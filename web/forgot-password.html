<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MDJPRO — Recuperar Contraseña</title>
    <link rel="stylesheet" href="./styles.css?v=20260226-1" />
    <style>
        .login-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 40px;
            background: var(--panel);
            border-radius: 24px;
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
        }
        .header { min-height: 90px; }
        .header-top .container { padding-bottom: 12px; }
    </style>
</head>
<body class="notranslate">
    <header class="header" id="mainHeader">
        <div class="header-top">
            <div class="container">
                <div class="brand">
                    <img src="./assets/branding/logo-transparent.png" alt="Miami DJ Beat Logo" class="logo-img-eagle">
                    <div class="brand-letters-wrapper">
                        <img src="./assets/branding/logo-transparent Letras.png" alt="Miami DJ Beat Letters" class="brand-letters-img">
                    </div>
                </div>
                <div class="header-actions">
                    <a href="./login.html" class="btn-pill">Volver al Login</a>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="login-container">
            <h2 style="margin-bottom: 20px; text-align: center; color: #fff;">Restablecer Contraseña</h2>
            <p style="text-align: center; color: var(--muted); margin-bottom: 30px; font-size: 14px;">Ingresa tu correo electrónico y te enviaremos un enlace oficial seguro para recuperar tu cuenta.</p>
            
            <form id="forgot-form" class="form">
                <label><span>Email *</span>
                    <input type="email" id="forgot-email" required placeholder="tu@email.com">
                </label>
                <button class="btn primary full" type="submit" id="forgot-submit-btn">Enviar enlace de recuperación</button>
            </form>

            <p id="forgot-error" style="color: #ff4d4d; margin-top: 15px; text-align: center; display: none; font-size: 13px;"></p>
            <p id="forgot-success" style="color: #4CAF50; margin-top: 15px; text-align: center; display: none; font-size: 13px;"></p>
        </div>
    </main>

    <footer class="footer">
        <div class="container" style="text-align: center;">
            <div style="color: rgba(255,255,255,0.4); font-size: 13px;">© 2026 Miami DJ Beat LLC. Pro Division Access.</div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js?v=20260226-1"></script>
    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('forgot-submit-btn');
            const email = document.getElementById('forgot-email').value.trim();
            const errEl = document.getElementById('forgot-error');
            const sucEl = document.getElementById('forgot-success');
            
            errEl.style.display = 'none';
            sucEl.style.display = 'none';
            
            if (!email) return;

            btn.disabled = true;
            btn.textContent = 'Enviando...';

            try {
                const db = window.getSupabaseClient();
                // Construir URL absoluta dinámica para el redireccionamiento desde el correo
                const redirectUrl = window.location.origin + window.location.pathname.replace('forgot-password.html', 'reset-password.html');
                
                const { data, error } = await db.auth.resetPasswordForEmail(email, {
                    redirectTo: redirectUrl,
                });

                if (error) throw error;

                // Success Message sin fake alerts (Regla de UX)
                sucEl.textContent = 'Si el correo está registrado, recibirás un enlace de recuperación en breve.';
                sucEl.style.display = 'block';
                document.getElementById('forgot-form').reset();
            } catch (err) {
                console.error(err);
                errEl.textContent = err.message || 'Error al enviar el enlace. Inténtalo más tarde.';
                errEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Enviar enlace de recuperación';
            }
        });
    </script>
</body>
</html>
