<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ELIXIS · FÉNIX AI — Miami DJ Beat</title>

<!-- Mismo patrón que el resto del sitio: supabase-js + config (única fuente de la URL/llave pública) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
<script>
    /* FIX-LEGACY-SUPABASE-01 (2026-08-19) · el respaldo entra cuando falta la
       LIBRERIA, no cuando falta la sintaxis.
       Antes la puerta era una sonda de `?.` y `??`. Eso solo cubre el motor que no
       sabe parsear: si el bundle del CDN muere por CUALQUIER otra razon —una v2 mas
       nueva con sintaxis que el motor no soporta, red caida, TLS, bloqueo— la sonda
       pasa, el respaldo NO se inyecta y la pagina se queda sin cliente Supabase.
       Sin cliente no hay sesion, y el guard del perfil expulsa al login: ese era el
       rebote en Mac antiguas. Ahora se pregunta lo unico que importa, si la libreria
       esta aqui. En un navegador moderno no hace nada, porque ya esta.
       El CDN ademas se clava a 2.112.3, la misma version que la copia vendorizada:
       `@2` era flotante y podia cambiar bajo nuestros pies sin tocar el repo. */
(function () {
    var mdjLibAusente = !(window.supabase &&
        typeof window.supabase.createClient === 'function');
    if (mdjLibAusente) {
        document.write('<script src="./vendor/supabase-js-2.112.3.legacy.js?v=20260818-safari-legacy"><\/script>');
    }
})();
</script>
<script src="./supabase-config.js"></script>

<style>
  /* MODO DIA. El oro baja a bronce: el oro claro sobre papel blanco se lee
     gris. Mismo criterio que en el movil, distintos nombres de token porque
     esta consola tiene los suyos. */
  :root[data-tema="claro"]{
    --bg:#eef0f4; --panel:#ffffff; --panel-2:#f2f4f7;
    --line:rgba(138,109,20,.30); --line-soft:rgba(0,0,0,.10);
    --gold:#8a6d14; --gold-2:#a8871f;
    --text:#0e1116; --muted:#535b69; --user:#e6e9ef; --danger:#c23c48;
    --hilos:120,94,16;      /* bronce: el oro claro sobre blanco se lee gris */
  }
  :root[data-tema="claro"] body{background:var(--bg)}
  :root{
    --bg:#08090c;
    --panel:#0f1218;
    --panel-2:#14181f;
    --line:rgba(212,175,55,.16);
    --line-soft:rgba(255,255,255,.06);
    --gold:#d4af37;
    --gold-2:#f4c95d;
    --text:#eceae4;
    --muted:#888f99;
    --user:#1b2029;
    --danger:#e0654f;
    --hilos:212,175,55;      /* la red, en RGB crudo para el canvas */
    --radius:16px;
  --gold-glow:rgba(212,175,55,.32);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1100px 520px at 50% -12%, rgba(212,175,55,.10), transparent 60%),
      radial-gradient(700px 400px at 100% 110%, rgba(212,175,55,.05), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .consola-shell{display:flex;height:100svh;overflow:hidden}

  /* ═══ RIEL — medidas COPIADAS de #staff-side3, no elegidas ═══════════
     250px abierto / 60px contraido / transicion .18s / etiquetas fuera al
     contraer / grupos en acordeon. Se copia el patron, no se reinventa. */
  .cfg-riel{
    /* SIN BARRA. Antes tenia fondo #0a0e16 clavado, y en modo dia se veia una
       franja NEGRA sobre papel blanco. Ahora solo se nota la linea que limita,
       igual que el resto de la consola: todo flota sobre la red. */
    width:250px;flex:none;background:none;border-right:1px solid var(--line);
    overflow-y:auto;overflow-x:hidden;padding:10px 0 44px;transition:width .18s ease;
  }
  .cfg-riel.contraido{width:60px}
  .cfg-top{display:flex;align-items:center;gap:11px;padding:2px 14px 12px}
  .cfg-contraer{
    display:flex;align-items:center;justify-content:center;width:36px;height:34px;flex:none;
    background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;
    color:var(--gold);cursor:pointer;
  }
  .cfg-contraer svg{width:17px;height:17px}
  .cfg-marca{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
  .cfg-riel.contraido .cfg-marca{display:none}
  .cfg-riel.contraido .cfg-top{justify-content:center;padding-left:0;padding-right:0}

  .cfg-grupo{
    display:flex;align-items:center;gap:11px;width:100%;padding:11px 16px;
    background:none;border:0;color:var(--text);font:inherit;font-size:13px;
    cursor:pointer;text-align:left;
  }
  .cfg-grupo:hover{background:rgba(255,255,255,.04)}
  .cfg-grupo svg{width:18px;height:18px;flex:none;color:var(--gold-2)}
  .cfg-grupo .cfg-tx{flex:1}
  .cfg-grupo .cfg-flecha{width:14px;height:14px;transition:transform .18s ease;opacity:.6}
  .cfg-grupo.abierto .cfg-flecha{transform:rotate(90deg)}
  .cfg-riel.contraido .cfg-tx,
  .cfg-riel.contraido .cfg-flecha{display:none}
  .cfg-riel.contraido .cfg-grupo{justify-content:center;gap:0;padding-left:0;padding-right:0}

  .cfg-cuerpo{max-height:0;overflow:hidden;transition:max-height .22s ease;padding:0 16px}
  .cfg-grupo.abierto + .cfg-cuerpo{max-height:420px;padding-bottom:12px}
  .cfg-riel.contraido .cfg-cuerpo{display:none}

  .cfg-fila{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:12.5px;color:var(--muted)}
  .cfg-fila .punto{width:7px;height:7px;border-radius:50%;flex:none;background:#3ecb7f;box-shadow:0 0 7px #3ecb7f}
  .cfg-fila.humana .punto{background:var(--gold);box-shadow:0 0 7px var(--gold)}
  .cfg-nota{font-size:11px;line-height:1.5;color:var(--muted);opacity:.7;padding:6px 0 2px}
  .app{
    max-width:860px;
    margin:0 auto;
    flex:1;min-width:0;height:100%;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ── Top bar ───────────────────────────────────────── */
  .topbar{
    /* NO ES UNA BARRA. Sin fondo, sin linea, sin desenfoque: es aire. Lo que
       se ve son las piezas, flotando sobre la red como todo lo demas. */
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:16px 20px;
    border-bottom:0;
    background:none;
    pointer-events:none;
    min-width:0;
  }
  .brand{display:flex;align-items:center;gap:13px;min-width:0}
  .logo{
    width:42px;height:42px;object-fit:contain;flex:none;
    filter:drop-shadow(0 2px 10px rgba(212,175,55,.35));
  }
  .brand-text{min-width:0}
  .wordmark{
    font-family:"Bodoni 72","Didot",Georgia,"Times New Roman",serif;
    font-size:26px;font-weight:700;letter-spacing:.14em;line-height:1;
    background:linear-gradient(180deg,var(--gold-2),var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{font-size:11px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;margin-top:5px}
  .status{display:flex;align-items:center;gap:10px;flex:none}
  .model-badge{
    font-size:11px;color:var(--gold-2);letter-spacing:.06em;
    border:1px solid var(--line);border-radius:999px;padding:5px 11px;
    background:rgba(212,175,55,.06);white-space:nowrap;
  }
  .pill{
    display:inline-flex;align-items:center;gap:7px;
    font-size:12px;color:var(--muted);
    border:1px solid var(--line-soft);border-radius:999px;padding:5px 11px;white-space:nowrap;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#3ecb7f;box-shadow:0 0 10px #3ecb7f;flex:none}
  .pill.off .dot{background:var(--danger);box-shadow:0 0 10px var(--danger)}

  /* ── Message stream ────────────────────────────────── */
  .stream{
    flex:1;overflow-y:auto;padding:26px 20px 12px;
    display:flex;flex-direction:column;gap:16px;
    scroll-behavior:smooth;
  }
  .row{display:flex;gap:11px;max-width:100%;animation:rise .28s ease both}
  .row.user{flex-direction:row-reverse}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.row{animation:none}}

  .ava{
    width:34px;height:34px;border-radius:10px;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;letter-spacing:.02em;
  }
  .ava.elixis{
    background:linear-gradient(160deg,rgba(212,175,55,.22),rgba(212,175,55,.05));
    border:1px solid var(--line);color:var(--gold-2);
    font-family:"Bodoni 72","Didot",Georgia,serif;
  }
  .ava.me{background:var(--user);border:1px solid var(--line-soft);color:var(--muted)}

  .bubble{
    padding:12px 15px;border-radius:14px;line-height:1.5;font-size:15px;
    max-width:min(78%,620px);white-space:pre-wrap;word-wrap:break-word;
  }
  .row.elixis .bubble{
    background:var(--panel-2);border:1px solid var(--line-soft);
    border-top-left-radius:4px;
  }
  .row.user .bubble{
    background:var(--user);border:1px solid var(--line-soft);
    border-top-right-radius:4px;color:#f3f2ee;
  }
  .row.error .bubble{border-color:rgba(224,101,79,.45);color:#f2b7ab}

  .name{font-size:11px;color:var(--muted);letter-spacing:.08em;margin:0 0 5px 2px;text-transform:uppercase}

  /* typing */
  .typing{display:inline-flex;gap:5px;padding:4px 2px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.5;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.18s}
  .typing i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  /* ── Composer ──────────────────────────────────────── */
  .composer{
    display:flex;align-items:flex-end;gap:10px;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    background:linear-gradient(0deg, rgba(15,18,24,.95), rgba(15,18,24,.5));
  }
  #input{
    flex:1;resize:none;max-height:160px;
    background:var(--panel-2);color:var(--text);
    border:1px solid var(--line-soft);border-radius:14px;
    padding:13px 15px;font:inherit;font-size:15px;line-height:1.45;
    outline:none;transition:border-color .15s;
  }
  #input:focus{border-color:var(--line)}
  #input::placeholder{color:#5f656e}
  #send{
    flex:none;width:48px;height:48px;border-radius:14px;cursor:pointer;
    border:1px solid var(--line);
    background:linear-gradient(160deg,var(--gold-2),var(--gold));
    color:#111;font-size:19px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s, opacity .15s;
  }
  #send svg,.mic-btn svg{width:21px;height:21px;display:block}
  /* El boton de enviar deja de ser un bloque de oro solido: en el diseno
     nuevo nada pesa mas que la red que pasa por detras. */
  #send{background:rgba(212,175,55,.18);border:1.6px solid rgba(212,175,55,.5);color:var(--gold-2);
    border-radius:24px;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  .mic-btn{background:rgba(20,24,30,.18);border:1.6px solid rgba(255,255,255,.20);
    border-radius:24px;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  #send:hover{transform:translateY(-1px)}
  #send:active{transform:translateY(0)}
  #send:disabled{opacity:.4;cursor:not-allowed;transform:none}
  #send:focus-visible,#input:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}

  /* Se retira en cuanto ya sabes el atajo: util la primera vez, ruido a
     partir de la segunda. Colapsa en vez de esconderse para no dejar hueco. */
  .hint.aprendido{
    opacity:0;max-height:0;padding-top:0;padding-bottom:0;overflow:hidden;
    transition:opacity .4s ease, max-height .4s ease, padding .4s ease;
  }
  .hint{
    max-height:60px;transition:opacity .4s ease, max-height .4s ease, padding .4s ease;
    text-align:center;font-size:11px;color:#5b616b;padding:0 16px 10px;
  }
  /* voz — botones */
  .icon-btn{
    /* Eran 38px pegados, con emoji y poco contraste: de un vistazo no se
       distinguian uno de otro. Mas tamano, mas aire y un trazo que si se lee
       sobre el fondo negro. */
    flex:none;width:42px;height:42px;border-radius:12px;cursor:pointer;
    border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);
    color:#cbd1da;
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .icon-btn svg{width:20px;height:20px;display:block}
  /* El contenedor es aire; las piezas si atrapan el raton. */
  .topbar > *{pointer-events:auto}
  /* Cada pieza flota con su propio cristal, no sobre una franja comun. */
  .brand,.status > *{
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  }
  .icon-btn.salir{color:#e6b9b0;border-color:rgba(224,101,79,.32)}
  .icon-btn.salir:hover{border-color:var(--danger);color:#f2b7ab}
  /* VOLUMEN de la voz de ELIXIS. El deslizador se despliega al acercarse:
     en reposo solo se ve la bocina, para no llenar la esquina de mandos. */
  .vol{display:flex;align-items:center;gap:0;border-radius:12px}
  .vol #volRange{
    width:0;opacity:0;margin:0;padding:0;
    transition:width .22s ease, opacity .22s ease, margin .22s ease;
    accent-color:var(--gold);cursor:pointer;
  }
  .vol:hover #volRange,.vol:focus-within #volRange{width:88px;opacity:1;margin:0 10px 0 8px}
  .vol #volRange:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}
  .icon-btn.off{color:var(--danger);border-color:rgba(224,101,79,.4)}
  .status{gap:12px}
  .icon-btn:hover{border-color:var(--line)}
  .icon-btn.off{color:#5f656e;opacity:.75}
  .mic-btn{
    flex:none;width:48px;height:48px;border-radius:14px;cursor:pointer;
    border:1px solid var(--line-soft);background:var(--panel-2);color:var(--gold-2);
    font-size:20px;display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .mic-btn:hover{border-color:var(--line)}
  .mic-btn.listening{
    background:linear-gradient(160deg,rgba(224,101,79,.28),rgba(224,101,79,.08));
    border-color:rgba(224,101,79,.55);color:#f2b7ab;animation:pulse 1.1s infinite;
  }
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,101,79,.4)}50%{box-shadow:0 0 0 9px rgba(224,101,79,0)}}
  .icon-btn:focus-visible,.mic-btn:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.mic-btn.listening{animation:none}}

  /* selector de voz */
  .settings-panel{
    position:absolute; top:72px; right:16px; z-index:30;
    background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:14px; width:min(290px,86vw);
    box-shadow:0 18px 50px rgba(0,0,0,.55);
    display:flex; flex-direction:column; gap:9px;
  }
  .settings-panel[hidden]{display:none}
  .settings-label{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
  #voiceSelect{
    background:var(--panel-2); color:var(--text);
    border:1px solid var(--line-soft); border-radius:10px;
    padding:10px 12px; font:inherit; font-size:14px; outline:none; cursor:pointer;
  }
  #voiceSelect:focus{border-color:var(--line)}
  .settings-hint{font-size:11px;color:#5f656e;line-height:1.4}
  .logout-btn{
    margin-top:4px;background:transparent;border:1px solid var(--line-soft);color:var(--muted);
    border-radius:10px;padding:9px;font:inherit;font-size:13px;cursor:pointer;
  }
  .logout-btn:hover{border-color:var(--danger);color:#f2b7ab}

  /* candado de acceso */
  .auth-gate{
    position:fixed; inset:0; z-index:100;
    background:radial-gradient(900px 500px at 50% 0%, rgba(212,175,55,.12), transparent 60%), var(--bg);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .auth-gate[hidden]{display:none}
  .auth-card{
    width:min(380px,92vw); background:var(--panel); border:1px solid var(--line);
    border-radius:20px; padding:32px 26px; box-shadow:0 24px 70px rgba(0,0,0,.6);
    display:flex; flex-direction:column; align-items:center; gap:9px;
  }
  .auth-logo{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 2px 12px rgba(212,175,55,.4))}
  .auth-title{
    font-family:"Bodoni 72","Didot",Georgia,serif;font-size:34px;font-weight:700;letter-spacing:.16em;
    background:linear-gradient(180deg,var(--gold-2),var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .auth-sub{font-size:11px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;margin-bottom:6px}
  .auth-form{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:4px}
  .auth-input{
    background:var(--panel-2);color:var(--text);border:1px solid var(--line-soft);
    border-radius:12px;padding:13px 15px;font:inherit;font-size:15px;outline:none;
  }
  .auth-input:focus{border-color:var(--line)}
  .auth-btn{
    margin-top:2px;border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer;
    background:linear-gradient(160deg,var(--gold-2),var(--gold));color:#111;font:inherit;font-weight:700;font-size:15px;transition:transform .12s;
  }
  .auth-btn:hover{transform:translateY(-1px)}
  .auth-btn:disabled{opacity:.6;cursor:progress;transform:none}
  .auth-msg{font-size:13px;color:var(--danger);min-height:18px}
  .auth-note{font-size:11px;color:#5f656e;line-height:1.5;margin-top:4px}

  @media (max-width:520px){
    .sub{display:none}
    .model-badge{display:none}
    .wordmark{font-size:22px}
  }

/* ═══ EL ROSTRO DE ELIXIS ═══════════════════════════════════════════════
   Traido del MDJ COMMANDER, que es la version de movil. Solo viaja la CARA
   y sus estados: la figura recortada sobre el campo de particulas vivo, sin
   circulo que la encierre. El motor de voz y la carroceria del movil se
   quedan alli. Aqui los estados los mueve el ciclo que ya tenia la consola. */
.face-stage{position:relative;width:min(260px,64vw);height:236px;margin:14px auto 6px;flex:none}
.face-fx{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.face-glow{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:70%;height:40%;z-index:2;
  background:radial-gradient(closest-side,var(--gold-glow),transparent 72%);filter:blur(11px);opacity:.55;
  transition:opacity .45s ease,width .45s ease,background .45s ease}
.face-fig{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;z-index:3;
  filter:drop-shadow(0 10px 26px rgba(0,0,0,.7));animation:face-respira 5.6s ease-in-out infinite}
@keyframes face-respira{50%{transform:translateY(-3px) scale(1.008)}}
body.modo-voz .face-stage.thinking .face-glow{opacity:1;width:86%;background:radial-gradient(closest-side,rgba(199,123,255,.42),transparent 72%)}
body.modo-voz .face-stage.speaking .face-glow{opacity:1;width:92%}
body.modo-voz .face-stage.speaking .face-fig{animation:face-habla 1.1s ease-in-out infinite}
@keyframes face-habla{25%{transform:translateY(-2px)}60%{transform:translateY(1px) scale(1.006)}}
@media (prefers-reduced-motion:reduce){.face-fig{animation:none!important}}

/* ═══ ESCRITORIO: la cara a la izquierda, la conversacion a la derecha ═══
   En pantalla ancha la columna unica desperdiciaba medio monitor y dejaba a
   ELIXIS arrinconado arriba. En rejilla, la cara ocupa su propia columna y
   respira, y el chat -- que es lo provisional mientras la voz manda -- se va
   al lado derecho. Por debajo de 900px vuelve a apilarse como estaba. */
/* ═══ TRANSPORTE DEL DISENO DE FENIX ════════════════════════════════
   Antes esto era una rejilla de dos columnas: la cara en una caja a la
   izquierda y el chat arrinconado a la derecha. Se sustituye por el diseno
   del centro de comando movil: la red a SANGRE por detras de todo, y la
   conversacion y el compositor FLOTANDO encima. Es la misma pieza, no un
   parecido -- mismos colores, misma translucidez, mismas medidas.
   La cabecera no se toca. */
.app{position:relative}
@media (min-width:900px){
  .app{max-width:none}
}
/* La red deja de vivir en una caja y pasa a ser el fondo de la pagina. */
.face-stage{
  position:absolute; inset:0; width:100%; height:100%; margin:0;
  z-index:0; pointer-events:none;
}
.face-fx{opacity:.85}
/* El rostro se retira mientras se escribe -- igual que en el telefono, donde
   el avatar se va en modo escritura y vuelve cuando ELIXIS habla. Ademas
   evita que la figura se estire a pantalla completa. */
.face-fig{
  /* Sin borde ni fondo: el retrato flota sobre la red, no vive en un marco.
     El recuadro que se veia era el hueco del <img> roto, no un estilo. */
  border:0; background:none; outline:0;
  inset:auto; left:50%; top:50%;
  transform:translate(-50%,-50%);
  width:min(300px,42vw); height:min(340px,46vh);
  opacity:0; transition:opacity .5s ease;
}
.face-glow{opacity:0}
/* EL ROSTRO ES DE LA VOZ. Escribiendo NO aparece -- igual que en el telefono,
   donde el avatar se retira en modo escritura. Ahi manda la red y la bola de
   energia; una cara mirandote mientras tecleas no aporta nada y estorba a la
   lectura. Solo con la voz encendida vuelve, y solo cuando ELIXIS piensa o
   habla. El resplandor de la base va con el. */
body.modo-voz .face-stage.thinking .face-fig,
body.modo-voz .face-stage.speaking .face-fig{opacity:1}
body.modo-voz .face-stage.speaking .face-glow{opacity:.9}

/* BOLA DE ENERGIA: la fuente que late en el centro cuando el rostro no esta.
   Mismo lenguaje que el orbe del telefono -- halo radial de oro y aros que
   se abren -- para que se lea como la misma energia. */
.face-stage::after{
  content:""; position:absolute; left:50%; top:50%;
  /* MEDIDA RELATIVA, no fija. Con 210px clavados la bola ocupaba el 14,6% del
     ancho en un monitor de 1440, cuando en el telefono ocupaba el 44%: un
     tercio de la presencia, y por eso el centro se leia vacio. Ahora crece
     con la pantalla, con tope para que no se desborde en un ultrapanoramico. */
  width:clamp(210px,30vw,460px); height:clamp(210px,30vw,460px);
  transform:translate(-50%,-50%);
  border-radius:50%; pointer-events:none;
  background:radial-gradient(circle,
    rgba(212,175,55,.26) 0%, rgba(212,175,55,.10) 44%, transparent 70%);
  animation:fenix-respira 4.6s ease-in-out infinite;
}
/* Aro que se abre en bucle: da MOVIMIENTO CONSTANTE y ancla la zona incluso
   con la conversacion vacia. Sin el, un monitor grande parece averiado antes
   de que nadie escriba. */
.face-stage::before{
  content:""; position:absolute; left:50%; top:50%;
  width:clamp(210px,30vw,460px); height:clamp(210px,30vw,460px);
  margin:0; border-radius:50%; pointer-events:none;
  border:1.5px solid rgba(212,175,55,.30); opacity:0;
  animation:fenix-aro 4.6s cubic-bezier(.15,.6,.35,1) infinite;
}
@keyframes fenix-aro{
  0%  {transform:translate(-50%,-50%) scale(.72); opacity:.34}
  100%{transform:translate(-50%,-50%) scale(1.7); opacity:0}
}
.face-stage.thinking::before,
.face-stage.speaking::before{border-color:rgba(212,175,55,.52);animation-duration:2.1s}
@media (prefers-reduced-motion:reduce){ .face-stage::before{animation:none} }
.face-stage.thinking::after,
.face-stage.speaking::after{
  background:radial-gradient(circle,
    rgba(212,175,55,.34) 0%, rgba(212,175,55,.13) 44%, transparent 72%);
  animation-duration:2.1s;
}
@keyframes fenix-respira{
  0%,100%{transform:translate(-50%,-50%) scale(1)}
  50%    {transform:translate(-50%,-50%) scale(1.08)}
}
@media (prefers-reduced-motion:reduce){ .face-stage::after{animation:none} }

/* Todo lo demas flota POR ENCIMA de la red. */
.topbar,.settings-panel,.stream,.composer,.hint{position:relative;z-index:1}
.stream{background:none;border-left:0}

/* ═══ LAS DOS VENTANAS LATERALES ══════════════════════════════════════
   Viven en los margenes que deja la columna de lectura (920px centrados),
   asi que no le quitan ni un pixel a la conversacion. Por debajo de 1240px
   no hay margen que ocupar y se retiran: apretarlas seria peor que no
   tenerlas. */
.lado{
  position:absolute; top:96px; bottom:96px; width:232px;
  display:none; flex-direction:column; gap:10px; z-index:1;
  pointer-events:none; opacity:0; transition:opacity .45s ease, transform .45s ease;
}
.lado-izq{left:max(16px, calc(50% - 460px - 248px)); transform:translateX(-14px)}
.lado-der{right:max(16px, calc(50% - 460px - 248px)); transform:translateX(14px)}
.lado.abierta{opacity:1; transform:translateX(0)}
/* El umbral sube de 1240 a 1400: el riel se lleva 250px, y con el antiguo
   las dos ventanas PISABAN la columna de lectura por los dos lados -- medido,
   no supuesto. Aqui solo aparecen cuando de verdad hay sitio para las tres
   piezas sin que ninguna invada a otra. */
@media (min-width:1400px){ .lado{display:flex} }

.lado-h{
  font-family:var(--mono); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--muted); padding-left:2px; flex:none;
}
.lado-cuerpo{
  flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:9px;
  scrollbar-width:none;
}
.lado-cuerpo::-webkit-scrollbar{display:none}

/* ── Derecha: la palabra ── */
.tl{
  font-size:12.5px; line-height:1.45; padding:8px 10px; border-radius:11px;
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
  text-shadow:0 1px 3px rgba(0,0,0,.85);
}
.tl b{display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.14em;
  text-transform:uppercase; opacity:.72; margin-bottom:3px; font-weight:600}
.tl-espera{
  font-size:12px; line-height:1.5; color:var(--muted); opacity:.62;
  padding:10px 2px; text-shadow:0 1px 3px rgba(0,0,0,.85);
}
.tl.yo{background:rgba(212,175,55,.13); border:1px solid rgba(212,175,55,.34); color:#f0e6cc}
.tl.el{background:rgba(63,185,230,.10); border:1px solid rgba(63,185,230,.30); color:#dcecf4}

/* ── Izquierda: el proceso ── */
.pz{
  border:1px solid rgba(255,255,255,.12); border-radius:13px; padding:11px 12px;
  background:rgba(20,24,30,.20);
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
  display:flex; flex-direction:column; gap:9px;
}
.pz-n{font-family:var(--mono); font-size:10.5px; letter-spacing:.10em;
  text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:7px}
.pz-n .punto{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.pz.ok .pz-n .punto{background:#3ecb7f;box-shadow:0 0 8px #3ecb7f}
.pz.mal .pz-n .punto{background:var(--danger);box-shadow:0 0 8px var(--danger)}

/* El SOBRE y la chispa que lo alcanza. La energia recorre un circuito y el
   simbolo se enciende AL LLEGAR -- mismo lenguaje que los pulsos del fondo. */
.pz-escena{position:relative; height:74px; display:grid; place-items:center}
.pz-hilo{position:absolute; left:8px; right:8px; top:50%; height:1px;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,.45),transparent)}
.pz-chispa{
  position:absolute; top:50%; left:8px; width:7px; height:7px; margin-top:-3.5px;
  border-radius:50%; background:#fff4d0; box-shadow:0 0 12px 3px rgba(244,201,93,.85);
  animation:pz-viaja 1.5s cubic-bezier(.4,0,.6,1) forwards;
}
@keyframes pz-viaja{
  0%  {left:8px;  opacity:0}
  12% {opacity:1}
  88% {opacity:1}
  100%{left:calc(50% - 3.5px); opacity:0}
}
.pz-simbolo{
  position:relative; z-index:1; width:42px; height:42px; color:var(--muted);
  display:grid; place-items:center; border-radius:12px;
  border:1px solid rgba(255,255,255,.14); background:rgba(0,0,0,.34);
  transition:color .4s ease, border-color .4s ease, box-shadow .4s ease;
}
.pz-simbolo svg{width:22px;height:22px}
.pz.encendido .pz-simbolo{
  color:var(--gold-2); border-color:rgba(212,175,55,.6);
  box-shadow:0 0 22px rgba(212,175,55,.45), inset 0 0 14px rgba(212,175,55,.18);
}
.pz-cartel{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  text-align:center; color:var(--muted); opacity:0; transition:opacity .4s ease .2s;
}
.pz.encendido .pz-cartel{opacity:1}
.pz.enviado .pz-cartel{color:#3ecb7f}
@media (prefers-reduced-motion:reduce){ .pz-chispa{animation:none;opacity:0} }
/* A 1440px las burbujas se pegaban a los bordes y la lectura se rompia. La
   columna se acota y se centra -- la red sigue ocupando el ancho completo. */
.stream > *, .composer{max-width:920px;width:100%;margin-left:auto;margin-right:auto}
/* Con las ventanas abiertas, la LECTURA cede sitio en vez de solaparse: se
   queda con lo que sobra despues de darles su ancho a las dos. */
@media (min-width:1400px){
  .stream > *, .composer{max-width:min(920px, calc(100% - 528px))}
}
.composer{box-sizing:content-box}

/* Burbujas translucidas: oro para el Capitan, cian para ELIXIS. El
   desenfoque es minimo A PROPOSITO -- uno fuerte convierte la red en papilla
   y lo que se quiere es verla pasar por detras. La lectura la sostiene la
   sombra del propio texto. */
/* ANCHO DE LAS BURBUJAS. El 78% del CSS original se resolvia contra el
   envoltorio, que a su vez se encoge a su contenido: circular. Con texto largo
   colaba, pero con "hola" colapsaba a una letra por linea. El tope pasa al
   ENVOLTORIO, que si tiene de que agarrarse -- la fila mide 920px fijos -- y la
   burbuja llena lo que le den. */
.row > div{min-width:0}
.row > div:not(.ava){max-width:min(78%,620px)}
.bubble{max-width:100%}
.sms-card{min-width:min(100%,300px)}

.row.elixis .bubble,
.row.user .bubble{
  -webkit-backdrop-filter:blur(2px) saturate(150%);
  backdrop-filter:blur(2px) saturate(150%);
  box-shadow:0 8px 22px rgba(0,0,0,.30);
  text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 12px rgba(0,0,0,.6);
  border-radius:17px;
}
.row.elixis .bubble{
  background:rgba(63,185,230,.12);
  border:1px solid rgba(63,185,230,.34);
  border-top-left-radius:5px;
}
.row.user .bubble{
  background:rgba(212,175,55,.16);
  border:1px solid rgba(212,175,55,.46);
  border-top-right-radius:5px;
}

/* En el telefono no hay iniciales ni rotulos sobre cada burbuja: el color ya
   dice quien habla. Se ocultan, no se borran -- volver atras es una linea. */
.ava,.name{display:none}

/* COMPOSITOR FLOTANTE: el contenedor no pinta nada, es aire. Lo que flota es
   el campo. */
.composer{
  background:none; border-top:0;
  padding:10px 16px calc(18px + env(safe-area-inset-bottom));
  pointer-events:none;
}
.composer > *{pointer-events:auto}
#input{
  background:rgba(20,24,30,.18);
  -webkit-backdrop-filter:blur(2px) saturate(150%);
  backdrop-filter:blur(2px) saturate(150%);
  border:1.6px solid rgba(255,255,255,.20);
  border-radius:24px; padding:14px 18px;
  box-shadow:0 8px 24px rgba(0,0,0,.34);
  text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 12px rgba(0,0,0,.6);
}
#input:focus{
  border-color:rgba(212,175,55,.58);
  background:rgba(24,29,36,.26);
}
#input::placeholder{text-shadow:0 1px 3px rgba(0,0,0,.85)}

/* ═══ TARJETA DE APROBACION DE SMS ══════════════════════════════════════
   Un SMS a un cliente es irreversible, asi que la decision tiene que verse
   y tomarse a mano. La tarjeta muestra a quien va (con el telefono tapado
   salvo los ultimos cuatro), el texto exacto que saldra, y dos salidas.
   Mientras despacha, los dos botones se bloquean: un doble clic nervioso no
   puede mandar el mensaje dos veces. */
.sms-card{
  /* Misma familia translucida que las burbujas, pero en AMBAR: no es una
     respuesta, es una DECISION que espera por ti. Se lee distinta a proposito
     y la red se ve pasar por detras, como todo lo demas. */
  border:1.6px solid rgba(232,178,58,.46);border-radius:17px;
  background:rgba(232,178,58,.12);
  -webkit-backdrop-filter:blur(2px) saturate(150%);
  backdrop-filter:blur(2px) saturate(150%);
  padding:16px 16px 14px;margin:4px 0;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 8px 26px rgba(0,0,0,.35);
  text-shadow:0 1px 3px rgba(0,0,0,.85);
}
.sms-card .sms-h{
  display:flex;align-items:center;gap:8px;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#e8b23a;
}
.sms-card .sms-dest{font-size:14px;color:var(--text)}
.sms-card .sms-dest b{color:var(--text)}
.sms-card .sms-tel{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.sms-card .sms-msg{
  background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.10);border-radius:11px;
  padding:12px 13px;font-size:14.5px;line-height:1.5;color:var(--text);
  white-space:pre-wrap;word-break:break-word;
}
.sms-card .sms-acc{display:flex;gap:9px;flex-wrap:wrap}
.sms-card button{
  font:inherit;font-size:13.5px;font-weight:650;border-radius:10px;
  padding:10px 16px;border:1px solid var(--line);cursor:pointer;
  background:var(--user);color:var(--text);transition:opacity .15s,transform .1s;
}
.sms-card button:active{transform:scale(.98)}
.sms-card button[disabled]{opacity:.45;cursor:not-allowed}
.sms-card .sms-ok{
  background:linear-gradient(180deg,#3ecf8e,#2ea56f);border:none;color:#062016;
}
.sms-card .sms-estado{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sms-card.resuelta{border-color:var(--line)}
.sms-card.resuelta .sms-acc{display:none}
</style>
</head>
<body>
<div class="consola-shell">

  <!-- ═══ RIEL DE CONFIGURACIONES ═══ Copia del patron real de la plataforma
       (#staff-side3 en staff.html): 250px abierto, 60px contraido, las
       etiquetas desaparecen y los grupos van en acordeon. Vive FUERA de las
       tres zonas para no tapar el proceso ni la transcripcion. -->
  <aside class="cfg-riel" id="cfgRiel" aria-label="Configuraciones de ELIXIS y permisos">
    <div class="cfg-top">
      <button type="button" class="cfg-contraer" id="cfgContraer" title="Contraer / expandir" aria-label="Contraer o expandir el panel" aria-expanded="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      </button>
      <span class="cfg-marca">ELIXIS</span>
    </div>
    <div class="cfg-items" id="cfgItems"></div>
  </aside>

  <div class="app">
  <!-- ═══ SIN BARRA DE MENU ═══ Ya no hay franja: los elementos FLOTAN sobre
       la red, cada uno pegado a su esquina. El engranaje desaparecio -- lo que
       colgaba de el vive en el riel lateral, y dos puertas a lo mismo es la
       redundancia que el PO lleva todo el dia quitando. -->
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="./assets/branding/fenix-emblem-160.png" alt="FÉNIX AI">
      <div class="brand-text">
        <div class="wordmark">ELIXIS</div>
        <div class="sub">Agente Ejecutivo · FÉNIX AI</div>
      </div>
    </div>
    <div class="status">
      <!-- MODO. Hoy solo puede decir la verdad que conoce: si hay conexion.
           El modo real de presupuesto (FULL / SAVER / GRATIS) lo calcula
           elixis-chat en su linea 1224 pero NO lo devuelve todavia. En cuanto
           viaje, esta pastilla lo dira sin tocar nada mas. -->
      <span class="pill" id="statusPill"><i class="dot"></i> En línea</span>

      <!-- VOZ: bocina para encender/apagar y control de volumen. OJO: es el
           volumen de la VOZ DE ELIXIS, no el del Mac -- ninguna pagina puede
           tocar el volumen del sistema ni capturar sus teclas. -->
      <div class="vol" id="vol">
        <button class="icon-btn" id="voiceToggle" aria-label="Voz de ELIXIS" title="Voz de ELIXIS: activada"></button>
        <input type="range" id="volRange" min="0" max="100" step="5" value="100"
               aria-label="Volumen de ELIXIS" title="Volumen de la voz de ELIXIS">
      </div>


      <!-- SALIR del modo productivo: de vuelta a MI PERFIL. -->
      <button class="icon-btn salir" id="salirBtn" title="Salir a Mi Perfil" aria-label="Salir del modo productivo"><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4'/><path d='m16 17 5-5-5-5M21 12H9'/></svg></button>
      <button class="icon-btn" id="temaBtn" title="Día / noche" aria-label="Día o noche"><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><circle cx='12' cy='12' r='4'/><path d='M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4'/></svg></button>
    </div>
  </header>

  <div class="settings-panel" id="settingsPanel" hidden>
    <label class="settings-label" for="voiceSelect">Voz de ELIXIS</label>
    <select id="voiceSelect" aria-label="Elegir voz de ELIXIS">
      <option value="ash">Ash — cálida, con autoridad</option>
      <option value="onyx">Onyx — profunda</option>
      <option value="echo">Echo — suave</option>
      <option value="verse">Verse — expresiva</option>
    </select>
    <div class="settings-hint">Solo voces masculinas. Se aplica a la próxima respuesta.</div>
    <button id="logoutBtn" class="logout-btn" type="button">Cerrar sesión</button>
  </div>

  <div class="face-stage" id="faceStage" aria-hidden="true">
    <canvas class="face-fx" id="faceFX"></canvas>
    <div class="face-glow"></div>
    <!-- SE CURA SOLO. Probado: la misma imagen pedida con un parametro nuevo
         carga (407x518), y con el testigo de la pagina falla -- o sea, cache
         envenenado, no un archivo roto. Asi que al primer fallo se reintenta
         UNA vez saltandose la cache; si tambien falla, el elemento se retira.
         Un hueco limpio es mejor que el recuadro roto de Safari animandose en
         mitad del chat, que ya se vio tres veces. -->
    <img class="face-fig" alt="" decoding="async" data-reintentos="0">
  </div>

  <!-- ═══ LAS DOS VENTANAS ═══ Dos oficios distintos, no un espejo:
       la izquierda ensena EL PROCESO (que esta haciendo ELIXIS por dentro),
       la derecha LA PALABRA (lo que se dijo). En reposo, cerradas. -->
  <aside class="lado lado-izq" id="ladoProceso" aria-label="Proceso de ELIXIS" aria-hidden="true">
    <div class="lado-h">Proceso</div>
    <div class="lado-cuerpo" id="procesoCuerpo"></div>
  </aside>
  <aside class="lado lado-der" id="ladoPalabra" aria-label="Transcripción" aria-hidden="true">
    <div class="lado-h">Transcripción</div>
    <div class="lado-cuerpo" id="palabraCuerpo"></div>
  </aside>

  <main class="stream" id="stream" aria-live="polite"></main>

  <footer class="composer">
    <button id="mic" class="mic-btn" aria-label="Hablar con ELIXIS" title="Hablar (dictado por voz)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg></button>
    <textarea id="input" placeholder="Escribe o dicta a ELIXIS, Capitán…" rows="1" aria-label="Mensaje para ELIXIS"></textarea>
    <button id="send" aria-label="Enviar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg></button>
  </footer>
  <div class="hint">ELIXIS · Miami DJ Beat LLC — responde con Claude. Enter envía · Shift+Enter salto de línea.</div>
  </div>
</div>

<script>
(function(){
  "use strict";
  /* ── Campo de particulas del rostro ────────────────────────────────
     Portado del COMMANDER. Dibuja la red viva detras de la figura y
     responde al estado. NO trae motor de voz: aqui los estados los marca
     el ciclo de chat que la consola ya tenia. */
  var FACE = (function(){
    var cv=null, ctx=null, W=0, H=0, pts=null, raf=0;
    var intensidad=0.7, objetivo=0.7, tono='gold', modo='idle';
    var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    var MAPA = { idle:[0.7,'gold'], thinking:[2.1,'magenta'], speaking:[1.5,'gold'] };

    /* El oro sale del tema: sobre papel blanco el oro claro se lee gris y la
       red practicamente desaparecia. En dia baja a bronce. Se cachea porque
       esto corre cientos de veces por fotograma, y se limpia al cambiar tema. */
    var _hilos = null;
    window.mdjOlvidarHilos = function(){ _hilos = null; };
    function hilos(){
      if(_hilos) return _hilos;
      _hilos = (getComputedStyle(document.documentElement).getPropertyValue('--hilos') || '').trim() || '212,175,55';
      return _hilos;
    }
    function color(a){ return tono==='magenta' ? 'rgba(199,123,255,'+a+')' : 'rgba('+hilos()+','+a+')'; }
    function medir(){
      if(!cv) return;
      var r=cv.getBoundingClientRect(), dpr=Math.min(2, window.devicePixelRatio||1);
      W=Math.max(60,r.width); H=Math.max(60,r.height);
      cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    function pintar(){
      if(!ctx || !cv || !document.body.contains(cv)) return;
      intensidad += (objetivo-intensidad)*0.05;
      var inten=intensidad;
      ctx.clearRect(0,0,W,H);
      for(var i=0;i<pts.length;i++){
        var p=pts[i]; p.x+=p.vx*inten; p.y+=p.vy*inten;
        if(p.x<-4)p.x+=W+8; if(p.x>W+4)p.x-=W+8;
        if(p.y<-4)p.y+=H+8; if(p.y>H+4)p.y-=H+8;
      }
      /* En monitor la malla quedaba fina y dispersa. Se ensancha con la
         pantalla: mas alcance en grande, sin pasarse en pequeno. */
      var grande = Math.min(1, Math.max(0, (Math.min(W,H) - 600) / 900));
      var D=Math.min(W,H)*(0.34 + grande*0.10);
      for(var i=0;i<pts.length;i++) for(var j=i+1;j<pts.length;j++){
        var a=pts[i], b=pts[j], dx=a.x-b.x, dy=a.y-b.y, d=Math.sqrt(dx*dx+dy*dy);
        if(d<D){ ctx.strokeStyle=color((1-d/D)*(1-d/D)*0.86*Math.min(1.7,inten)); ctx.lineWidth=.9+grande*0.7;
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
      }
      for(var i=0;i<pts.length;i++){
        var p=pts[i], pr=p.r+Math.sin(Date.now()/600+p.ph)*.3;
        ctx.fillStyle=color(.6); ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(.4,pr),0,6.283); ctx.fill();
      }
    }
    function bucle(){ pintar(); raf=requestAnimationFrame(bucle); }

    function iniciar(){
      cv=document.getElementById('faceFX');
      if(!cv) return;
      ctx=cv.getContext('2d'); medir();
      /* La densidad depende del AREA: 28 puntos llenaban una caja de 400px,
         pero sobre un monitor entero dejaban la red casi vacia. */
      var objetivo = Math.max(34, Math.min(96, Math.round((W*H)/13000)));
      pts=[]; for(var i=0;i<objetivo;i++) pts.push({
        x:Math.random()*W, y:Math.random()*H,
        vx:(Math.random()-.5)*.32, vy:(Math.random()-.5)*.32,
        r:Math.random()*1.5+.7, ph:Math.random()*6.28 });
      if(reduce){ pintar(); return; }   /* sin bucle si pidieron menos movimiento */
      if(!raf) bucle();
      window.addEventListener('resize', medir);
    }
    function estado(m){
      if(modo===m) return;
      modo=m;
      var v=MAPA[m]||MAPA.idle; objetivo=v[0]; tono=v[1];
      var st=document.getElementById('faceStage');
      if(st) st.className='face-stage'+(m==='idle'?'':' '+m);
      if(reduce) pintar();
    }
    return { iniciar:iniciar, estado:estado };
  })();

  async function initAuth(){

    var session = null;
    try{
      var r = await supa.auth.getSession();
      session = (r && r.data) ? r.data.session : null;
      if(session && session.access_token){
        accessToken = session.access_token;   // ya estás dentro → ELIXIS abre
      } else {
        goLogin();                             // no logueado → a tu login principal
        return;
      }
    }catch(e){ goLogin(); return; }
    // Identidad del usuario: saludar por nombre + adaptar al rol
    try{
      var pr = await supa.from("dj_profiles")
        .select("stage_name,dj_name,full_name,role").eq("user_id", session.user.id).maybeSingle();
      var p = (pr && pr.data) ? pr.data : {};
      userName = String(p.stage_name || p.dj_name || p.full_name || "").trim();
      userRole = String(p.role || "").toLowerCase().trim();
    }catch(e){}
    showGreeting();
    try{
      supa.auth.onAuthStateChange(function(_ev, s){
        accessToken = s ? s.access_token : null;
        if(!accessToken) goLogin();
      });
    }catch(e){}
  }

  // ── Render helpers ─────────────────────────────────
  function el(tag, cls, txt){

  function esc(s){

  }
  // Markdown mínimo y seguro (escapado ANTES): **negrita** y *cursiva*.
  function fmt(s){
    return esc(s)
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, "$1<em>$2</em>");

  /* Pinta el borrador y cablea las dos salidas. El envio real NO pasa por
     ELIXIS: va directo a elixis-sms-dispatch, que exige rol owner/staff y solo
     acepta una fila que ya estaba en cola. */
  function addSmsCard(sms){
    if(!sms || !sms.id) return;
    var row = el("div","row elixis");
    row.appendChild(el("div","ava elixis","E"));
    var wrap = el("div");
    var card = el("div","sms-card");
    card.innerHTML =
      '<div class="sms-h">✉︎ SMS listo para aprobar</div>' +
      '<div class="sms-dest">Para <b>'+esc(sms.destinatario||"(sin nombre)")+'</b> ' +
        '<span class="sms-tel">'+esc(sms.telefono||"")+'</span></div>' +
      '<div class="sms-msg"></div>' +
      '<div class="sms-acc">' +
        '<button class="sms-ok" data-a="enviar">Aprobar y enviar</button>' +
        '<button data-a="cancelar">Cancelar</button>' +
      '</div>' +
      '<div class="sms-estado"></div>';
    card.querySelector(".sms-msg").textContent = sms.mensaje || "";
    wrap.appendChild(card); row.appendChild(wrap);
    stream.appendChild(row); stream.scrollTop = stream.scrollHeight;

    var estado = card.querySelector(".sms-estado");
    var botones = card.querySelectorAll("button");

    function cerrar(txt, clase){
      estado.textContent = txt;
      card.classList.add("resuelta");
      if(clase) card.classList.add(clase);
    }

    card.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", async function(){
        var accion = b.getAttribute("data-a");
        botones.forEach(function(x){ x.disabled = true; });   /* nada de doble clic */
        estado.textContent = accion === "enviar" ? "Enviando…" : "Cancelando…";
        var base = (typeof window.mdbSupabaseFunctionUrl === "function")
          ? window.mdbSupabaseFunctionUrl("elixis-sms-dispatch") : null;
        if(!base){ cerrar("No pude ubicar el despachador."); return; }
        var url = base + (base.indexOf("?")===-1?"?":"&") + "id=" + encodeURIComponent(sms.id)
                + (accion === "cancelar" ? "&accion=cancelar" : "");
        try{
          var res = await fetch(url, { method:"POST", headers: invokeHeaders() });
          var d = {}; try{ d = await res.json(); }catch(_){}
          if(res.status === 401){ goLogin(); return; }
          if(res.status === 403){ cerrar("Tu cuenta no puede enviar SMS de la empresa."); return; }
          if(res.status === 409){ cerrar("Este mensaje ya estaba resuelto ("+(d.estado||"?")+")."); return; }
          if(!res.ok || d.ok !== true){
            cerrar("No se pudo "+(accion==="enviar"?"enviar":"cancelar")+". Inténtalo de nuevo.");
            botones.forEach(function(x){ x.disabled = false; });
            card.classList.remove("resuelta");
            return;
          }
          cerrar(accion === "enviar" ? "✓ Enviado a "+(d.destinatario||sms.destinatario) : "Cancelado. No salió nada.");
          /* La ventana del proceso solo puede decir ENVIADO cuando el
             despachador lo confirma. Hasta aqui era "en cola", que es la
             verdad: encolar no es enviar. */
          if(accion === "enviar"){ marcarSmsEnviado(); } else { marcarSmsCancelado(); }
        }catch(e){
          cerrar("Sin conexión con el despachador.");
          botones.forEach(function(x){ x.disabled = false; });
          card.classList.remove("resuelta");
        }
      });
    });
  }

  /* ═══ LAS DOS VENTANAS ═════════════════════════════════════════════

  var ladoProceso = document.getElementById("ladoProceso");

  var modoVoz = false;

  function ponerPalabraEnEspera(){

  function transcribir(quien, texto){

  var SOBRE = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><rect x='2.5' y='5' width='19' height='14' rx='2.5'/><path d='m3 7 9 6 9-6'/></svg>";

  /* ═══ RIEL DE CONFIGURACIONES Y PERMISOS ═══════════════════════════
     Los controles se MUEVEN aqui, no se copian: el selector de voz sigue
     siendo el mismo nodo, con sus mismos oyentes, solo que colgado de otro
     sitio. Duplicarlo habria dejado dos mandos para lo mismo. */
  /* ═══ EL RETRATO SE CURA SOLO ═══════════════════════════════════════
     Diagnosticado, no supuesto: la imagen falla SOLO durante la carga de la
     pagina, y la misma URL pedida un segundo despues entra sin problema
     (407x518, comprobado). No es un archivo roto ni cache envenenado: es que
     el servidor local de desarrollo -- python3 -m http.server, de un solo
     hilo -- se atraganta con la rafaga de peticiones del arranque, y la
     imagen es la que pierde la carrera.
     Por eso el reintento va CON ESPERA: reintentar al instante caia dentro
     del mismo atasco. Dos intentos separados; si aun asi falla, el elemento
     se retira -- un hueco limpio es mejor que el recuadro roto de Safari
     animandose en mitad del chat, que ya se vio tres veces. */
  (function retratoResistente(){
    var img = document.querySelector(".face-fig");
    if(!img) return;
    var RUTA = "./assets/elixis-avatar.webp?v=20260820b-rostro";
    img.addEventListener("error", function(){
      var n = Number(img.dataset.reintentos || 0);
      if(n >= 2){ img.remove(); return; }       /* hueco limpio, nunca el icono roto */
      img.dataset.reintentos = String(n + 1);
      setTimeout(function(){ img.src = RUTA + "&r=" + Date.now(); }, 400 + n * 800);
    });
    img.src = RUTA;      /* la fuente se pone DESDE AQUI, no en el HTML */
  })();


  /* ═══ VOLUMEN DE LA VOZ DE ELIXIS ══════════════════════════════════
     IMPORTANTE, y se dice aqui para que nadie lo intente otra vez: esto NO es
     el volumen del Mac. Ninguna pagina web puede leer ni cambiar el volumen
     del sistema, ni capturar sus teclas -- macOS se las queda antes de que
     lleguen al navegador. Lo que se controla es el elemento de audio de
     ELIXIS. Se recuerda entre sesiones. */
  /* ═══ DIA / NOCHE ═══ Lo que elijas manda; si nunca elegiste, manda tu Mac. */
  function ponerTema(t){
    if(t === "claro") document.documentElement.setAttribute("data-tema", "claro");
    else document.documentElement.removeAttribute("data-tema");
    try{ localStorage.setItem("elixis_tema", t); }catch(e){}
    /* La red cachea su color: hay que decirle que lo recalcule. */
    try{ if(typeof window.mdjOlvidarHilos === "function") window.mdjOlvidarHilos(); }catch(e){}
    var b = document.getElementById("temaBtn");
    if(b) b.innerHTML = (t === "claro") ? ICO_LUNA : ICO_SOL;
  }
  var ICO_SOL  = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='4'/><path d='M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4'/></svg>";
  var ICO_LUNA = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><path d='M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z'/></svg>";
  (function(){
    var g = null; try{ g = localStorage.getItem("elixis_tema"); }catch(e){}
    if(g === "claro" || g === "oscuro"){ ponerTema(g); }
    else if(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches){ ponerTema("claro"); }
    else { ponerTema("oscuro"); }
    var b = document.getElementById("temaBtn");
    if(b) b.addEventListener("click", function(){
      ponerTema(document.documentElement.getAttribute("data-tema") === "claro" ? "oscuro" : "claro");
    });
  })();

  var volRange = document.getElementById("volRange");
  var _volumen = 1;
  try { var g = localStorage.getItem("elixis_volumen"); if (g !== null) _volumen = Math.min(1, Math.max(0, Number(g))); } catch (e) {}

  function aplicarVolumen(v, guardar) {
    _volumen = Math.min(1, Math.max(0, v));
    var a = document.querySelector("audio");
    if (a) a.volume = _volumen;
    if (volRange) volRange.value = String(Math.round(_volumen * 100));
    if (guardar) { try { localStorage.setItem("elixis_volumen", String(_volumen)); } catch (e) {} }
  }
  window.mdjVolumenElixis = function () { return _volumen; };   /* lo lee speak() al crear el audio */
  if (volRange) volRange.addEventListener("input", function () { aplicarVolumen(Number(volRange.value) / 100, true); });
  aplicarVolumen(_volumen, false);

  /* Atajos DENTRO de la pagina, ya que las teclas del Mac no llegan.
     Cmd/Ctrl + flechas: sube y baja. Se evita chocar con la escritura. */
  document.addEventListener("keydown", function (e) {
    if (!(e.metaKey || e.ctrlKey)) return;
    if (e.key === "ArrowUp")   { e.preventDefault(); aplicarVolumen(_volumen + 0.1, true); }
    if (e.key === "ArrowDown") { e.preventDefault(); aplicarVolumen(_volumen - 0.1, true); }
  });

  /* ═══ SALIR DEL MODO PRODUCTIVO ════════════════════════════════════
     Vuelve a MI PERFIL. Se usa el resolvedor canonico si esta disponible;
     si no, la estacion de staff, que es a donde el resolvedor manda al owner.
     target=_top a proposito: la consola vive dentro de un iframe en
     staff.html, y sin eso cargaria el portal DENTRO de si mismo. */
  var salirBtn = document.getElementById("salirBtn");
  if (salirBtn) salirBtn.addEventListener("click", function () {
    var destino = "./staff.html";
    try { if (window.top && window.top !== window.self) { window.top.location.href = destino; return; } } catch (e) {}
    window.location.href = destino;
  });

  var cfgRiel = document.getElementById("cfgRiel");
  var cfgItems = document.getElementById("cfgItems");
  var cfgContraer = document.getElementById("cfgContraer");

  var ICO_AJUSTES = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='3'/><path d='M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z'/></svg>";
  var ICO_ESCUDO  = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z'/><path d='M9 12l2 2 4-4'/></svg>";
  var ICO_FLECHA  = "<svg class='cfg-flecha' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m9 18 6-6-6-6'/></svg>";

  /* Lo que ELIXIS puede hacer, leido del porton real (approval-gate.ts). Es
     una FICHA, no un mando: los permisos viven en el servidor y no se cambian
     desde aqui. Decirlo evita que parezca que tocando algo se abre una puerta. */
  var PERMISOS = [
    ["Consultar finanzas", "lee"], ["Consultar agenda", "lee"],
    ["Consultar precios", "lee"], ["Buscar clientes", "lee"],
    ["Dejar notas en leads", "escribe"], ["Bloquear la agenda", "escribe"],
    ["Preparar cotizaciones", "escribe"], ["Enviar SMS", "humana"]
  ];

  function grupo(id, icono, titulo){
    var b = document.createElement("button");
    b.type = "button"; b.className = "cfg-grupo"; b.setAttribute("data-g", id);
    b.innerHTML = icono + "<span class='cfg-tx'>" + titulo + "</span>" + ICO_FLECHA;
    return b;
  }

  (function montarRiel(){
    if(!cfgItems) return;

    /* CONFIGURACIONES — se traga el contenido del panel del engranaje. */
    var gCfg = grupo("cfg", ICO_AJUSTES, "Configuraciones");
    var cCfg = document.createElement("div"); cCfg.className = "cfg-cuerpo";
    var viejo = document.getElementById("settingsPanel");
    if(viejo){
      while(viejo.firstChild) cCfg.appendChild(viejo.firstChild);  /* MOVER, no clonar */
      viejo.remove();
    }
    cfgItems.appendChild(gCfg); cfgItems.appendChild(cCfg);

    /* PERMISOS — ficha de solo lectura. */
    var gPer = grupo("per", ICO_ESCUDO, "Permisos");
    var cPer = document.createElement("div"); cPer.className = "cfg-cuerpo";
    PERMISOS.forEach(function(p){
      var f = document.createElement("div");
      f.className = "cfg-fila" + (p[1] === "humana" ? " humana" : "");
      f.innerHTML = "<span class='punto'></span>";
      f.appendChild(document.createTextNode(p[0]));
      cPer.appendChild(f);
    });
    var nota = document.createElement("div");
    nota.className = "cfg-nota";
    nota.textContent = "Ficha de solo lectura. Los permisos viven en el servidor; enviar SMS exige siempre tu aprobación en pantalla.";
    cPer.appendChild(nota);
    cfgItems.appendChild(gPer); cfgItems.appendChild(cPer);

    /* ACORDEON: uno abierto a la vez, como en el riel de staff. */
    cfgItems.querySelectorAll(".cfg-grupo").forEach(function(g){
      g.addEventListener("click", function(){
        var abrir = !g.classList.contains("abierto");
        cfgItems.querySelectorAll(".cfg-grupo").forEach(function(x){ x.classList.remove("abierto"); });
        if(abrir) g.classList.add("abierto");
        if(cfgRiel.classList.contains("contraido")) alternarRiel();   /* contraido no se puede leer */
      });
    });
    gCfg.classList.add("abierto");
  })();

  function alternarRiel(){
    if(!cfgRiel) return;
    var contraido = cfgRiel.classList.toggle("contraido");
    if(cfgContraer) cfgContraer.setAttribute("aria-expanded", String(!contraido));
    try{ localStorage.setItem("elixis_riel_contraido", contraido ? "1" : "0"); }catch(e){}
  }
  if(cfgContraer) cfgContraer.addEventListener("click", alternarRiel);
  /* El patron de staff.html NO recuerda el estado y vuelve a abierto en cada
     recarga. Aqui si se recuerda: es un anadido consciente, no una copia. */
  try{
    if(localStorage.getItem("elixis_riel_contraido") === "1" && cfgRiel){
      cfgRiel.style.transition = "none";
      cfgRiel.classList.add("contraido");
      if(cfgContraer) cfgContraer.setAttribute("aria-expanded", "false");
      setTimeout(function(){ cfgRiel.style.transition = ""; }, 60);
    }
  }catch(e){}

  async function askElixis(message){
    var url = functionUrl();
    if(!url){
      addError("No pude ubicar la función (supabase-config.js no cargó). Recarga la página.");
      return;
    }
    showTyping();
    retirarPie();
    abrirLados();
    transcribir("yo", message);
    try{
      var res = await fetch(url, {
        method:"POST",
        headers: invokeHeaders(),
        body: JSON.stringify({ message: message, history: history.slice(-20) })
      });
      hideTyping();
      var data = {};
      try { data = await res.json(); } catch(_) {}
      if(res.status === 401){ goLogin(); return; }
      if(res.status === 403){ addError("Esta cuenta no tiene acceso de owner/staff" + (data.detail ? " (rol: " + data.detail + ")" : "") + "."); return; }
      if(!res.ok || !data.reply){
        addError("ELIXIS tuvo un problema (" + res.status + "): " + (data.error || "sin respuesta") + ".");
        return;
      }
      addRow("elixis", data.reply);
      transcribir("elixis", data.reply);
      /* FASE 1 en accion: esto es lo que ELIXIS hizo de verdad, reportado por
         el backend. Sin este campo, la ventana estaria adivinando. */
      if(data.herramientas_usadas) dibujarProceso(data.herramientas_usadas);
      /* Si en este turno quedo un SMS en cola, la tarjeta sale justo debajo de
         lo que dijo ELIXIS, para que la decision este donde esta el contexto. */
      if(data.sms_pendiente) addSmsCard(data.sms_pendiente);
      speak(data.reply);
      history.push({ role:"user", content:message });
      history.push({ role:"assistant", content:data.reply });
    }catch(err){
      hideTyping();
      statusPill.classList.add("off");
      statusPill.lastChild.textContent = " Sin conexión";
      addError("No pude contactar el servidor. Revisa tu conexión e inténtalo de nuevo.");
    }
  }

  // ── Send flow ──────────────────────────────────────
  /* Teclear a mano saca del modo voz. Se escucha keydown y no input a
     proposito: el dictado rellena el campo por codigo y eso no dispara
     keydown, asi que hablar no se confunde con escribir. */
  (function(){
    var campo = document.getElementById("input");
    if(campo) campo.addEventListener("keydown", function(e){
      if(e.key && e.key.length === 1) salirModoVoz();
    });
  })();

  /* El atajo se aprende una vez. Se recuerda entre sesiones para que no
     reaparezca cada vez que abres la consola. */
  function retirarPie(){
    var h = document.querySelector(".hint");
    if(h) h.classList.add("aprendido");
    try{ localStorage.setItem("elixis_pie_aprendido", "1"); }catch(e){}
  }
  try{
    if(localStorage.getItem("elixis_pie_aprendido") === "1"){
      var _h = document.querySelector(".hint");
      if(_h){ _h.classList.add("aprendido"); _h.style.transition = "none"; }
    }
  }catch(e){}

  function send(){
    if(busy) return;
    var msg = (input.value || "").trim();
    if(!msg) return;
    if(msg.length > 2000){ msg = msg.slice(0,2000); }
    addRow("user", msg);
    input.value = ""; autogrow();
    busy = true; sendBtn.disabled = true;
    askElixis(msg).finally(function(){
      busy = false; sendBtn.disabled = false; input.focus();
    });
  }

  function autogrow(){
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }

  input.addEventListener("input", autogrow);
  input.addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
  });
  sendBtn.addEventListener("click", send);

  // ── VOZ DE SALIDA — TTS del navegador (gratis) ─────
  var voiceToggle = document.getElementById("voiceToggle");
  var micBtn = document.getElementById("mic");
  /* Los dos estados del dictado, en trazo de linea del mismo banco que el
     resto. Antes se reponian con textContent y un emoji, lo que borraba el
     SVG del boton en cuanto terminabas de dictar. */
  var MIC_LINEA = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z'/><path d='M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8'/></svg>";
  var MIC_PARAR = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><rect x='6' y='6' width='12' height='12' rx='2.5'/></svg>";
  var settingsBtn = document.getElementById("settingsBtn");
  var settingsPanel = document.getElementById("settingsPanel");
  var voiceSelect = document.getElementById("voiceSelect");
  var voiceOn = true;
  /* Trazos de linea, no emoji. Se reponian con textContent y un emoji, lo
     que habria borrado el SVG del boton al silenciar. */
  var ICO_ALTAVOZ = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M11 5 6 9H2v6h4l5 4z'/><path d='M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13'/></svg>";
  var ICO_MUDO    = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M11 5 6 9H2v6h4l5 4z'/><path d='m16 9 5 6M21 9l-5 6'/></svg>";
  var esVoice = null;
  var synth = window.speechSynthesis || null;
  var selectedVoice = "ash";
  try { var _sv = localStorage.getItem("elixis_voice"); if(_sv) selectedVoice = _sv; } catch(e){}
  if(voiceSelect){ voiceSelect.value = selectedVoice; }

  function pickSpanishVoice(){
    if(!synth) return null;
    var vs = synth.getVoices() || [];
    return vs.find(function(v){ return /^es[-_]US/i.test(v.lang); })
        || vs.find(function(v){ return /^es[-_](ES|MX|419)/i.test(v.lang); })
        || vs.find(function(v){ return /^es/i.test(v.lang); })
        || null;
  }
  if(synth){
    esVoice = pickSpanishVoice();
    synth.onvoiceschanged = function(){ esVoice = pickSpanishVoice(); };
  } else if(voiceToggle){
    voiceToggle.style.display = "none";
  }

  // Desbloqueo de audio: un elemento "armado" con el primer gesto del usuario
  // para que la voz natural (OpenAI) SIEMPRE suene, sin bloqueo de autoplay.
  var currentAudio = null, _audioArmed = false;
  var _SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
  function _voiceEl(){
    if(!currentAudio){
      currentAudio = new Audio();
      /* El volumen elegido se aplica al crear el elemento: si no, la primera
         respuesta salia siempre a tope aunque el mando dijera otra cosa. */
      try{ currentAudio.volume = (typeof window.mdjVolumenElixis === "function") ? window.mdjVolumenElixis() : 1; }catch(e){}
    }
    return currentAudio;
  }
  function armAudio(){ if(_audioArmed) return; var el=_voiceEl(); try{ el.src=_SILENT; var p=el.play(); if(p&&p.then)p.then(function(){_audioArmed=true;}).catch(function(){}); }catch(e){} }
  ["pointerdown","keydown","touchstart"].forEach(function(ev){ document.addEventListener(ev, armAudio); });
  function stopAudio(){ if(currentAudio){ try{ currentAudio.pause(); }catch(e){} } if(synth){ try{ synth.cancel(); }catch(e){} } }
  function cleanForSpeech(text){
    return String(text||"").replace(/[*_`#>]/g,"").replace(/https?:\/\/\S+/g,"").trim();
  }
  // Voz PREMIUM (OpenAI vía elixis-tts) — natural o nada; NUNCA voz robótica del navegador.
  async function speak(text){
    if(!voiceOn) return;
    var clean = cleanForSpeech(text);
    if(!clean) return;
    stopAudio();
    var url = (typeof window.mdbSupabaseFunctionUrl === "function")
      ? window.mdbSupabaseFunctionUrl("elixis-tts") : null;
    if(!url) return;
    try{
      var res = await fetch(url, { method:"POST", headers: invokeHeaders(), body: JSON.stringify({ text: clean, voice: selectedVoice }) });
      var ct = res.headers.get("content-type") || "";
      if(res.ok && ct.indexOf("audio") !== -1){
        var blob = await res.blob();
        var el = _voiceEl();
        try{ el.pause(); }catch(e){}
        el.src = URL.createObjectURL(blob);
        /* El rostro habla exactamente mientras suena el audio, ni antes ni
           despues: se engancha al elemento, no a un temporizador. */
        el.onplaying = function(){ FACE.estado("speaking"); };
        el.onended = el.onpause = function(){ FACE.estado("idle"); };
        el.play().catch(function(){});
      }
    }catch(e){ /* natural-o-nada: sin voz robótica */ }
  }

  /* La bocina se dibuja YA: el markup la deja vacia a proposito para que el
     estado (encendida / silenciada) sea el que mande, no el HTML. */
  if(voiceToggle) voiceToggle.innerHTML = voiceOn ? ICO_ALTAVOZ : ICO_MUDO;
  if(voiceToggle){
    voiceToggle.addEventListener("click", function(){
      voiceOn = !voiceOn;
      voiceToggle.innerHTML = voiceOn ? ICO_ALTAVOZ : ICO_MUDO;
      voiceToggle.classList.toggle("off", !voiceOn);
      voiceToggle.title = voiceOn ? "Voz de ELIXIS: activada" : "Voz de ELIXIS: silenciada";
      if(!voiceOn){ stopAudio(); }
    });
  }

  // Selector de voz — persiste en localStorage y se envía a elixis-tts
  /* Ya NO se exige settingsPanel: el riel se lo lleva por delante antes de
     que este bloque corra, asi que pedirlo dejaba al engranaje sin oyente. */
  if(settingsBtn){
    settingsBtn.addEventListener("click", function(e){
      e.stopPropagation();
      /* Su panel propio ya no existe: sus controles VIVEN en el riel. El
         engranaje pasa a ser un atajo -- abre el riel y despliega
         Configuraciones -- para que no haya dos mandos para lo mismo.
         Queda pendiente de decision del PO si este boton se retira de la
         cabecera; hasta entonces, atajo. */
      if(cfgRiel && cfgRiel.classList.contains("contraido")) alternarRiel();
      var g = cfgItems && cfgItems.querySelector('.cfg-grupo[data-g="cfg"]');
      if(g && !g.classList.contains("abierto")) g.click();
    });
    /* El cierre por clic fuera se retira con el panel: el riel no se cierra
       solo, se contrae con su boton, igual que en staff.html. */
  }
  if(voiceSelect){
    voiceSelect.addEventListener("change", function(){
      selectedVoice = voiceSelect.value || "ash";
      try { localStorage.setItem("elixis_voice", selectedVoice); } catch(e){}
    });
  }

  // ── VOZ DE ENTRADA — dictado (Web Speech API) ──────
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  var rec = null, listening = false;
  function stopListening(){
    listening = false;
    if(micBtn){ micBtn.classList.remove("listening"); micBtn.innerHTML = MIC_LINEA; }
  }
  if(SR && micBtn){
    rec = new SR();
    rec.lang = "es-ES";
    rec.interimResults = true;
    rec.continuous = false;
    rec.onresult = function(e){
      var txt = "";
      for(var i=0;i<e.results.length;i++){ txt += e.results[i][0].transcript; }
      input.value = txt; autogrow();
      if(e.results[e.results.length-1].isFinal){
        stopListening();
        if((input.value||"").trim()) send();
      }
    };
    rec.onerror = function(){ stopListening(); };
    rec.onend = function(){ stopListening(); };
    micBtn.addEventListener("click", function(){
      if(listening){ try{ rec.stop(); }catch(e){} stopListening(); return; }
      try{
        stopAudio();   // no escucharse a sí mismo
        entrarModoVoz();   /* hablando: la ventana derecha pasa a transcribir */
        rec.start(); listening = true;
        micBtn.classList.add("listening"); micBtn.innerHTML = MIC_PARAR;
      }catch(e){ stopListening(); }
    });
  } else if(micBtn){
    micBtn.style.display = "none";   // navegador sin reconocimiento de voz
  }

  // El saludo personalizado lo dispara initAuth() tras identificar al usuario.
})();
</script>
</body>
</html>
