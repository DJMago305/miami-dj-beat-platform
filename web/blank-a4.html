<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hoja A4 en blanco</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #2a2a2a;
    }
    /* Vista previa en pantalla: proporción A4 */
    .sheet {
      width: 210mm;
      min-height: 297mm;
      margin: 16px auto;
      background: #fff;
      box-shadow: 0 4px 24px rgba(0,0,0,0.35);
    }
    @page {
      size: A4;
      margin: 12mm;
    }
    @media print {
      html, body { background: #fff; }
      .sheet {
        width: auto;
        min-height: auto;
        margin: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="sheet" aria-label="Hoja A4 en blanco"></div>
</body>
</html>
