<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Staff — Miami DJ Beat LLC</title>

  <!-- ── Auth-gate anti-flash STAFF: oculta todo hasta confirmar rol staff ── -->
  <style id="mdj-staff-gate-css">
    html.mdj-staff-gate-pending body { visibility: hidden !important; }
    html.mdj-staff-gate-pending { background: #050810; }
  </style>
  <script>document.documentElement.classList.add('mdj-staff-gate-pending');</script>

  <link rel="stylesheet" href="./styles.css?v=20260516-wordmark-clear-r-1" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js?v=20260814-bfi"></script>

  <style>
    /* ══════════ Portal STAFF — shell modular, bounded context /staff ══════════ */
    :root{ --gold:#c5a059; --gold-lt:#e8c987; --bg:#050810; --panel:#0b0f18; --line:rgba(255,255,255,.10); }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:#e8eaed;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      min-height:100vh;display:flex;flex-direction:column;}

    /* ── Topbar (logo + badge de rol + salir) ── */
    .staff-topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
      padding:12px 22px;background:linear-gradient(180deg,#0a0e16,#070a11);
      border-bottom:1px solid var(--line);flex-wrap:wrap;}
    .staff-brand{display:flex;align-items:center;gap:11px;min-width:0;}
    .staff-brand .mk{color:var(--gold-lt);font-size:17px;line-height:1;}
    .staff-brand .tx{font-size:15px;font-weight:900;letter-spacing:.02em;line-height:1.1;white-space:nowrap;}
    .staff-brand .tx small{display:block;font-size:8.5px;font-weight:700;letter-spacing:.16em;
      text-transform:uppercase;color:rgba(232,201,135,.72);}
    .staff-actions{display:flex;align-items:center;gap:12px;}
    #role-badge{font-size:9.5px;font-weight:900;letter-spacing:.16em;color:var(--gold);
      border:1px solid rgba(197,160,89,.55);border-radius:999px;padding:4px 11px;text-transform:uppercase;}
    #staff-name{font-size:12.5px;font-weight:700;color:rgba(255,255,255,.85);max-width:180px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    #staff-logout{background:#c0392b;border:none;color:#fff;font-weight:800;font-size:11px;letter-spacing:.05em;
      border-radius:9px;padding:8px 15px;cursor:pointer;transition:background .2s;}
    #staff-logout:hover{background:#e04b3a;}

    /* ── Nav propia (aislada de la tira de artista), poblada por RBAC ── */
    .staff-nav{display:flex;align-items:center;gap:4px;padding:0 16px;background:#070a11;
      border-bottom:1px solid var(--line);overflow-x:auto;min-height:47px;}
    .staff-nav a,.staff-nav button{background:transparent;border:none;border-bottom:2px solid transparent;
      color:rgba(255,255,255,.62);font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
      padding:14px 16px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:color .2s,border-color .2s;font-family:inherit;}
    .staff-nav a:hover,.staff-nav button:hover{color:var(--gold-lt);}
    .staff-nav [data-view].active{color:var(--gold-lt);border-bottom-color:var(--gold);}
    .staff-nav .ext{margin-left:auto;color:rgba(255,255,255,.42);font-weight:700;}
    .staff-nav .ext + .ext{margin-left:0;}
    .staff-nav .ext:hover{color:#fff;}

    /* ── Main + módulos/vistas ── */
    .staff-main{flex:1;min-height:0;position:relative;}
    .staff-module{display:none;height:100%;}
    .staff-module.active{display:block;}
    .staff-view{display:none;height:100%;}
    .staff-view.active{display:block;}

    /* ── Módulo Owner: Matrix embebido (reusa patrón .ofm-* de dj-dashboard) ── */
    .ofm-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
      margin:0;padding:7px 18px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0));
      border-bottom:1px solid rgba(255,255,255,.06);}
    .ofm-bar .lbl{font-size:11px;font-weight:800;letter-spacing:.10em;text-transform:uppercase;color:var(--gold-lt);}
    .ofm-ctrls{display:flex;align-items:center;gap:11px;}
    .ofm-sep{width:1px;height:20px;background:rgba(255,255,255,.14);}
    .ofm-daynight{width:30px;height:28px;display:inline-flex;align-items:center;justify-content:center;
      background:transparent;border:1px solid rgba(255,255,255,.16);border-radius:9px;color:var(--gold-lt);
      cursor:pointer;padding:0;transition:background .2s,border-color .2s;}
    .ofm-daynight:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.30);}
    .ofm-daynight svg{width:16px;height:16px;display:block;}
    .ofm-expand{background:rgba(197,160,89,.10);border:1px solid rgba(197,160,89,.4);color:var(--gold-lt);
      font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
      border-radius:8px;padding:6px 11px;white-space:nowrap;transition:background .2s;}
    .ofm-expand:hover{background:rgba(197,160,89,.20);}
    #ofm-business-view{height:calc(100vh - 132px);}
    #ofm-matrix-frame,#elixis-frame{width:100%;height:100%;min-height:520px;border:none;background:#0b0b0f;display:block;}
    #view-elixis{height:calc(100vh - 96px);}
    #ofm-business-view.ofm-full{position:fixed;inset:0;z-index:9998;height:100vh;background:#000;}
    #ofm-business-view.ofm-full #ofm-matrix-frame{height:100vh;}
    #ofm-business-view.ofm-full .ofm-exit{display:block;}
    .ofm-exit{display:none;position:fixed;top:14px;right:16px;z-index:10000;background:rgba(0,0,0,.6);
      border:1px solid rgba(255,255,255,.25);color:#fff;font-size:12px;font-weight:800;cursor:pointer;
      border-radius:10px;padding:8px 13px;backdrop-filter:blur(6px);}
    .ofm-exit:hover{background:rgba(0,0,0,.82);}

    /* ── Módulo stub (manager/vendedor — estructura RBAC lista) ── */
    .stub-wrap{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 160px);padding:24px;}
    .stub-card{max-width:560px;text-align:center;background:var(--panel);border:1px solid var(--line);
      border-radius:18px;padding:40px 34px;}
    .stub-card h2{margin:0 0 10px;font-size:22px;color:var(--gold-lt);}
    .stub-card p{margin:0 0 22px;color:rgba(255,255,255,.66);line-height:1.55;font-size:14px;}
    .stub-card .go{display:inline-block;background:rgba(197,160,89,.14);border:1px solid rgba(197,160,89,.45);
      color:var(--gold-lt);text-decoration:none;font-weight:800;font-size:12.5px;letter-spacing:.06em;
      text-transform:uppercase;border-radius:10px;padding:12px 20px;transition:background .2s;}
    .stub-card .go:hover{background:rgba(197,160,89,.24);}
  </style>
</head>
<body>
  <header class="staff-topbar">
    <div class="staff-brand">
      <span class="mk">◆</span>
      <span class="tx">MIAMI DJ BEAT LLC<small id="brand-sub">Staff Command Center</small></span>
    </div>
    <div class="staff-actions">
      <span id="role-badge">◆ Staff</span>
      <span id="staff-name"></span>
      <button id="staff-logout" type="button">SALIR</button>
    </div>
  </header>

  <!-- Nav ISLADA (poblada por RBAC según el rol) -->
  <nav class="staff-nav" id="staff-nav" aria-label="Navegación de staff"></nav>

  <main class="staff-main">
    <!-- ═══ Módulo OWNER (Matrix Principal) — solo rol owner ═══ -->
    <div id="module-owner" class="staff-module">
      <section id="view-financiero" class="staff-view active">
        <div class="ofm-bar">
          <span class="lbl">◆ Owner Financial IA — Matrix</span>
          <div class="ofm-ctrls">
            <span class="ofm-sep"></span>
            <button type="button" id="ofm-daynight" class="ofm-daynight" aria-label="Modo día / noche del Matrix"></button>
            <button type="button" id="ofm-expand" class="ofm-expand" aria-label="Pantalla completa">⛶ Pantalla completa</button>
          </div>
        </div>
        <div id="ofm-business-view">
          <button id="ofm-exit" class="ofm-exit" type="button" aria-label="Salir de pantalla completa">✕ Salir</button>
          <iframe id="ofm-matrix-frame" src="./business-financial-intelligence.html"
                  title="Owner Financial IA — Matrix" referrerpolicy="same-origin"></iframe>
        </div>
      </section>
      <section id="view-elixis" class="staff-view">
        <iframe id="elixis-frame" data-src="./elixis-console.html" title="ELIXIS — consola" referrerpolicy="same-origin"></iframe>
      </section>
    </div>

    <!-- ═══ Módulo STUB (manager/vendedor) — estructura RBAC lista, vista por construir ═══ -->
    <div id="module-stub" class="staff-module">
      <div class="stub-wrap">
        <div class="stub-card">
          <h2 id="stub-title">Módulo</h2>
          <p id="stub-desc">Tu vista de staff se habilitará aquí muy pronto. La estructura RBAC ya está lista.</p>
          <a class="go" href="./admin-dashboard.html">Ir a mi panel actual</a>
        </div>
      </div>
    </div>
  </main>

  <script>
  (function(){
    var STAFF_ROLES = ['owner','admin','manager','seller'];
    function getSb(){ return window.getSupabaseClient ? window.getSupabaseClient() : window.supabase; }
    function reveal(){ document.documentElement.classList.remove('mdj-staff-gate-pending'); }
    function el(id){ return document.getElementById(id); }

    /* ── Gate STAFF (solo fila dj_profiles.role, nunca JWT solo — patrón admin-dashboard) ── */
    function wait(cb,n){
      var sb=getSb();
      if(sb&&sb.auth) return cb(sb);
      if((n||0)>40){ reveal(); return; }
      setTimeout(function(){ wait(cb,(n||0)+1); }, 250);
    }
    wait(async function(sb){
      try{
        var sess=(await sb.auth.getSession()).data.session;
        if(!sess){ location.replace('./login.html?next=staff.html'); return; }
        var res=await sb.from('dj_profiles').select('role, dj_name').eq('user_id', sess.user.id).maybeSingle();
        var role=String(res.data&&res.data.role?res.data.role:'').toLowerCase().trim();
        if(STAFF_ROLES.indexOf(role)===-1){ location.replace('./dj-dashboard.html'); return; } // no-staff → su edificio
        reveal();
        initStaff(sb, role, res.data||{});
      }catch(e){ reveal(); location.replace('./login.html'); }
    });

    /* ── Router RBAC: el shell renderiza el módulo según el rol ── */
    function initStaff(sb, role, profile){
      // badge + nombre
      var badge=el('role-badge'), nm=el('staff-name');
      var label = role==='owner' ? '◆ Owner' : role==='seller' ? 'Vendedor' : (role==='manager'?'Manager':'Admin');
      if(badge) badge.textContent = label;
      if(nm) nm.textContent = profile.dj_name || (sb && '');
      // logout
      var out=el('staff-logout');
      if(out) out.addEventListener('click', async function(){ try{ await sb.auth.signOut(); }catch(e){} location.replace('./index.html'); });

      if(role==='owner'){ mountOwner(sb); }
      else { mountStub(role); }  // admin/manager → operaciones · seller → ventas
    }

    /* ── Módulo OWNER: Matrix (BFI + Caja Real Fase 4) + ELIXIS + Gobernanza ── */
    function mountOwner(sb){
      el('brand-sub').textContent='Owner Command Center';
      el('module-owner').classList.add('active');
      // nav propia del owner
      el('staff-nav').innerHTML =
        '<button type="button" data-view="financiero" class="active">Financiero</button>'+
        '<button type="button" data-view="elixis">ELIXIS</button>'+
        '<a class="ext" href="./admin-dashboard.html" title="Gobernanza / supervisión staff">Gobernanza</a>'+
        '<a class="ext" href="./dj-dashboard.html" title="Tu agenda de DJ">Mi Agenda</a>'+
        '<a class="ext" href="./account-settings.html" title="Configuración">Config</a>';

      // switch de vistas (Financiero ⇄ ELIXIS)
      var btns=document.querySelectorAll('#staff-nav [data-view]');
      var views=document.querySelectorAll('#module-owner .staff-view');
      function showView(v){
        views.forEach(function(s){ s.classList.toggle('active', s.id==='view-'+v); });
        btns.forEach(function(b){ b.classList.toggle('active', b.dataset.view===v); });
        if(v==='elixis'){ var f=el('elixis-frame'); if(f&&!f.getAttribute('src')) f.setAttribute('src', f.getAttribute('data-src')); }
      }
      btns.forEach(function(b){ b.addEventListener('click', function(){ showView(b.dataset.view); }); });

      // Matrix: día/noche (ícono sol/luna) + pantalla completa nativa (reusa ofm de dj-dashboard)
      var frame=el('ofm-matrix-frame'), biz=el('ofm-business-view'), dtog=el('ofm-daynight'),
          expand=el('ofm-expand'), exitBtn=el('ofm-exit');
      var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
      var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
      var THEME_KEY='mdjFinTheme', curTheme='night';
      function applyTheme(theme, persist){
        curTheme=theme; var day=(theme==='day');
        if(dtog){ dtog.innerHTML=day?MOON:SUN; dtog.title=day?'Modo día · toca para noche':'Modo noche · toca para día'; }
        try{ var d=frame&&frame.contentDocument; if(d&&d.body) d.body.setAttribute('data-mode', day?'light':'dark'); }catch(e){}
        if(persist){ try{ localStorage.setItem(THEME_KEY, theme); }catch(e){} }
      }
      if(dtog) dtog.addEventListener('click', function(){ applyTheme(curTheme==='day'?'night':'day', true); });
      if(frame) frame.addEventListener('load', function(){ applyTheme(curTheme, false); });
      var st='night'; try{ st=localStorage.getItem(THEME_KEY)||'night'; }catch(e){}
      applyTheme(st, false);

      function fsEl(){ return document.fullscreenElement || document.webkitFullscreenElement || null; }
      function paintFull(full){ biz.classList.toggle('ofm-full', full); document.body.style.overflow=full?'hidden':''; }
      function goFull(){ var req=biz.requestFullscreen||biz.webkitRequestFullscreen;
        if(req){ try{ var p=req.call(biz); if(p&&p.catch) p.catch(function(){paintFull(true);}); }catch(e){ paintFull(true); } } else paintFull(true); }
      function leaveFull(){ if(fsEl()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); } paintFull(false); }
      if(expand) expand.addEventListener('click', goFull);
      if(exitBtn) exitBtn.addEventListener('click', leaveFull);
      function onFs(){ paintFull(fsEl()===biz); }
      document.addEventListener('fullscreenchange', onFs);
      document.addEventListener('webkitfullscreenchange', onFs);
      document.addEventListener('keydown', function(e){ if(e.key==='Escape' && biz.classList.contains('ofm-full') && !fsEl()) paintFull(false); });
    }

    /* ── Módulo STUB: manager/vendedor (estructura lista, vista por construir) ── */
    function mountStub(role){
      var isSeller = (role==='seller');
      el('brand-sub').textContent = isSeller ? 'Ventas' : 'Operaciones';
      el('stub-title').textContent = isSeller ? 'Módulo de Ventas' : 'Módulo de Operaciones';
      el('module-stub').classList.add('active');
      el('staff-nav').innerHTML =
        '<button type="button" class="active">'+(isSeller?'Ventas':'Operaciones')+'</button>'+
        '<a class="ext" href="./admin-dashboard.html" title="Panel actual">Mi Panel</a>';
    }
  })();
  </script>
</body>
</html>
