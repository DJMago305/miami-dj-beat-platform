       sustituta del sistema y el texto sale ~2% mas estrecho, desplazando el eje X. -->

    /* Editorial “papel” — inspiración layout boda + collage lateral */
    body.page-wedding-planning {
      background: linear-gradient(175deg, #c9c4bc 0%, #a8a298 18%, #8f8a82 55%, #6e6a63 100%);
      min-height: 100vh;
    }

    .mdj-wp-shell {
      /* body ya reserva altura del header en styles.css */
      padding: 24px clamp(14px, 3vw, 28px) 88px;
      box-sizing: border-box;
    }

    .mdj-wp-editorial {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(260px, 0.88fr);
      gap: clamp(28px, 4vw, 52px);
      align-items: start;
      padding: clamp(28px, 4vw, 48px) clamp(22px, 3.5vw, 44px) clamp(32px, 4vw, 52px);
      background: linear-gradient(180deg, #fffefb 0%, #faf7f2 48%, #f3efe8 100%);
      border-radius: 28px;
      box-shadow:
        0 4px 0 rgba(255, 255, 255, 0.65) inset,
        0 32px 64px rgba(20, 18, 14, 0.22),
        0 1px 0 rgba(0, 0, 0, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.85);
    }

    .mdj-wp-copy {
      min-width: 0;
      font-family: 'Outfit', system-ui, sans-serif;
      color: #2c2833;
    }

    .mdj-wp-breadcrumb {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 22px;
      color: rgba(44, 40, 51, 0.55);
      font-weight: 600;
    }

    .mdj-wp-breadcrumb a {
      color: #7a6140;
      font-weight: 700;
      text-decoration: none;
      border-bottom: 1px solid rgba(122, 97, 64, 0.35);
    }

    .mdj-wp-breadcrumb a:hover {
      color: #4a3928;
      border-bottom-color: rgba(74, 57, 40, 0.55);
    }

    .mdj-wp-copy h1 {
      font-family: 'Cormorant Garamond', 'Times New Roman', serif;
      font-size: clamp(2.1rem, 4.2vw, 2.85rem);
      font-weight: 600;
      color: #1a1614;
      margin: 0 0 16px;
      line-height: 1.08;
      letter-spacing: 0.02em;
    }

    .mdj-wp-lead {
      font-size: 1.02rem;
      line-height: 1.65;
      color: rgba(44, 40, 51, 0.78);
      margin: 0 0 36px;
      max-width: 52ch;
      font-weight: 400;
    }

    .mdj-wp-tier {
      margin-bottom: 32px;
      padding: 0 0 4px;
      border: none;
      background: transparent;
    }

    .mdj-wp-tier h2 {
      font-family: 'Cormorant Garamond', 'Times New Roman', serif;
      font-size: clamp(1.35rem, 2.4vw, 1.65rem);
      font-weight: 700;
      color: #141210;
      margin: 0 0 12px;
      line-height: 1.2;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(197, 160, 89, 0.45);
      display: inline-block;
      min-width: 0;
    }

    .mdj-wp-tier p {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.78;
      color: rgba(35, 32, 38, 0.88);
      max-width: 54ch;
    }

    .mdj-wp-addons {
      margin-top: 8px;
      margin-bottom: 8px;
      padding-top: 8px;
    }

    .mdj-wp-addons h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: #141210;
      margin: 0 0 14px;
      letter-spacing: 0.03em;
    }

    .mdj-wp-addons ul {
      margin: 0;
      padding: 0 0 0 1.15rem;
      color: rgba(35, 32, 38, 0.88);
      font-size: 0.98rem;
      line-height: 1.75;
    }

    .mdj-wp-addons li {
      margin-bottom: 8px;
    }

    .mdj-wp-cta-wrap {
      margin-top: 32px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    body.page-wedding-planning .mdj-wp-copy .btn.primary {
      background: linear-gradient(135deg, #2a241c, #1a1612);
      color: #faf6ef;
      border: 1px solid rgba(197, 160, 89, 0.55);
      font-weight: 700;
    }

    body.page-wedding-planning .mdj-wp-copy .btn.primary:hover {
      filter: brightness(1.08);
    }

    body.page-wedding-planning .mdj-wp-copy .btn.outline {
      border-color: rgba(44, 40, 51, 0.25);
      color: #2c2833;
      background: rgba(255, 255, 255, 0.55);
    }

    body.page-wedding-planning .mdj-wp-copy .btn.outline:hover {
      border-color: rgba(197, 160, 89, 0.65);
      color: #5c4a32;
    }

    /* Columna derecha: sello + collage escalonado */
    .mdj-wp-mosaicWrap {
      position: relative;
      min-height: 200px;
      padding-top: 8px;
    }

    .mdj-wp-seal {
      position: absolute;
      top: -6px;
      right: 8px;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fffef8, #e8dcc4 55%, #c5a059 120%);
      border: 3px double rgba(90, 72, 48, 0.55);
      box-shadow: 0 12px 28px rgba(40, 32, 20, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      z-index: 6;
      font-family: 'Outfit', sans-serif;
      line-height: 1.15;
    }

    .mdj-wp-seal .mdj-wp-seal-k {
      display: block;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #3d3226;
    }

    .mdj-wp-seal .mdj-wp-seal-m {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      font-weight: 700;
      color: #1a1410;
      margin: 4px 0;
      line-height: 1.1;
    }

    .mdj-wp-mosaic {
      display: flex;
      flex-direction: column;
      gap: 0;
      padding-top: 52px;
      position: relative;
    }

    .mdj-wp-mosaic figure {
      margin: 0;
      border-radius: 14px;
      overflow: hidden;
      border: 4px solid #fff;
      box-shadow: 0 22px 48px rgba(25, 22, 18, 0.18);
      background: #e8e4dc;
      position: relative;
      z-index: 1;
    }

    .mdj-wp-mosaic figure img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      aspect-ratio: 4 / 3;
      vertical-align: middle;
    }

    .mdj-wp-mosaic__piece--1 {
      width: 92%;
      align-self: flex-start;
      transform: rotate(-1.2deg);
      z-index: 1;
    }

    .mdj-wp-mosaic__piece--2 {
      width: 88%;
      align-self: flex-end;
      margin-top: -18px;
      margin-right: 4%;
      transform: translateX(-6%) rotate(1.4deg);
      z-index: 2;
    }

    .mdj-wp-mosaic__piece--3 {
      width: 86%;
      align-self: flex-start;
      margin-top: -14px;
      margin-left: 6%;
      transform: translateX(4%) rotate(-0.8deg);
      z-index: 3;
    }

    .mdj-wp-mosaic__piece--4 {
      width: 90%;
      align-self: center;
      margin-top: -12px;
      transform: rotate(0.6deg);
      z-index: 4;
    }

    @media (max-width: 920px) {
      .mdj-wp-editorial {
        grid-template-columns: 1fr;
        padding: 28px 22px 36px;
      }

      .mdj-wp-mosaicWrap {
        max-width: 420px;
        margin: 0 auto;
      }

      .mdj-wp-seal {
        position: relative;
        top: 0;
        right: auto;
        margin: 0 auto 20px;
      }

      .mdj-wp-mosaic {
        padding-top: 0;
      }

      .mdj-wp-mosaic__piece--2,
      .mdj-wp-mosaic__piece--3 {
        transform: none;
        margin-left: 0;
        margin-right: 0;
      }

      .mdj-wp-mosaic figure {
        width: 100% !important;
        align-self: stretch !important;
        margin-top: 12px !important;
        transform: none !important;
      }

      .mdj-wp-mosaic__piece--1 {
        margin-top: 0;
      }
    }

    body.page-wedding-planning .footer {
      background: rgba(12, 11, 10, 0.55);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    body.page-wedding-planning .footer [data-i18n="footer-rights-llc"] {

    }

    /* Nav overflow fix: rompe la restricción MDN overflow-y:hidden→overflow-x:auto en todos los ancestros */
    body.page-wedding-planning #mainHeader.header.mdj-header-unified,
    body.page-wedding-planning #mainHeader.header.mdj-header-unified .header-nav,

    /* Reducción mínima de font como seguro si el viewport es muy estrecho */

    body.page-wedding-planning #mainHeader #mainNav.mdj-mainnav-flex.nav.top-nav > a.active {
      font-size: 15px !important;
    }
  </style>

  <script>
    /* FIX-LEGACY-SUPABASE-01 (2026-08-19) · el respaldo entra cuando falta la
       LIBRERIA, no cuando falta la sintaxis.
       Antes la puerta era una sonda de `?.` y `??`. Eso solo cubre el motor que no
       sabe parsear: si el bundle del CDN muere por CUALQUIER otra razon —una v2 mas
       nueva con sintaxis que el motor no soporta, red caida, TLS, bloqueo— la sonda
       pasa, el respaldo NO se inyecta y la pagina se queda sin cliente Supabase.
       Sin cliente no hay sesion, y el guard del perfil expulsa al login: ese era el
       rebote en Mac antiguas. Ahora se pregunta lo unico que importa, si la libreria
       esta aqui. En un navegador moderno no hace nada, porque ya esta.
       El CDN ademas se clava a 2.112.3, la misma version que la copia vendorizada:
       `@2` era flotante y podia cambiar bajo nuestros pies sin tocar el repo. */
  (function () {
      var mdjLibAusente = !(window.supabase &&
          typeof window.supabase.createClient === 'function');
      if (mdjLibAusente) {
          document.write('<script src="./vendor/supabase-js-2.112.3.legacy.js?v=20260818-safari-legacy"><\/script>');
      }
  })();
  </script>
