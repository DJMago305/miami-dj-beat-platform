<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDJPRO — Party Planner</title>
    <link rel="stylesheet" href="./styles.css?v=20260415-CORE-CONNECTIONS">
    <style>
        .planner-container {
            max-width: 800px;
            margin: 60px auto;
            padding: 40px;
        }

        .step-container {
            display: none;
        }

        .step-container.active {
            display: block;
            animation: fadeIn 0.5s ease-out;
        }

        .progress-bar {
            height: 4px;
            background: var(--line);
            margin-bottom: 40px;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--gold);
            width: 0%;
            transition: width 0.3s ease;
        }

        .recommendation-box {
            background: rgba(183, 148, 62, 0.1);
            border-left: 4px solid var(--gold);
            padding: 15px;
            margin: 20px 0;
            font-size: 14px;
        }
    </style>
    <link rel="stylesheet" href="./mdj-assistant.css?v=20260306-1" />
</head>

<body class="notranslate">
    <!-- MDJ canonical site header — keep in sync with index #mainHeader; use ./index.html# anchors for subpages -->
<header class="header" id="mainHeader">
  <div class="header-top">
    <div class="container">
      <div class="brand">
        <img src="./assets/branding/logo-transparent.png" alt="Miami DJ Beat Logo" class="logo-img-eagle">
        <div class="brand-letters-wrapper">
          <img src="./assets/branding/logo-transparent Letras.png" alt="Miami DJ Beat Letters" class="brand-letters-img">
        </div>
      </div>

      <div class="header-actions">
        <a href="./login.html?plan=pro" class="btn-pill gold" id="header-get-pro-btn" data-i18n="btn-get-pro">Get PRO</a>
        <a href="./login.html?signup=free" class="btn-pill" id="header-subscribe-free-btn" data-i18n="btn-subscribe-free">Suscripción gratis</a>
        <span id="header-djpro-badge" class="header-djpro-badge" style="display: none;" aria-label="DJPRO">DJPRO</span>
        <div class="lang-switcher">
          <span class="lang-btn" data-lang="es">ES</span>
          <span class="lang-pipe">|</span>
          <span class="lang-btn active" data-lang="en">EN</span>
        </div>
        <a href="./login.html" id="header-login-btn" class="btn-pill gold" data-i18n="btn-login">Log in</a>

        <div class="header-avatar-cart-row" aria-label="Account and cart">
          <div class="account session-pending" id="header-auth-zone" style="display: none;">
            <a class="account-btn" id="accountBtn" href="./dj-profile.html" title="Mi perfil" aria-label="Mi perfil">
              <img class="avatar" src="./assets/dj-avatar-placeholder.png" alt="" />
            </a>
</div>

          <a href="./shop.html" id="header-cart-link" class="header-cart-btn" title="Cart" aria-label="Shopping cart">
            <span aria-hidden="true">🛒</span>
            <span id="header-cart-count" class="header-cart-count" hidden></span>
          </a>
        </div>
        <div class="header-search-wrap">
          <input type="search" id="header-smart-search" class="header-smart-search"
            placeholder="Search DJs, gear, services…" autocomplete="off" enterkeyhint="search" />
        </div>
      </div>

      <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="mobile-overlay" id="mobileMenu">
        <nav class="mobile-nav">
          <a href="./index.html" data-i18n="nav-home" data-mdj-nav="home">Home</a>
          <a href="./index.html#services" data-i18n="nav-services" data-mdj-nav="services">Services</a>
          <a href="./rentals.html" data-i18n="nav-rentals" data-mdj-nav="rentals">Event Services</a>
          <a href="./shop.html" style="color:#c5a059;font-weight:800;" data-mdj-nav="shop">Shop</a>
          <a href="./dj-tools.html" data-i18n="nav-tools" data-mdj-nav="tools">DJ Tools</a>
          <a href="./jobs.html" data-i18n="nav-jobs" data-mdj-nav="jobs">Jobs</a>
          <a href="./index.html#contact" data-i18n="nav-contact" data-mdj-nav="contact">Contacto</a>
          <a href="./login.html?signup=free" id="header-subscribe-free-mobile" data-i18n="btn-subscribe-free"
            style="color:rgba(255,255,255,0.88); font-weight:800;">Suscripción gratis</a>
          <a href="./login.html" id="header-login-btn-mobile" data-i18n="btn-login"
            style="color:var(--gold); font-weight:800;">Entrar</a>
          <a href="./dj-profile.html" id="nav-my-profile-mobile"
            style="display:none; color:var(--gold); font-weight:900;" data-i18n="menu-account">MY PROFILE</a>
        </nav>
      </div>
    </div>
  </div>
  <div class="header-bottom">
    <div class="container">
      <nav class="nav top-nav" id="mainNav">
        <a href="./index.html" data-i18n="nav-home" data-mdj-nav="home">Home</a>
        <a href="./index.html#services" data-i18n="nav-services" data-mdj-nav="services">Services</a>
        <a href="./rentals.html" data-i18n="nav-rentals" data-mdj-nav="rentals">Event Services</a>
        <a href="./shop.html" style="color:var(--gold);font-weight:800;" data-mdj-nav="shop">Shop</a>
        <a href="./dj-tools.html" data-i18n="nav-tools" data-mdj-nav="tools">DJ Tools</a>
        <a href="./jobs.html" data-i18n="nav-jobs" data-mdj-nav="jobs">Jobs</a>
        <a href="./index.html#contact" data-i18n="nav-contact" data-mdj-nav="contact">Contact</a>
      </nav>
    </div>
  </div>
</header>

    <main class="planner-container">
        <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
        </div>

        <div id="planner-form-content">
            <div class="loading-spinner">Cargando tu planera...</div>
        </div>

        <div class="flex" style="margin-top: 40px; justify-content: space-between;">
            <button id="prev-btn" class="btn secondary" style="display: none;">Anterior</button>
            <button id="next-btn" class="btn primary">Continuar</button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="./supabase-config.js?v=20260226-1"></script>
    <script src="./party-planner.js"></script>
    <!-- MDJ Assistant Booth (AI Sales Agent) -->
    <div id="mdj-assistant-booth">
        <!-- Chat Window & Trigger defined in mdj-assistant.css/js -->
        <div class="booth-window">
            <div class="booth-header">
                <div class="status-dot"></div>
                <div style="flex: 1;">
                    <h3>Booth Assistant</h3>
                    <div style="font-size: 10px; color: rgba(255,255,255,0.4); font-weight: 700;">Sales & Negotiation
                        Expert</div>
                </div>
            </div>
            <div class="booth-messages"></div>
            <div class="booth-input-area">
                <input type="text" placeholder="Type your message here..." />
                <button class="booth-send-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
        <div class="booth-trigger" title="Talk to Booth Assistant">
            <div class="avatar-glow"></div>
            <div style="font-size: 30px; z-index: 10;">🤖</div>
        </div>
    </div>
    <script src="./mdj-assistant.js?v=20260411-booth-policy"></script>

    <script src="./header-smart-search.js?v=20260415-CORE-CONNECTIONS"></script>
    <script src="./mdj-shared-header.js?v=20260414-MAC-DESKTOP-SYNC"></script>
  <script src="./mdj-social-bar.js?v=20260414-MAC-DESKTOP-SYNC"></script>
</body>

</html>
