<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MDJPRO — Nueva Contraseña</title>
    <link rel="stylesheet" href="./styles.css?v=20260226-1" />
    <style>
        .login-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 40px;
            background: var(--panel);
            border-radius: 24px;
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
        }
        .header { min-height: 90px; }
        .header-top .container { padding-bottom: 12px; }
        
        .pwd-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .pwd-wrapper input {
            width: 100%;
            padding-right: 40px;
        }
        .pwd-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 18px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pwd-toggle:hover {
            color: var(--gold);
        }
    </style>
</head>
<body class="notranslate">
    <header class="header" id="mainHeader">
        <div class="header-top">
            <div class="container">
                <div class="brand">
                    <img src="./assets/branding/logo-transparent.png" alt="Miami DJ Beat Logo" class="logo-img-eagle">
                    <div class="brand-letters-wrapper">
                        <img src="./assets/branding/logo-transparent Letras.png" alt="Miami DJ Beat Letters" class="brand-letters-img">
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="login-container">
            <h2 id="reset-title" style="margin-bottom: 20px; text-align: center; color: #fff;">Nueva Contraseña</h2>
            <p style="text-align: center; color: var(--muted); margin-bottom: 30px; font-size: 14px;" id="reset-subtitle">Estás a un solo paso de recuperar tu cuenta de forma segura.</p>
            
            <form id="reset-form" class="form">
                <label><span>Nueva Contraseña *</span>
                    <div class="pwd-wrapper">
                        <input type="password" id="reset-password" required placeholder="Mínimo 6 caracteres">
                        <button type="button" class="pwd-toggle" tabindex="-1" aria-label="Mostrar contraseña">👁️</button>
                    </div>
                </label>
                <label><span>Confirmar Contraseña *</span>
                    <div class="pwd-wrapper">
                        <input type="password" id="reset-password-confirm" required placeholder="Repite tu contraseña">
                        <button type="button" class="pwd-toggle" tabindex="-1" aria-label="Mostrar contraseña">👁️</button>
                    </div>
                </label>
                <button class="btn primary full" type="submit" id="reset-submit-btn">Guardar Contraseña</button>
            </form>

            <div id="success-panel" style="display: none; text-align: center;">
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#4CAF50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto 20px auto;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                <p style="color: #fff; margin-bottom: 25px; font-size: 16px;">¡Tu contraseña ha sido actualizada correctamente en nuestra red!</p>
                <a href="./login.html" class="btn primary full">Ir al Login para Entrar</a>
            </div>

            <p id="reset-error" style="color: #ff4d4d; margin-top: 15px; text-align: center; display: none; font-size: 13px;"></p>
        </div>
    </main>

    <footer class="footer">
        <div class="container" style="text-align: center;">
            <div style="color: rgba(255,255,255,0.4); font-size: 13px;">© 2026 Miami DJ Beat LLC. Pro Division Access.</div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js?v=20260226-1"></script>
    <script>
        // UX: Eye toggles logic
        document.querySelectorAll('.pwd-toggle').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const input = this.previousElementSibling;
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                this.style.opacity = type === 'text' ? '1' : '0.5';
            });
        });

        document.addEventListener('DOMContentLoaded', async () => {
            const db = window.getSupabaseClient();
            
            // Protección: Validar que el usuario vino de un enlace de recuperación.
            // Supabase extrae el token del hash y loguea temporalmente al usuario bajo el capó.
            const urlHash = window.location.hash.substring(1);
            const params = new URLSearchParams(urlHash);
            const isRecoveryFlow = params.get('type') === 'recovery' || urlHash.includes('access_token');
            
            const { data: { session } } = await db.auth.getSession();
            
            if (!session && !isRecoveryFlow) {
                // Si alguien entra tipeando /reset-password.html sin token, lo botamos
                window.location.href = './login.html';
                return;
            }
            
            document.getElementById('reset-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('reset-submit-btn');
                const errEl = document.getElementById('reset-error');
                
                const pwd = document.getElementById('reset-password').value;
                const pwdConfirm = document.getElementById('reset-password-confirm').value;
                
                errEl.style.display = 'none';
                
                if (pwd.length < 6) {
                    errEl.textContent = 'La contraseña debe tener al menos 6 caracteres.';
                    errEl.style.display = 'block';
                    return;
                }
                
                if (pwd !== pwdConfirm) {
                    errEl.textContent = 'Las contraseñas no coinciden.';
                    errEl.style.display = 'block';
                    return;
                }

                btn.disabled = true;
                btn.textContent = 'Guardando...';

                try {
                    // Update user password in Supabase directly
                    const { data, error } = await db.auth.updateUser({ password: pwd });

                    if (error) throw error;

                    // Cerrar sesión recuperada internamente para obligarlo a loguearse 
                    // de forma manual con su nueva contraseña.
                    await db.auth.signOut();

                    // UX de Éxito
                    document.getElementById('reset-form').style.display = 'none';
                    document.getElementById('reset-subtitle').style.display = 'none';
                    document.getElementById('reset-title').style.display = 'none';
                    document.getElementById('success-panel').style.display = 'block';
                    
                } catch (err) {
                    console.error(err);
                    errEl.textContent = err.message || 'Error al actualizar la contraseña.';
                    errEl.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Guardar Contraseña';
                }
            });
        });
    </script>
</body>
</html>
