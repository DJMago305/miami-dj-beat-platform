<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <!-- Se sirve en /t/<uuid> (rewrite de vercel.json → /t.html?id=<uuid>): sin <base>, ./supabase-config.js se pediría a /t/supabase-config.js. -->
    <base href="/" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ticket — Miami DJ Beat</title>
    <meta name="description" content="Ficha de un ticket o mesa de Miami DJ Beat." />
    <meta name="robots" content="noindex" />
    <style>
        :root { --bg: #0b0d14; --card: #12151f; --line: rgba(255, 255, 255, .14); --ink: #f3f5ff; --dim: rgba(243, 245, 255, .62); --gold: #d4af37; --ok: #14803c; --bad: #b3261e; }
        @media (prefers-color-scheme: light) {
            :root { --bg: #eef1f5; --card: #ffffff; --line: rgba(0, 0, 0, .14); --ink: #161a22; --dim: rgba(0, 0, 0, .6); --gold: #8a6d2e; }
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 16px; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .card { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--gold); border-radius: 20px; padding: 24px 22px; }
        .brand { font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin: 0 0 14px; }
        h1 { margin: 0 0 4px; font-size: 22px; line-height: 1.25; }
        .kind { font-size: 12px; color: var(--dim); margin: 0 0 16px; }
        dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 14px; }
        dt { color: var(--dim); } dd { margin: 0; font-weight: 600; word-break: break-word; }
        .ref { margin-top: 16px; font-size: 12px; letter-spacing: .14em; color: var(--dim); }
        .tag { display: inline-block; margin: 0 0 14px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; border: 1px solid currentColor; border-radius: 999px; padding: 4px 12px; }
        .tag--bad { color: var(--bad); }
        .staff { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
        .staff h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
        button, .link { cursor: pointer; font: inherit; font-size: 14px; font-weight: 800; border-radius: 12px; padding: 13px 18px; border: 0; width: 100%; background: var(--gold); color: #fff; text-align: center; text-decoration: none; display: block; }
        button[disabled] { opacity: .55; cursor: default; }
        .link--soft { background: transparent; color: var(--gold); border: 1px solid var(--gold); margin-top: 10px; font-weight: 700; }
        .res { margin-top: 14px; border-radius: 14px; padding: 16px 16px; color: #fff; }
        .res--ok { background: var(--ok); } .res--bad { background: var(--bad); }
        .res b { display: block; font-size: 18px; margin-bottom: 4px; }
        .res small { display: block; opacity: .92; font-size: 13px; line-height: 1.5; }
        .note { margin: 14px 0 0; font-size: 12px; color: var(--dim); line-height: 1.5; }
        .qr { margin: 18px 0 4px; text-align: center; }
        .qr-box { display: inline-block; background: #fff; padding: 12px; border-radius: 14px; line-height: 0; min-width: 120px; min-height: 120px; border: 1px solid var(--line); }
        .qr-actions { margin-top: 12px; }
        .qr-actions button { margin-top: 10px; }
        .qr-actions .btn--soft { background: transparent; color: var(--gold); border: 1px solid var(--gold); }
        /* ── Boleto: cuerpo + perforación con muescas + talón con el QR ── */
        #card.plain { background: transparent; border: 0; padding: 0; max-width: 460px; }
        .wal-head { text-align: center; margin: 4px 0 6px; }
        .wal-head h1 { font-size: 20px; text-transform: uppercase; letter-spacing: .03em; }
        .passes-h { margin: 18px 0 2px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); text-align: center; }
        .tk { position: relative; margin-top: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, .28); }
        .tk-main { padding: 20px 22px 18px; border-top: 3px solid var(--gold); border-radius: 20px 20px 0 0; }
        .tk-brand { font-size: 10.5px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); margin: 0 0 10px; }
        .tk-title { margin: 0; font-size: 22px; font-weight: 800; line-height: 1.15; letter-spacing: .02em; text-transform: uppercase; word-break: break-word; }
        .tk-meta { margin: 6px 0 0; font-size: 13px; color: var(--dim); line-height: 1.45; }
        .tk-slot { display: flex; flex-wrap: wrap; gap: 8px 26px; margin-top: 16px; }
        .tk-k { display: block; font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
        .tk-v { display: block; margin-top: 2px; font-size: 24px; font-weight: 800; color: var(--gold); line-height: 1.1; }
        .tk-holder { margin-top: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--dim); }
        .tk-holder b { color: var(--ink); font-weight: 700; }
        .tk-perf { position: relative; height: 0; border-top: 2px dashed var(--line); margin: 0 16px; }
        .tk-perf::before, .tk-perf::after { content: ''; position: absolute; top: -14px; width: 26px; height: 26px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
        .tk-perf::before { left: -29px; } .tk-perf::after { right: -29px; }
        .tk-stub { padding: 20px 22px 22px; text-align: center; border-radius: 0 0 20px 20px; }
        .tk-stub .qr { margin: 0; } .tk-stub .qr-box { min-width: 0; min-height: 0; padding: 10px; }
        .tk-ref { margin-top: 10px; font-size: 12px; letter-spacing: .18em; color: var(--dim); }
        .tk.is-used .tk-main, .tk.is-void .tk-main { opacity: .55; }
        .tk-stamp { display: inline-block; margin: 6px 0 2px; padding: 8px 18px; border: 3px solid currentColor; border-radius: 10px; font-size: 18px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; transform: rotate(-6deg); }
        .tk-stamp--used { color: var(--dim); } .tk-stamp--void { color: var(--bad); }
        .tk-time { margin-top: 8px; font-size: 12px; color: var(--dim); }
        .badge { flex: none; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; border-radius: 999px; padding: 3px 10px; border: 1px solid currentColor; }
        .badge--ok { color: var(--ok); } .badge--used { color: var(--dim); } .badge--void { color: var(--bad); }
        .tk input { width: 100%; font: inherit; font-size: 14px; padding: 11px 12px; margin-top: 12px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--ink); text-align: left; }
        .tk details { margin-top: 6px; font-size: 12px; color: var(--dim); text-align: left; } .tk summary { cursor: pointer; padding: 4px 0; }
        .tk .msg { margin-top: 6px; font-size: 12px; min-height: 16px; color: var(--dim); text-align: left; } .tk .msg--bad { color: var(--bad); } .tk .msg--ok { color: var(--ok); }
        .tk .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .tk .row2 button { margin-top: 8px; padding: 11px 8px; font-size: 13px; }
        .tk .btn--soft { background: transparent; color: var(--gold); border: 1px solid var(--gold); }
        [hidden] { display: none !important; }
    </style>
</head>

                sh.addEventListener('click', function () { window.mdjTicketQr.share(id, 'Miami DJ Beat', '').then(function (r) { if (r === 'shared' || r === 'copied') { sh.textContent = r === 'shared' ? T.sharedOk : T.copiedOk; setTimeout(function () { sh.textContent = T.shareP; }, 2200); } else if (r === 'fail') { sh.textContent = window.mdjTicketQr.url(id); setTimeout(function () { sh.textContent = T.shareP; }, 9000); } }); });
                row.appendChild(dl); row.appendChild(sh);
                wrap.appendChild(nm); wrap.appendChild(det); wrap.appendChild(sv); wrap.appendChild(msg); wrap.appendChild(row);
                return wrap;
            }

            function renderWallet(sb, id, w) {
                clear(); card.classList.add('plain'); card.removeChild(card.firstChild);
                if (w.void) { var head = el('div', 'wal-head'); head.appendChild(el('span', 'tag tag--bad', T.void)); card.appendChild(head); }
                if (w.void || !w.passes || !w.passes.length) {
                    card.appendChild(ticketEl({ title: w.event_title, date: w.event_date, room: w.room_name, kind: w.kind }, { label: '', status: 'void' }, stubFor(sb, id, { status: 'void' }, 'wallet')));
                    return;
                }
                card.appendChild(el('h2', 'passes-h', T.passes + ' (' + w.passes.length + ')'));
                card.appendChild(el('p', 'note', T.passesHint));
                var ctx = { title: w.event_title, date: w.event_date, room: w.room_name, kind: w.kind };
                w.passes.forEach(function (p) { card.appendChild(ticketEl(ctx, { id: p.id, label: p.label, status: p.status, name: p.name, checked_in_at: p.checked_in_at }, stubFor(sb, id, p, 'wallet'))); });
            }

            function renderPassView(sb, id, p) {
                clear(); card.classList.add('plain'); card.removeChild(card.firstChild);
                if (p.void) { var head = el('div', 'wal-head'); head.appendChild(el('span', 'tag tag--bad', T.void)); card.appendChild(head); }
                var ctx = { title: p.event_title, date: p.event_date, room: p.room_name, kind: p.kind };
                var pass = { id: id, label: p.label, status: p.status, name: null, holder: p.holder === 'Invitado' ? T.guest : p.holder, checked_in_at: p.checked_in_at };
                card.appendChild(ticketEl(ctx, pass, stubFor(sb, id, pass, 'pass')));
            }

            function renderStaff(sb, id, info) {
                var box = el('section', 'staff'); box.appendChild(el('h2', null, T.staff));
                var btn = el('button', null, T.validate); btn.type = 'button';
                var out = el('div');
                btn.addEventListener('click', async function () {
                    btn.disabled = true; btn.textContent = T.validating; out.textContent = '';
                    var res = null, err = null;
                    try { var r = await sb.rpc('venue_ticket_scan', { p_order_id: id, p_event_id: info.event_id, p_qty: 1 }); res = r.data; err = r.error; } catch (e) { err = e; }
                    btn.disabled = false; btn.textContent = T.validate;
                    var d = el('div', 'res');
                    if (err || !res) {
                        var msg = String((err && err.message) || '');
                        d.className = 'res res--bad';
                        d.appendChild(el('b', null, msg.indexOf('not_allowed') >= 0 ? T.denied : (/venue_ticket_scan/.test(msg) && /exist|find/i.test(msg) ? T.noSql : T.fail)));
                    } else if (res.ok) {
                        d.className = 'res res--ok';
                        d.appendChild(el('b', null, '✔ ' + T.ok));
                        if (res.reservation_name) d.appendChild(el('small', null, T.who + ': ' + res.reservation_name));
                        d.appendChild(el('small', null, T.in + ': ' + res.checked_in_qty + ' ' + T.of + ' ' + res.total_qty));
                        var its = Array.isArray(res.items) ? res.items.map(function (it) { return (Number(it.qty) > 1 ? it.qty + ' × ' : '') + String(it.label || ''); }).join(' · ') : '';
                        if (its) d.appendChild(el('small', null, its));
                    } else {
                        d.className = 'res res--bad';
                        d.appendChild(el('b', null, '✖ ' + (T['c_' + res.code] || T.fail)));
                        if (res.total_qty != null) d.appendChild(el('small', null, T.in + ': ' + res.checked_in_qty + ' ' + T.of + ' ' + res.total_qty));
                    }
                    out.appendChild(d);
                });
                box.appendChild(btn); box.appendChild(out); card.appendChild(box);
            }

            async function isTeam(sb, uid) {
                try {
                    var p = await sb.from('dj_profiles').select('role').eq('user_id', uid).maybeSingle();
                    var role = String((p && p.data && p.data.role) || '').toLowerCase().trim();
                    if (['admin', 'owner', 'manager', 'seller'].indexOf(role) !== -1) return true;
                } catch (e) { /* sin perfil: se revisa el local */ }
                try {
                    var v = await sb.from('venue_staff').select('venue_id').eq('user_id', uid).limit(1);
                    return !!(v && v.data && v.data.length);
                } catch (e2) { return false; }
            }

            async function init() {
                var id = idFromUrl();
                if (!id) { clear(); card.appendChild(el('h1', null, T.bad)); return; }
                var sb = typeof window.getSupabaseClient === 'function' ? window.getSupabaseClient() : null;
                if (!sb) { renderInfo(id, null); return; }
                var res = await window.mdjTicketQr.resolve(sb, id), info = res.data;       // pase individual → cartera de la compra → ficha antigua
                if (res.type === 'wallet') renderWallet(sb, id, info);
                else if (res.type === 'pass') renderPassView(sb, id, info);
                else renderInfo(id, info);
                if (!info || info.found === false) return;
                var uid = null;
                try { var s = await sb.auth.getSession(); uid = s && s.data && s.data.session && s.data.session.user && s.data.session.user.id; } catch (e3) { uid = null; }
                if (!uid) {
                    var a = el('a', 'link link--soft', T.login); a.href = './login.html?next=' + encodeURIComponent('/t/' + id);
                    card.appendChild(a);
                    return;
                }
                if (info.event_id && !info.void && await isTeam(sb, uid)) renderStaff(sb, id, info);   // una orden anulada o reembolsada NO ofrece validar ingreso
            }
            init();
        })();
    </script>
</body>

</html>
