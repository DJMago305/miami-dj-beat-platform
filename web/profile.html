<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perfil — Miami DJ Beat</title>
  <meta name="description" content="Perfil público · Miami DJ Beat LLC" />
  <!-- 2026-09-04: esta página dejó de tener su propia plantilla. Existían DOS
       implementaciones separadas de "el perfil público" (esta, y la vista
       ?view=public embebida en dj-profile.html) que divergieron con el
       tiempo — nombre mal priorizado aquí, diseño más pobre, sin reseñas ni
       disponibilidad. Por pedido explícito del PO ("una sola verdad
       visual"), esta ya no renderiza nada propio: solo reenvía a la versión
       real y completa. No se elimina el archivo porque enlaces/QR ya
       impresos o compartidos apuntan a esta URL — deben seguir funcionando. -->
  <script id="pf-redirect">
    (function () {
      var params = new URLSearchParams(window.location.search || '');
      var id = params.get('id') || '';
      var ref = params.get('ref') || '';
      var target = './dj-profile.html?id=' + encodeURIComponent(id) + '&view=public';
      if (ref) target += '&ref=' + encodeURIComponent(ref);
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <!-- Solo se ve si el visitante tiene JavaScript desactivado (caso raro) — el script de arriba ya redirigió. -->
  <p>Ver <a id="pf-fallback-link" href="./dj-profile.html">el perfil</a>…</p>
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search || '');
        var id = params.get('id') || '';
        var ref = params.get('ref') || '';
        var target = './dj-profile.html?id=' + encodeURIComponent(id) + '&view=public';
        if (ref) target += '&ref=' + encodeURIComponent(ref);
        document.getElementById('pf-fallback-link').href = target;
      } catch (e) {}
    })();
  </script>
</body>
</html>
