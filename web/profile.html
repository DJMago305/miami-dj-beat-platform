<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perfil — Miami DJ Beat</title>
  <meta name="description" content="Perfil público · Miami DJ Beat LLC" />
  <!-- 2026-09-04: esta página dejó de tener su propia plantilla. Existían DOS
       implementaciones separadas de "el perfil público" (esta, y la vista
       ?view=public embebida en dj-profile.html) que divergieron con el
       tiempo — nombre mal priorizado aquí, diseño más pobre, sin reseñas ni
       disponibilidad. Por pedido explícito del PO ("una sola verdad
       visual"), esta ya no renderiza nada propio: solo reenvía a la versión
       real y completa. No se elimina el archivo porque enlaces/QR ya
       impresos o compartidos apuntan a esta URL — deben seguir funcionando. -->
  <script id="pf-redirect">
    (function () {
      /* 2026-10-09 (QR de cabina de SoundForTips): esta página reenviaba SIEMPRE a ?view=public y descartaba el resto, así que el QR de la consola
         (…/profile.html?id=…&mode=live) caía en el perfil comercial y no en el modo kiosco donde el fan pide canciones. Ahora ?mode=live se conserva
         (y entonces NO se manda view=public) y también se reenvían los demás parámetros (ref, rcode…). */
      var params = new URLSearchParams(window.location.search || '');
      var out = new URLSearchParams();
      out.set('id', params.get('id') || '');
      if (params.get('mode') === 'live') out.set('mode', 'live'); else out.set('view', 'public');
      params.forEach(function (v, k) { if (k !== 'id' && k !== 'mode' && k !== 'view' && v !== '') out.set(k, v); });
      window.location.replace('./dj-profile.html?' + out.toString());
    })();
  </script>
</head>
<body>
  <!-- Solo se ve si el visitante tiene JavaScript desactivado (caso raro) — el script de arriba ya redirigió. -->
  <p>Ver <a id="pf-fallback-link" href="./dj-profile.html">el perfil</a>…</p>
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search || '');
        var out = new URLSearchParams();
        out.set('id', params.get('id') || '');
        if (params.get('mode') === 'live') out.set('mode', 'live'); else out.set('view', 'public');
        params.forEach(function (v, k) { if (k !== 'id' && k !== 'mode' && k !== 'view' && v !== '') out.set(k, v); });
        document.getElementById('pf-fallback-link').href = './dj-profile.html?' + out.toString();
      } catch (e) {}
    })();
  </script>
</body>
</html>
