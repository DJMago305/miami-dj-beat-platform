<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perfil — Miami DJ Beat</title>
  <meta name="description" content="Perfil público · Miami DJ Beat LLC" />
  <!-- Vista PÚBLICA de visitante (plantilla nueva, modular: staff + artistas). NO es el portal: cero pestañas internas.
       No toca dj-profile.html (evita regresiones/forense). El QR/compartir/búsqueda abren esta página. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  /* P2.3 · rollout global del fallback verificado en login.html (Ticket P2.2 / PR #173).
     El CDN de arriba queda intacto para navegadores modernos; si el motor no soporta
     ?./?? (WebKit legacy), se inyecta -- mismo origen, sin el aviso de document.write
     cross-site de Chrome -- la copia local transpilada ya vendorizada y verificada. */
  (function () {
      var mdjModernSyntaxOk = true;
      try { new Function('return (null)?.x ?? 1;'); } catch (eDetect) { mdjModernSyntaxOk = false; }
      if (!mdjModernSyntaxOk) {
          document.write('<script src="./vendor/supabase-js-2.112.3.legacy.js?v=20260818-safari-legacy"><\/script>');
      }
  })();
  </script>
  <script src="./supabase-config.js?v=20260814-bfi"></script>
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
  <script src="./mdj-referral.js?v=1"></script>
  <style>
    :root{ --gold:#c5a059; --gold-lt:#e8c987; --bg:#050810; --panel:#0b0f18; --line:rgba(255,255,255,.10); }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:#e8eaed;min-height:100vh;overflow-x:hidden;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
    img,svg{max-width:100%;}
    a{color:inherit;}

    /* ── Chrome de VISITANTE: logo oficial + Entrar / Crear Cuenta. Cero pestañas de portal. ── */
    .visitor-header{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:16px;
      padding:12px 20px;background:linear-gradient(180deg,#0a0e16,#070a11);border-bottom:1px solid var(--line);flex-wrap:wrap;}
    .vh-brand{display:flex;align-items:center;gap:11px;min-width:0;}
    .vh-brand img{width:34px;height:34px;aspect-ratio:1/1;object-fit:contain;flex:none;}
    .vh-brand .tx{font-size:15px;font-weight:900;letter-spacing:.02em;color:#fff;white-space:nowrap;line-height:1.1;}
    .vh-brand .tx small{display:block;font-size:8.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(232,201,135,.72);}
    .vh-actions{display:flex;align-items:center;gap:10px;}
    .vh-btn{font-size:12.5px;font-weight:800;letter-spacing:.04em;border-radius:10px;padding:9px 16px;text-decoration:none;cursor:pointer;white-space:nowrap;font-family:inherit;}
    .vh-login{color:var(--gold-lt);border:1px solid rgba(197,160,89,.5);background:transparent;}
    .vh-login:hover{background:rgba(197,160,89,.12);}
    .vh-signup{color:#0a0e16;background:linear-gradient(135deg,var(--gold-lt),var(--gold));border:none;}
    .vh-signup:hover{filter:brightness(1.08);}

    main{max-width:900px;margin:0 auto;padding:26px 20px 64px;}

    /* ── HERO = toda la etiqueta: banner de fondo + perfil CENTRADO flotando encima ── */
    .pf-hero{position:relative;background:linear-gradient(135deg,rgba(197,160,89,.10),rgba(11,15,24,.35));
      border:1px solid var(--line);border-radius:20px;overflow:hidden;}
    .pf-banner{display:none;position:absolute;inset:0;z-index:0;}
    .pf-hero.has-banner .pf-banner{display:block;}
    .pf-banner img{width:100%;height:100%;object-fit:cover;display:block;}
    .pf-scrim{display:none;}
    .pf-hero.has-banner .pf-scrim{display:block;position:absolute;inset:0;z-index:0;
      background:linear-gradient(180deg,rgba(8,11,18,.05) 24%,rgba(8,11,18,.72) 56%,rgba(8,11,18,.97));}
    .pf-hero-body{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;flex-wrap:wrap;padding:38px 28px;}
    .pf-hero.has-banner .pf-hero-body{min-height:380px;}
    .pf-hero.has-banner .pf-name,.pf-hero.has-banner .pf-role,.pf-hero.has-banner .pf-badge{text-shadow:0 2px 10px rgba(0,0,0,.7);}
    .pf-photo{width:clamp(96px,26vw,132px);height:clamp(96px,26vw,132px);aspect-ratio:1/1;border-radius:50%;object-fit:cover;flex:none;border:2px solid rgba(197,160,89,.55);background:#0b0f18;}
    .pf-id{display:flex;flex-direction:column;align-items:center;}
    .pf-badge{display:inline-block;font-size:10px;font-weight:900;letter-spacing:.14em;color:var(--gold);border:1px solid rgba(197,160,89,.5);border-radius:999px;padding:5px 12px;text-transform:uppercase;}
    .pf-role{margin-top:13px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);}
    .pf-name{margin:4px 0 0;font-size:clamp(22px,5.5vw,34px);font-weight:900;color:#fff;letter-spacing:-.5px;line-height:1.05;overflow-wrap:anywhere;}
    .pf-stars{margin-top:7px;color:var(--gold);letter-spacing:3px;font-size:15px;}
    .pf-stars .on{color:var(--gold);} .pf-stars .off{color:rgba(255,255,255,.2);}
    .pf-socials{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap;justify-content:center;}
    .pf-socials a{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;transition:background .15s,color .15s;}
    .pf-socials a:hover{background:rgba(197,160,89,.16);color:var(--gold-lt);}
    .pf-socials svg{width:18px;height:18px;display:block;}

    .pf-section{margin:16px 0 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px;}
    .pf-section-head{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;}
    .pf-bio{margin:0;font-size:14px;line-height:1.7;color:rgba(255,255,255,.82);white-space:pre-line;}
    .pf-grid{margin:16px 0 0;display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start;}
    .pf-grid .pf-section{margin:0;}
    @media(max-width:640px){.pf-grid{grid-template-columns:1fr;}}

    /* ── OPINIONES (debajo del hero). Carrusel de MEDIDA ESTÁNDAR: NO cambia de tamaño por mensaje ── */
    .pf-rev-avg{font-size:12px;font-weight:800;color:var(--gold);margin:-2px 0 12px;}
    .pf-reviews{display:flex;flex-direction:column;gap:11px;}
    .pf-rev-vp{position:relative;overflow:hidden;height:132px;}          /* ← MEDIDA FIJA del carrusel */
    .pf-rev-slide{transition:transform .42s ease, opacity .42s ease;}
    .pf-rev-slide.exit{transform:translateX(-22px);opacity:0;}
    .pf-rev-slide.enter{transform:translateX(22px);opacity:0;transition:none;}
    .pf-rev-slide .stars{color:var(--gold);font-size:12px;letter-spacing:2px;}
    .pf-rev-slide .txt{margin:8px 0 0;font-size:14px;color:rgba(255,255,255,.85);line-height:1.5;
      display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}  /* recorta a 3 líneas → altura constante */
    .pf-rev-slide .who{margin-top:8px;font-size:11px;color:rgba(255,255,255,.45);}
    .pf-rev-count{margin-top:12px;font-size:10px;font-weight:800;letter-spacing:.1em;color:rgba(255,255,255,.35);text-align:right;}
    .pf-empty-rev{height:132px;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:rgba(255,255,255,.45);border:1px dashed var(--line);border-radius:12px;text-align:center;}

    /* input de opinión */
    .pf-rate{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line);}
    .pf-rate-lead{font-size:12px;font-weight:800;color:rgba(255,255,255,.72);margin-bottom:8px;}
    .pf-stars-input{display:flex;gap:4px;}
    .pf-star{background:none;border:none;cursor:pointer;font-size:26px;line-height:1;padding:2px 3px;color:rgba(255,255,255,.85);transition:color .12s,transform .1s;}
    .pf-star:hover{transform:scale(1.12);} .pf-star.on{color:var(--gold);}
    .pf-rate-dialog{display:none;margin-top:12px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:14px;}
    .pf-rate-dialog.open{display:block;}
    .pf-rate-dialog textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:9px;color:#fff;font-size:13px;padding:9px 11px;box-sizing:border-box;resize:vertical;font-family:inherit;min-height:64px;}
    .pf-rate-lowhint{display:none;margin-top:8px;font-size:11.5px;color:#e0b64d;} .pf-rate-lowhint.show{display:block;}
    .pf-rate-actions{display:flex;gap:9px;align-items:center;margin-top:10px;}
    .pf-rate-btn{border:none;border-radius:9px;padding:9px 16px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;}
    .pf-rate-btn.ok{background:#1f7a4d;color:#fff;} .pf-rate-btn.no{background:transparent;border:1px solid var(--line);color:rgba(255,255,255,.6);}
    .pf-rate-msg{font-size:12px;font-weight:700;}

    /* Interactuar / QR */
    .pf-qr-card{text-align:center;}
    .pf-qr-paper{background:#fff;border-radius:14px;padding:12px;display:inline-block;margin-top:4px;}
    .pf-qr-paper #pf-qrcode img,.pf-qr-paper #pf-qrcode canvas{display:block;}
    .pf-qr-cap{margin-top:12px;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);}
    .pf-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;justify-content:center;}
    .pf-cta a{font-size:12.5px;font-weight:800;border-radius:10px;padding:10px 16px;text-decoration:none;cursor:pointer;}

    .pf-loading{max-width:900px;margin:60px auto;text-align:center;color:rgba(255,255,255,.5);font-size:14px;}
    .pf-badge{font-size:clamp(9px,2.4vw,10px);}
    .pf-role{font-size:clamp(10px,2.6vw,12px);}
    /* ══ RESPONSIVE: 320px legacy → 1440px+ estudio (fluido, sin distorsión ni overflow) ══ */
    @media (max-width:1024px){ .pf-grid{grid-template-columns:1.4fr 1fr;} }
    @media (max-width:640px){
      main{padding:18px 14px 56px;}
      .visitor-header{padding:10px 14px;}
      .vh-btn{padding:8px 13px;font-size:11.5px;}
      .pf-hero.has-banner .pf-hero-body{min-height:300px;padding:28px 18px;}
      .pf-hero-body{padding:30px 18px;}
      .pf-section{padding:18px 16px;}
      .pf-grid{grid-template-columns:1fr;}
    }
    @media (max-width:380px){
      .vh-brand .tx small{display:none;}
      .vh-actions{gap:7px;}
      .vh-btn{padding:7px 11px;font-size:11px;}
      .pf-socials{gap:8px;}
      .pf-socials a{width:34px;height:34px;}
      .pf-rev-vp,.pf-empty-rev{height:150px;}
    }
    @media (min-width:1440px){ main{max-width:980px;} }
  </style>
</head>
<body>
  <!-- ═══ Encabezado de VISITANTE (logo + Entrar / Crear Cuenta). Sin pestañas de portal. ═══ -->
  <header class="visitor-header">
    <a class="vh-brand" href="./index.html" style="text-decoration:none;">
      <img src="./assets/branding/fenix-emblem-160.png" alt="Miami DJ Beat" />
      <span class="tx">MIAMI DJ BEAT LLC<small>Entertainment &amp; Events</small></span>
    </a>
    <div class="vh-actions">
      <a class="vh-btn vh-login" id="vh-login" href="./login.html">Entrar</a>
      <a class="vh-btn vh-signup" id="vh-signup" href="./login.html?signup=free">Crear Cuenta</a>
    </div>
  </header>

  <div class="pf-loading" id="pf-loading">Cargando perfil…</div>

  <main id="pf-main" style="display:none;">
    <!-- HERO -->
    <div class="pf-hero" id="pf-hero">
      <div class="pf-banner" id="pf-banner"><img id="pf-banner-img" alt="" loading="lazy"></div>
      <div class="pf-scrim"></div>
      <div class="pf-hero-body">
        <img class="pf-photo" id="pf-photo" alt="" src="./assets/dj-avatar-placeholder.png">
        <div class="pf-id">
          <span class="pf-badge" id="pf-badge">◆</span>
          <div class="pf-role" id="pf-role">—</div>
          <h1 class="pf-name" id="pf-name">—</h1>
          <div class="pf-stars" id="pf-hero-stars" aria-label="Rating">★★★★★</div>
          <div class="pf-socials" id="pf-socials"></div>
        </div>
      </div>
    </div>

    <!-- OPINIONES (debajo del hero) -->
    <div class="pf-section">
      <div class="pf-section-head" id="pf-rev-title">Opiniones</div>
      <div class="pf-rev-avg" id="pf-rev-avg"></div>
      <div class="pf-rate" id="pf-rate">
        <div class="pf-rate-lead">Deja tu opinión</div>
        <div class="pf-stars-input" id="pf-stars-input" role="group" aria-label="Tu valoración de 1 a 5 estrellas">
          <button type="button" class="pf-star" data-star="1" aria-label="1 estrella">★</button>
          <button type="button" class="pf-star" data-star="2" aria-label="2 estrellas">★</button>
          <button type="button" class="pf-star" data-star="3" aria-label="3 estrellas">★</button>
          <button type="button" class="pf-star" data-star="4" aria-label="4 estrellas">★</button>
          <button type="button" class="pf-star" data-star="5" aria-label="5 estrellas">★</button>
        </div>
        <div class="pf-rate-dialog" id="pf-rate-dialog">
          <div id="pf-rate-picked" style="font-size:12px;font-weight:700;color:var(--gold-lt);"></div>
          <div class="pf-rate-lowhint" id="pf-rate-lowhint">Cuéntanos el porqué — nos ayuda a mejorar.</div>
          <textarea id="pf-rate-comment" placeholder="Escribe tu opinión (opcional en 4–5★)…" rows="3"></textarea>
          <div class="pf-rate-actions">
            <button type="button" class="pf-rate-btn ok" id="pf-rate-submit">Publicar</button>
            <button type="button" class="pf-rate-btn no" id="pf-rate-cancel">Cancelar</button>
            <span class="pf-rate-msg" id="pf-rate-msg"></span>
          </div>
        </div>
      </div>
      <div class="pf-reviews" id="pf-reviews"></div>
    </div>

    <div class="pf-grid">
      <!-- BIO -->
      <div class="pf-section">
        <div class="pf-section-head">Bio</div>
        <p class="pf-bio" id="pf-bio">—</p>
      </div>
      <!-- INTERACTUAR -->
      <div class="pf-section pf-qr-card">
        <div class="pf-section-head">Interactuar</div>
        <div class="pf-qr-paper"><div id="pf-qrcode"></div></div>
        <div class="pf-qr-cap">Comparte este perfil</div>
        <div class="pf-cta">
          <button class="vh-btn vh-login" id="pf-share" type="button">Compartir enlace</button>
          <a class="vh-btn vh-signup" id="pf-cta-join" href="./login.html?signup=free">Únete al ecosistema</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    var el = function (id) { return document.getElementById(id); };
    function getSb(){ return window.getSupabaseClient ? window.getSupabaseClient() : window.supabase; }

    // Propagar ref (referido) a Entrar / Crear Cuenta desde la primera visita
    (function () {
      try {
        if (window.mdjAppendRef) {
          ['vh-login','vh-signup','pf-cta-join'].forEach(function(id){ var a=el(id); if(a) a.href=window.mdjAppendRef(a.getAttribute('href')); });
        }
      } catch(e){}
    })();

    (async function () {
      var qp = new URLSearchParams(location.search);
      var id = (qp.get('id') || '').trim();
      var sb = getSb();
      if (!sb) { el('pf-loading').textContent = 'No se pudo conectar. Intenta más tarde.'; return; }
      if (!id) { el('pf-loading').textContent = 'Perfil no especificado.'; return; }

      var p = {};
      try {
        // Vista pública SEGURA (security_invoker=false + GRANT a anon): un visitante anónimo
        // (QR / compartir / búsqueda) SÍ la puede leer, y solo expone columnas públicas
        // (nunca email/teléfono/dirección/source_ref). NO leer la tabla base dj_profiles:
        // su RLS niega la lectura a anon → el perfil NO cargaría para el público.
        var r = await sb.from('public_dj_profiles').select('*').eq('user_id', id).maybeSingle();
        p = (r && r.data) || {};
      } catch (e) {}
      if (!p || !p.user_id) { el('pf-loading').textContent = 'Perfil no encontrado.'; return; }

      el('pf-loading').style.display = 'none';
      el('pf-main').style.display = '';

      // Nombre + badge — plantilla de ARTISTA-pura (categoría única; sin ramas de owner/staff)
      var name = p.dj_name || p.stage_name || p.full_name || 'Perfil';
      el('pf-name').textContent = name;
      document.title = name + ' — Miami DJ Beat';
      el('pf-role').textContent = p.city ? ('DJ · ' + p.city) : 'Artista';
      el('pf-badge').textContent = '◆ ARTISTA' + (p.verified === true ? ' · VERIFICADO' : '');

      // Avatar (canónico: photo_url)
      var photo = p.photo_url || p.avatar_url || p.image_url || '';
      if (photo) { var im = el('pf-photo'); im.src = photo; im.alt = name; }

      // HERO banner (background_url + focal + zoom) — coincide con CONFIG
      var bg = (p.background_url || '').toString().trim();
      if (bg) {
        var heroEl = el('pf-hero'), bi = el('pf-banner-img');
        var fx = (p.photo_focal_x != null) ? Math.max(0, Math.min(100, Number(p.photo_focal_x))) : 50;
        var fy = (p.photo_focal_y != null) ? Math.max(0, Math.min(100, Number(p.photo_focal_y))) : 50;
        var zm = (p.hero_bg_zoom != null) ? Math.max(80, Math.min(200, Number(p.hero_bg_zoom))) : 100;
        if (bi) { bi.style.objectPosition = fx + '% ' + fy + '%'; bi.style.transform = 'scale(' + Math.max(1, (zm / 100)) + ')'; bi.style.transformOrigin = fx + '% ' + fy + '%'; bi.src = bg; bi.alt = 'Portada — ' + name; }
        if (heroEl) heroEl.classList.add('has-banner');
      }

      // Redes
      var SOC = [
        {f:['social_instagram','instagram_url'],t:'Instagram',svg:'<rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.3" fill="currentColor"/>'},
        {f:['social_youtube','youtube_url'],t:'YouTube',svg:'<rect x="2" y="5" width="20" height="14" rx="4" fill="currentColor"/><path d="M10 9l6 3-6 3z" fill="#0b0f18"/>'},
        {f:['social_tiktok','tiktok_url'],t:'TikTok',svg:'<path d="M14 3c.3 2 1.7 3.5 3.7 3.8V9c-1.4 0-2.7-.4-3.7-1.1v5.6a4.8 4.8 0 1 1-4.8-4.8c.3 0 .6 0 .9.1v2.5a2.4 2.4 0 1 0 1.7 2.2V3z" fill="currentColor"/>'},
        {f:['social_facebook','facebook_url'],t:'Facebook',svg:'<path d="M13.5 21v-8H16l.4-3h-2.9V8.2c0-.9.3-1.5 1.6-1.5H16.5V4.1C16.2 4 15.3 4 14.3 4c-2.1 0-3.6 1.3-3.6 3.7V10H8v3h2.7v8z" fill="currentColor"/>'},
        {f:['social_web','website_url'],def:'https://www.miamidjbeat.com/',t:'Web',svg:'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c2.6 2.6 2.6 15.4 0 18M12 3c-2.6 2.6-2.6 15.4 0 18" fill="none" stroke="currentColor" stroke-width="1.4"/>'}
      ];
      var row = el('pf-socials');
      if (row) { row.innerHTML = SOC.map(function (s) { var href=''; for (var i=0;i<s.f.length;i++){ var v=p[s.f[i]]; if (v && String(v).trim() && String(v)!=='null'){ href=String(v).trim(); break; } } if(!href) href=s.def||''; if(!href) return ''; if(!/^(https?:|mailto:|tel:)/i.test(href)) href='https://'+href.replace(/^\/+/,''); href=href.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); return '<a href="'+href+'" target="_blank" rel="noopener noreferrer" title="'+s.t+'" aria-label="'+s.t+'"><svg viewBox="0 0 24 24">'+s.svg+'</svg></a>'; }).join(''); }

      // Bio
      var bio = (p.bio || p.bio_long || p.bio_short || '').trim();
      if (bio) el('pf-bio').textContent = bio;

      // Enlace público a compartir — lleva ?ref=<user_id> del perfil (contrato nativo "?ref=DJ_UUID"
      // → mdb_referral_dj_id, último-toque). Atribuye la comisión a ESTE artista cuando se registre quien lo abra.
      var shareUrl = 'https://www.miamidjbeat.com/profile.html?id=' + encodeURIComponent(id) + '&ref=' + encodeURIComponent(id);
      try {
        var qc = el('pf-qrcode');
        if (qc && window.QRCode) {
          qc.innerHTML = '';
          var ql = (window.QRCode.CorrectLevel ? window.QRCode.CorrectLevel.M : 0);
          new window.QRCode(qc, { text: shareUrl, width: 180, height: 180, colorDark: '#000000', colorLight: '#ffffff', correctLevel: ql });
        }
      } catch (eq) {}
      // Botón "Compartir enlace" (Web Share API + fallback a portapapeles) — propaga el mismo enlace con ?ref.
      try {
        var shb = el('pf-share');
        if (shb) shb.addEventListener('click', function () {
          if (navigator.share) { navigator.share({ title: name + ' — Miami DJ Beat', url: shareUrl }).catch(function () {}); }
          else if (navigator.clipboard) { navigator.clipboard.writeText(shareUrl).then(function () { var o = shb.textContent; shb.textContent = '¡Enlace copiado!'; setTimeout(function () { shb.textContent = o; }, 1600); }).catch(function () {}); }
        });
      } catch (esh) {}

      // Opiniones (bundle público) + estrellas del hero
      var avg = null, cnt = 0, rev = [];
      try {
        if (sb.rpc) {
          var rb = await sb.rpc('get_dj_public_review_bundle', { p_dj_user_id: id });
          if (!rb.error && rb.data) { var d = rb.data; if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { d = null; } } if (d) { rev = Array.isArray(d.reviews) ? d.reviews : []; avg = d.avg_rating; cnt = Number(d.review_count) || 0; } }
        }
      } catch (er) {}
      var titEl = el('pf-rev-title'); if (titEl) titEl.textContent = cnt > 0 ? 'Opiniones de clientes' : 'Opiniones · sin reseñas aún';
      var avgEl = el('pf-rev-avg'); if (avgEl) avgEl.textContent = cnt > 0 ? ('★ ' + Number(avg).toFixed(1) + ' · ' + cnt + ' reseñas') : '';
      mdjRenderRevCarousel(el('pf-reviews'), rev.slice(0, 8));
      try { var hs = el('pf-hero-stars'); if (hs) { var rr = (cnt > 0 && avg != null) ? Math.max(0, Math.min(5, Math.round(Number(avg)))) : 0; hs.innerHTML = '<span class="on">' + '★'.repeat(rr) + '</span><span class="off">' + '★'.repeat(5 - rr) + '</span>'; } } catch (eh) {}

      // Input de opinión (visitante). Si no hay sesión → invita a Entrar/Crear Cuenta (propaga ref).
      var sess = null; try { sess = (await sb.auth.getSession()).data.session; } catch (e) {}
      wireReviewInput(sb, id, sess ? sess.user.id : null);
    })();

    /* ── Opinión interactiva ── */
    function wireReviewInput(sb, profileOwnerId, viewerId) {
      var input = el('pf-stars-input'); if (!input || input.dataset.bound) return; input.dataset.bound = '1';
      var dlg = el('pf-rate-dialog'), picked = el('pf-rate-picked'), low = el('pf-rate-lowhint'),
          comment = el('pf-rate-comment'), submit = el('pf-rate-submit'), cancel = el('pf-rate-cancel'), msg = el('pf-rate-msg');
      var isSelf = profileOwnerId && viewerId && String(profileOwnerId) === String(viewerId);
      var loggedIn = !!viewerId;
      var current = 0;
      function paint(n) { current = Math.min(5, Math.max(0, n || 0)); [].forEach.call(input.querySelectorAll('.pf-star'), function (b) { b.classList.toggle('on', parseInt(b.dataset.star, 10) <= current && current > 0); }); }
      function open() { if (dlg) dlg.classList.add('open'); if (picked) picked.textContent = 'Tu valoración: ' + '★'.repeat(current) + '☆'.repeat(5 - current); if (low) low.classList.toggle('show', current > 0 && current <= 3); if (msg) msg.textContent = ''; }
      input.addEventListener('click', function (e) { var b = e.target.closest('.pf-star'); if (!b) return; paint(parseInt(b.dataset.star, 10)); open(); if (comment) comment.focus(); });
      if (cancel) cancel.addEventListener('click', function () { if (dlg) dlg.classList.remove('open'); paint(0); if (comment) comment.value = ''; });
      if (submit) submit.addEventListener('click', async function () {
        if (current < 1) { if (msg) { msg.style.color = '#e0b64d'; msg.textContent = 'Elige de 1 a 5 estrellas.'; } return; }
        if (!loggedIn) {   // visitante anónimo → debe entrar/crear cuenta (propagando ref)
          if (msg) { msg.style.color = '#e0b64d'; msg.textContent = 'Entra o crea tu cuenta para publicar tu opinión…'; }
          var back = window.mdjAppendRef ? window.mdjAppendRef('./login.html?next=' + encodeURIComponent(location.pathname + location.search)) : './login.html';
          setTimeout(function () { window.location.assign(back); }, 1100);
          return;
        }
        if (isSelf) { if (msg) { msg.style.color = '#e0b64d'; msg.textContent = 'No puedes reseñar tu propio perfil.'; } return; }
        var txt = comment && comment.value ? comment.value.trim() : '';
        if (current <= 3 && !txt) { if (msg) { msg.style.color = '#e0b64d'; msg.textContent = 'Para una valoración baja, cuéntanos el porqué.'; } if (comment) comment.focus(); return; }
        submit.disabled = true; var prev = submit.textContent; submit.textContent = 'Enviando…';
        try {
          var res = await sb.rpc('submit_dj_public_review', { p_dj_user_id: profileOwnerId, p_rating: current, p_comment: txt || null });
          if (res && res.error) { if (msg) { msg.style.color = '#e88'; msg.textContent = res.error.message || 'No se pudo guardar.'; } }
          else { if (msg) { msg.style.color = '#7fdca0'; msg.textContent = '¡Gracias! Tu opinión se publicó.'; } if (dlg) dlg.classList.remove('open'); if (comment) comment.value = ''; paint(0); }
        } catch (e2) { if (msg) { msg.style.color = '#e88'; msg.textContent = 'Error de conexión.'; } }
        submit.disabled = false; submit.textContent = prev;
      });
    }

    /* ── Carrusel de opiniones: UNA a la vez, auto-avanza, MEDIDA FIJA ── */
    function mdjRenderRevCarousel(host, reviews) {
      if (!host) return;
      if (window._pfRevTimer) { clearTimeout(window._pfRevTimer); window._pfRevTimer = null; }
      host.innerHTML = '';
      if (!reviews || !reviews.length) { var em = document.createElement('div'); em.className = 'pf-empty-rev'; em.textContent = 'Sin reseñas aún — sé el primero en opinar.'; host.appendChild(em); return; }
      var vp = document.createElement('div'); vp.className = 'pf-rev-vp'; vp.setAttribute('aria-live', 'polite');
      var slide = document.createElement('div'); slide.className = 'pf-rev-slide'; vp.appendChild(slide); host.appendChild(vp);
      if (reviews.length > 1) { var c = document.createElement('div'); c.className = 'pf-rev-count'; c.id = 'pf-rev-count'; host.appendChild(c); }
      var idx = 0, reduce = false;
      try { reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
      function fill(i) {
        slide.innerHTML = '';
        var r = reviews[i] || {};
        var rt = Math.max(0, Math.min(5, Math.round(Number(r.rating || r.stars || 0))));
        var st = document.createElement('div'); st.className = 'stars'; st.textContent = '★★★★★'.slice(0, rt) + '☆☆☆☆☆'.slice(0, 5 - rt); slide.appendChild(st);
        var txt = String(r.comment || r.text || r.review || '').trim();
        if (txt) { var pp = document.createElement('p'); pp.className = 'txt'; pp.textContent = txt; slide.appendChild(pp); }
        var who = String(r.author || r.client_name || r.name || r.reviewer || 'Cliente').trim();
        var wd = document.createElement('div'); wd.className = 'who'; wd.textContent = '— ' + who; slide.appendChild(wd);
        var cc = document.getElementById('pf-rev-count'); if (cc) cc.textContent = (i + 1) + ' / ' + reviews.length;
      }
      function schedule() { if (reviews.length <= 1) return; window._pfRevTimer = setTimeout(advance, 5200); }
      function advance() {
        var nx = (idx + 1) % reviews.length;
        if (reduce) { idx = nx; fill(idx); schedule(); return; }
        slide.classList.add('exit');
        window._pfRevTimer = setTimeout(function () { idx = nx; slide.classList.remove('exit'); slide.classList.add('enter'); fill(idx); void slide.offsetWidth; slide.classList.remove('enter'); schedule(); }, 420);
      }
      fill(0); schedule();
    }
  </script>
