<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Event Flow — A4</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #222; color: #111; font-family: 'Segoe UI', system-ui, sans-serif; }
    .toolbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center;
      padding: 12px; background: rgba(10,8,6,0.95); border-bottom: 1px solid rgba(197,160,89,0.4);
    }
    .toolbar button {
      padding: 10px 18px; border-radius: 10px; border: 1px solid rgba(197,160,89,0.5);
      background: rgba(197,160,89,0.15); color: #f5e6c8; font-weight: 800; cursor: pointer;
    }
    .toolbar button:hover { background: rgba(197,160,89,0.3); }
    .wrap { padding: 16px; display: flex; justify-content: center; }
    #a4-root {
      width: 210mm; min-height: 297mm; background: #fff; padding: 14mm 16mm;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    h1 { margin: 0 0 4px; font-size: 18pt; color: #1a1208; letter-spacing: 0.04em; }
    .sub { font-size: 10pt; color: #444; margin-bottom: 14px; }
    table.flow { width: 100%; border-collapse: collapse; font-size: 10pt; }
    table.flow th, table.flow td { border: 1px solid #ccc; padding: 6px 8px; vertical-align: top; }
    table.flow th { background: #f0ebe3; text-align: left; color: #5c4a2a; }
    .brand { font-size: 9pt; color: #888; margin-top: 16px; text-align: center; }
    @media print {
      html, body { background: #fff; }
      .toolbar { display: none !important; }
      .wrap { padding: 0; }
      #a4-root { box-shadow: none; width: 210mm; min-height: 297mm; page-break-after: always; }
      @page { size: A4; margin: 12mm; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button type="button" id="btn-print">Imprimir / PDF (A4)</button>
    <button type="button" id="btn-png">Descargar PNG (A4)</button>
  </div>
  <div class="wrap">
    <div id="a4-root"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    (function () {
      var KEY = 'mdj_event_flow_print_v1';
      var raw = null;
      try { raw = sessionStorage.getItem(KEY); } catch (e) {}
      var data = raw ? JSON.parse(raw) : null;
      var root = document.getElementById('a4-root');
      if (!data || data.v !== 1 || !root) {
        root.innerHTML = '<p style="padding:24px;">No hay datos de Event Flow. Genera uno desde <strong>Admin → Producción</strong>.</p>';
        return;
      }
      function esc(s) {
        if (s == null) return '';
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }
      var blocks = Array.isArray(data.blocks) ? data.blocks : [];
      var acc = String(data.accessNotes || '').trim();
      var accHead = esc(data.accessHeading || 'Acceso al local (equipo)');
      var accBox = '';
      if (acc) {
        accBox =
          '<div style="margin:10px 0 14px;padding:10px 12px;border-radius:8px;border:1px solid #c5cae9;background:#f8f9ff;font-size:10pt;line-height:1.45;color:#222;">' +
          '<strong style="color:#1a237e;">' + accHead + '</strong><br/>' +
          esc(acc) +
          '</div>';
      }
      var rows = blocks.map(function (b) {
        return '<tr><td>' + esc(b.start) + '</td><td>' + esc(b.end) + '</td><td><strong>' + esc(b.title) + '</strong></td><td>' + esc(b.actions) + '</td><td>' + esc(b.notes) + '</td></tr>';
      }).join('');
      root.innerHTML =
        '<h1>' + esc(data.title || 'Event Flow') + '</h1>' +
        '<div class="sub">' + esc(data.eventType || '') + (data.venue ? ' · ' + esc(data.venue) : '') + (data.eventDate ? ' · ' + esc(data.eventDate) : '') + '</div>' +
        accBox +
        '<table class="flow"><thead><tr><th>Inicio</th><th>Fin</th><th>Bloque</th><th>Acciones</th><th>Notas</th></tr></thead><tbody>' +
        (rows || '<tr><td colspan="5">Sin bloques</td></tr>') +
        '</tbody></table>' +
        '<div class="brand">Miami DJ Beat LLC — Event Flow (uso interno / talento)</div>';

      document.getElementById('btn-print').onclick = function () { window.print(); };

      document.getElementById('btn-png').onclick = function () {
        if (typeof html2canvas !== 'function') {
          alert('html2canvas no cargó. Revisa la red e inténtalo de nuevo.');
          return;
        }
        html2canvas(document.getElementById('a4-root'), { scale: 2, useCORS: true, backgroundColor: '#ffffff' }).then(function (canvas) {
          var a = document.createElement('a');
          a.download = 'event-flow-a4.png';
          a.href = canvas.toDataURL('image/png');
          a.click();
        }).catch(function (err) {
          alert('PNG: ' + (err && err.message ? err.message : err));
        });
      };
    })();
  </script>
</body>
</html>
