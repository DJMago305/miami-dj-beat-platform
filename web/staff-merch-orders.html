<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pedidos Merch — Miami DJ Beat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
    <script>
    /* P2.2 · WebKit legacy no puede ni PARSEAR el bundle del CDN de arriba
       (?. y ??, 133 veces en la build 2.112.3 -- se resuelve sola, sin
       version fijada) -- ese <script> falla entero y en silencio antes de
       ejecutar una sola linea. Deteccion indirecta (try/catch): escribir
       ?. / ?? aqui mismo tambien rompería ESTE script en el mismo motor. Si
       falta soporte, se inyecta -- mismo origen -- una copia local
       transpilada (mismo 2.112.3, downlevel a ES2019, verificada
       funcionalmente identica). Mismo bloque exacto que login.html/index.html
       -- esta pagina era la unica de 65 que carga Supabase sin este respaldo
       (hallazgo de auditoria 2026-09-07, no aplicado antes por omision). */
    (function () {
        var mdjLibAusente = !(window.supabase &&
            typeof window.supabase.createClient === 'function');
        if (mdjLibAusente) {
            document.write('<script src="./vendor/supabase-js-2.112.3.legacy.js?v=20260818-safari-legacy"><\/script>');
        }
    })();
    </script>
    <script src="./js/mdj-safe-storage.js?v=20260616-1"></script>
    <script src="./supabase-config.js?v=20260422-supabase-kxvqdr-host"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=optional" rel="stylesheet" />
    <style>
        /* Mismos tokens que el carrito de shop.html (.cart-item, var(--gold), etc.)
           — esta pantalla es la continuación operativa de esa misma tienda, no una
           herramienta aparte, así que hereda su lenguaje visual en vez de inventar uno. */
        :root {
            --gold: #c5a059;
            --gold-soft: rgba(197, 160, 89, .14);
            --bg: #0a0a0c;
            --card: #16151a;
            --card-line: #2a2a30;
            --muted: #8f8f98;
            --text: #f2f1ee;
            --ok: #5fd68a;
            --ok-soft: rgba(70, 200, 120, .14);
            --bad: #f08080;
            --bad-soft: rgba(220, 80, 80, .14);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
        }
        .wrap { width: 100%; margin: 0; padding: 32px 40px 60px; }

        .page-head { margin-bottom: 24px; }
        .eyebrow {
            color: var(--gold);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            margin: 0 0 6px;
        }
        h1 { font-size: 24px; font-weight: 800; margin: 0 0 6px; letter-spacing: .2px; }
        #filter-label { color: var(--gold); font-weight: 700; font-size: 15px; }
        #filter-label:not(:empty)::before { content: "· "; color: var(--muted); }
        .sub { color: var(--muted); font-size: 13px; margin: 0; }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin: 24px 0 20px;
        }
        .filters { display: flex; gap: 8px; }
        .filters button {
            background: transparent;
            border: 1px solid var(--card-line);
            color: var(--muted);
            padding: 7px 16px;
            border-radius: 999px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: border-color .15s, color .15s;
        }
        .filters button:hover { border-color: var(--gold); color: var(--text); }
        .filters button.active { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }
        .count { color: var(--muted); font-size: 12.5px; }

        .orders { display: grid; grid-template-columns: 1fr; gap: 16px; }

        .order-card {
            background: var(--card);
            border: 1px solid var(--card-line);
            border-radius: 12px;
            padding: 18px 20px;
        }
        .order-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 14px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--card-line);
        }
        .order-when { font-size: 12.5px; color: var(--muted); }
        .order-when b { color: var(--text); font-weight: 600; }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 11px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .02em;
        }
        .pill.paid_pending_fulfillment { background: var(--gold-soft); color: var(--gold); }
        .pill.shipped { background: var(--ok-soft); color: var(--ok); }
        .pill.cancelled, .pill.refunded { background: var(--bad-soft); color: var(--bad); }

        .order-body { display: grid; grid-template-columns: 1.1fr 1.4fr; gap: 24px; }
        @media (max-width: 640px) { .order-body { grid-template-columns: 1fr; } }

        .block-label {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
            margin: 0 0 8px;
        }
        .customer-name { font-size: 14.5px; font-weight: 700; margin-bottom: 2px; }
        .customer-line { font-size: 12.5px; color: var(--muted); line-height: 1.6; }
        .ship-block { margin-top: 14px; }
        .ship-line { font-size: 12.5px; color: var(--text); line-height: 1.6; }

        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px dashed var(--card-line);
            font-size: 13px;
        }
        .item-row:last-child { border-bottom: none; }
        .item-name { font-weight: 600; }
        .item-variant { color: var(--muted); font-size: 12px; margin-top: 1px; }
        .item-qty {
            color: var(--gold);
            font-weight: 700;
            font-size: 12.5px;
            white-space: nowrap;
        }

        .order-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--card-line);
        }
        .total { font-size: 17px; font-weight: 800; color: var(--gold); }
        .total span { color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-right: 8px; }

        .btn-ship {
            background: var(--gold);
            color: #17130a;
            border: none;
            padding: 9px 18px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 12.5px;
            cursor: pointer;
            transition: filter .15s;
        }
        .btn-ship:hover { filter: brightness(1.08); }
        .btn-ship:disabled { opacity: .55; cursor: default; }
        .fulfilled-note { color: var(--muted); font-size: 12px; }
        .fulfilled-note b { color: var(--ok); }

        .state {
            text-align: center;
            color: var(--muted);
            font-size: 13.5px;
            padding: 70px 20px;
            border: 1px dashed var(--card-line);
            border-radius: 12px;
        }
        .state .glyph { font-size: 26px; display: block; margin-bottom: 10px; opacity: .7; }
        .state.error { color: var(--bad); }

        /* Vista Entradas (taquilla de salas): lista por nombre para la puerta */
        .search { background: var(--card); border: 1px solid var(--card-line); color: var(--text); border-radius: 999px; padding: 8px 16px; font-size: 13px; min-width: 240px; font-family: inherit; }
        .search:focus { outline: none; border-color: var(--gold); }
        .ev-block { margin-bottom: 26px; }
        .ev-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        .ev-title { font-size: 16px; font-weight: 800; }
        .ev-meta { color: var(--muted); font-size: 12.5px; }
        .ev-meta b { color: var(--gold); }
        .guest { display: grid; grid-template-columns: 1.4fr 1.6fr 1fr auto; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--card-line); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; }
        .guest.in { border-color: rgba(70, 200, 120, .45); }
        .guest-name { font-size: 14.5px; font-weight: 700; }
        .guest-sub { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-word; }
        .guest-items { font-size: 13px; }

        /* Escáner de puerta (cámara + QR): botón de la cabecera y visor a pantalla completa */
        .btn-scan { cursor: pointer; font: inherit; font-size: 13px; font-weight: 800; letter-spacing: .04em; color: #fff; background: #1f7a45; border: 0; border-radius: 10px; padding: 10px 16px; }
        .btn-scan:hover { background: #17633a; }
        #scan-modal { position: fixed; inset: 0; z-index: 10000; background: #05070c; color: #fff; display: none; flex-direction: column; }
        #scan-modal.open { display: flex; }
        .scan-top { display: flex; gap: 10px; align-items: center; padding: 12px 14px; background: #0c111b; border-bottom: 1px solid rgba(255,255,255,.14); flex-wrap: wrap; }
        .scan-top select { flex: 1 1 220px; min-width: 0; font: inherit; font-size: 14px; padding: 9px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25); background: #151b28; color: #fff; }
        .scan-close { cursor: pointer; font: inherit; font-size: 14px; font-weight: 800; color: #fff; background: #3a4150; border: 0; border-radius: 8px; padding: 10px 16px; }
        .scan-stage { position: relative; flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; background: #000; }
        .scan-stage video { width: 100%; height: 100%; object-fit: cover; }
        .scan-frame { position: absolute; width: min(70vw, 320px); aspect-ratio: 1; border: 3px solid rgba(255,255,255,.85); border-radius: 18px; box-shadow: 0 0 0 9999px rgba(0,0,0,.35); pointer-events: none; }
        .scan-msg { position: absolute; left: 12px; right: 12px; bottom: 12px; text-align: center; font-size: 13px; line-height: 1.5; background: rgba(0,0,0,.65); border-radius: 10px; padding: 10px 12px; }
        .scan-manual { display: flex; gap: 8px; padding: 10px 14px; background: #0c111b; border-top: 1px solid rgba(255,255,255,.14); }
        .scan-manual input { flex: 1 1 auto; min-width: 0; font: inherit; font-size: 14px; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25); background: #151b28; color: #fff; }
        .scan-manual button { cursor: pointer; font: inherit; font-size: 14px; font-weight: 800; color: #fff; background: #1f7a45; border: 0; border-radius: 8px; padding: 10px 16px; }
        #scan-result { position: fixed; inset: 0; z-index: 10001; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 28px; color: #fff; cursor: pointer; }
        #scan-result.show { display: flex; }
        #scan-result.ok { background: #12803c; } #scan-result.bad { background: #b3261e; }
        #scan-result .big { font-size: 64px; line-height: 1; margin-bottom: 14px; }
        #scan-result h2 { margin: 0 0 8px; font-size: 28px; }
        #scan-result p { margin: 4px 0; font-size: 17px; line-height: 1.45; max-width: 30em; }
        #scan-result .tap { margin-top: 22px; font-size: 12px; opacity: .8; letter-spacing: .08em; text-transform: uppercase; }
        .guest-code { color: var(--muted); font-size: 11.5px; letter-spacing: .06em; margin-top: 2px; }
        .gate { display: flex; align-items: center; gap: 8px; }
        .gate button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--card-line); background: transparent; color: var(--text); font-size: 18px; font-weight: 700; cursor: pointer; line-height: 1; }
        .gate button:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
        .gate button:disabled { opacity: .35; cursor: default; }
        .gate-n { min-width: 54px; text-align: center; font-weight: 800; font-size: 15px; }
        .gate-n.full { color: var(--ok); }
        @media (max-width: 760px) { .guest { grid-template-columns: 1fr auto; } .guest-items { grid-column: 1 / -1; } }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="page-head">
            <p class="eyebrow">Shopping Miami DJ Beat</p>
            <h1>Pedidos <span id="filter-label"></span></h1>
            <p class="sub" id="sub-line">Pedidos pagados vía Stripe Checkout · visible solo para staff (owner/admin/manager/seller)</p>
        </div>

        <div class="toolbar">
            <input type="search" id="guest-search" class="search" placeholder="Buscar por nombre…" aria-label="Buscar por nombre" style="display:none" />
            <button type="button" id="scan-open" class="btn-scan" style="display:none">📷 Escanear QR con Cámara</button>
            <span class="count" id="count"></span>
        </div>

        <div id="content" class="state">Cargando…</div>
    </div>


    <div id="scan-modal" role="dialog" aria-modal="true" aria-label="Escáner de puerta">
        <div class="scan-top">
            <select id="scan-event" aria-label="Evento de esta puerta"></select>
            <button type="button" class="scan-close" id="scan-close">Cerrar</button>
        </div>
        <div class="scan-stage">
            <video id="scan-video" playsinline muted></video>
            <div class="scan-frame"></div>
            <div class="scan-msg" id="scan-msg"></div>
        </div>
        <div class="scan-manual">
            <input type="text" id="scan-manual-input" placeholder="Pegar enlace o código (UUID) del ticket" autocomplete="off" autocapitalize="off" spellcheck="false" />
            <button type="button" id="scan-manual-go">Validar</button>
        </div>
    </div>
    <div id="scan-result" role="alert"></div>

    <script>
        var currentFilter = 'paid_pending_fulfillment';

        function esc(s) { return String(s == null ? '' : s).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }); }

        var STATUS_LABEL = {
            paid_pending_fulfillment: 'Pendiente de envío',
            shipped: 'Enviado',
            cancelled: 'Cancelado',
            refunded: 'Reembolsado'
        };

        function itemRows(items) {
            if (!Array.isArray(items) || !items.length) return '<div class="item-row"><span class="item-variant">Sin artículos registrados</span></div>';
            return items.map(function (it) {
                return '<div class="item-row">' +
                    '<div><div class="item-name">' + esc(it.i || '?') + '</div>' +
                    '<div class="item-variant">' + esc(it.c || '—') + ' · Talla ' + esc(it.s || '—') + '</div></div>' +
                    '<div class="item-qty">×' + esc(it.q || 1) + '</div>' +
                    '</div>';
            }).join('');
        }

        function fmtAddr(a) {
            if (!a || !a.address) return 'Sin dirección de envío';
            var ad = a.address;
            var name = a.name ? esc(a.name) + '<br>' : '';
            return name + esc([ad.line1, ad.line2].filter(Boolean).join(', ')) + '<br>' +
                esc([ad.city, ad.state, ad.postal_code].filter(Boolean).join(', '));
        }

        async function markShipped(sb, id, btn) {
            btn.disabled = true;
            btn.textContent = 'Guardando…';
            var sess = (await sb.auth.getSession()).data.session;
            var { error } = await sb.from('merch_orders').update({
                status: 'shipped',
                fulfilled_at: new Date().toISOString(),
                fulfilled_by: sess ? sess.user.id : null
            }).eq('id', id);
            if (error) {
                alert('No se pudo actualizar: ' + error.message);
                btn.disabled = false;
                btn.textContent = 'Marcar enviado';
                return;
            }
            load(sb);
        }

        function orderCard(o) {
            var when = o.created_at ? new Date(o.created_at).toLocaleString('es-US', {
                timeZone: 'America/New_York', dateStyle: 'medium', timeStyle: 'short'
            }) : '—';

            var foot = o.status === 'paid_pending_fulfillment'
                ? '<button class="btn-ship" data-id="' + o.id + '">Marcar enviado</button>'
                : (o.fulfilled_at
                    ? '<span class="fulfilled-note">Enviado el <b>' + new Date(o.fulfilled_at).toLocaleDateString('es-US') + '</b></span>'
                    : '');

            return '<div class="order-card">' +
                '<div class="order-top">' +
                    '<span class="order-when">Pedido del <b>' + when + '</b></span>' +
                    '<span class="pill ' + esc(o.status) + '">' + esc(STATUS_LABEL[o.status] || o.status) + '</span>' +
                '</div>' +
                '<div class="order-body">' +
                    '<div>' +
                        '<p class="block-label">Cliente</p>' +
                        '<div class="customer-name">' + esc(o.customer_name || 'Sin nombre') + '</div>' +
                        '<div class="customer-line">' + esc(o.customer_email || '—') + '<br>' + esc(o.customer_phone || '—') + '</div>' +
                        '<div class="ship-block">' +
                            '<p class="block-label">Envío</p>' +
                            '<div class="ship-line">' + fmtAddr(o.shipping_address) + '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div>' +
                        '<p class="block-label">Artículos</p>' +
                        itemRows(o.items) +
                    '</div>' +
                '</div>' +
                '<div class="order-foot">' +
                    '<div class="total"><span>Total</span>$' + ((o.total_cents || 0) / 100).toFixed(2) + '</div>' +
                    foot +
                '</div>' +
            '</div>';
        }

        // ── Vista Entradas: lista por nombre para la puerta (venue_ticket_orders) ──
        var _guests = [];
        // Cada carga lleva un número; si llega otra mientras espera la base, la vieja NO dibuja (evita que la carga
        // inicial de merch pise a la de Entradas cuando el padre manda el filtro justo después de abrir).
        var _loadSeq = 0;

        function ticketQty(o) {
            return (Array.isArray(o.items) ? o.items : []).reduce(function (n, it) { return n + (Number(it.qty) || 0); }, 0);
        }

        function guestRow(o) {
            var total = ticketQty(o), inn = o.checked_in_qty || 0;
            var items = (Array.isArray(o.items) ? o.items : []).map(function (it) { return esc(it.qty) + '× ' + esc(it.label); }).join(', ') || '—';
            return '<div class="guest' + (inn >= total && total > 0 ? ' in' : '') + '" data-id="' + esc(o.id) + '">' +
                '<div><div class="guest-name">' + esc(o.customer_name || 'Sin nombre') + '</div>' +
                '<div class="guest-sub">' + esc(o.customer_email || '—') + (o.customer_phone ? ' · ' + esc(o.customer_phone) : '') + '</div></div>' +
                '<div class="guest-items">' + items + '<div class="guest-code">Código ' + esc(String(o.id).slice(0, 8).toUpperCase()) + '</div></div>' +
                '<div class="guest-sub">$' + ((o.total_cents || 0) / 100).toFixed(2) + '</div>' +
                '<div class="gate"><button type="button" data-d="-1" aria-label="Quitar una entrada" ' + (inn <= 0 ? 'disabled' : '') + '>−</button>' +
                '<span class="gate-n' + (inn >= total && total > 0 ? ' full' : '') + '">' + inn + ' / ' + total + '</span>' +
                '<button type="button" data-d="1" aria-label="Marcar una entrada que entró" ' + (inn >= total ? 'disabled' : '') + '>+</button></div>' +
                '</div>';
        }

        function renderGuests() {
            var content = document.getElementById('content');
            var term = (document.getElementById('guest-search').value || '').trim().toLowerCase();
            var list = _guests.filter(function (o) {
                return !term || String(o.customer_name || '').toLowerCase().indexOf(term) !== -1 ||
                    String(o.customer_email || '').toLowerCase().indexOf(term) !== -1 ||
                    String(o.id).slice(0, 8).toLowerCase().indexOf(term) !== -1;
            });
            var totalAll = 0, inAll = 0;
            _guests.forEach(function (o) { totalAll += ticketQty(o); inAll += o.checked_in_qty || 0; });
            document.getElementById('count').textContent = inAll + ' de ' + totalAll + ' entradas ya entraron · ' + _guests.length + (_guests.length === 1 ? ' orden' : ' órdenes');
            if (!list.length) {
                content.className = 'state';
                content.innerHTML = '<span class="glyph">🎟️</span>' + (_guests.length ? 'Nadie coincide con la búsqueda.' : 'Todavía no hay entradas vendidas.');
                return;
            }
            var byEvent = {}, order = [];
            list.forEach(function (o) {
                var k = o.event_id || 'sin-evento';
                if (!byEvent[k]) { byEvent[k] = []; order.push(k); }
                byEvent[k].push(o);
            });
            content.className = '';
            content.innerHTML = order.map(function (k) {
                var rows = byEvent[k], ev = rows[0].venue_events || {};
                rows.sort(function (a, b) { return String(a.customer_name || '').localeCompare(String(b.customer_name || ''), 'es', { sensitivity: 'base' }); });
                var t = 0, i = 0; rows.forEach(function (o) { t += ticketQty(o); i += o.checked_in_qty || 0; });
                var when = ev.event_date ? new Date(ev.event_date + 'T12:00:00').toLocaleDateString('es-US', { dateStyle: 'medium' }) : 'fecha por anunciar';
                return '<div class="ev-block"><div class="ev-head"><span class="ev-title">' + esc(ev.title || 'Evento') + '</span>' +
                    '<span class="ev-meta">' + esc(when) + ' · <b>' + i + ' / ' + t + '</b> entraron</span></div>' +
                    rows.map(guestRow).join('') + '</div>';
            }).join('');
        }

        async function gate(sb, id, delta) {
            var { data, error } = await sb.rpc('venue_ticket_checkin', { p_order_id: id, p_delta: delta });
            if (error) { alert('No se pudo registrar: ' + error.message); return; }
            var o = _guests.filter(function (g) { return g.id === id; })[0];
            if (o && data) o.checked_in_qty = data.checked_in_qty;
            renderGuests();
        }

        async function loadEntradas(sb) {
            var content = document.getElementById('content');
            content.className = 'state';
            content.innerHTML = 'Cargando…';
            document.getElementById('count').textContent = '';
            var mySeq = ++_loadSeq;
            var { data, error } = await sb.from('venue_ticket_orders')
                .select('id,event_id,customer_name,customer_email,customer_phone,items,total_cents,created_at,checked_in_qty,venue_events(title,event_date)')
                .order('created_at', { ascending: false }).limit(1000);
            if (mySeq !== _loadSeq) return;
            if (error) {
                content.className = 'state error';
                var falta = /checked_in_qty/.test(error.message || '');
                content.innerHTML = '<span class="glyph">⚠</span>' + (falta
                    ? 'Falta aplicar el SQL de la puerta (supabase/scripts/20261002_taquilla_puerta_y_sala_mesas.sql).'
                    : esc(error.message));
                return;
            }
            _guests = data || [];
            renderGuests();
        }

        document.addEventListener('click', function (e) {
            var b = e.target.closest ? e.target.closest('.gate button') : null;
            if (!b || !_sbRef || b.disabled) return;
            var row = b.closest('.guest');
            if (row) gate(_sbRef, row.getAttribute('data-id'), Number(b.getAttribute('data-d')));
        });
        document.addEventListener('input', function (e) {
            if (e.target && e.target.id === 'guest-search') renderGuests();
        });

        async function load(sb) {
            if (currentFilter === 'entradas') return loadEntradas(sb);
            var mySeq = ++_loadSeq;
            var content = document.getElementById('content');
            var countEl = document.getElementById('count');
            content.className = 'state';
            content.innerHTML = 'Cargando…';
            countEl.textContent = '';

            var q = sb.from('merch_orders').select('*').order('created_at', { ascending: false }).limit(200);
            if (currentFilter !== 'all') q = q.eq('status', currentFilter);
            var { data, error } = await q;
            if (mySeq !== _loadSeq) return;

            if (error) {
                content.className = 'state error';
                content.innerHTML = '<span class="glyph">⚠</span>' + esc(error.message);
                return;
            }
            if (!data || !data.length) {
                content.className = 'state';
                content.innerHTML = '<span class="glyph">🛍️</span>No hay pedidos en este filtro.';
                return;
            }

            countEl.textContent = data.length + (data.length === 1 ? ' pedido' : ' pedidos');
            content.className = 'orders';
            content.innerHTML = data.map(orderCard).join('');

            content.querySelectorAll('button.btn-ship').forEach(function (btn) {
                btn.addEventListener('click', function () { markShipped(sb, btn.getAttribute('data-id'), btn); });
            });
        }

        // Cablea la campana de notificaciones (#mdj-notif-bell en staff.html): el número
        // no se borra por cambiar de estado, solo cuando alguien de staff realmente abre
        // este panel. Se marca UNA vez por sesión de vista, no en cada cambio de filtro.
        async function markAllRead(sb) {
            var { error } = await sb.from('merch_orders').update({ is_read: true }).eq('is_read', false);
            if (!error) {
                try { window.parent.postMessage({ type: 'mdjb:merch-read' }, '*'); } catch (e) { }
            }
        }

        var FILTER_LABEL = { paid_pending_fulfillment: 'Pendientes', shipped: 'Enviados', all: 'Todos', entradas: 'Entradas' };
        var _sbRef = null;
        var _readMarked = false;

        function applyFilter(filter) {
            currentFilter = filter;
            var ent = filter === 'entradas';
            document.getElementById('filter-label').textContent = FILTER_LABEL[filter] || '';
            document.getElementById('guest-search').style.display = ent ? '' : 'none';
            document.getElementById('scan-open').style.display = ent ? '' : 'none';
            document.getElementById('sub-line').textContent = ent
                ? 'Entradas de salas y eventos · lista por nombre para la puerta · visible solo para staff'
                : 'Pedidos pagados vía Stripe Checkout · visible solo para staff (owner/admin/manager/seller)';
            // Abrir Entradas no debe borrar el número de pedidos de merch sin leer.
            if (!ent && !_readMarked && _sbRef) { _readMarked = true; markAllRead(_sbRef); }
            if (_sbRef) load(_sbRef);
        }

        // El padre (staff.html → sidebar Pedidos → Pendientes/Enviados/Todos) manda el filtro
        // por postMessage, mismo patrón que usan las plantillas de Bóveda Legal con su iframe.
        window.addEventListener('message', function (e) {
            if (e.data && e.data.type === 'mdjb:merch-filter') applyFilter(e.data.filter);
        });


        // ── Escáner de puerta: cámara + BarcodeDetector → venue_ticket_scan(order, evento, 1) ──
        var UUID_RE = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i;
        var SCAN_REASON = {
            already_used: 'Ya ingresaron todas las entradas de este ticket.',
            invalid_event: 'Este ticket es de OTRO evento o de otra fecha.',
            cancelled: 'Ticket cancelado, reembolsado o en revisión.',
            order_not_found: 'Ticket no encontrado.'
        };
        var _scan = { stream: null, det: null, timer: 0, busy: false, last: '', lastAt: 0, events: [], hideTimer: 0 };

        function ymdNY(d) { return d.toLocaleDateString('en-CA', { timeZone: 'America/New_York' }); }
        function scanMsg(t) { document.getElementById('scan-msg').textContent = t || ''; document.getElementById('scan-msg').style.display = t ? '' : 'none'; }

        // Eventos de la puerta: los de HOY (hora de Miami); si hoy no hay, los próximos 14 días. Si hay uno solo de hoy, queda elegido.
        async function scanLoadEvents(sb) {
            var today = new Date(), to = new Date(today.getTime() + 14 * 86400000);
            var r = await sb.from('venue_events').select('id,title,event_date,status,venue_rooms(name)')
                .gte('event_date', ymdNY(new Date(today.getTime() - 86400000))).lte('event_date', ymdNY(to)).neq('status', 'cancelled').order('event_date', { ascending: true });
            var rows = (r && r.data) || [], hoy = ymdNY(today);
            var delDia = rows.filter(function (e) { return e.event_date === hoy; });
            _scan.events = delDia.length ? delDia : rows;
            var sel = document.getElementById('scan-event');
            sel.innerHTML = _scan.events.length ? _scan.events.map(function (e) {
                var room = e.venue_rooms && e.venue_rooms.name ? ' · ' + e.venue_rooms.name : '';
                return '<option value="' + esc(e.id) + '">' + esc((e.event_date === hoy ? 'HOY · ' : e.event_date + ' · ') + (e.title || 'Evento') + room) + '</option>';
            }).join('') : '<option value="">Sin eventos en los próximos días</option>';
            var saved = ''; try { saved = sessionStorage.getItem('mdj_scan_event') || ''; } catch (e) { }
            if (saved && _scan.events.some(function (e) { return e.id === saved; })) sel.value = saved;
            return _scan.events.length > 0;
        }

        function beep(ok) {
            try {
                var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
                var ctx = _scan.ctx || (_scan.ctx = new AC()), t0 = ctx.currentTime;
                (ok ? [[880, 0, .16]] : [[220, 0, .18], [220, .26, .18]]).forEach(function (n) {
                    var o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = n[0]; o.type = ok ? 'sine' : 'square';
                    g.gain.value = .18; o.connect(g); g.connect(ctx.destination); o.start(t0 + n[1]); o.stop(t0 + n[1] + n[2]);
                });
            } catch (e) { }
            try { if (navigator.vibrate) navigator.vibrate(ok ? [120] : [220, 90, 220]); } catch (e2) { }
        }

        function showResult(ok, title, lines) {
            var box = document.getElementById('scan-result');
            box.className = 'show ' + (ok ? 'ok' : 'bad');
            box.innerHTML = '<div class="big">' + (ok ? '✔' : '✖') + '</div><h2>' + esc(title) + '</h2>' +
                (lines || []).filter(Boolean).map(function (l) { return '<p>' + esc(l) + '</p>'; }).join('') + '<div class="tap">Toca para continuar</div>';
            beep(ok);
            clearTimeout(_scan.hideTimer);
            _scan.hideTimer = setTimeout(hideResult, ok ? 2200 : 3200);
        }
        function hideResult() { clearTimeout(_scan.hideTimer); document.getElementById('scan-result').className = ''; _scan.busy = false; }

        async function scanHandle(raw) {
            if (_scan.busy || !_sbRef) return;
            var m = UUID_RE.exec(String(raw || ''));                       // acepta la URL completa https://…/t/<uuid> o el UUID plano
            var now = Date.now();
            if (!m) { if (raw !== _scan.last || now - _scan.lastAt > 3000) { _scan.last = raw; _scan.lastAt = now; _scan.busy = true; showResult(false, 'QR no reconocido', ['No es un ticket de Miami DJ Beat.']); } return; }
            var id = m[0].toLowerCase();
            if (id === _scan.last && now - _scan.lastAt < 4000) return;    // la cámara lee el mismo QR muchas veces: una sola vez
            _scan.last = id; _scan.lastAt = now;
            var eventId = document.getElementById('scan-event').value;
            if (!eventId) { _scan.busy = true; showResult(false, 'Elige el evento', ['Selecciona el evento de esta puerta arriba.']); return; }
            _scan.busy = true;
            var res = null, err = null;
            try { var r = await _sbRef.rpc('venue_ticket_scan', { p_order_id: id, p_event_id: eventId, p_qty: 1 }); res = r.data; err = r.error; } catch (e) { err = e; }
            if (err || !res) {
                var em = String((err && err.message) || '');
                var txt = em.indexOf('not_allowed') >= 0 ? 'Tu cuenta no tiene permiso para validar en este local.'
                    : (/venue_ticket_scan/.test(em) && /exist|find/i.test(em) ? 'Falta aplicar el SQL de escaneo (20261007_venue_ticket_scan_and_logs.sql).' : 'No se pudo validar. Intenta de nuevo.');
                showResult(false, 'Sin validar', [txt]); return;
            }
            var guest = _guests.filter(function (g) { return g.id === id; })[0];
            if (res.ok) {
                if (guest) { guest.checked_in_qty = res.checked_in_qty; if (currentFilter === 'entradas') renderGuests(); }
                var nombre = res.reservation_name || (guest && guest.customer_name) || '';
                var arts = Array.isArray(res.items) ? res.items.map(function (it) { return (Number(it.qty) > 1 ? it.qty + '× ' : '') + String(it.label || ''); }).join(' · ') : '';
                showResult(true, 'Ingreso registrado', [nombre, 'Ingresaron: ' + res.checked_in_qty + ' de ' + res.total_qty, arts]);
            } else {
                var det = res.total_qty != null ? 'Ingresaron: ' + res.checked_in_qty + ' de ' + res.total_qty : '';
                showResult(false, SCAN_REASON[res.code] || 'Rechazado', [(res.reservation_name || (guest && guest.customer_name) || ''), det]);
            }
        }

        async function scanTick() {
            var v = document.getElementById('scan-video');
            if (_scan.busy || !_scan.det || v.readyState < 2) return;
            try { var found = await _scan.det.detect(v); if (found && found.length) scanHandle(found[0].rawValue); } catch (e) { }
        }

        async function scanStartCamera() {
            var v = document.getElementById('scan-video');
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { scanMsg('Este navegador no permite usar la cámara. Usa el campo de abajo para pegar el código, o la lista por nombre.'); return; }
            if (!('BarcodeDetector' in window)) { scanMsg('Este navegador no lee códigos QR con la cámara (falta BarcodeDetector). Usa Chrome en Android, o pega el código abajo, o la lista por nombre.'); return; }
            try {
                var formats = await window.BarcodeDetector.getSupportedFormats();
                if (formats && formats.indexOf('qr_code') === -1) { scanMsg('Este dispositivo no lee códigos QR. Pega el código abajo o usa la lista por nombre.'); return; }
                _scan.det = new window.BarcodeDetector({ formats: ['qr_code'] });
                _scan.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
                v.srcObject = _scan.stream; await v.play();
                scanMsg('Apunta la cámara al QR del ticket.');
                clearInterval(_scan.timer); _scan.timer = setInterval(scanTick, 250);
            } catch (e) {
                var n = e && e.name;
                scanMsg(n === 'NotAllowedError' ? 'Permiso de cámara denegado. Actívalo en los ajustes del navegador para este sitio, o pega el código abajo.'
                    : n === 'NotFoundError' ? 'No se encontró ninguna cámara en este dispositivo. Pega el código abajo.'
                    : 'No se pudo abrir la cámara. Pega el código abajo.');
            }
        }
        function scanStopCamera() {
            clearInterval(_scan.timer); _scan.timer = 0;
            if (_scan.stream) { _scan.stream.getTracks().forEach(function (t) { t.stop(); }); _scan.stream = null; }
            var v = document.getElementById('scan-video'); try { v.pause(); } catch (e) { } v.srcObject = null;
        }
        async function scanOpen() {
            if (!_sbRef) return;
            var modal = document.getElementById('scan-modal');
            modal.classList.add('open'); _scan.busy = false; _scan.last = ''; _scan.lastAt = 0;
            // el sonido solo se puede crear tras un toque del usuario: se prepara aquí
            try { var AC = window.AudioContext || window.webkitAudioContext; if (AC && !_scan.ctx) _scan.ctx = new AC(); if (_scan.ctx && _scan.ctx.state === 'suspended') _scan.ctx.resume(); } catch (e) { }
            scanMsg('Cargando eventos…');
            var hay = false; try { hay = await scanLoadEvents(_sbRef); } catch (e) { hay = false; }
            if (!hay) { scanMsg('No hay eventos hoy ni en los próximos 14 días: no se puede validar. La lista por nombre sigue disponible.'); return; }
            scanStartCamera();
        }
        function scanClose() { scanStopCamera(); hideResult(); document.getElementById('scan-modal').classList.remove('open'); }

        document.getElementById('scan-open').addEventListener('click', scanOpen);
        document.getElementById('scan-close').addEventListener('click', scanClose);
        document.getElementById('scan-result').addEventListener('click', hideResult);
        document.getElementById('scan-event').addEventListener('change', function (e) { try { sessionStorage.setItem('mdj_scan_event', e.target.value); } catch (x) { } });
        document.getElementById('scan-manual-go').addEventListener('click', function () {
            var i = document.getElementById('scan-manual-input'); var val = i.value; i.value = ''; _scan.last = ''; scanHandle(val);
        });
        document.getElementById('scan-manual-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('scan-manual-go').click(); });
        window.addEventListener('pagehide', scanStopCamera);

        document.addEventListener('DOMContentLoaded', async function () {
            var sb = typeof window.getSupabaseClient === 'function' ? window.getSupabaseClient() : null;
            var content = document.getElementById('content');
            if (!sb) { content.innerHTML = 'Supabase no configurado.'; return; }

            var sess = (await sb.auth.getSession()).data.session;
            if (!sess) {
                content.innerHTML = '<span class="glyph">🔒</span>Sesión requerida — abre esta vista desde staff.html.';
                return;
            }

            _sbRef = sb;
            document.getElementById('filter-label').textContent = FILTER_LABEL[currentFilter] || '';
            load(sb);
            // El padre manda el filtro justo después de cargar; si es Entradas no se marca merch como leído.
            // Abierta sola (sin padre) nunca llega ese mensaje: se marca tras una espera corta.
            setTimeout(function () {
                if (!_readMarked && currentFilter !== 'entradas') { _readMarked = true; markAllRead(sb); }
            }, 1200);
        });
    </script>
</body>

</html>
