    <script>
    /* FIX-LEGACY-SUPABASE-01 (2026-08-19) · el respaldo entra cuando falta la
       LIBRERIA, no cuando falta la sintaxis.
       Antes la puerta era una sonda de `?.` y `??`. Eso solo cubre el motor que no
       sabe parsear: si el bundle del CDN muere por CUALQUIER otra razon —una v2 mas
       nueva con sintaxis que el motor no soporta, red caida, TLS, bloqueo— la sonda
       pasa, el respaldo NO se inyecta y la pagina se queda sin cliente Supabase.
       Sin cliente no hay sesion, y el guard del perfil expulsa al login: ese era el
       rebote en Mac antiguas. Ahora se pregunta lo unico que importa, si la libreria
       esta aqui. En un navegador moderno no hace nada, porque ya esta.
       El CDN ademas se clava a 2.112.3, la misma version que la copia vendorizada:
       `@2` era flotante y podia cambiar bajo nuestros pies sin tocar el repo. */
    (function () {
        var mdjLibAusente = !(window.supabase &&
            typeof window.supabase.createClient === 'function');
        if (mdjLibAusente) {
            document.write('<script src="./vendor/supabase-js-2.112.3.legacy.js?v=20260818-safari-legacy"><\/script>');
        }
    })();
    </script>

    <script>
        const db = supabase.createClient(window.MDB_SUPABASE_URL, window.MDB_SUPABASE_ANON_KEY);

        function sanitizeSearchToken(s) {
            if (!s) return '';
            return String(s).replace(/[%_\\,]/g, '').trim().slice(0, 80);
        }

        function getUrlParams() {
            return new URLSearchParams(window.location.search);
        }


        function tierBadgeHtml(dj) {
            var sub = window.MDB_SUBSCRIPTION;
            var pro = sub && typeof sub.isPremiumTier === 'function' && sub.isPremiumTier(dj);
            if (pro) return '<span class="find-dj-tier find-dj-tier--pro find-dj-chip__tier">PRO</span>';
            var lite = (window.i18n && typeof window.i18n.t === 'function')
                ? window.i18n.t('find-dj-tier-lite')
                : 'LITE · backup pool';
            return '<span class="find-dj-tier find-dj-tier--lite find-dj-chip__tier">' + lite + '</span>';
        }

        /** CTA de rental según categoría / roles (DJ, banda, percusión…). */
        function rentalCtaLabel(dj, categoryFromUrl) {
            var pack = (
                String(categoryFromUrl || '') + ' ' +
                String(dj && dj.roles != null ? dj.roles : '') + ' ' +
                String(dj && dj.artist_specialty != null ? dj.artist_specialty : '')
            ).toLowerCase();
            if (/\borquesta\b|\bbanda\b|\bgrupo\b|\blive\s*band\b|\bensemble\b/i.test(pack)) return 'Rentar esta banda';
            if (/\bpercusion|percussion|timbal|timbalero|bongo|conga|batista\b/i.test(pack)) return 'Rentar percusión / timbal';
            if (/\bdj\b|\bdisc\s*jockey\b|\bdeejay\b/i.test(pack)) return 'Rentar este DJ';
            if (/\bvocal|cantante|singer\b/i.test(pack)) return 'Rentar vocal / artista';
            return 'Rentar este talento';
        }

        async function searchDJs() {
            const grid = document.getElementById('dj-grid');
            const msg = document.getElementById('state-msg');
            msg.innerHTML = 'Searching...';
            grid.innerHTML = '';

            const cityEl = document.getElementById('f-city');
            const city = cityEl ? cityEl.value : '';
            const params = getUrlParams();
            const nameQ = sanitizeSearchToken(params.get('q') || '');
            const specialtyQ = sanitizeSearchToken(params.get('specialty') || '');
            const intent = params.get('intent');
            const categoryFromUrl = params.get('category') || params.get('role') || specialtyQ;

            var selectFull = 'user_id, dj_slug, stage_name, full_name, mdjb_id, photo_url, bio_short, city, roles, artist_specialty, plan, plan_type, plan_status, plan_expires_at, is_premium, subscription_status';
            var selectMid  = 'user_id, dj_slug, stage_name, full_name, photo_url, bio_short, city, roles, artist_specialty, plan';
            var selectMin  = 'user_id, dj_slug, stage_name, photo_url, bio_short, city, roles, artist_specialty, plan';

            function buildNameFilter(q, mode) {
                // mode: 'full' = stage+full_name+mdjb_id | 'mid' = stage+full_name | 'min' = stage only
                if (mode === 'full') {
                    q = q.or('stage_name.ilike.%' + nameQ + '%,full_name.ilike.%' + nameQ + '%,mdjb_id.ilike.%' + nameQ + '%');
                } else if (mode === 'mid') {
                    q = q.or('stage_name.ilike.%' + nameQ + '%,full_name.ilike.%' + nameQ + '%');
                } else {
                    q = q.ilike('stage_name', '%' + nameQ + '%');
                }
                return q;
            }

            function buildQuery(sel, nameMode) {
                var q = db.from('public_dj_profiles').select(sel).eq('available', true);
                if (city) q = q.ilike('city', '%' + city + '%');
                if (nameQ) {
                    q = buildNameFilter(q, nameMode || 'min');
                } else if (specialtyQ) {
                    var spTokens = specialtyQ.split(/\s+/).filter(Boolean);
                    var spClauses = [];
                    spTokens.forEach(function (tok) {
                        spClauses.push('artist_specialty.ilike.%' + tok + '%');
                        spClauses.push('roles.ilike.%' + tok + '%');
                    });
                    q = q.or(spClauses.join(','));
                } else {
                    // Directory mode: only DJ-type artists
                    q = q.or('artist_specialty.ilike.%dj%,roles.ilike.%dj%');
                }
                return q.limit(120);
            }

            // Cascade: full (stage+full_name+mdjb_id) → mid (stage+full_name) → min (stage only)
            var res = await buildQuery(selectFull, 'full');
            if (res.error) res = await buildQuery(selectMid, 'mid');
            if (res.error) res = await buildQuery(selectMin, 'min');

            const { data: raw, error } = res;

            if (error) {
                msg.innerHTML = 'Error: ' + error.message;
                return;
            }

            var data = raw || [];
            if (window.MDB_SUBSCRIPTION && typeof window.MDB_SUBSCRIPTION.searchRankScore === 'function') {
                data = data.slice().sort(function (a, b) {
                    return window.MDB_SUBSCRIPTION.searchRankScore(b) - window.MDB_SUBSCRIPTION.searchRankScore(a);
                });
            }

            let line = 'Found ' + data.length + ' talents.';
            if (nameQ) line += ' (name/slug: “' + nameQ + '”)';
            if (intent === 'availability') line += ' — refine date & filters for availability.';
            msg.innerHTML = line;
            grid.innerHTML = data.map(function (dj) {
                var esc = function (s) {
                    return String(s == null ? '' : s)
                        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                };
                var name = esc(dj.stage_name || dj.dj_slug || 'Artist');
                var img = esc(dj.photo_url || '');
                var uid = dj.user_id != null ? String(dj.user_id).trim() : '';
                var profHref = uid
                    ? './profile.html?id=' + encodeURIComponent(uid) + '&ref=' + encodeURIComponent(uid)
                    : '#';
                var rentQ = 'utm_source=find-dj&intent=rent&dj=' + encodeURIComponent(uid || String(dj.dj_slug || '').trim());
                var rentHref = './rentals.html?' + rentQ;
                var rentLabel = esc(rentalCtaLabel(dj, categoryFromUrl));
                var imgSrc = img || './assets/dj-avatar-placeholder.png';
                var rawSpecialty = String(dj.artist_specialty || dj.roles || '').split(',')[0].trim();
                var specialtyTag = rawSpecialty ? esc(rawSpecialty.slice(0, 18)) : '';
                var cityStr = dj.city ? '📍 ' + esc(dj.city) : '';
                var bioStr = dj.bio_short ? esc(String(dj.bio_short).slice(0, 110)) : '';
                var disabledAttrs = uid ? '' : ' onclick="return false" style="opacity:0.5;pointer-events:none"';
                return (
                    '<article class="find-dj-chip">' +
                    '<a class="find-dj-chip__link" href="' + profHref + '"' + disabledAttrs + '>' +
                    '<div class="find-dj-chip__photo-wrap">' +
                    '<img class="find-dj-chip__photo" src="' + imgSrc + '" alt="' + name + '" loading="lazy" />' +
                    (specialtyTag ? '<span class="find-dj-chip__specialty-tag">' + specialtyTag + '</span>' : '') +
                    '</div>' +
                    '<div class="find-dj-chip__body">' +
                    '<div class="find-dj-chip__name-row">' +
                    '<span class="find-dj-chip__name">' + name + '</span>' +
                    tierBadgeHtml(dj) +
                    '</div>' +
                    (cityStr ? '<span class="find-dj-chip__city">' + cityStr + '</span>' : '') +
                    (bioStr ? '<p class="find-dj-chip__bio">' + bioStr + '</p>' : '') +
                    '</div>' +
                    '</a>' +
                    '<a class="find-dj-chip__rent" href="' + (uid ? rentHref : '#') + '"' + (uid ? '' : ' onclick="return false"') + '>' + rentLabel + '</a>' +
                    '</article>'
                );
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', function () {
            searchDJs();
        });
    </script>
