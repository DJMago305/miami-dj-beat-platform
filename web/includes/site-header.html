<!-- MDJ cabecera unificada (2 filas) — sincronizar con web/index.html #mainHeader; #mainNav = menú de piedra (slots fijos). En <head>: ./header-unified.css tras styles.css -->
<header class="header mdj-header-unified" id="mainHeader">
  <div class="header-top">
    <div class="container">
      <div class="brand">
        <img src="./assets/branding/logo-transparent.png" alt="Miami DJ Beat Logo" class="logo-img-eagle">
        <div class="brand-letters-wrapper">
          <img src="./assets/branding/logo-transparent Letras.png" alt="Miami DJ Beat Letras" class="brand-letters-img">
        </div>
      </div>

      <div class="header-actions">
        <a href="./login.html?plan=pro" class="btn-pill gold" id="header-get-pro-btn" data-i18n="btn-get-pro">Obtener PRO</a>
        <a href="./login.html?signup=free" class="btn-pill" id="header-subscribe-free-btn" data-i18n="btn-subscribe-free">Suscripción gratis</a>
        <span id="header-djpro-badge" class="header-djpro-badge" style="display: none;" aria-label="DJPRO">DJPRO</span>
        <div class="lang-switcher">
          <span class="lang-btn" data-lang="es">ES</span>
          <span class="lang-pipe">|</span>
          <span class="lang-btn active" data-lang="en">EN</span>
        </div>
        <a href="./login.html" id="header-login-btn" class="btn-pill gold" data-i18n="btn-login">Entrar</a>

        <div class="header-avatar-cart-row" aria-label="Cuenta y carrito">
          <div class="account session-pending" id="header-auth-zone">
            <a class="account-btn" id="accountBtn" href="./dj-profile.html" title="Mi perfil" aria-label="Mi perfil">
              <img class="avatar" src="./assets/dj-avatar-placeholder.png" alt="" />
            </a>
          </div>

          <a href="./shop.html" id="header-cart-link" class="header-cart-btn" title="Carrito" aria-label="Carrito de compras">
            <span aria-hidden="true">🛒</span>
            <span id="header-cart-count" class="header-cart-count" hidden></span>
          </a>
        </div>
        <div class="header-search-wrap">
          <input type="search" id="header-smart-search" class="header-smart-search"
            placeholder="Buscar DJs, equipo, servicios…" autocomplete="off" enterkeyhint="search" />
        </div>
      </div>

      <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="Menú">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="mobile-overlay" id="mobileMenu">
        <nav class="mobile-nav">
          <div class="mdj-mobile-lang" role="group" aria-labelledby="mdj-mobile-lang-heading">
            <div id="mdj-mobile-lang-heading" class="mdj-mobile-lang-label" data-i18n="header-lang-label">Language · Idioma</div>
            <div class="lang-switcher">
              <span class="lang-btn" data-lang="es">ES</span>
              <span class="lang-pipe">|</span>
              <span class="lang-btn active" data-lang="en">EN</span>
            </div>
          </div>
          <a href="./index.html" data-i18n="nav-home" data-mdj-nav="home">Inicio</a>
          <a href="./rentals.html" data-i18n="nav-services" data-mdj-nav="services">Servicios</a>
          <a href="./index.html#experience" data-i18n="nav-rentals" data-mdj-nav="venues">Eventos</a>
          <a href="./shop.html" style="color:#c5a059;font-weight:800;" data-i18n="nav-shop" data-mdj-nav="shop">Shop</a>
          <a href="./dj-tools.html" data-i18n="nav-tools" data-mdj-nav="tools">DJ Tools</a>
          <a href="./jobs.html" data-i18n="nav-jobs" data-mdj-nav="jobs">Trabajos</a>
          <a href="./index.html#contact" data-i18n="nav-contact" data-mdj-nav="contact">Contacto</a>
          <a href="./login.html?signup=free" id="header-subscribe-free-mobile" data-i18n="btn-subscribe-free"
            style="color:rgba(255,255,255,0.88); font-weight:800;">Suscripción gratis</a>
          <a href="./login.html" id="header-login-btn-mobile" data-i18n="btn-login"
            style="color:var(--gold); font-weight:800;">Entrar</a>
          <a href="./dj-profile.html" id="nav-my-profile-mobile"
            style="display:none; color:var(--gold); font-weight:900;" data-i18n="menu-account">MI PERFIL</a>
        </nav>
      </div>
    </div>
  </div>

  <!-- FILA 2: … MI PORTAL; 1 sola pestaña STAFF|MI PERFIL; Config (ruta por rol) — mdj-shared-header.js -->
