<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Profile — Miami DJ Beat</title>
  <meta name="description" content="Manage your personal account information." />
  <link rel="stylesheet" href="./styles.css?v=20260226-1" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js?v=20260226-1"></script>
  <style>
    /* Heredar la lógica VIP que inyectamos en el Index para la UI de Cabecera */

    .lang-switcher {
      display: inline-flex !important;
      align-items: center !important;
      gap: 4px !important;
      padding: 3px !important;
      border-radius: 999px !important;
      background: rgba(255, 255, 255, 0.06) !important;
      user-select: none !important;
      -webkit-user-select: none !important;
    }

    .lang-pipe {
      display: none !important;
    }

    .lang-btn {
      padding: 4px 10px !important;
      border-radius: 999px !important;
      opacity: 0.65 !important;
      transition: all 0.22s ease !important;
    }

    .lang-btn.active {
      background: rgba(212, 175, 55, 0.22) !important;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.22) !important;
      opacity: 1 !important;
      color: #fff !important;
    }

    .lang-btn:hover {
      opacity: 0.9 !important;
    }

    /* Account Base */

    #accountMenu {
      background: rgba(28, 28, 30, 0.85) !important;
      backdrop-filter: blur(20px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      border-radius: 12px !important;
      padding: 6px !important;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05) inset !important;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
      min-width: 170px !important;

      /* Positioning & Animation */
      position: absolute !important;
      top: calc(100% + 12px) !important;
      right: 0 !important;
      opacity: 0 !important;
      visibility: hidden !important;
      transform: translateY(-8px) scale(0.95) !important;
      transform-origin: top right !important;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1) !important;
      z-index: 9999 !important;
      pointer-events: none !important;
    }

    #accountMenu.open {
      opacity: 1 !important;
      visibility: visible !important;
      transform: translateY(0) scale(1) !important;
      pointer-events: auto !important;
    }

    #accountMenu .menu-item {
      display: flex !important;
      align-items: center !important;
      gap: 12px !important;
      padding: 8px 12px !important;
      color: rgba(255, 255, 255, 0.85) !important;
      font-size: 13px !important;
      font-weight: 500 !important;
      letter-spacing: -0.1px !important;
      border-radius: 8px !important;
      transition: background 0.15s ease, color 0.15s ease !important;
      text-decoration: none !important;
      background: transparent !important;
    }

    #accountMenu .menu-item svg {
      opacity: 0.55 !important;
      transition: opacity 0.15s ease !important;
    }

    #accountMenu .menu-item:hover {
      background: rgba(255, 255, 255, 0.12) !important;
      color: #fff !important;
    }

    #accountMenu .menu-item:hover svg {
      opacity: 0.9 !important;
    }

  </style>
</head>

<body class="notranslate">
  <!-- CABECERA ESTÁNDAR GLOBAL (Replicada de index.html) -->
  <header class="header" id="mainHeader">
    <div class="header-top">
      <div class="container">

        <div class="brand">
          <a href="./index.html" style="display:flex; align-items:center; text-decoration:none;">
            <img src="./assets/branding/logo-transparent.png" alt="Miami DJ Beat Logo" class="logo-img-eagle">
            <div class="brand-letters-wrapper">
              <img src="./assets/branding/logo-transparent Letras.png" alt="Miami DJ Beat Letters"
                class="brand-letters-img">
            </div>
          </a>
        </div>

        <div class="header-actions">
          <div class="lang-switcher" translate="no">
            <span class="lang-btn active" data-lang="es">ES</span>
            <span class="lang-pipe">|</span>
            <span class="lang-btn" data-lang="en">EN</span>
          </div>

          <a href="login.html" class="btn-pill gold" id="header-get-pro-btn" data-i18n="btn-get-pro">Obtener PRO</a>
          
          <a href="./index.html" class="btn-pill" data-i18n="nav-home">Home</a>

          <div class="account" id="header-auth-zone" style="visibility: hidden; opacity: 0; pointer-events: none;">
            <button class="account-btn" id="accountBtn"
              onclick="document.getElementById('accountMenu').classList.toggle('open'); event.stopPropagation();">
              <img class="avatar" src="./assets/dj-avatar-placeholder.png" alt="Avatar" id="navAvatarImg" />
              <span class="caret">▾</span>
            </button>
            <button id="header-logout-btn-visible" class="btn-pill danger" onclick="window.doLogout(event)" style="border: 1px solid #ff4d4d; color: #ff4d4d; background: transparent; cursor: pointer; padding: 6px 14px; border-radius: 20px; font-weight: 600; font-size: 12px; margin-left: 10px;">Logout</button>

            <div class="account-menu" id="accountMenu" aria-hidden="true">
              <a href="./account-profile.html" class="menu-item">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                My Profile
              </a>
              <a href="./account-settings.html" class="menu-item">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3"></circle>
                  <path
                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                  </path>
                </svg>
                Settings
              </a>
            </div>
          </div>
        </div>

        <button class="mobile-menu-btn" id="mobileMenuBtn">
          <span></span><span></span><span></span>
        </button>

        <div class="mobile-overlay" id="mobileMenu">
          <nav class="mobile-nav">
            <a href="./index.html">Home</a>
            <a href="./rentals.html">Event Services</a>
            <a href="./shop.html">Shop</a>
            <a href="./dj-tools.html">Tools</a>
            <a href="./account-profile.html" id="nav-my-profile-mobile" style="display:none;">MY PROFILE</a>
          </nav>
        </div>
      </div>
    </div>
  </header>

  <main class="account-layout">

    <!-- SECCIÓN EYEBROW MINIMALISTA (Reemplazo del Hero Gigante) -->
    <div class="account-eyebrow-wrap">
      <div class="account-eyebrow-pill">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span data-i18n="account-profile-title">My Profile</span>
      </div>
    </div>

    <!-- MAIN IDENTITY CARD (System UI) -->
    <div class="system-card">

      <div class="system-card-header">
        <div class="system-avatar" id="profile-avatar-container">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <div class="system-meta">
          <h2 id="ui-fname"><span class="empty-state">Not provided</span></h2>
          <p class="username" id="ui-username"></p>
        </div>
      </div>

      <div class="data-list">

        <div class="data-row">
          <div class="data-label">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            Account Type
          </div>
          <div class="data-value">
            <span class="data-badge">Customer</span>
          </div>
        </div>

        <div class="data-row">
          <div class="data-label">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            Email
          </div>
          <div class="data-value" id="ui-email"><span class="empty-state">Not provided</span></div>
        </div>

        <div class="data-row">
          <div class="data-label">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
              </path>
            </svg>
            Phone
          </div>
          <div class="data-value" id="ui-phone"><span class="empty-state">Not provided</span></div>
        </div>

        <div class="data-row">
          <div class="data-label">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            Member Since
          </div>
          <div class="data-value" id="ui-date"><span class="empty-state">Not provided</span></div>
        </div>

        <div class="data-row">
          <div class="data-label">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            Address
          </div>
          <div class="data-value" id="ui-address" style="line-height: 1.5;"><span class="empty-state">Not provided</span></div>
        </div>



      </div>

      <div class="system-actions">
        <a href="./account-settings.html" class="sys-btn secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          Edit in Settings
        </a>
      </div>

    </div>

  </main>

  <!-- AUTH LOGIC & COMPATIBILITY -->
  <script src="./auth.js?v=20260226-1"></script>
  <script src="./translations.js?v=20260226-1"></script>
  <script src="./i18n.js?v=20260226-1"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Mobile Menu Toggle
      const mobileBtn = document.getElementById('mobileMenuBtn');
      const mobileMenu = document.getElementById('mobileMenu');
      if (mobileBtn && mobileMenu) {
        mobileBtn.addEventListener('click', () => {
          mobileBtn.classList.toggle('active');
          mobileMenu.classList.toggle('active');
        });
      }

      // Close dropdown when clicking outside or inside a link
      document.addEventListener('click', (e) => {
        const m = document.getElementById('accountMenu');
        const b = document.getElementById('accountBtn');
        if (m && m.classList.contains('open')) {
          if ((m.contains(e.target) && e.target.closest('a')) || (b && !b.contains(e.target) && !m.contains(e.target))) {
            m.classList.remove('open');
          }
        }
      });

      // Init i18n
      if (typeof initI18n === 'function') initI18n();

      // Mute header auth synchronization internally
      if (typeof updateHeaderAuth === 'function') updateHeaderAuth();

      // Simulate/Fetch Data hook point
      try {
        const db = window.getSupabaseClient();
        const { data: { session }, error: sessionErr } = await db.auth.getSession();
        if (session && session.user) {
          // 🚨 CRITICAL FIX: Hacer Fetch directo del SERVER (getUser) en vez de caché para no perder la foto subida
          let liveUser = null;
          try {
             const { data: { user } } = await db.auth.getUser();
             liveUser = user;
          } catch(e) {
             console.warn('[PROFILE] Error fetching live user, falling back to session:', e);
          }
          const meta = liveUser?.user_metadata || session.user.user_metadata || {};

          // Data Binding Condicional: Si existe valor en Supabase, sobrescribe el span 'Not provided'.
          if (meta.full_name) document.getElementById('ui-fname').textContent = meta.full_name;
          if (meta.username) document.getElementById('ui-username').textContent = '@' + meta.username;

          document.getElementById('ui-email').textContent = session.user.email;

          if (meta.phone) document.getElementById('ui-phone').textContent = meta.phone;
          
          // Formateo de dirección unificada estilo Apple
          const addrParts = [];
          if (meta.address_street) addrParts.push(meta.address_street);
          if (meta.address_apt) addrParts.push(meta.address_apt);
          
          const regionalParts = [];
          if (meta.address_city) regionalParts.push(meta.address_city);
          if (meta.address_state) regionalParts.push(meta.address_state);
          if (meta.address_zip) regionalParts.push(meta.address_zip);
          if (regionalParts.length > 0) addrParts.push(regionalParts.join(' ')); // e.g. "Miami FL 33132"
          
          if (meta.address_country) addrParts.push(meta.address_country);

          if (addrParts.length > 0) {
            document.getElementById('ui-address').textContent = addrParts.join(', ');
          }

          if (meta.avatar_url) {
            const avContainer = document.getElementById('profile-avatar-container');
            if (avContainer) {
              avContainer.innerHTML = `<img src="${meta.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`;
              avContainer.style.border = 'none';
            }
          }

          const createdDate = new Date(session.user.created_at);
          document.getElementById('ui-date').textContent = createdDate.toLocaleDateString();

        } else {
          // No hay sesión: redirigir
          window.location.href = './login.html';
        }
      } catch (err) {
        console.warn('Silent auth check on profile load', err);
      }
    });

    // Handle logout visual hook
    window.doLogout = async function (e) {
      if (e) e.preventDefault();
      try {
        await supabase.auth.signOut();
        window.location.href = './index.html';
      } catch (err) {
        console.error(err);
      }
    }
  </script>
</body>

</html>
