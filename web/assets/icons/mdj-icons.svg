<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    MIAMI DJ BEAT LLC · Biblioteca de iconos de trazo (Paso 1 · perfiles de artista)
    ───────────────────────────────────────────────────────────────────────────────
    Convención COPIADA del precedente vivo de la plataforma (352 usos en web/*.html),
    no inventada: viewBox 0 0 24 24 · fill none · stroke currentColor · width 2.5 ·
    linecap y linejoin round.

    El color NO se declara aquí: cada símbolo hereda `currentColor`, así que el
    estado (dorado activo / plata inactivo) se decide desde CSS con `color`.

    Uso:  <svg class="mdj-ico"><use href="./assets/icons/mdj-icons.svg#ico-agenda"/></svg>
  -->
  <defs>
    <g id="mdj-trazo-base" fill="none" stroke="currentColor" stroke-width="2.5"
       stroke-linecap="round" stroke-linejoin="round"></g>
  </defs>

  <!-- 🎧 Cabina / sesiones -->
  <symbol id="ico-cabina" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 17v-5a9 9 0 0 1 18 0v5"/>
    <path d="M21 18a2 2 0 0 1-2 2h-1a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h3z"/>
    <path d="M3 18a2 2 0 0 0 2 2h1a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1H3z"/>
  </symbol>

  <!-- 🎚️ Mezcla / herramientas -->
  <symbol id="ico-mezcla" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21v-6M5 11V3M12 21v-9M12 8V3M19 21v-4M19 13V3"/>
    <path d="M2.5 15h5M9.5 12h5M16.5 17h5"/>
  </symbol>

  <!-- 📈 Rendimiento / analítica -->
  <symbol id="ico-rendimiento" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 3v16a2 2 0 0 0 2 2h16"/>
    <path d="M7 14.5l3.5-3.5 3 3L20 7"/>
    <path d="M15.5 7H20v4.5"/>
  </symbol>

  <!-- 📅 Agenda -->
  <symbol id="ico-agenda" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="16" rx="2"/>
    <path d="M8 3v4M16 3v4M3 11h18"/>
  </symbol>

  <!-- 👤 Mi perfil -->
  <symbol id="ico-perfil" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
    <circle cx="12" cy="7" r="4"/>
  </symbol>

  <!-- ⛭ Config -->
  <symbol id="ico-config" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Engranaje real, con dientes. Un círculo con rayos rectos se lee como SOL,
         y el sol ya tiene significado propio en la plataforma: el conmutador
         día/noche de la tira staff. No pueden compartir símbolo. -->
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </symbol>

  <!-- 🛡️ Staff / permisos -->
  <symbol id="ico-staff" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21.5s7.5-3.75 7.5-9.5V5.25L12 2.5 4.5 5.25V12c0 5.75 7.5 9.5 7.5 9.5z"/>
    <path d="M9.25 12l2 2 3.5-3.75"/>
  </symbol>
</svg>
