<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Artist onboarding (local QA) — Miami DJ Beat</title>
  <link rel="stylesheet" href="./styles.css?v=20260820-tuerca" />
  <style>
    body { background: #080c14; color: #e4eaf5; font-family: system-ui, sans-serif; padding: 24px; max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.1rem; letter-spacing: 0.08em; text-transform: uppercase; color: #c5a059; }
    label { display: block; margin-top: 14px; font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.75); }
    input, textarea, select { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(197,160,89,0.35); background: rgba(15,22,35,0.9); color: #e4eaf5; }
    textarea { min-height: 100px; resize: vertical; }
    .actions { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; }
    .btn { padding: 10px 16px; border-radius: 999px; border: 1px solid rgba(197,160,89,0.5); background: rgba(197,160,89,0.15); color: #f0e6c8; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; font-size: 12px; }
    .btn-primary { background: linear-gradient(145deg, rgba(197,160,89,0.35), rgba(197,160,89,0.08)); }
    #ao-status { margin-top: 16px; font-size: 13px; line-height: 1.45; }
    .hint { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 8px; }
  </style>
</head>
<body>
  <p><a href="./index.html" class="btn">← Site</a> <a href="./rentals.html" class="btn">Rentals (carousel QA)</a></p>
  <h1>Artist profile (local QA)</h1>
  <p class="hint">Session required (artist). Billing truth for Pro/Elite remains Stripe/checkout — use “Plan” below as intent + link to Jobs.</p>

  <form id="ao-form" novalidate>
    <label for="ao-bio">Bio</label>
    <textarea id="ao-bio" placeholder="Public bio (ES/EN as you prefer)"></textarea>

    <label for="ao-bio-short">Short bio (listings)</label>
    <input id="ao-bio-short" type="text" maxlength="280" placeholder="One or two lines for find-dj / hub" />

    <label for="ao-specialty">Specialty (stored as roles + artist_specialty)</label>
    <input id="ao-specialty" type="text" placeholder="e.g. Latin · Weddings · Open format" />

    <label for="ao-hourly">Hourly rate (USD)</label>
    <input id="ao-hourly" type="number" min="0" step="1" placeholder="e.g. 250" />

    <label for="ao-tier">Subscription intent (local)</label>
    <select id="ao-tier">
      <option value="lite">LITE (included)</option>
      <option value="pro">PRO (checkout)</option>
      <option value="elite">ELITE (checkout)</option>
    </select>

    <div class="actions">
      <button type="submit" class="btn btn-primary">Save to dj_profiles</button>
      <a class="btn" id="ao-register" href="./login.html?signup=free&redirect=dj-dashboard">New artist signup</a>
      <a class="btn" id="ao-plans" href="./jobs.html#selection-screen">Open plans (Pro/Elite)</a>
    </div>
  </form>
  <div id="ao-status" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
  <script>
    /* FIX-LEGACY-SUPABASE-01 (2026-08-19) · el respaldo entra cuando falta la
       LIBRERIA, no cuando falta la sintaxis.
       Antes la puerta era una sonda de `?.` y `??`. Eso solo cubre el motor que no
       sabe parsear: si el bundle del CDN muere por CUALQUIER otra razon —una v2 mas
       nueva con sintaxis que el motor no soporta, red caida, TLS, bloqueo— la sonda
       pasa, el respaldo NO se inyecta y la pagina se queda sin cliente Supabase.
       Sin cliente no hay sesion, y el guard del perfil expulsa al login: ese era el
       rebote en Mac antiguas. Ahora se pregunta lo unico que importa, si la libreria
       esta aqui. En un navegador moderno no hace nada, porque ya esta.
       El CDN ademas se clava a 2.112.3, la misma version que la copia vendorizada:
       `@2` era flotante y podia cambiar bajo nuestros pies sin tocar el repo. */
  (function () {
      var mdjLibAusente = !(window.supabase &&
          typeof window.supabase.createClient === 'function');
      if (mdjLibAusente) {
          document.write('<script src="./vendor/supabase-js-2.112.3.legacy.js?v=20260818-safari-legacy"><\/script>');
      }
  })();
  </script>
  <script src="./supabase-config.js?v=20260422-supabase-kxvqdr-host"></script>
  <script src="./subscription.js"></script>
  <script src="./js/artists.js?v=20260418-onboarding"></script>
  <script>
    (function () {
      var form = document.getElementById('ao-form');
      var st = document.getElementById('ao-status');
      function setStatus(msg, ok) {
        st.textContent = msg;
        st.style.color = ok ? 'rgba(180,230,200,0.95)' : 'rgba(255,180,160,0.95)';
      }
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var sb = typeof getSupabaseClient === 'function' ? getSupabaseClient() : null;
        if (!sb) {
          setStatus('No Supabase client.', false);
          return;
        }
        if (!window.MDJ_ARTISTS || typeof window.MDJ_ARTISTS.saveArtistOnboardingProfile !== 'function') {
          setStatus('MDJ_ARTISTS not loaded.', false);
          return;
        }
        var tier = (document.getElementById('ao-tier') || {}).value || 'lite';
        var hourly = document.getElementById('ao-hourly').value;
        window.MDJ_ARTISTS.saveArtistOnboardingProfile(sb, {
          bio: document.getElementById('ao-bio').value,
          bio_short: document.getElementById('ao-bio-short').value,
          specialty: document.getElementById('ao-specialty').value,
          hourly_rate_usd: hourly,
          subscription_tier: tier
        }).then(function (r) {
          if (r.ok) setStatus('Saved. ' + (r.partial ? '(Partial: apply migration hourly/specialty in Supabase for full columns.)' : ''), true);
          else setStatus('Error: ' + (r.error && r.error.message ? r.error.message : JSON.stringify(r.error || r)), false);
        }).catch(function (err) {
          setStatus(String(err && err.message ? err.message : err), false);
        });
      });
    })();
  </script>
</body>
</html>
