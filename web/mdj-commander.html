       nueva con sintaxis que el motor no soporta, red caida, TLS, bloqueo— la sonda
       pasa, el respaldo NO se inyecta y la pagina se queda sin cliente Supabase.

       rebote en Mac antiguas. Ahora se pregunta lo unico que importa, si la libreria

       El CDN ademas se clava a 2.112.3, la misma version que la copia vendorizada:
       `@2` era flotante y podia cambiar bajo nuestros pies sin tocar el repo. */

        typeof window.supabase.createClient === 'function');
    if (mdjLibAusente) {
        document.write('<script src="./vendor/supabase-js-2.112.3.legacy.js?v=20260818-safari-legacy"><\/script>');

})();
</script>

  /* El PO pidio sacar la foto fija (mano levantada, "se queda tiesa" en

     El problema real era que el <video loop> nativo REINICIA de golpe al

<style>
  /* ═══════════ MDJ COMMANDER · mobile executive · dark premium ═══════════ */
  :root{
    --bg:#050505; --surface:#0b0d10; --elev:#12151a; --elev2:#171b22; --elev3:#1e222b;
    --line:#23262d; --line2:#2e323b;
    --gold:#d4af37; --gold2:#f4c95d; --gold-dim:rgba(212,175,55,.14); --gold-glow:rgba(212,175,55,.32);
    --text:#ffffff; --muted:#9ea4ad; --faint:#6a7079;
    --cyan:#3fb9e6; --green:#3ecf8e; --magenta:#c77bff; --amber:#e8b23a; --red:#f0616a;
    --shell:430px; --nav-h:64px; --top-h:52px;
    /* El orbe sobresale de la barra y la pastilla de escribir tiene que
       librarlo. Ambas medidas cuelgan de aqui para que no se vuelvan a
       cruzar si una cambia. */
    --orbe-d:64px; --orbe-alza:22px; --orbe-aire:12px;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
    /* Cristal: todo lo translucido (burbujas, compositor) sale de aqui.
       Antes estaba escrito a mano en grafito y por eso no podia haber
       modo claro: un fondo oscuro fijo sobre papel blanco es ilegible. */
    --vidrio:rgba(20,24,30,.18);
    --vidrio-borde:rgba(255,255,255,.20);
    --vidrio-foco:rgba(24,29,36,.26);
    --sombra-texto:0 1px 3px rgba(0,0,0,.85), 0 0 12px rgba(0,0,0,.6);
    --hilos:212,175,55;          /* la red, en RGB crudo para el canvas */
    --sans:-apple-system,system-ui,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  /* ═══ MODO DIA ═══════════════════════════════════════════════════
     El oro se OSCURECE a bronce: el oro claro sobre papel blanco no tiene
     contraste y se lee gris. Es el mismo oro de la marca, bajado de brillo
     para que siga mandando sin cegar. */
  :root[data-tema="claro"]{
    --bg:#eef0f4; --surface:#ffffff; --elev:#ffffff; --elev2:#f2f4f7; --elev3:#e8ebf0;
    --line:#dfe3ea; --line2:#c9cfda;
    --gold:#8a6d14; --gold2:#a8871f; --gold-dim:rgba(138,109,20,.13); --gold-glow:rgba(138,109,20,.26);
    --text:#0e1116; --muted:#535b69; --faint:#858d9b;
    --cyan:#1d7fa8; --green:#1f8f5f; --magenta:#8b4fc4; --amber:#a1741a; --red:#c23c48;
    --vidrio:rgba(255,255,255,.52);
    --vidrio-borde:rgba(0,0,0,.16);
    --vidrio-foco:rgba(255,255,255,.72);
    --sombra-texto:none;
    --hilos:138,109,20;
  }
  :root[data-tema="claro"] body{background:var(--bg)}

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* overscroll-behavior-x (2026-08-27, "el trackpad dispara Back/Forward
     del navegador"): en Mac/Safari (y Chrome) un swipe horizontal de dos
     dedos puede disparar la navegacion nativa de historial aunque la pagina
     no tenga scroll propio -- esto es la primera barrera (CSS); la segunda
     es el manejo de "wheel" + preventDefault() dentro de
     elixis-swipe-carousel.js. */
  html,body{margin:0;height:100%;overscroll-behavior-x:none}
  body{background:#000;color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
  button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none}
  img{display:block}
  ::-webkit-scrollbar{width:0;height:0}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* device frame on larger screens */
  .stage{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1000px 700px at 50% -10%,rgba(212,175,55,.06),transparent 60%),#000}
  .device{position:relative;width:100%;max-width:var(--shell);height:100%;background:var(--bg);overflow:hidden;
    display:flex;flex-direction:column}
  @media(min-width:480px){
    .device{height:min(920px,96dvh);border-radius:44px;border:1px solid #1c1f26;
      box-shadow:0 40px 120px rgba(0,0,0,.7),0 0 0 10px #0a0b0d,0 0 0 11px #202329}
    .app-scroll{border-radius:0}
  }

  /* faux status bar */

  /* top bar */
  .topbar{height:var(--top-h);flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);position:relative;z-index:5}
  .topbar .tb-title{font-size:16px;font-weight:700;letter-spacing:.01em;display:flex;flex-direction:column;line-height:1.1}
  .topbar .tb-title small{font-size:10.5px;font-weight:500;color:var(--muted);letter-spacing:.02em}
  .topbar .tb-spacer{flex:1}
  .icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;color:var(--muted);flex:none}
  .icon-btn:active{background:var(--elev)}
  .icon-btn svg{width:20px;height:20px}
  .tb-logo{width:30px;height:30px;flex:none}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .d-green{background:var(--green);box-shadow:0 0 8px var(--green)}
  .d-cyan{background:var(--cyan)}.d-amber{background:var(--amber)}.d-red{background:var(--red);box-shadow:0 0 8px var(--red)}.d-gold{background:var(--gold)}.d-magenta{background:var(--magenta)}.d-muted{background:var(--faint)}

  /* scroll area */
  .app-scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch}
  .pad{padding:18px 16px calc(20px + var(--sab))}
  .screen-anim{animation:scin .26s cubic-bezier(.2,.7,.3,1)}
  @keyframes scin{from{opacity:0;transform:translateX(14px)}}
  .fade-anim{animation:fade .24s ease}@keyframes fade{from{opacity:0}}

  /* bottom nav */
  .bottomnav{height:calc(var(--nav-h) + var(--sab));padding-bottom:var(--sab);flex:none;display:flex;border-top:1px solid var(--line);
    background:linear-gradient(180deg,var(--surface),var(--bg));position:relative;z-index:6}
  .navb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:10px;font-weight:600;letter-spacing:.02em;position:relative}
  .navb svg{width:22px;height:22px}
  .navb.on{color:var(--gold)}
  .navb.on::before{content:"";position:absolute;top:0;width:26px;height:2.5px;border-radius:0 0 3px 3px;background:var(--gold)}
  .navb .nb-badge{position:absolute;top:8px;right:calc(50% - 20px);min-width:15px;height:15px;border-radius:8px;background:var(--red);color:#fff;font-size:9px;display:grid;place-items:center;padding:0 3px;font-weight:700}
  .navb.center{flex:0 0 64px}
  .nav-orb{position:relative;width:var(--orbe-d);height:var(--orbe-d);margin-top:calc(var(--orbe-alza) * -1);border-radius:50%;
    background:linear-gradient(180deg,var(--gold2),var(--gold));display:grid;place-items:center;
    /* Sin el anillo de 5px que lo separaba de la barra: el PO lo queria sin
       tanto borde. Queda solo la sombra que lo despega del fondo. */
    box-shadow:0 6px 18px var(--gold-glow);
    transition:opacity .1s linear}
  /* Desconectado invita a hablar: dentro del circulo va el microfono. En
     sesion, el circulo pasa a ser la fuente de energia y muestra el fenix.
     El simbolo dice en que momento estas sin necesidad de leer nada. */
  .nav-orb img{width:56px;height:56px;display:none}
  .nav-orb .orb-mic{display:grid;place-items:center;color:#1a1405}
  .nav-orb .orb-mic svg{width:28px;height:28px}
  .nav-orb.live img{display:block}
  .nav-orb.live .orb-mic{display:none}

  /* Con el saludo, los chips y el microfono fuera, el avatar quedaba pegado
     arriba y con un hueco debajo. Ahora la pantalla de comando centra su
     contenido en el alto disponible. */
  .pad-centro{min-height:100%;display:flex;flex-direction:column;justify-content:center}

  /* ── MODO AGENTE: el branding como fuente de energia ──────────────
     En sesion viva el fenix deja de ser un boton y emite. Los anillos son
     un radar que sale del centro; el resplandor y su tamano NO son una
     animacion fija: los mueve la amplitud real de la voz (--pulso), de tu
     microfono mientras escuchas y de la pista de ELIXIS mientras habla. */
  /* ── MODO ESCRITURA · espacio de trabajo ──────────────────────────
     Arquitectura, no piezas sueltas: la red neuronal es el fondo, la
     conversacion es una columna que respira, y el compositor va ANCLADO al
     pie del dispositivo -- nunca flotando ni saliendose del marco.
     El anclaje es sticky dentro del area de scroll: asi el compositor se
     queda abajo mientras la conversacion corre por detras, que es como se
     comporta cualquier espacio de trabajo serio. */
  .pad-centro{position:relative}
  /* El area de scroll pasa a columna flexible cuando se escribe (lo pone
     render), y aqui el contenido la llena. Con min-height:100% no bastaba:
     el porcentaje no resolvia contra un contenedor de altura flexible y el
     compositor se quedaba pegado arriba, medido en el navegador. */
  .pad-centro.escritura{padding:0;flex:1;min-height:0;display:flex;flex-direction:column}
  .avatar-fig,.avatar-baseglow{transition:opacity .55s ease}

  .pad-centro.escritura #cmdBody{
    position:relative;z-index:1;flex:1;display:flex;flex-direction:column;min-height:0;
  }
  /* Restaura la red de fondo en modo escritura (2026-08-27, ver el comentario
     en el JS de esta pantalla) -- #cmdBody ya reservaba z-index:1 para vivir
     por encima de esto; solo faltaba el canvas. */
  .pad-centro.escritura #chatFX{z-index:0}

  /* la conversacion ocupa el alto y empuja al compositor al pie */
  .escritura .convo{
    flex:1;min-height:0;max-height:none;overflow-y:auto;
    padding:20px 18px 18px;margin:0;gap:14px;
  }
  /* En modo voz la transcripcion se esconde cuando no hay nada (.convo:empty).
     Aqui NO: si se colapsa, el compositor se sube al centro de la pantalla en
     vez de quedarse anclado al pie. Tiene que ocupar su sitio aunque este
     vacia. Medido en el navegador: era exactamente esto. */
  .escritura .convo:empty{display:flex}
  .escritura .convo-state{margin:14px 0 0;order:-1}

  /* ── Compositor FLOTANTE Y TRANSPARENTE ──────────────────────────
     El contenedor no pinta nada: ni fondo, ni linea, ni desenfoque. Lo que
     flota es el campo -- una pastilla translucida sobre la red neuronal, que
     se ve pasar por detras. La conversacion corre por DEBAJO y el desenfoque
     de la pastilla la mantiene legible sobre lo que sea. */
  .cmd-input{
    position:sticky;bottom:0;z-index:2;
    display:flex;gap:10px;align-items:flex-end;margin:0;
    padding:10px 14px calc(var(--orbe-alza) + var(--orbe-aire) + env(safe-area-inset-bottom,0px));
    background:none;border-top:0;
    -webkit-backdrop-filter:none;backdrop-filter:none;
    pointer-events:none;           /* el aire de los lados no atrapa toques */
  }
  .cmd-input > *{pointer-events:auto}
  .cmd-input textarea{
    flex:1;min-width:0;resize:none;overflow-y:auto;
    min-height:48px;max-height:9.5em;
    background:var(--vidrio);
    /* Desenfoque casi nulo A PROPOSITO: blur(22px) volvia papilla la red que
       pasa por detras. Con 2px se ve el fondo nitido y la lectura la sostiene
       la sombra del texto, igual que en las burbujas. */
    -webkit-backdrop-filter:blur(2px) saturate(150%);
    backdrop-filter:blur(2px) saturate(150%);
    text-shadow:var(--sombra-texto);
    border:1.6px solid var(--vidrio-borde);
    border-radius:24px;
    box-shadow:0 8px 24px rgba(0,0,0,.34);
    padding:13px 18px;color:var(--text);
    font-size:16px;line-height:1.45;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    -webkit-appearance:none;appearance:none;
    transition:border-color .2s ease, background .2s ease, box-shadow .2s ease;
  }
  .cmd-input textarea:focus{
    outline:none;border-color:rgba(212,175,55,.58);
    background:var(--vidrio-foco);
    box-shadow:0 8px 26px rgba(0,0,0,.4), 0 0 0 3px rgba(212,175,55,.10);
  }
  .cmd-input textarea::placeholder{color:var(--faint);text-shadow:var(--sombra-texto)}
  /* Sin boton de enviar: Enter manda en escritorio y el teclado tactil trae
     su propia tecla de enviar (enterkeyhint). Una flecha ahi solo anadia
     ruido y quitaba ancho al campo. */

  /* ── Mensajes: burbujas FLOTANTES Y TRANSLUCIDAS ────────────────
     Como la pastilla de escribir: la red neuronal se ve pasar por detras y
     el desenfoque es lo unico que sostiene la lectura. Dos bandos por COLOR,
     no por posicion: los tuyos en oro -- que es la homogeneidad de la marca
     y manda -- y los de ELIXIS en grafito frio. Mismo criterio que ya usa
     msgBubble() en el resto del archivo: oro para ti, neutro para el. */
  .escritura .convo .line,
  .escritura .convo .yo{
    max-width:86%;padding:12px 15px;
    font-size:15px;line-height:1.52;color:var(--text);
    -webkit-backdrop-filter:blur(2px) saturate(150%);
    backdrop-filter:blur(2px) saturate(150%);
    box-shadow:0 8px 22px rgba(0,0,0,.30);
    /* Con las burbujas casi transparentes, la legibilidad ya no la da el
       fondo sino el contorno del propio texto. */
    text-shadow:var(--sombra-texto);
  }
  /* ELIXIS responde en CIAN -- el mismo --cyan que ya usa la paleta para el
     estado de transcripcion, no un color inventado. Alfa bajo a proposito:
     tiene que leerse el tono sin tapar la red que pasa por detras. */
  .escritura .convo .line{
    align-self:flex-start;

  /* EN ACTIVO EL AMARILLO NO ES SOLIDO. El disco desaparece y lo que queda
     son AROS DE ENERGIA latiendo alrededor del fenix: el relleno se sustituye
     por un halo radial que respira con la voz. Energia, no boton. */
  .nav-orb.live{
    background:radial-gradient(circle,
      rgba(212,175,55,calc(.10 + var(--pulso,0) * .26)) 0%,
      rgba(212,175,55,calc(.04 + var(--pulso,0) * .10)) 52%,
      transparent 70%);
    box-shadow:0 0 calc(12px + var(--pulso,0) * 38px) rgba(212,175,55,calc(.26 + var(--pulso,0) * .44));
    /* La escala la pone el bucle en JS: scale(calc(...)) con una variable
       dentro salia identidad, medido en el navegador. */
  }
  /* Tres aros desfasados un tercio de ciclo: se lee como energia continua y
     no como un solo latido. */
  .nav-orb.live::before,.nav-orb.live::after,.nav-orb.live .orb-aro{
    content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
    border:2px solid var(--gold2);opacity:0;
    animation:orbe-radar 1.9s cubic-bezier(.15,.6,.35,1) infinite;
  }
  .nav-orb.live::after{animation-delay:.63s}
  .nav-orb .orb-aro{display:none}
  .nav-orb.live .orb-aro{display:block;animation-delay:1.26s}
  @keyframes orbe-radar{
    0%  {transform:scale(1);   opacity:calc(.22 + var(--pulso,0) * .58)}
    100%{transform:scale(2.35);opacity:0}
  }
  /* El oro es la homogeneidad de la marca y manda siempre. Escuchar y hablar
     NO se distinguen por color sino por INTENSIDAD: escuchando los aros son
     tenues y lentos; hablando se abren del todo. Misma luz, distinta fuerza. */
  .nav-orb.live.rx::before,.nav-orb.live.rx::after,.nav-orb.live.rx .orb-aro{
    border-color:var(--gold);
    animation-duration:2.6s;
  }
  .nav-orb.live.rx{
    background:radial-gradient(circle,
      rgba(212,175,55,calc(.06 + var(--pulso,0) * .18)) 0%, transparent 68%);
    box-shadow:0 0 calc(8px + var(--pulso,0) * 24px) rgba(212,175,55,calc(.16 + var(--pulso,0) * .30));
  }

  /* command / avatar */
  /* AI agent = cut-out figure (no circle) over a live particle/circuit field */
  .avatar-stage{position:relative;width:min(290px,80vw);height:min(460px,58vh);margin:2px auto 0}
  /* "Ellos son los duenos de la pantalla" (2026-08-27, correccion sobre el
     intento anterior: subir a 460px/58vh NO alcanzo, seguia quedando un
     espacio enorme sin usar debajo). En el panel del carrusel Avatar (NO en
     otros usos de .avatar-stage, como el inmersivo .big o el mock de
     SCREENS.conversation, que se dejan con su tamano fijo de siempre) la
     caja pasa a CRECER con flex hasta llenar el alto real disponible del
     panel, en vez de un numero de pixeles adivinado -- se acomoda solo a
     cualquier tamano de pantalla. El recorte/encuadre en si sigue sin
     tocarse (object-fit:cover + object-position:center top, igual que
     siempre). */
  /* Correccion 2 (2026-08-27, sigue reportado "demasiado arriba, casi todo
     el cuerpo cortado" con captura real -- el intento anterior con
     "flex:1 1 auto;height:auto" NO alcanzaba: los hijos de .avatar-stage son
     TODOS position:absolute (el canvas de particulas, la foto, los clips),
     asi que no aportan alto propio -- con flex-basis "auto" (que mira el
     contenido cuando no hay una altura explicita) la caja se quedaba en un
     alto minimo en vez de crecer. "flex:1" a secas (basis 0%) + min-height:0
     es el patron que YA se usa en otro lado de este mismo archivo (ej.
     #cmdBody) para exactamente este caso -- ignora el contenido, crece SOLO
     por flex-grow. Con la caja de verdad ocupando el alto real del panel, el
     mismo recorte "cover + top" de siempre revela mucho mas cuerpo solo, sin
     tocar object-position para nada. */
  .ew-pantalla-avatar{justify-content:flex-start}
  .ew-pantalla-avatar .avatar-stage{flex:1;min-height:0;max-height:none;width:100%}
  /* Causa real de "columnas/bordes del hero" reportada en vivo (2026-08-28),
     confirmada con datos reales del DOM (getBoundingClientRect en la sesion
     del PO): "avatar-stage listening big" media 350x50px dentro de un padre
     de 396px -- la clase "big" (se agrega SIEMPRE que hay conversacion de
     voz activa, sin importar en que contenedor vive #avatarStage, ver
     "var voice=...") tiene la MISMA especificidad CSS que la regla de
     arriba (dos clases cada una) -- en caso de empate gana la que aparece
     DESPUES en el archivo, que es .avatar-stage.big (mas abajo, pensada
     para el modo de voz INMERSIVO de pantalla completa, .voice-live). El
     resultado: apenas el PO hablaba por el microfono estando en el
     carrusel, el ancho fijo de esa otra regla pisaba a esta. El contexto
     (vivir dentro del carrusel) tiene que ganarle siempre al estado
     (conversacion de voz activa) -- esta regla, con TRES clases en el
     selector, es mas especifica que ".avatar-stage.big" (dos clases) sin
     importar el orden en el archivo. */
  .ew-pantalla-avatar .avatar-stage.big{flex:1;min-height:0;max-height:none;width:100%;height:auto}
  .avatar-fx{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
  .avatar-baseglow{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);width:74%;height:44%;z-index:2;
    background:radial-gradient(closest-side,var(--gold-glow),transparent 72%);filter:blur(11px);opacity:.6;transition:.45s ease}
  /* object-fit:cover, no contain (2026-08-27, investigacion en vivo): la
     proporcion real de la foto/loop (680x964, ~0.70) es mas angosta que su
     marco (.avatar-stage.big, ~0.91) -- con "contain" quedaban franjas
     vacias a los costados por donde se veia la red de particulas moviendose
     de fondo (canvas #avatarFX, z-index:1, ocupa todo el stage). Con la
     foto fija pasaba desapercibido; con el loop corriendo todo el tiempo se
     veia como un destello/parpadeo en los bordes del avatar. "cover" recorta
     el sobrante en vez de dejar hueco. object-position:center TOP, no
     bottom: "cover" aqui recorta de arriba/abajo (no de los costados), y
     con "bottom" se estaba cortando la cabeza -- reportado en vivo, mismo
     dia. "top" prioriza que la cara quede siempre completa. */
  .avatar-fig{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;z-index:3;background:transparent;
    filter:drop-shadow(0 10px 26px rgba(0,0,0,.7))}
  /* stream-live solo esconde la foto estatica -- el video real ya NO vive
     adentro de .avatar-stage (ver .heygen-portal mas abajo, 2026-08-27 v4):
     asi ningun repintado de esta pantalla puede tocarlo. */
  .avatar-stage.stream-live .avatar-fig{display:none}
  /* PORTAL de HeyGen (2026-08-27, v4) -- vive fuera de #view a proposito
     (ver el <video> junto a <body>). position:fixed + coordenadas de
     getBoundingClientRect() de #avatarStage (puestas en JS por
     sincronizarPortalHeygen()) lo superponen exactamente encima de donde
     esta el avatar, sin ser parte del DOM que se repinta. */
  .heygen-portal{position:fixed;object-fit:cover;object-position:center top;z-index:500;display:none;pointer-events:none;filter:drop-shadow(0 10px 26px rgba(0,0,0,.7))}
  .heygen-portal.activo{display:block}
  /* Fuente invisible del <video> (2026-08-27, recorte de fondo verde) -- se
     posiciona IGUAL que .heygen-portal (mismo metodo, sincronizarPortalHeygen)
     para que avatar-heygen-chromakey.js lea sus dimensiones reales, pero
     nunca se muestra: el canvas de arriba es lo unico que se ve. */
  .heygen-portal-fuente{position:fixed;opacity:0;pointer-events:none;z-index:499}
  /* Motor de fotogramas (avatar-frame-player.js): dos capas superpuestas en
     opacity:0 por defecto -- sin clips reales configurados, se quedan asi
     para siempre y la foto de arriba manda, tal como se pidio. */
  .avatar-clip{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;z-index:3;opacity:0;transition:opacity .2s linear;pointer-events:none}
  /* Croma key de DJMago (2026-08-27) -- el <video> real sigue existiendo y
     cruzando opacidad (avatar-frame-player.js no cambia), pero queda
     invisible: lo que se ve es .avatar-clip-canvas, redibujado sin el verde
     por avatar-heygen-chromakey.js. visibility, NO opacity/display -- esas
     dos las sigue manejando avatar-frame-player.js para el cruce. */
  .avatar-clip-fuente{visibility:hidden}
  .avatar-clip-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
  .avatar-stage.stream-live .avatar-clip-canvas{display:none} /* Elixis/HeyGen activa: el canvas de DJMago se apaga, igual que la foto */
  /* Sprites de boca por amplitud real (avatar-viseme-sprites.js): una sola
     capa que se prende SOLO mientras ELIXIS habla de verdad. Sin fotogramas
     reales configurados, se queda en opacity:0 para siempre. */
  .avatar-viseme{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;z-index:4;opacity:0;transition:opacity .04s linear;pointer-events:none}

  /* Carrusel de 3 pantallas del modo voz (Enfoque / Avatar / Hilos) --
     misma mecanica y mismas clases que el carrusel de staff.html, aqui
     dentro de .pad-centro en vez de la rejilla de .ew-grid. */
  .ew-carrusel{position:relative;overflow:hidden;width:100%;flex:1;min-height:0;touch-action:pan-y;overscroll-behavior-x:none;}
  .ew-carrusel-pista{display:flex;width:300%;height:100%;}
  .ew-pantalla{width:33.3333%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;overflow-y:auto;padding:0 6px;}
  .ew-pantalla::-webkit-scrollbar{display:none}
  .ew-dots{display:flex;justify-content:center;gap:8px;padding:10px 0 4px;}
  .ew-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22);border:none;padding:0;cursor:pointer;}
  .ew-dot.activo{background:var(--gold);}
  /* Flechas laterales de escritorio (2026-08-28, ticket de soporte desktop
     para el carrusel) -- inyectadas por elixis-swipe-carousel.js mismo, no
     por el HTML de esta pagina. Ocultas por defecto: en tactil real el
     gesto de arrastre ya cubre esto, un boton de mas ahi solo estorba.
     "(hover:hover) and (pointer:fine)" es la forma estandar de detectar
     "hay un mouse de verdad" sin depender del ancho de pantalla (un
     iPad con mouse conectado, por ejemplo, sigue siendo touch primero). */
  .ew-flecha{display:none}
  @media (hover:hover) and (pointer:fine){
    .ew-flecha{position:absolute;top:50%;transform:translateY(-50%);z-index:4;
      width:34px;height:34px;border-radius:50%;border:none;
      background:rgba(20,24,30,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
      color:var(--text);font-size:19px;line-height:1;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:opacity .15s linear,background .15s linear}
    .ew-flecha:hover{background:rgba(20,24,30,.7)}
    .ew-flecha:disabled{opacity:.22;cursor:default}
    .ew-flecha-izq{left:6px}
    .ew-flecha-der{right:6px}
  }
  .ew-enfoque{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:16px;flex:1;}
  /* Tarjetas de acceso rapido del carrusel de chat (2026-08-27) -- oscuras y
     translucidas, resplandor al presionar. :active nativo, sin JS de estado:
     el resplandor tiene que sentirse instantaneo al dedo, no esperar un
     repintado. */
  .acceso-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:2px 2px 16px}
  .acceso-card{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    padding:18px 6px;border-radius:16px;border:1px solid var(--line2);
    background:rgba(255,255,255,.04);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    color:var(--text);font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:box-shadow .15s ease,border-color .15s ease,background .15s ease;
  }
  .acceso-card:active{
    background:rgba(255,255,255,.08);border-color:var(--gold);
    box-shadow:0 0 22px rgba(212,175,55,.5);
  }
  .acceso-card .acceso-ico{width:30px;height:30px;color:var(--gold)}
  .acceso-card .acceso-ico svg{width:100%;height:100%}
  .acceso-card .acceso-t{font-size:12.5px;font-weight:600;text-align:center}
  /* Tarjetas verticales de Modo Enfoque (2026-08-27) -- distintas a proposito
     de .acceso-card: el resplandor queda PEGADO mientras ese modo siga
     activo (no es un flash al tocar), porque esto es un filtro de contexto
     con estado, no una accion de una sola vez. */
  .enfoque-vgrid{display:flex;flex-direction:column;gap:10px;padding:2px 2px 16px}
  .enfoque-vcard{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    padding:16px 16px;border-radius:14px;border:1px solid var(--line2);
    background:rgba(255,255,255,.04);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    color:var(--text);font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:box-shadow .2s ease,border-color .2s ease,background .2s ease;
  }
  .enfoque-vcard .enfoque-vico{font-size:22px;line-height:1;flex:none}
  .enfoque-vcard .enfoque-vt{font-size:14px;font-weight:700}
  .enfoque-vcard.activo{
    background:rgba(212,175,55,.12);border-color:var(--gold);
    box-shadow:0 0 22px rgba(212,175,55,.5);
  }
  .ew-enfoque-item{display:flex;flex-direction:column;align-items:center;gap:5px;width:70px;cursor:pointer;-webkit-tap-highlight-color:transparent;background:none;border:none;padding:0;font-family:inherit;}
  .ew-enfoque-icono{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:22px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.14);transition:border-color .25s,box-shadow .25s;}
  .ew-enfoque-icono.activo{border:2px solid rgba(234,179,8,0.5);box-shadow:0 0 14px rgba(234,179,8,0.5);}
  .ew-enfoque-item .l{font-size:9.5px;letter-spacing:.03em;color:var(--muted);text-align:center}
  /* immersive voice-conversation mode: only the agent + particles + subtitles */
  .voice-live{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;min-height:0;padding-top:4px}
  /* .avatar-stage.big tenia un marco fijo (350x390px maximo) centrado
     dentro de .voice-live -- "el hero" con "bordes" reportado en vivo
     (2026-08-28): mucho espacio negro alrededor de esa caja chica en vez
     de llenar la pantalla real. "Cero bordes... el avatar puede quedar
     con los hombros detras de la pantalla pero no detras del hero" --
     mismo patron flex:1;min-height:0 que ya se uso para el carrusel del
     dashboard (ver [[project_portal_desync_and_cache_bust_lesson]]): crece
     para llenar TODO el espacio real disponible de .voice-live (descontado
     el alto natural de .voice-status), auto-ajustable a cualquier pantalla.
     object-fit:cover en .avatar-fig/.avatar-clip-canvas sigue haciendo su
     trabajo de siempre -- llena sin dejar huecos sea cual sea el aspect
     ratio resultante. */
  .avatar-stage.big{flex:1;min-height:0;width:100%;max-width:100%}
  .voice-status{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
  .voice-caption{text-align:center;font-size:18px;font-weight:600;line-height:1.42;color:var(--text);min-height:54px;margin:16px 8px 6px;max-width:340px;text-wrap:balance}
  .voice-caption .cap-q{color:var(--muted);font-weight:500;font-size:15.5px}
  .voice-controls{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:6px}
  .voice-pills{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .voice-pill{display:inline-flex;align-items:center;gap:7px;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:700;border:1px solid var(--line2);background:var(--elev2);color:var(--text)}
  .voice-pill.gold{border:none;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1405}
  .voice-pill:active{transform:scale(.97)}
  .voice-end{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--faint);padding:9px 18px;border:1px solid var(--line);border-radius:999px}
  .mic.small{width:74px;height:74px}.mic.small svg{width:30px}
  .mic.live::after{animation:micpulse 2.2s ease-out infinite}
  .voice-hint{font-size:11.5px;color:var(--faint);text-align:center;max-width:270px;line-height:1.45}
  .agent-name{text-align:center;margin-top:6px}
  .agent-name b{font-size:19px;letter-spacing:.04em}
  .agent-role{font-size:10.5px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:2px}
  .state-label{text-align:center;color:var(--muted);font-size:13px;margin-top:14px;min-height:20px;font-weight:500}
  .cmd-prompt{text-align:center;font-size:17px;font-weight:600;margin:6px 0 2px}

  /* ── Chat escrito: lo que ELIXIS va diciendo ─────────────────────
     Traido del laboratorio de voz, que es donde estaba funcionando. Debajo
     del avatar, no encima: la cara manda y el texto acompana. */
  .convo{display:flex;flex-direction:column;gap:10px;margin:6px 2px 0;
    max-height:34vh;overflow-y:auto;padding:2px 2px 6px}
  .convo .line{font-size:14.5px;line-height:1.5;color:var(--text)}
  .convo .line b{color:var(--gold2);font-weight:700}
  .convo .sys{font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:.02em}
  .convo:empty{display:none}
  .convo-state{display:flex;align-items:center;justify-content:center;gap:8px;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--muted);margin-top:10px;min-height:16px}

  /* waveform */
  .waveform{display:flex;align-items:center;justify-content:center;gap:3px;height:32px;margin:6px 0}
  .waveform i{width:3px;height:20%;border-radius:3px;background:var(--gold);opacity:.85;animation:wv 1s ease-in-out infinite}
  .waveform.idle i{animation:none;height:14%;opacity:.3;background:var(--faint)}
  @keyframes wv{50%{height:100%}}

  /* mic button */
  .mic-wrap{display:flex;align-items:center;justify-content:center;gap:26px;margin:16px 0 8px}
  .mic-side{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:10px;font-family:var(--mono);letter-spacing:.08em}
  .mic-side .icon-btn{width:46px;height:46px;border:1px solid var(--line2);border-radius:14px;background:var(--elev)}
  .mic-side.on .icon-btn{border-color:var(--gold);color:var(--gold);background:var(--gold-dim)}
  .mic{width:96px;height:96px;border-radius:50%;background:linear-gradient(180deg,var(--gold2),var(--gold));display:grid;place-items:center;
    box-shadow:0 0 0 6px rgba(212,175,55,.12),0 0 40px var(--gold-glow);position:relative;color:#1a1405;flex:none}
  .mic svg{width:38px;height:38px}
  .mic::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--gold);opacity:0}
  .mic.rec::after{animation:micpulse 1.5s ease-out infinite}
  @keyframes micpulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.35);opacity:0}}
  .mic.rec{background:linear-gradient(180deg,#ff6b6b,var(--red));color:#fff;box-shadow:0 0 0 6px rgba(240,97,114,.18),0 0 44px rgba(240,97,114,.4)}

  /* text input */
  /* ── Compositor de espacio de trabajo ─────────────────────────────
     Convenciones de Apple: la fuente del sistema, correccion y mayuscula
     automatica de frase, y 16px CLAVADOS -- por debajo de eso Safari en iOS
     hace zoom al enfocar y descoloca la pantalla entera. Crece solo hasta
     seis lineas, como cualquier chat serio, y respeta el area segura para
     no quedar debajo del indicador de inicio. */
  /* El bloque duplicado del compositor se elimino: venia de la primera
     version, iba DESPUES en la hoja y por eso ganaba -- dejaba el campo
     opaco pese a las reglas flotantes de arriba. Arrastraba ademas las
     reglas del boton de enviar, que ya no existe. */

  .chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
  .chip{font-size:12px;padding:7px 12px;border:1px solid var(--line2);border-radius:999px;background:var(--elev);color:var(--muted)}
  .chip:active{border-color:var(--gold);color:var(--gold)}

  /* quick reply buttons (avatar responses) */
  .qr{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
  .qr .btn{width:auto;min-height:42px;padding:0 16px;font-size:13px}

  /* radar */
  .radar-wrap{position:relative;width:230px;height:230px;margin:8px auto}
  .radar-wrap svg{width:100%;height:100%}
  .radar-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .radar-center b{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .radar-center span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--cyan);margin-top:2px}
  .radar-sweep{transform-origin:center;animation:sweep 3.4s linear infinite}
  @keyframes sweep{to{transform:rotate(360deg)}}

  .tabs{display:flex;gap:6px;background:var(--elev);border:1px solid var(--line);border-radius:12px;padding:4px;margin:4px 0 14px;overflow-x:auto}
  .tabs button{flex:1;white-space:nowrap;padding:8px 10px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--gold-dim);color:var(--gold)}

  /* pipeline steps */
  .pl-step{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
  .pl-step:last-child{border:none}
  .pl-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--elev2);color:var(--faint)}
  .pl-step.done .pl-ico{color:var(--green);background:rgba(62,207,142,.12)}
  .pl-step.run .pl-ico{color:var(--cyan);background:rgba(63,185,230,.12)}
  .pl-step .pl-t{font-size:13.5px;font-weight:600}
  .pl-step .pl-s{font-size:10.5px;font-family:var(--mono);letter-spacing:.04em}
  .pl-step.done .pl-s{color:var(--green)}.pl-step.run .pl-s{color:var(--cyan)}.pl-step.pend .pl-s{color:var(--faint)}
  .pl-time{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .spin{animation:spin 1s linear infinite;display:inline-block}@keyframes spin{to{transform:rotate(360deg)}}

  .progress{height:8px;border-radius:99px;background:var(--elev3);overflow:hidden}
  .progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .5s ease}

  /* list rows */
  .lrow{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}
  .lrow:last-child{border:none}
  .lrow .l-ico{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--elev2);color:var(--gold);overflow:hidden}
  /* ── Ajustes: iconos de LINEA, sin azulejo ──────────────────────
     Los trazos ya eran Lucide; lo que los hacia parecer emoji era el
     envoltorio: un azulejo relleno de 40x40 con esquinas redondeadas y
     color oro. Quitado el relleno y bajado a monocromo, se leen como
     Ajustes de ChatGPT o Preferencias del Sistema. El azulejo sigue
     intacto en el resto de pantallas: aqui solo cambia .ajustes. */
  .ajustes .lrow .l-ico{
    width:22px;height:22px;border-radius:0;background:none;
    /* !important porque la fila de Conexion trae color en linea. El estado
       ya lo dice la insignia ON/OFF; el icono no tiene que repetirlo. */
    color:var(--muted)!important;
  }
  .ajustes .lrow .l-ico svg{width:20px;height:20px;stroke-width:1.6}
  .ajustes .lrow{gap:15px}
  .lrow .l-ico img{width:100%;height:100%;object-fit:cover}
  .lrow .l-t{font-size:14.5px;font-weight:600}
  .lrow .l-s{font-size:12px;color:var(--muted);margin-top:1px}
  .lrow .l-r{margin-left:auto;text-align:right;flex:none}
  .chev{color:var(--faint)}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13.5px}
  .kv dt{color:var(--faint);font-family:var(--mono);font-size:11px}
  .kv dd{margin:0;text-align:right}
  .bul{list-style:none;padding:0;margin:0}
  .bul li{display:flex;gap:9px;padding:6px 0;font-size:13.5px;color:var(--muted)}
  .bul li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);flex:none;margin-top:7px}

  .price{font-size:34px;font-weight:800;letter-spacing:-.02em}
  .price small{font-size:14px;color:var(--muted);font-weight:600}

  .empty{text-align:center;color:var(--faint);padding:40px 20px;font-size:14px}
  .hr{height:1px;background:var(--line);border:none;margin:14px 0}

  /* floating mic (secondary screens) */
  .fab-mic{position:absolute;right:16px;bottom:calc(var(--nav-h) + var(--sab) + 16px);width:52px;height:52px;border-radius:50%;
    background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1405;display:grid;place-items:center;z-index:20;box-shadow:0 8px 24px var(--gold-glow)}
  .fab-mic svg{width:24px;height:24px}

  /* sheet / overlay -- z-index 550/551, no 40/41 (2026-08-27, auditoria):
     el portal de HeyGen (.heygen-portal) vive fijo junto a <body> en
     z-index:500 -- con 40/41 cualquier sheet abierto (selector de avatar,
     historial) quedaba VISUALMENTE TAPADO detras del video de Katya
     mientras una presentacion estuviera activa (bug real, encontrado en
     esta auditoria, nunca reportado en vivo). Los sheets tienen que ganarle
     siempre al portal: son el nivel de interaccion mas alto de la app. */
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:550;display:none;animation:fade .2s ease}
  .scrim.open{display:block}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:551;background:var(--elev);border-top:1px solid var(--line2);border-radius:22px 22px 0 0;
    padding:10px 18px calc(22px + var(--sab));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow-y:auto}
  .sheet.open{transform:none}
  .sheet-grip{width:40px;height:4px;border-radius:3px;background:var(--line2);margin:2px auto 14px}
  .sheet h3{margin:0 0 4px;font-size:18px}

  /* voice overlay */
  .voice-ov{position:absolute;left:0;right:0;bottom:0;z-index:45;background:linear-gradient(180deg,var(--elev),var(--surface));border-top:1px solid var(--gold-dim);
    border-radius:22px 22px 0 0;padding:16px 18px calc(20px + var(--sab));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  .voice-ov.open{transform:none}
  .voice-ov .vo-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}

  /* toast */
  .toast-wrap{position:absolute;left:0;right:0;bottom:calc(var(--nav-h) + var(--sab) + 18px);z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
  .toast{background:var(--elev3);border:1px solid var(--gold-2,var(--gold));border-radius:12px;padding:11px 16px;font-size:13.5px;max-width:88%;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:tin .22s ease;display:flex;gap:9px;align-items:center}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}}

  .offline-banner{background:rgba(240,97,114,.12);border-bottom:1px solid rgba(240,97,114,.4);color:var(--red);font-size:12px;text-align:center;padding:6px;font-family:var(--mono);letter-spacing:.05em}

  .stat-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
  .stat-3 .s-v{font-size:24px;font-weight:800;font-family:var(--mono)}
  .stat-3 .s-l{font-size:10.5px;color:var(--muted);margin-top:2px}

  .conf-note{font-size:11px;color:var(--faint);text-align:center;margin-top:10px;line-height:1.5}

  /* ── RATON, no dedo ─────────────────────────────────────────────
     En celular y tableta se toca; en computadora se apunta. (hover:hover) y
     (pointer:fine) es lo que separa las dos: un tactil NUNCA entra aqui, asi
     que no se queda ningun estado de hover pegado despues de tocar -- que es
     el defecto clasico de poner :hover a secas. */
  @media (hover:hover) and (pointer:fine){
    .navb:hover{color:var(--muted)}
    .navb.on:hover{color:var(--gold2)}
    .nav-orb:hover{box-shadow:0 6px 22px var(--gold-glow),0 0 0 4px rgba(212,175,55,.14)}
    .icon-btn:hover,.modo-btn:hover{background:rgba(255,255,255,.07)}
    .cmd-input textarea:hover:not(:focus){border-color:rgba(255,255,255,.28)}
    .sms-acc button:hover:not(:disabled){filter:brightness(1.1)}
    .sms-acc button:not(.sms-ok):hover:not(:disabled){border-color:var(--gold);background:rgba(212,175,55,.10)}
    .btn:hover{filter:brightness(1.08)}
    .lrow:hover,.card:hover{border-color:var(--line2)}
  }
  /* El pulsado si vale para los dos: el dedo tambien lo nota. */
  .nav-orb:active{transform:scale(.94)}
  .sms-acc button:active:not(:disabled){transform:scale(.97)}
  .navb:active{opacity:.7}

  /* splash */
  .splash{position:absolute;inset:0;z-index:80;background:radial-gradient(600px 500px at 50% 35%,rgba(212,175,55,.09),transparent 60%),var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s ease}
  .splash.hide{opacity:0;pointer-events:none}
  .splash img{width:96px;height:96px;filter:drop-shadow(0 0 24px var(--gold-glow));animation:sfloat 3s ease-in-out infinite}
  @keyframes sfloat{50%{transform:translateY(-6px)}}
  /* ── OPENING: solo el nombre. ────────────────────────────────────
     Oro translucido -- no relleno solido -- con el resplandor haciendo el
     trabajo, y un filo de neon que DA LA VUELTA al marco. El giro se hace
     con un angulo animado y una mascara que solo deja ver el borde, no el
     relleno: por eso la luz recorre el contorno en vez de girar el fondo. */
  @property --giro{syntax:'<angle>';initial-value:0deg;inherits:false}
  .sp-nombre{
    position:relative;padding:16px 30px;border-radius:16px;
    display:grid;place-items:center;
    background:rgba(212,175,55,.03);
  }
  .sp-nombre::before{
    content:"";position:absolute;inset:0;border-radius:inherit;padding:1.6px;
    background:
      conic-gradient(from var(--giro),
        rgba(212,175,55,.16) 0deg, rgba(212,175,55,.16) 250deg,
        rgba(244,201,93,.55) 300deg, #fff4d0 340deg,
        rgba(244,201,93,.55) 352deg, rgba(212,175,55,.16) 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    animation:giro-neon 2.9s linear infinite;
    pointer-events:none;
  }
  /* El halo que despega el marco del negro. */
  .sp-nombre::after{
    content:"";position:absolute;inset:-14px;border-radius:26px;pointer-events:none;
    background:radial-gradient(circle,rgba(212,175,55,.13),transparent 68%);
  }
  @keyframes giro-neon{to{--giro:360deg}}
  .splash h1{
    margin:0;position:relative;z-index:1;
    font-size:34px;font-weight:300;letter-spacing:.44em;text-indent:.44em;
    color:rgba(244,201,93,.60);
    text-shadow:0 0 10px rgba(212,175,55,.6), 0 0 30px rgba(212,175,55,.32),
                0 0 62px rgba(212,175,55,.16);
  }
  /* Navegadores sin angulos animables: el marco se queda quieto pero sigue
     siendo un filo de neon, no desaparece. */
  @supports not (background:conic-gradient(from 0deg,red,blue)){
    .sp-nombre::before{background:rgba(244,201,93,.5);animation:none}
  }
  @media (prefers-reduced-motion:reduce){ .sp-nombre::before{animation:none} }
  .splash .sp-auth{margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .faceid{width:56px;height:56px;border-radius:16px;border:1.5px solid var(--gold);display:grid;place-items:center;color:var(--gold)}
</style>
</head>
<body>

<!-- PORTAL de HeyGen (2026-08-27, v4): vive aqui, fuera de #view, para que
     NINGUN repintado de pantalla (setAvatar() llama a render() en cada
     cambio de estado -- escuchando/pensando/hablando -- todo el tiempo en
     una conversacion real) pueda crear, destruir u ocultar por error el
     <video> con el track ya conectado. mdj-commander.html solo lo
     reposiciona (estilos) para que quede visualmente encima de donde esta
     el avatar -- ver sincronizarPortalHeygen(). El elemento en si es
     responsabilidad de avatar-heygen-stream.js (attach/srcObject).

     El <video> ya NO se ve directo (2026-08-27, recorte de fondo verde):
     sigue existiendo porque el SDK necesita un <video> real para pegarle el
     track y decodificar cuadros, pero queda siempre invisible
     (.heygen-portal-fuente) -- lo que se ve es el <canvas> de al lado, que
     avatar-heygen-chromakey.js redibuja cuadro a cuadro con el verde ya
     recortado. Si el canvas fallara por lo que sea, el video sigue ahi
     decodificando, listo para volver a mostrarse a mano. -->
<video id="elixis-avatar-stream" class="heygen-portal-fuente" autoplay playsinline muted></video>
<canvas id="elixis-avatar-canvas" class="heygen-portal"></canvas>

<div class="stage">
  <div class="device" id="device">
    <!-- La barra de estado falsa (9:41, cobertura, wifi, bateria) se elimino:
         en un movil real la pinta el sistema encima. Era teatro de prototipo. -->
    <div id="offlineBanner"></div>
    <div class="topbar" id="topbar"></div>
    <div class="app-scroll" id="view"></div>
    <div class="bottomnav" id="bottomnav"></div>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet"></div>
    <div class="voice-ov" id="voiceOv"></div>
    <div class="toast-wrap" id="toastWrap"></div>

    <!-- splash -->
    <div class="splash" id="splash">
      <img id="splashLogo" alt="Phoenix">
      <div class="sp-nombre"><h1>ELIXIS</h1></div>
      <div class="sp-auth">
        <div class="faceid"><svg viewBox="0 0 24 24" width="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 10v1M15 10v1M12 9v4l-1 1M9.5 15c1.5 1 3.5 1 5 0"/></svg></div>
        <div style="font-size:12px;color:var(--muted)" id="authTxt">Autenticación segura…</div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var $=function(s,r){return (r||document).querySelector(s);};

  var _supa = (typeof window.getSupabaseClient==='function') ? window.getSupabaseClient() : null;

  (async function _initAuth(){
    if(!_supa) return;
    try{
      var r = await _supa.auth.getSession();
      var s = (r&&r.data)?r.data.session:null;
      if(s&&s.access_token){ _token = s.access_token; loadRealClients(); loadRealNotifs(); }
      else { _goLogin(); return; }
      _supa.auth.onAuthStateChange(function(_e,ss){ _token = ss?ss.access_token:null; if(!_token) _goLogin(); });
    }catch(e){ _goLogin(); }

  function _invokeHeaders(){
    var pub = window.MDB_SUPABASE_ANON_KEY||'';

    if(pub) h.apikey=pub;
    h.Authorization='Bearer '+(_token||pub);

  window._invokeHeaders = _invokeHeaders;
  /* Pantalla CLIENTES → leads reales (RLS: staff/owner ve sus leads) */
  async function loadRealClients(){
    if(!_supa) return;
    try{
      var r = await _supa.from('leads')
        .select('name,contact_person,email,event_type,city,event_location,status,lead_outcome,total_amount,budget_estimate,event_date,created_at')
        .order('created_at',{ascending:false}).limit(30);
      var rows=(r&&r.data)?r.data:[];
      if(!rows.length) return;
      function mapSt(s){ s=String(s||'').toLowerCase(); if(/won|confirm|paid|active|complet/.test(s))return 'active'; if(/lost|cancel|declin|dead/.test(s))return 'lead'; return 'opportunity'; }
      CLIENTS = rows.map(function(l){
        var val=l.total_amount||l.budget_estimate;
        var last=l.event_type?(l.event_type+(l.event_date?' · '+l.event_date:'')):(l.lead_outcome||l.status||'Consulta');
        var nm=l.name||l.contact_person||(l.email?String(l.email).split('@')[0]:'')||'Cliente';
        return { n:nm, co:l.city||l.event_location||'—', st:mapSt(l.lead_outcome||l.status), last:{es:last,en:last}, val:val?('$'+Math.round(Number(val))):'—' };
      });
      if(state.screen==='clients'||state.screen==='clientDetail') render();
    }catch(e){}
  }
  /* Pantalla NOTIFICACIONES → alertas reales derivadas de leads */
  async function loadRealNotifs(){
    if(!_supa) return;
    try{
      var r = await _supa.from('leads')
        .select('name,contact_person,email,event_type,event_date,total_amount,payment_status,assigned_dj_name,created_at')
        .order('created_at',{ascending:false}).limit(30);
      var rows=(r&&r.data)?r.data:[];
      if(!rows.length) return;
      function nameOf(l){ return l.name||l.contact_person||(l.email?String(l.email).split('@')[0]:'')||'Cliente'; }
      var out=[];
      var sinDj=rows.filter(function(l){return !l.assigned_dj_name;}).length;
      if(sinDj>0) out.push({lvl:'critical',ico:'warn',t:{es:sinDj+' solicitudes sin DJ asignado',en:sinDj+' leads without a DJ'},d:{es:'Requieren tu asignación',en:'Need assignment'},time:''});
      rows.forEach(function(l){
        var ps=String(l.payment_status||'').toLowerCase();
        var val=Number(l.total_amount||0);
        if(val>0 && ps!=='paid_full' && ps!=='paid'){
          var txt=nameOf(l)+' · '+(l.event_type||'evento')+(l.event_date?' · '+l.event_date:'')+' · $'+Math.round(val);
          out.push({lvl:'important',ico:'dollar',t:{es:'Pago pendiente',en:'Pending payment'},d:{es:txt,en:txt},time:''});
        }
      });
      if(!out.length) out.push({lvl:'info',ico:'check',t:{es:'Todo al día',en:'All caught up'},d:{es:'Sin alertas pendientes',en:'No pending alerts'},time:''});
      NOTIFS = out.slice(0,10);
      if(state.screen==='notifications') render();
    }catch(e){}
  }
  async function askElixis(text){
    var url = window.mdbSupabaseFunctionUrl ? window.mdbSupabaseFunctionUrl('elixis-orchestrator') : null;
    if(!url) return 'No pude ubicar el servidor.';
    try{
      var res = await fetch(url,{ method:'POST', headers:_invokeHeaders(), body:JSON.stringify({ message:text, history:_elixisHistory.slice(-20) }) });
      if(res.status===401){ _goLogin(); return ''; }
      var d={}; try{ d=await res.json(); }catch(_){}
      if(!res.ok||!d.reply) return {reply:(d.error==='forbidden_not_staff') ? 'Tu cuenta no tiene acceso de staff/owner.' : 'Tuve un problema ('+res.status+').'};
      _elixisHistory.push({role:'user',content:text});
      _elixisHistory.push({role:'assistant',content:d.reply});
      /* sms_pendiente viaja desde elixis-chat y el orquestador lo reenvia
         entero. Antes se perdia aqui: ELIXIS encolaba el mensaje y el Capitan
         no llegaba a verlo nunca, asi que el SMS se quedaba en la cola. */
      return {reply:d.reply, sms:d.sms_pendiente||null};
    }catch(e){ return {reply:'No pude conectar. Revisa tu conexión.'}; }
  }
  /* Desbloqueo de audio: un solo elemento "armado" con el primer gesto del usuario,
     para que la voz natural (OpenAI) SIEMPRE suene y nunca caiga a algo robótico. */
  var _audioArmed=false;
  var _SILENT="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
  function _voiceEl(){ if(!_cvAudio){ _cvAudio=new Audio(); } return _cvAudio; }
  function _armAudio(){ if(_audioArmed)return; var el=_voiceEl(); try{ el.src=_SILENT; var p=el.play(); if(p&&p.then)p.then(function(){_audioArmed=true;}).catch(function(){}); }catch(e){} }
  ['pointerdown','keydown','touchstart'].forEach(function(ev){ document.addEventListener(ev,_armAudio); });
  async function speakReal(text){
    var url = window.mdbSupabaseFunctionUrl ? window.mdbSupabaseFunctionUrl('elixis-tts') : null;
    if(!url||!text) return;
    try{
      var clean = String(text).replace(/[*_`#>]/g,'').replace(/https?:\/\/\S+/g,'').trim();
      var res = await fetch(url,{ method:'POST', headers:_invokeHeaders(), body:JSON.stringify({ text:clean, voice:(localStorage.getItem('elixis_voice')||'ash') }) });
      if(res.ok && (res.headers.get('content-type')||'').indexOf('audio')!==-1){
        var b = await res.blob();
        var el=_voiceEl();
        try{ el.pause(); }catch(_){}
        el.src=URL.createObjectURL(b);
        el.play().catch(function(){});
      }
    }catch(e){}
  }

  /* ───── AI particle / circuit field (behind the agent) ───── */
  var FX={pts:null,canvas:null,ctx:null,W:0,H:0,intensity:0.8,target:0.8,hue:'gold',raf:null,
    reduce:(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches)};
  var FXMAP={idle:[0.95,'gold'],listening:[1.5,'gold'],transcribing:[1.3,'cyan'],understanding:[2.1,'magenta'],confirmation:[1,'gold'],executing:[2.4,'magenta'],speaking:[1.5,'gold']};
  function fxSize(){var c=FX.canvas;if(!c)return;var r=c.getBoundingClientRect();var dpr=Math.min(2,window.devicePixelRatio||1);FX.W=Math.max(60,r.width);FX.H=Math.max(60,r.height);c.width=FX.W*dpr;c.height=FX.H*dpr;FX.ctx.setTransform(dpr,0,0,dpr,0,0);}
  /* El oro de la red sale del tema (--hilos, RGB crudo): en modo dia baja a
     bronce, porque oro claro sobre papel blanco se lee gris. Se cachea: esto
     corre cientos de veces por fotograma. */
  var _hilos=null;
  function hilosRGB(){
    if(_hilos) return _hilos;
    _hilos=(getComputedStyle(document.documentElement).getPropertyValue('--hilos')||'').trim()||'212,175,55';
    return _hilos;
  }
  function fxCol(a){return FX.hue==='magenta'?'rgba(199,123,255,'+a+')':FX.hue==='cyan'?'rgba(63,185,230,'+a+')':'rgba('+hilosRGB()+','+a+')';}
  function mountFX(canvas,state){
    if(!canvas)return;FX.canvas=canvas;FX.ctx=canvas.getContext('2d');fxSize();
    var m=FXMAP[state]||FXMAP.idle;FX.target=m[0];FX.hue=m[1];
    if(!FX.pts){
      FX.pts=[];for(var i=0;i<56;i++)FX.pts.push({x:Math.random()*FX.W,y:Math.random()*FX.H,vx:(Math.random()-.5)*.32,vy:(Math.random()-.5)*.32,r:Math.random()*1.5+.7,ph:Math.random()*6.28,
        /* z = plano de profundidad. Los de delante van mas gruesos, brillantes
           y rapidos; los del fondo se apagan. Sin esto la red es un dibujo
           plano por muy brillante que se ponga. */
        z:0.42+Math.random()*0.58});
      FX.wGenerado=FX.W; FX.hGenerado=FX.H;
    } else if(FX.wGenerado && FX.hGenerado && (FX.wGenerado!==FX.W || FX.hGenerado!==FX.H)){
      /* Reescalado (2026-08-28, "lineas negras a los lados" reportado en
         vivo): FX.pts vive UNA sola vez por sesion (arriba, "if(!FX.pts)")
         -- antes de esta sesion .avatar-stage tenia un tamano FIJO, asi que
         el canvas de particulas nunca cambiaba y esto nunca hacia falta.
         Con el sizing dinamico de hoy (flex:1;width:100%), el canvas puede
         medir mas chico en el primer mountFX (layout todavia asentandose) y
         mas grande despues -- sin esto, las 56 particulas quedaban
         "atrapadas" moviendose solo dentro del rango original, angosto, y
         los bordes nuevos (mas anchos) se veian sin ninguna particula. Se
         reescala la POSICION de las particulas existentes proporcional al
         nuevo tamano -- no se recrean de cero, para no perder su fase/
         profundidad/velocidad ya asignadas (evita un salto visual). */
      var escalaX=FX.W/FX.wGenerado, escalaY=FX.H/FX.hGenerado;
      for(var i=0;i<FX.pts.length;i++){ FX.pts[i].x*=escalaX; FX.pts[i].y*=escalaY; }
      FX.wGenerado=FX.W; FX.hGenerado=FX.H;
    }
    if(FX.reduce){FX.intensity=FX.target;fxDraw();return;}
    if(!FX.raf)fxLoop();
  }
  /* La red tiene que LEERSE como una red: hilos visibles con su propio
     resplandor, nodos con nucleo y halo, y pulsos de energia recorriendo las
     conexiones. Antes eran puntos y rayas planas; ahora se ve la corriente. */
  function fxDraw(){
    var ctx=FX.ctx,c=FX.canvas;if(!ctx||!c||!document.body.contains(c))return;
    FX.intensity+=(FX.target-FX.intensity)*0.05;
    var voiceOn=(state.avatar==='listening'||state.avatar==='speaking'||state.avatar==='transcribing');
    /* Nivel real del analizador de RT (latir() lo publica cada frame en
       FX.voiceLevel), no una simulacion. En silencio o sin llamada activa,
       FX.voiceLevel es 0/indefinido y la red simplemente no reacciona. */
    var raw=voiceOn?(FX.voiceLevel||0):0;
    FX.level=(FX.level||0)+(raw-(FX.level||0))*0.3; var lvl=FX.level;
    var W=FX.W,H=FX.H,pts=FX.pts,inten=FX.intensity*(1+lvl*0.7);
    ctx.clearRect(0,0,W,H);

    for(var i=0;i<pts.length;i++){var p=pts[i];var pz=p.z||1;p.x+=p.vx*inten*pz;p.y+=p.vy*inten*pz;
      if(p.x<-4)p.x+=W+8;if(p.x>W+4)p.x-=W+8;if(p.y<-4)p.y+=H+8;if(p.y>H+4)p.y-=H+8;}

    var D=Math.min(W,H)*0.46*(1+lvl*0.14);

    /* Los hilos, con resplandor propio. El grosor y el brillo caen con la
       distancia, que es lo que da sensacion de profundidad. */
    /* SIN shadowBlur en los hilos: son cientos de trazos por frame y el
       desenfoque de sombra es lo mas caro del canvas -- fundiria la GPU en
       movil. El brillo se consigue con alfa y grosor, que no cuesta nada.
       La sombra se reserva para los pulsos, que son diez arcos pequenos. */
    ctx.lineCap='round';
    var enlaces=[];
    for(var i=0;i<pts.length;i++)for(var j=i+1;j<pts.length;j++){
      var a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<D){
        var k=1-d/D;
        var zz=((a.z||1)+(b.z||1))*0.5;   /* hilo del fondo = hilo apagado */
        ctx.strokeStyle=fxCol((k*k*0.92*zz*Math.min(1.7,inten)*(1+lvl*0.9)).toFixed(3));
        ctx.lineWidth=(0.7+k*1.8+lvl*0.6)*zz;
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
        if(k>0.55) enlaces.push([a,b]);
      }
    }

    /* Pulsos de energia: chispas que recorren las conexiones mas fuertes.
       Es lo que convierte una malla estatica en una red con corriente. */
    if(!FX.pulsos) FX.pulsos=[];
    while(FX.pulsos.length<18 && enlaces.length)
      FX.pulsos.push({e:enlaces[(Math.random()*enlaces.length)|0], t:Math.random(), v:0.006+Math.random()*0.012});
    for(var i=FX.pulsos.length-1;i>=0;i--){
      var pu=FX.pulsos[i];
      pu.t += pu.v*(1+lvl*1.6)*inten;
      if(pu.t>=1){
        if(!enlaces.length){ FX.pulsos.splice(i,1); continue; }
        pu.e=enlaces[(Math.random()*enlaces.length)|0]; pu.t=0; continue;
      }
      var A=pu.e[0], B=pu.e[1];
      var px=A.x+(B.x-A.x)*pu.t, py=A.y+(B.y-A.y)*pu.t;
      var brillo=Math.sin(pu.t*Math.PI);
      ctx.shadowColor=fxCol(1); ctx.shadowBlur=15*brillo;
      ctx.fillStyle=fxCol(Math.min(1,(0.85+lvl*0.15)*brillo).toFixed(3));
      ctx.beginPath();ctx.arc(px,py,2.2+lvl*1.4,0,6.283);ctx.fill();
      ctx.shadowBlur=0;
    }

    /* Nodos: nucleo solido con halo, no un punto plano. */
    for(var i=0;i<pts.length;i++){
      var p=pts[i];
      var pz=p.z||1;
      var pr=(p.r+Math.sin(Date.now()/600+p.ph)*.3)*(1+lvl*1.05)*(0.55+pz*0.65);
      ctx.fillStyle=fxCol((0.20*pz+lvl*0.16).toFixed(3));
      ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.6,pr*2.9),0,6.283);ctx.fill();
      ctx.fillStyle=fxCol(((0.42+pz*0.46)+lvl*.22).toFixed(3));
      ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.4,pr),0,6.283);ctx.fill();
    }
  }
  function fxLoop(){fxDraw();FX.raf=requestAnimationFrame(fxLoop);}

     exactamente encima de donde quedo #avatarStage en cada repintado --
     eso es lo que hace esta funcion, sin tocar el DOM del video para nada. */
  function sincronizarPortalHeygen(){
    var fuente = document.getElementById('elixis-avatar-stream');
    var canvas = document.getElementById('elixis-avatar-canvas');
    if(!fuente) return;
    /* state.modoPresentacion agregado a proposito (2026-08-28) -- antes
       esto solo miraba si la SESION de HeyGen seguia conectada
       (estaListo()), sin preguntar si la persona activa en pantalla
       realmente es Elixis. En el camino normal (boton selector) ambas
       cosas coinciden porque alternarModoPresentacion() llama a
       AvatarHeygenStream.detener() antes de pasar a DJMago -- pero
       cualquier desincronizacion entre ese estado y la sesion real
       (reportada en vivo: "Elixis sigue sobreponiendose encima de
       DJMago") deja el portal fijo montado encima del avatar equivocado.
       Esta condicion extra es una segunda barrera: el portal NUNCA se
       muestra si el modo activo no es realmente Elixis, sin importar lo
       que diga estaListo(). */
    var listo = !!(window.AvatarHeygenStream && window.AvatarHeygenStream.estaListo()) && !!state.modoPresentacion;
    var stage = document.getElementById('avatarStage');
    if(!listo || !stage){
      if(canvas) canvas.classList.remove('activo');
      return;
    }
    var r = stage.getBoundingClientRect();
    /* El <video> fuente (invisible) y el <canvas> visible ocupan EXACTAMENTE
       el mismo rectangulo -- avatar-heygen-chromakey.js lee canvas.clientWidth/
       Height para decidir su resolucion de proceso, tiene que coincidir con
       donde en verdad se ve, no con el tamano del video crudo. */
    [fuente, canvas].forEach(function(el){
      if(!el) return;
      el.style.top = r.top+'px';
      el.style.left = r.left+'px';
      el.style.width = r.width+'px';
      el.style.height = r.height+'px';
    });
    if(canvas) canvas.classList.add('activo');
  }

  if(!window._mdjHeygenListoListener){

  /* iniciarChromaKeyDJMago() -- reintento calibrado (2026-08-28). El intento

     video en esta pantalla. En vez de elegir un unico punto, el PO pidio

     fraccionAncho = que fraccion del ANCHO del video ocupa el contenedor
     (ver dibujarCover en avatar-heygen-chromakey.js).

     vivo con el PO. El 'cover' automatico original (fraccionAncho=
     undefined) mostraba solo ~29% del ancho del video -- MENOS que el
     ancho real del sujeto (hombros+auriculares, medido en 1138-1144px de
     1920 = 0.593-0.596, con umbral de densidad sobre los 394 frames del
     boomerang -- casi constante: lo que se mueve en el boomerang es la
     cabeza, no los hombros). Se probo 0.60 (con aire, elegido entre 3
     opciones) y luego 0.593 (el ancho exacto sin margen) pero NINGUNO de
     los dos se sintio "full-bleed" real: a esa distancia la CABEZA (mas
     angosta que los hombros) siempre deja aire visible a los lados aunque
     los hombros ya no se corten -- es geometria del sujeto, no un bug.
     El PO vio un espectro de 4 encuadres reales (0.593/0.50/0.42/0.35) y
     eligio 0.42 como default: a esa distancia los hombros/auriculares
     llegan practicamente al borde (recorte minimo aceptado a proposito).

     del video, ampliado); MAYOR = camara mas lejos. */
  var ZOOM_NIVELES = [0.42, 0.35, 0.50]; /* 0=default full-bleed / 1=primer plano cerrado / 2=plano medio con mas aire */

       canvas comparte z-index con ella, y en sus zonas transparentes (el
       fondo ya recortado) se veria la foto por debajo -- tapando la red de
       particulas real de la app, que es justo lo que este recorte quiere
       revelar. Mientras el video carga su primer frame puede haber un
       instante sin nada encima de las particulas; se prefiere eso a que la
       foto quede pegada de fondo todo el tiempo. */
    var fig = stage.querySelector('.avatar-fig');

      suprimirSpill:1.0, /* afinado del croma key -- ver avatar-heygen-chromakey.js */
      fraccionAncho: ZOOM_NIVELES[state.avatarZoomNivel],
      /* zonaProtegida: elipse de rotoscopia, calibrada UNICAMENTE para el
         encuadre viejo del nivel 0 (el cover automatico que este mismo
         cambio reemplazo). Con el nuevo default (0.60) la cabeza queda en
         otra posicion/escala y esa elipse ya no calza -- verificado en 9
         frames repartidos por todo el clip que, con este encuadre mas
         alejado, el spill de compresion ya no se nota sin ella. Queda
         desactivada en los 3 niveles hasta que se recalibre una nueva para
         el encuadre 0.60 (si hiciera falta). */
      zonaProtegida: undefined };
    stage._djChroma = window.AvatarHeygenChromaKey.iniciarChromaKey(
      [videoA, videoB], canvas, opciones
    );
    /* El mismo objeto "opciones" se guarda para poder mutarlo en vivo
       (JS pasa objetos por referencia) -- el loop de dibujo (tick(), en
       avatar-heygen-chromakey.js) lee esta misma referencia en cada
       fotograma, asi que cambiar opciones.fraccionAncho aca se ve reflejado
       de inmediato, sin reiniciar el chroma key. */
    stage._djChromaOpciones = opciones;

    /* Doble toque para ciclar de nivel -- funciona igual con touch (mobile)
       y con click de mouse/trackpad (Fenix/escritorio, cuando se conecte
       ahi). Ventana de 350ms, patron estandar de doble-tap. */
    if(!stage._djZoomDobleTap){
      stage._djZoomDobleTap = true;
      var ultimoTap = 0;
      stage.addEventListener('click', function(){
        var ahora = Date.now();
        if(ahora - ultimoTap < 350){
          ultimoTap = 0;
          state.avatarZoomNivel = (state.avatarZoomNivel + 1) % ZOOM_NIVELES.length;
          if(stage._djChromaOpciones){
            stage._djChromaOpciones.fraccionAncho = ZOOM_NIVELES[state.avatarZoomNivel];
            /* zonaProtegida desactivada en los 3 niveles -- ver el comentario
               donde se arma "opciones" mas arriba */
            stage._djChromaOpciones.zonaProtegida = undefined;
          }
          haptic('light');
        } else {
          ultimoTap = ahora;
        }
      });
    }
  }

  /* La conversacion se guarda en state.chat y se REPINTA tras cada render.
     Antes se pegaba directamente al DOM, y como startUnderstanding() llama a
     render() justo despues, el mensaje recien escrito se borraba al enviarlo.
     El estado es la fuente; el DOM, un reflejo. */
  function pintarChat(){

  /* ═══ CONSTITUCION DEL ARTEFACTO · aprobacion humana de SMS ═══
     ELIXIS NUNCA envia. Solo deja el borrador en la cola. El envio real lo
     hace elixis-sms-dispatch, una funcion que el modelo ni siquiera tiene en
     su inventario de herramientas y que exige JWT de owner/staff mas una fila
     que ya estuviera encolada. El telefono y el texto se leen DE LA FILA, no
     de lo que se pida aqui: asi un numero dictado al vuelo no puede colarse.
     El candado esta en la cerradura, no en el prompt. */
  function encolarSms(sms){

  }
  function tarjetaSms(m){
    var sms=m.sms;
    var card=document.createElement('div');
    card.className='sms-card'+(m.estado!=='pendiente'?' resuelta':'');
    card.innerHTML =
      '<div class="sms-h">'+svg('shield','width="14"')+' SMS listo para aprobar</div>'+
      '<div class="sms-dest">Para <b>'+esc(sms.destinatario||'(sin nombre)')+'</b>'+
        '<span class="sms-tel">'+esc(sms.telefono||'')+'</span></div>'+
      '<div class="sms-msg"></div>'+
      (m.estado==='pendiente'
        ? '<div class="sms-acc"><button class="sms-ok" data-a="enviar">Aprobar y enviar</button>'+
          '<button class="sms-no" data-a="cancelar">Cancelar</button></div>'
        : '')+
      '<div class="sms-estado"></div>';
    card.querySelector('.sms-msg').textContent = sms.mensaje||'';
    card.querySelector('.sms-estado').textContent = m.nota||'';
    var botones=card.querySelectorAll('button');
    Array.prototype.forEach.call(botones,function(b){
      b.onclick=function(){ despacharSms(m,b.getAttribute('data-a'),botones,card); };
    });
