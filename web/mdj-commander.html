  }
  async function despacharSms(m, accion, botones, card){
    Array.prototype.forEach.call(botones,function(x){ x.disabled=true; });  /* nada de doble clic */
    card.querySelector('.sms-estado').textContent = accion==='enviar'?'Enviando…':'Cancelando…';
    var base = (typeof window.mdbSupabaseFunctionUrl==='function')
      ? window.mdbSupabaseFunctionUrl('elixis-sms-dispatch') : null;
    function cerrar(txt, resuelto){
      m.nota=txt; if(resuelto) m.estado=accion==='enviar'?'enviado':'cancelado';
      pintarChat();
    }
    function reabrir(txt){ m.nota=txt; pintarChat(); }
    if(!base){ cerrar('No pude ubicar el despachador.',false); return; }
    var url = base + (base.indexOf('?')===-1?'?':'&') + 'id=' + encodeURIComponent(m.sms.id)
            + (accion==='cancelar'?'&accion=cancelar':'');
    try{
      var res = await fetch(url,{ method:'POST', headers:_invokeHeaders() });
      var d={}; try{ d=await res.json(); }catch(_){}
      if(res.status===401){ _goLogin(); return; }
      if(res.status===403){ cerrar('Tu cuenta no puede enviar SMS de la empresa.',true); return; }
      if(res.status===409){ cerrar('Este mensaje ya estaba resuelto ('+(d.estado||'?')+').',true); return; }
      if(!res.ok || d.ok!==true){
        reabrir('No se pudo '+(accion==='enviar'?'enviar':'cancelar')+'. Inténtalo de nuevo.');
        return;
      }
      cerrar(accion==='enviar' ? '✓ Enviado a '+(d.destinatario||m.sms.destinatario) : 'Cancelado. No salió nada.', true);
      haptic('light');
    }catch(e){
      reabrir('Sin conexión con el despachador.');
    }
  }
  function decir(quien, texto){
    if(!texto) return;
    state.chat.push({q:quien, t:texto});
    if(state.chat.length>200) state.chat.splice(0, state.chat.length-200);
    pintarChat();
  }
  function demoOrder(){ return ''; }
  /* ═══════════════════════════════════════════════════════════════════
     MOTOR DE VOZ EN TIEMPO REAL (FÉNIX)

     Sustituye al ciclo viejo — SpeechRecognition del navegador -> texto ->
     elixis-orchestrator -> elixis-tts — que medía entre 1 y 2,8 segundos por
     turno y no permitía interrumpir. Ahora el audio va y viene por WebRTC
     contra elixis-realtime-session: 171-364 ms medidos, y se le puede cortar
     a media frase.

     La CARA no se toca. Este motor solo mueve setAvatar() y state.agentReply,
     que es lo que la carrocería ya sabía leer.
     ═══════════════════════════════════════════════════════════════════ */
  var RT = (function(){
    var pc=null, dc=null, mic=null, spk=null, micPrecalentado=null, conectando=false;
    var ac=null, sink=null, anMic=null, anRem=null, buf=null, rafPulso=0;
    var sesion=null, nivelBloque=0, hb=0, t0=0;
    var hablando=false;

    function fnUrl(accion){
      if(!window.mdbSupabaseFunctionUrl) return null;
      var u = window.mdbSupabaseFunctionUrl('elixis-realtime-session');
      if(!u) return null;
      return accion ? u + (u.indexOf('?')===-1?'?':'&') + 'action=' + accion : u;
    }
    function usados(){ return t0 ? Math.max(0, Math.round((Date.now()-t0)/1000)) : 0; }

    /* ── Fuente de energia del branding ──────────────────────────────
       Un sumidero mudo mantiene el grafo bombeando sin emitir sonido; sin
       el, algunos navegadores no alimentan un analizador que no llega al
       destino y el orbe se queda plano. */
    function orbe(){ return document.querySelector('.nav-orb'); }
    function analizador(stream){
      /* Ya era un singleton (se crea UNA vez, se reusa siempre -- nunca se
         cierra/suspende/recrea en ningun lado de este archivo, confirmado).
         Unico agregado real (2026-08-27, "las micro-caidas persisten"):
         pedir 48000Hz explicito en vez de dejar que el navegador elija --
         si el hardware ya corre a 48000 (lo mas comun) esto no cambia nada;
         si corriera a otra tasa, evita que el navegador tenga que resamplear
         para hacerlos coincidir. */
      if(!ac){
        var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
        try{ ac=new AC({ sampleRate: 48000 }); }catch(e){ ac=new AC(); } /* algunos navegadores viejos no aceptan la opcion */
        sink=ac.createGain(); sink.gain.value=0; sink.connect(ac.destination);
        buf=new Uint8Array(256);
      }
      try{
        var an=ac.createAnalyser(); an.fftSize=512; an.smoothingTimeConstant=0.72;
        ac.createMediaStreamSource(stream).connect(an); an.connect(sink);
        return an;
      }catch(e){ return null; }
    }
    function nivel(an){
      if(!an||!buf) return 0;
      an.getByteTimeDomainData(buf);
      var s=0; for(var i=0;i<buf.length;i++){ var v=(buf[i]-128)/128; s+=v*v; }
      return Math.min(1, Math.sqrt(s/buf.length)*3.2);
    }
    var pulso=0, vivo=false;
    function latir(){
      /* Modo presentacion: HeyGen habla con SU propia voz (hablar(), ver
         evento() en response.done) -- si la de OpenAI tambien sonara,
         serian dos voces encimadas. Se revisa cada cuadro, no una sola
         vez al activar, para que quede correcto sin importar en que
         momento exacto se toco el boton. */
      if(spk) spk.muted = !!state.modoPresentacion;
      var o=orbe();
      if(o){
        /* La barra inferior se vuelve a dibujar cuando cambia el estado, y el
           orbe pasa a ser OTRO elemento. Si solo se marcara al encender, la
           clase se perderia en el primer redibujado y el radar se apagaria
           solo. Se reafirma cada frame: sale barato y no se pierde nunca. */
        if(vivo && !o.classList.contains('live')) o.classList.add('live');
        var an = hablando ? (anRem||anMic) : anMic;
        var objetivo = nivel(an);
        pulso += (objetivo - pulso) * 0.3;
        if(pulso < 0.002) pulso = 0;
        o.style.setProperty('--pulso', pulso.toFixed(3));
        o.style.transform = 'scale(' + (1 + pulso * 0.09).toFixed(4) + ')';
        /* La opacidad respira con la voz: en silencio se atenua, en los picos
           se enciende del todo. Es lo que le da la pulsacion al boton. */
        o.style.opacity = (0.62 + pulso * 0.38).toFixed(3);
        o.classList.toggle('rx', !hablando);
        /* La foto (.avatar-fig) queda 100% estatica por orden expresa
           (2026-08-26): este nivel real alimenta la red de particulas
           (fxDraw() lee FX.voiceLevel), el anillo del boton, y -- solo si
           hay fotogramas reales configurados en MDB_AVATAR_VISEMES -- la
           capa de sprites de boca, que si no hay fotogramas se queda
           invisible para siempre (ver avatar-viseme-sprites.js). */
        FX.voiceLevel = pulso;
        /* Apagado a pedido explicito del PO (2026-08-27): el intercambio de
           bocas en tiempo real se veia y se sentia como un muñeco de
           marioneta abriendo y cerrando la boca -- "me estresa". djmago
           ahora es solo el loop calmado (elixis-idle.mp4), sin animar la
           boca -- "se ve vivo" igual, por el movimiento del cuerpo. No se
           borra avatar-viseme-sprites.js ni sus imagenes por si se
           reconsidera mas adelante; solo se dejo de llamar. */
      }
      rafPulso = requestAnimationFrame(latir);
    }
    function encender(){
      vivo=true;
      var o=orbe(); if(o){ o.classList.add('live','rx'); }
      if(!rafPulso) rafPulso = requestAnimationFrame(latir);
    }
    function apagar(){
      vivo=false;
      if(rafPulso){ cancelAnimationFrame(rafPulso); rafPulso=0; }
      var o=orbe(); if(o){ o.classList.remove('live','rx');
        o.style.removeProperty('--pulso'); o.style.removeProperty('transform');
        o.style.removeProperty('opacity'); }
      pulso=0; anMic=null; anRem=null;
      if(ac){ try{ ac.close(); }catch(e){} ac=null; sink=null; }
      /* Colgar la llamada no debe dejar una sesion de HeyGen viva de fondo --
         se apaga junto con todo lo demas, no solo con el boton dedicado. */
      if(state.modoPresentacion){
        state.modoPresentacion=false;
        if(window.AvatarHeygenStream) window.AvatarHeygenStream.detener();
        var btnHg=document.getElementById('btnHeygenPresent');
        if(btnHg) btnHg.textContent=T('Modo presentación','Presentation mode');
      }
    }

    /* Herramientas: ELIXIS pide, el navegador ejecuta CON el JWT del usuario.
       El candado de cada función sigue mandando. */
    async function accion(nombre, cuerpo){
      var u = fnUrl(nombre);
      if(!u) return { ok:false, motivo:'fallo' };
      try{
        var r = await fetch(u,{ method:'POST', headers:_invokeHeaders(), body:JSON.stringify(cuerpo) });
        var d={}; try{ d=await r.json(); }catch(_){}
        if(r.status===401||r.status===403) return { ok:false, motivo:'sin_acceso' };
        if(!r.ok) return { ok:false, motivo:'fallo' };
        return d;
      }catch(e){ return { ok:false, motivo:'fallo' }; }
    }

    async function herramienta(item){
      setAvatar('executing');
      var args={}; try{ args=JSON.parse(item.arguments||'{}'); }catch(_){}
      var out;
      if(item.name==='consultar_elixis')      out = await accion('consultar',     { pregunta:String(args.pregunta||'') });
      else if(item.name==='recordar')         out = await accion('memory_write',  { clave:String(args.clave||''), hecho:String(args.hecho||'') });
      else if(item.name==='olvidar')          out = await accion('memory_forget', { clave:String(args.clave||'') });
      else                                    out = { ok:false, motivo:'herramienta_desconocida' };

      if(!dc || dc.readyState!=='open') return;
      dc.send(JSON.stringify({ type:'conversation.item.create',
        item:{ type:'function_call_output', call_id:item.call_id, output:JSON.stringify(out) } }));
      dc.send(JSON.stringify({ type:'response.create' }));   /* sin esto se queda mudo */
    }

    function linea(txt, cls){
      var c=document.getElementById('convo'); if(!c) return null;
      var d=document.createElement('div'); d.className=cls||'line';
      if(cls==='sys') d.textContent=txt; else d.innerHTML='<b>'+AGENT+':</b> '+esc(txt);
      c.appendChild(d); c.scrollTop=c.scrollHeight; return d;
    }
    function rotulo(t){ var e=document.getElementById('convoState'); if(e) e.textContent=t||''; }

    /* Guarda una linea en elixis_session_threads (TTL 7 dias). Unica via
       de escritura: la RPC exige auth.uid() adentro, nadie puede escribir
       en el hilo de otro. Best-effort, igual que la memoria de largo
       plazo -- si falla, la conversacion sigue igual. */
    function guardarHilo(rol, contenido){
      if(!_supa || !_supa.rpc || !contenido) return;
      /* BUG real encontrado en vivo (2026-08-27, con el PO investigando en
         la consola): .catch() directo sobre esto tiraba "catch is not a
         function" -- el "query builder" que devuelve _supa.rpc() es
         thenable (soporta .then) pero no siempre expone .catch como metodo
         propio. Ese error, al no estar atrapado, cortaba en seco TODO lo
         que seguia en 'response.done' (mas abajo en evento()): hablar()
         de HeyGen nunca se llamaba, hablando nunca volvia a false, y
         setAvatar('listening') nunca corria -- el avatar se quedaba
         trabado en "hablando" para siempre. Con try/catch + .then() de dos
         argumentos (la forma que CUALQUIER thenable tiene que soportar),
         esto vuelve a ser lo que el comentario de arriba siempre dijo que
         era: best-effort, nunca rompe la conversacion. */
      try{
        /* MODO_ENFOQUE_DB_OK: la tabla solo acepta los 5 valores viejos por
           CHECK constraint -- mandar 'musica'/'negocios'/'merch' de una
           tiraria un error de Postgres en cada guardado mientras ese modo
           este activo. Se manda null en vez de inventar una migracion
           nueva sin permiso (ver MC_CONTEXTOS mas arriba). */
        var modoParaDB = MODO_ENFOQUE_DB_OK[state.modoEnfoque] ? state.modoEnfoque : null;
        var q = _supa.rpc('elixis_thread_append', { p_rol:rol, p_contenido:contenido, p_modo_enfoque:modoParaDB });
        if(q && typeof q.then === 'function'){
          q.then(function(){}, function(e){ console.warn('[ELIXIS] hilo no guardado:', e); });
        }
      }catch(e){
        console.warn('[ELIXIS] hilo no guardado:', e);
      }
    }

    /* Devuelve el prefijo de "texto" hasta el ULTIMO punto/exclamacion/
       interrogacion seguido de un espacio (oracion completa), o '' si
       todavia no hay ninguna oracion cerrada. El punto no cuenta si le
       sigue un digito (evita cortar "3.5" como si fueran dos oraciones) --
       heuristica simple a proposito: esto solo decide CUANDO mandar audio a
       HeyGen en pedazos, nunca cambia el texto real que se lee ni se guarda. */
    function extraerOracionCompleta(texto){
      var m = texto.match(/^[\s\S]*[.!?…](?!\d)\s/);
      return m ? m[0] : '';
    }

    function evento(m){
      switch(m.type){
        /* Lo que dice el humano, por escrito -- esta pagina no lo capturaba
           en absoluto (a diferencia de elixis-console.html y del modulo
           compartido, que ya lo tenian). Se agrega ahora, no solo para
           guardar el hilo: sin esto tampoco habia forma de persistir la
           mitad de la conversacion. */
        case 'conversation.item.input_audio_transcription.completed': {
          var dicho = (m.transcript || '').trim();
          if(dicho) guardarHilo('yo', dicho);
          break;
        }
        case 'input_audio_buffer.speech_started':
          hablando=false; state.agentReply=null; state.agentLine=null; state._hgEnviado=0;
          rotulo(T('Te escucho','Listening'));
          setAvatar('listening'); break;

        case 'input_audio_buffer.speech_stopped':
          rotulo(T('Pensando','Thinking'));
          setAvatar('understanding'); break;

        case 'response.output_audio_transcript.delta':
          if(!hablando){ hablando=true; state.agentReply=''; state.agentLine='real'; state._hgEnviado=0;
            RT._fila = linea('', 'line'); rotulo(T('Hablando','Speaking')); }
          state.agentReply += (m.delta||'');
          /* La preferencia de "sonrisa" que esto fijaba ya no la lee nadie
             (pintarNivel(), el unico consumidor, se apago mas abajo en
             latir() -- ver ese comentario). Se quita de aqui tambien para
             no dejar una llamada que no hace nada. */
          if(RT._fila) RT._fila.innerHTML='<b>'+AGENT+':</b> '+esc(state.agentReply);
          var c=document.getElementById('convo'); if(c) c.scrollTop=c.scrollHeight;
          /* "se esta demorando mucho en responder" (2026-08-27): antes Katya
             esperaba a response.done (el LLM terminando de escribir TODA la
             respuesta) para recien ahi pedir el audio completo. Ahora, apenas
             una oracion queda cerrada dentro del texto que va llegando, se
             manda ESA oracion sola -- Katya arranca a hablar con la primera
             oracion mientras el LLM todavia esta escribiendo el resto, igual
             que ya hace la voz nativa de OpenAI del lado DJMago. La cola
             serial de hablar() (avatar-heygen-stream.js) se encarga de que
             las oraciones salgan en orden sin pisarse. */
          if(state.modoPresentacion && window.AvatarHeygenStream){
            var pendiente = state.agentReply.slice(state._hgEnviado);
            var oracion = extraerOracionCompleta(pendiente);
            if(oracion){
              state._hgEnviado += oracion.length;
              window.AvatarHeygenStream.hablar(oracion.trim());
            }
          }
          setAvatar('speaking'); break;

        case 'response.done':
          /* Las llamadas a herramienta viajan DENTRO de response.done. Si se
             cierra el turno aquí sin mirarlas, la consulta no sale nunca. */
          var salida = (m.response && m.response.output) || [];
          var llamadas = salida.filter(function(i){ return i && i.type==='function_call'; });
          if(llamadas.length){ llamadas.forEach(herramienta); break; }
          /* El hilo se guarda completo aqui, no en cada delta -- una fila
             por turno, no una por fragmento. state.agentReply ya trae el
             texto acumulado, no hace falta un buffer nuevo. */
          if(hablando && state.agentReply) guardarHilo('elixis', state.agentReply);
          /* Solo el RESTO que las oraciones ya mandadas en cada delta todavia
             no cubrieron (ej. la ultima frase corta que cierra recien aca, o
             una respuesta de una sola oracion que nunca disparo el envio de
             arriba) -- mandar state.agentReply entero de nuevo duplicaria el
             audio de las oraciones que ya se dijeron. */
          if(state.modoPresentacion && hablando && state.agentReply && window.AvatarHeygenStream){
            var resto = state.agentReply.slice(state._hgEnviado||0).trim();
            if(resto) window.AvatarHeygenStream.hablar(resto);
          }
          hablando=false; RT._fila=null; rotulo(T('Te escucho','Listening'));
          setAvatar('listening'); break;

        case 'error':
          toast(T('Error en el canal de voz','Voice channel error'),'warn'); break;
      }
    }

    /* Pre-calentamiento del microfono (2026-08-27, "corte de 0.5s en Serato
       al activar la voz"): el PO usa Serato DJ en la MISMA maquina -- pedir
       un microfono NUEVO cada vez que se activa la voz hace que el sistema
       operativo reconfigure el driver de audio para tratarlo como una
       llamada VoIP (procesamiento de eco/ruido activado), y esa
       reconfiguracion puede cortar por una fraccion de segundo el audio de
       OTRO programa que este usando la misma interfaz. Dos cambios: (1)
       constraints en RAW (todo el procesamiento de voz apagado) para no
       disparar esa reconfiguracion, (2) pedir el permiso UNA sola vez (al
       entrar a Comando, ver SCREENS.command) y reusar el MISMO stream entre
       llamadas -- start()/stop() ya no vuelven a pedir hardware, solo
       activan/desactivan el track (ver mas abajo). */
    var CONSTRAINTS_MIC_RAW = { audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false, channelCount:1 } };
    /* Preferir el microfono integrado y evitar interfaces de DJ/USB por
       nombre (2026-08-27, "las micro-caidas persisten") -- pedirle el mismo
       reloj de audio a una interfaz que Serato ya esta usando (Pioneer/Rane/
       DDJ/DJM/etc.) es una causa real de glitches. enumerateDevices() SOLO
       devuelve nombres reales si el origen ya tiene permiso de microfono
       concedido de antes (si no, todo viene con label vacio) -- por eso esto
       se prueba ANTES de pedir permiso: si hay nombres, se usa el mejor
       candidato en la MISMA llamada a getUserMedia; si no hay nombres
       (primera vez que se usa la app en este navegador), se seria una
       segunda llamada a getUserMedia para corregir el dispositivo despues --
       exactamente el patron que este pedido quiere evitar -- asi que en ese
       caso se sigue de largo con el dispositivo por defecto del sistema,
       sin reintentar. Una sola vez (la primera vez de siempre en ese
       navegador) puede no evitar la interfaz USB; de ahi en mas el
       navegador recuerda el permiso y esto funciona normal. */
    function elegirMicrofono(dispositivos){
      /* Lista negra ampliada (2026-08-27, confirmado en vivo: Pioneer
         DDJ-FLX10 y similares) -- union de la lista original mas las marcas
         que el PO identifico por hardware real, nunca se achica una lista
         de seguridad, solo se agranda. */
      var EVITAR = /pioneer|serato|rane|ddj|flx|denon|xdj|traktor|djm|numark|reloop|hercules|usb audio|aggregate device/i;
      var PREFERIR = /built-?in|integrad|macbook|airpods/i;
      var entradas = dispositivos.filter(function(d){ return d.kind==='audioinput' && d.label; });
      if(!entradas.length) return null; /* sin permiso previo -- labels vacios, no hay nada que decidir */
      var preferido = entradas.filter(function(d){ return PREFERIR.test(d.label); })[0];
      if(preferido) return preferido.deviceId;
      var seguro = entradas.filter(function(d){ return !EVITAR.test(d.label); })[0];
      return seguro ? seguro.deviceId : null;
    }
    async function precalentarMic(){
      if(micPrecalentado && micPrecalentado.getAudioTracks().some(function(t){ return t.readyState==='live'; })){
        return micPrecalentado;
      }
      try{
        var constraints = CONSTRAINTS_MIC_RAW;
        try{
          var deviceId = elegirMicrofono(await navigator.mediaDevices.enumerateDevices());
          if(deviceId){
            constraints = { audio: Object.assign({}, CONSTRAINTS_MIC_RAW.audio, { deviceId: { exact: deviceId } }) };
          }
        }catch(e){ /* enumerateDevices puede fallar sin permiso -- seguir con el default */ }
        var s = await navigator.mediaDevices.getUserMedia(constraints);
        s.getAudioTracks().forEach(function(t){ t.enabled=false; }); /* mudo hasta que start() lo active de verdad */
        micPrecalentado = s;
        return s;
      }catch(e){
        /* Silencioso a proposito: esto puede correr ANTES de que el usuario
           pida hablar (al entrar a Comando) -- un toast de error ahi
           confundiria mas de lo que ayuda. start() reintenta solo, con su
           propio aviso, cuando de verdad haga falta. */
        return null;
      }
    }

    async function start(){
      /* conectando (2026-08-28, "hey hey hey" en loop reportado en vivo):
         "if(pc) return" NO alcanza para evitar un doble arranque -- pc
         recien se asigna mas abajo, DESPUES de "await precalentarMic()".
         Durante esa espera pc sigue siendo null, asi que un segundo toque
         al orbe (muy normal si el usuario no ve respuesta inmediata) pasa
         el mismo guard sin problema -- las dos llamadas siguen de largo en
         paralelo, cada una termina creando su PROPIO RTCPeerConnection y
         reproduciendo su propia respuesta del modelo por encima de la
         otra. "conectando" se pone en true ANTES de cualquier await (aca
         mismo, sincronico) y cierra esa ventana por completo -- se resetea
         en el finally de abajo, tanto si termina bien como si corta por
         cualquier error, para no dejar el boton trabado. */
      if(pc || conectando) return;
      conectando = true;
      try{
      var url = fnUrl(null);
      if(!url){ toast(T('No pude ubicar el servidor de voz','Voice server not found'),'warn'); return; }
      url += (url.indexOf('?')===-1?'?':'&') + 'voice=' + (localStorage.getItem('elixis_voice')||'ash')
           + '&vad=' + (localStorage.getItem('elixis_vad')||'medium')
           + (state.modoEnfoque ? '&modo=' + encodeURIComponent(state.modoEnfoque) : '');

      setAvatar('understanding');
      try{
        mic = await precalentarMic();
        if(!mic) throw new Error('sin_stream');
        mic.getAudioTracks().forEach(function(t){ t.enabled=true; });
      }catch(e){
        toast(T('Necesito permiso de micrófono','Microphone permission needed'),'warn');
        setAvatar('idle'); return;
      }

      pc = new RTCPeerConnection();
      spk = _voiceEl();                       /* reusa el elemento ya "armado" */
      pc.ontrack = function(ev){
        try{ spk.srcObject = ev.streams[0]; spk.play(); }catch(_){ }
        anRem = analizador(ev.streams[0]);   /* la voz de ELIXIS mueve el orbe */
      };
      mic.getAudioTracks().forEach(function(t){ pc.addTrack(t, mic); });
      anMic = analizador(mic);               /* tu voz lo mueve mientras escucha */

      dc = pc.createDataChannel('oai-events');
      dc.onopen = function(){
        linea(T('Canal de voz conectado. Habla con normalidad.','Voice channel connected. Speak normally.'),'sys');
        rotulo(T('Te escucho','Listening'));
        encender();                          /* modo agente: el fenix emite */
        setAvatar('listening'); haptic('light');
      };
      dc.onmessage = function(ev){ var m; try{ m=JSON.parse(ev.data); }catch(_){ return; } evento(m); };
      pc.onconnectionstatechange = function(){
        if(pc && ['failed','disconnected','closed'].indexOf(pc.connectionState)!==-1) stop(true);
      };

      var offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      var h = _invokeHeaders(); h['Content-Type']='application/sdp';
      var res;
      try{ res = await fetch(url,{ method:'POST', headers:h, body:offer.sdp }); }
      catch(e){ toast(T('No pude conectar la voz','Could not connect voice'),'warn'); stop(true); return; }

      if(res.status===401){ _goLogin(); return; }
      if(res.status===402){
        var q={}; try{ q=await res.json(); }catch(_){}
        toast(q.error==='safety_cap_reached'
          ? T('Tope técnico alcanzado','Technical cap reached')
          : T('Sin saldo de voz · continúa por texto','Out of voice credit · continue by text'),'warn');
        state.voiceMode='text'; stop(true); return;
      }
      if(res.status===403){ toast(T('Esta cuenta no tiene acceso de voz','No voice access for this account'),'warn'); stop(true); return; }
      if(res.status===429){ toast(T('Demasiadas sesiones · espera un momento','Too many sessions · wait a moment'),'warn'); stop(true); return; }
      if(!res.ok){ toast(T('La voz no está disponible ahora','Voice unavailable right now'),'warn'); stop(true); return; }

      sesion     = res.headers.get('x-elixis-session');
      nivelBloque= parseInt(res.headers.get('x-elixis-granted-seconds')||'0',10);
      t0         = Date.now();

      await pc.setRemoteDescription({ type:'answer', sdp: await res.text() });

      /* El latido evita que el barrendero dé la sesión por abandonada y la
         cobre entera. */
      if(sesion){
        hb = setInterval(function(){
          var u = fnUrl('heartbeat'); if(!u) return;
          fetch(u + '&session=' + encodeURIComponent(sesion), { method:'POST', headers:_invokeHeaders() }).catch(function(){});
        }, 4*60*1000);
      }
      } finally {
        conectando = false;
      }
    }

    /* keepalive: la liquidación sale aunque se cierre la pestaña. Sin esto se
       le cobra al cliente el bloque entero en vez de lo que habló. */
    function liquidar(){
      if(hb){ clearInterval(hb); hb=0; }
      if(!sesion) { t0=0; return; }
      var u = fnUrl('settle');
      var s = sesion; sesion=null;
      var seg = usados(); t0=0;
      if(u) fetch(u + '&session=' + encodeURIComponent(s) + '&used=' + seg,
                  { method:'POST', headers:_invokeHeaders(), keepalive:true }).catch(function(){});
    }

    function stop(silencioso){
      liquidar();
      if(dc){ try{ dc.close(); }catch(_){ } dc=null; }
      if(pc){ try{ pc.close(); }catch(_){ } pc=null; }
      /* NO se llama t.stop() -- eso libera el hardware de verdad, y la
         PROXIMA vez que se hable, start() tendria que pedir un microfono
         nuevo (exactamente el corte de audio que precalentarMic() esta
         evitando). Solo se muta (track.enabled=false); micPrecalentado
         sigue vivo para la proxima llamada. */
      if(mic){ try{ mic.getAudioTracks().forEach(function(t){ t.enabled=false; }); }catch(_){ } mic=null; }
      if(spk){ try{ spk.pause(); spk.srcObject=null; }catch(_){ } }
      hablando=false;
      apagar();
      linea(T('Canal de voz cerrado.','Voice channel closed.'),'sys');
      rotulo('');
      /* Al colgar, el tablero se despide del avatar y vuelve al chat: es el
         estado natural del agente, no una pantalla vacia esperando. */
      state.voiceMode='text';
      state.avatar='idle';
      render();
    }

    window.addEventListener('beforeunload', liquidar);
    /* Modo de enfoque: mismo mecanismo que el modulo compartido de
       staff.html (elixis-voice-session.js) -- session.update a media
       sesion, sin reiniciar la llamada. */
    function actualizarContexto(instrucciones){
      if(!dc || dc.readyState!=='open') return false;
      dc.send(JSON.stringify({ type:'session.update', session:{ instructions:String(instrucciones||'') } }));
      return true;
    }

    return { start:start, stop:stop, activa:function(){ return !!pc; }, actualizarContexto:actualizarContexto, precalentarMic:precalentarMic };
  })();

  /* continuous dialogue: the agent keeps listening & answering until the human ends it */
  function startListening(){
    /* Es un agente con rostro: el chat es la casa y el avatar se presenta
       cuando lo llamas. Llamar a ELIXIS trae al avatar al tablero. */
    state.agentLine=null; state.agentReply=null;
    state.voiceMode='voice'; render();
    RT.start();
  }

  function sendText(){
    var i=$('#cmdText'); if(!i||!i.value.trim()) return;
    if(!state.online){ toast(T('Sin conexión · borrador guardado','Offline · draft saved'),'warn'); return; }
    var txt=i.value.trim();
    /* Se vacia y se encoge ANTES de enviar: en un chat, el campo que se queda
       con lo que acabas de mandar es un error que se nota en el primer uso. */
    i.value=''; i.style.height='auto';
    startUnderstanding(txt);
  }
  /* Repinta SOLO la escena -- clase del escenario y color de la red -- sin
     reconstruir la vista. Hace falta porque al llegar la respuesta se cambiaba
     state.avatar a 'speaking' pero no se repintaba nada: mountFX vive dentro
     de render(), asi que FX.hue se quedaba clavado en el 'magenta' de
     'understanding' PARA SIEMPRE despues del primer mensaje, y la escena
     seguia diciendo "pensando" mientras ELIXIS ya habia contestado.
     No se llama a render() a proposito: reconstruiria el compositor y borraria
     lo que el Capitan pueda estar escribiendo mientras espera. */
  function pintarEscena(st){
    var stage=document.getElementById('avatarStage');
    if(stage){
      var voice = state.voiceMode!=='text' && VCONVO.indexOf(st)>=0;
      stage.className='avatar-stage '+st+(voice?' big':'');
      if(window.AvatarFramePlayer){
        var afp=window.AvatarFramePlayer.montar(stage);
        if(afp) window.AvatarFramePlayer.fijarEstado(afp, st);
      }
      iniciarChromaKeyDJMago(stage);
    }
    mountFX(document.getElementById('avatarFX'), st);
  }
  function startUnderstanding(text){
    /* Lo que escribe el Capitan tambien va a la conversacion: un chat en el
       que solo se ve una de las dos voces no es un chat. */
    decir('yo', text);
    state.avatar='understanding';state.agentReply=null;render();haptic('light');
    askElixis(text).then(function(r){
      if(!r||!r.reply) return; /* 401 ya redirigió al login */
      state.agentReply=r.reply; state.agentLine='real'; state.avatar='speaking';
      pintarEscena('speaking');      /* la red vuelve al oro */
      decir('elixis', r.reply);
      /* La constitucion: ELIXIS solo ENCOLA. Aqui aparece el borrador para que
         lo apruebes tu. El envio real lo hace otra funcion que ELIXIS ni
         conoce, y que exige rol owner/staff. */
      if(r.sms && r.sms.id) encolarSms(r.sms);
      if(state.narracionActiva) speakReal(r.reply);
    });
  }

    v.innerHTML='<div class="pad screen-anim"><div class="card">'+AGENTS.map(function(a,i){var d=a.st==='run'?'d-cyan':'d-muted';return '<button class="lrow tap" style="width:100%;text-align:left" data-ag="'+i+'"><span class="l-ico">'+svg('agents')+'</span><div style="flex:1"><div class="l-t">'+esc(a.n)+'</div><div class="l-s">'+esc(a.task[lang]||a.task.es)+'</div></div><span class="l-r"><span class="dot '+d+'" style="display:inline-block"></span> <span class="mono" style="font-size:11px;color:var(--muted)">'+a.health+'%</span></span></button>';}).join('')+'</div></div>';
    document.querySelectorAll('[data-ag]').forEach(function(b){b.onclick=function(){go('agentDetail',{i:+b.getAttribute('data-ag')});};});
  };
  SCREENS.agentDetail=function(v){
    var a=AGENTS[state.params.i||0];
    renderTopbar({back:true,title:esc(a.n)});
    v.innerHTML='<div class="pad screen-anim">'+
      '<div class="card"><div class="row" style="gap:12px;margin-bottom:10px"><span class="l-ico" style="width:46px;height:46px">'+svg('agents')+'</span><div><div style="font-size:17px;font-weight:700">'+esc(a.n)+'</div><div class="muted" style="font-size:12.5px">'+esc(a.ms[lang]||a.ms.es)+'</div></div><span class="l-r badge '+(a.st==='run'?'b-cyan':'b-muted')+'" style="margin-left:auto">'+(a.st==='run'?'RUNNING':'IDLE')+'</span></div>'+
      '<dl class="kv"><dt>'+T('Tarea actual','Current task')+'</dt><dd>'+esc(a.task[lang]||a.task.es)+'</dd><dt>Health</dt><dd style="color:var(--green)">'+a.health+'%</dd><dt>'+T('Permisos','Permissions')+'</dt><dd>READ · EXECUTE</dd><dt>'+T('Errores','Errors')+'</dt><dd>0</dd></dl></div>'+
      '<div class="btn-col" style="margin-top:14px"><div style="display:flex;gap:10px"><button class="btn" id="agToggle">'+(a.st==='run'?svg('pause')+' Pause':svg('play')+' Activate')+'</button><button class="btn" id="agAsk">'+svg('mic')+' Ask</button></div>'+
      '<button class="btn ghost" id="agAct">'+svg('history')+' View Activity</button></div>'+
      '<div class="conf-note">'+T('La arquitectura profunda de agentes se edita en el Desktop Studio, no aquí.','Deep agent architecture is edited in the Desktop Studio, not here.')+'</div></div>';
    $('#agToggle').onclick=function(){a.st=a.st==='run'?'idle':'run';toast(T('Estado actualizado (demo)','Status updated (demo)'));render();};
    $('#agAsk').onclick=function(){openVoice(true);};
    $('#agAct').onclick=function(){toast(T('Actividad · vista demo','Activity · demo view'),'history');};
  };

  /* STUDIO */
  SCREENS.studio=function(v){
    renderTopbar({back:true,title:'Studio'});
    v.innerHTML='<div class="pad screen-anim">'+
      '<div class="card"><div class="row" style="justify-content:space-between"><div class="row" style="gap:9px"><span class="dot d-green"></span><b>Desktop Studio</b></div><span class="badge b-green">ONLINE</span></div>'+
      '<div class="stat-3" style="margin-top:16px"><div><div class="s-v" style="color:var(--gold)">8</div><div class="s-l">Agents active</div></div><div><div class="s-v" style="color:var(--cyan)">3</div><div class="s-l">Tasks running</div></div><div><div class="s-v" style="color:var(--amber)">'+(state.decisionReady?1:0)+'</div><div class="s-l">Approvals</div></div></div>'+
      '<hr class="hr"><div class="row" style="justify-content:space-between;font-size:13px"><span class="muted">System Health</span><b style="color:var(--green)">98%</b></div></div>'+
      '<div class="card"><div class="sec-h" style="margin-top:0">'+T('Handoff móvil → escritorio','Handoff mobile → desktop')+'</div>'+
      '<p class="muted" style="font-size:13.5px;margin:0 0 12px">'+T('Cualquier documento, misión, cliente o decisión puede enviarse al Workspace Multi-Pantalla. El escritorio continúa desde ese contexto.','Any document, mission, client or decision can be sent to the Multi-Display Workspace. The desktop continues from that context.')+'</p>'+
      '<button class="btn gold" id="stSend">'+svg('desktop')+' Send to Desktop</button></div></div>';
    $('#stSend').onclick=function(){haptic('light');toast('Sent to Studio Workspace (demo)','desktop');};
  };

  /* PROFILE */
  SCREENS.profile=function(v){
    renderTopbar({back:true,title:T('Perfil','Profile'),right:'<button class="icon-btn" id="pfSet">'+svg('settings')+'</button>'});
    v.innerHTML='<div class="pad screen-anim">'+
      '<div class="card" style="text-align:center"><img src="'+AVATAR+'" alt="" style="width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:center top;margin:0 auto 10px;border:2px solid var(--gold-dim)">'+
      '<div style="font-size:19px;font-weight:800">Capitán Gerardo A. Valles</div>'+
      '<div class="agent-role" style="color:var(--gold)">OWNER · EXECUTIVE COMMAND</div>'+
      '<div class="muted" style="font-size:13px;margin-top:4px">Miami DJ Beat LLC</div>'+
      '<div class="row" style="gap:6px;justify-content:center;margin-top:8px"><span class="dot d-green"></span><span style="font-size:12px;color:var(--green)">'+T('En línea','Online')+'</span></div></div>'+
      '<div class="stat-3 card"><div><div class="s-v">32</div><div class="s-l">'+T('Misiones hoy','Missions today')+'</div></div><div><div class="s-v" style="color:var(--amber)">'+(state.decisionReady?1:0)+'</div><div class="s-l">'+T('Pendientes','Pending')+'</div></div><div><div class="s-v" style="color:var(--green)">28</div><div class="s-l">'+T('Completadas','Completed')+'</div></div></div>'+
      '<div class="card">'+[['lang',T('Idioma','Language'),lang==='es'?'Español':'English'],['face',T('Voz','Voice'),T('Push to talk','Push to talk')],['bell',T('Notificaciones','Notifications'),T('Inteligentes','Smart')],['lock',T('Seguridad','Security'),'Face ID'],['studio','Desktop Studio','ONLINE']].map(function(r){return '<div class="lrow"><span class="l-ico">'+svg(r[0])+'</span><span class="l-t" style="flex:1">'+r[1]+'</span><span class="muted" style="font-size:13px">'+r[2]+'</span></div>';}).join('')+'</div>'+
      '<button class="btn danger" id="pfOut" style="margin-top:14px">'+svg('logout')+' '+T('Cerrar sesión','Sign out')+'</button></div>';
    $('#pfSet').onclick=function(){go('settings');};
    $('#pfOut').onclick=function(){confirmAction({danger:true,title:T('¿Cerrar sesión?','Sign out?'),body:T('Volverás a la autenticación.','You will return to authentication.'),ok:T('Cerrar sesión','Sign out'),onOk:function(){location.reload();}});};
  };

  /* SETTINGS */
  SCREENS.settings=function(v){
    renderTopbar({back:true,title:T('Ajustes','Settings')});
    v.innerHTML='<div class="pad screen-anim ajustes">'+
      '<div class="sec-h">'+T('Idioma','Language')+'</div><div class="card" style="padding:8px"><div class="tabs" style="margin:0"><button class="'+(lang==='es'?'on':'')+'" data-lang="es">Español</button><button class="'+(lang==='en'?'on':'')+'" data-lang="en">English</button></div></div>'+
      '<div class="sec-h">'+T('Modo de voz','Voice mode')+'</div><div class="card">'+
      [['ptt','Push to talk',true],['cont',T('Conversación continua','Continuous conversation'),false],['text',T('Solo texto','Text only'),false]].map(function(r){return '<div class="lrow"><span class="l-t" style="flex:1">'+r[1]+'</span>'+(r[2]?'<span class="badge b-green">'+T('ACTIVO','ACTIVE')+'</span>':'<span class="muted" style="font-size:12px">'+T('Tocar','Tap')+'</span>')+'</div>';}).join('')+'</div>'+
      '<div class="sec-h">'+T('Conexión','Connection')+'</div><div class="card"><button class="lrow tap" id="offToggle" style="width:100%;text-align:left"><span class="l-ico" style="color:'+(state.online?'var(--green)':'var(--red)')+'">'+svg(state.online?'shield':'warn')+'</span><div style="flex:1"><div class="l-t">'+(state.online?T('En línea','Online'):'OFFLINE')+'</div><div class="l-s">'+T('Toca para simular offline','Tap to simulate offline')+'</div></div><span class="badge '+(state.online?'b-green':'b-red')+'">'+(state.online?'ON':'OFF')+'</span></button></div>'+
      '<div class="sec-h">'+T('Privacidad','Privacy')+'</div><div class="card"><div class="lrow"><span class="l-ico">'+svg('mic')+'</span><span class="l-t" style="flex:1">'+T('Micrófono','Microphone')+'</span><span class="badge b-muted">'+T('INACTIVO','OFF')+'</span></div><div class="lrow"><span class="l-ico">'+svg('lock')+'</span><span class="l-t" style="flex:1">'+T('Datos cifrados','Encrypted data')+'</span><span class="badge b-green">ON</span></div></div>'+
      '<div class="conf-note">ELIXIS v0.1 · Miami DJ Beat LLC</div></div>';
    document.querySelectorAll('[data-lang]').forEach(function(b){b.onclick=function(){lang=b.getAttribute('data-lang');localStorage.setItem('mdjc_lang',lang);render();};});
    $('#offToggle').onclick=function(){state.online=!state.online;render();renderOffline();};
  };

  /* CONVERSATION (long) */
  SCREENS.conversation=function(v){
    renderTopbar({back:true,title:'ELIXIS',sub:T('Conversación','Conversation')});
    v.innerHTML='<div class="pad screen-anim" style="display:flex;flex-direction:column;min-height:100%">'+
      '<div class="avatar-stage speaking" style="width:170px;height:186px;margin:0 auto 8px" id="cvStage"><canvas class="avatar-fx" id="cvFX"></canvas><div class="avatar-baseglow"></div><img class="avatar-fig" src="'+AVATAR+'"></div>'+
      '<div style="flex:1">'+
      msgBubble('me',T('Analiza esta compañía.','Analyze this company.'))+
      msgBubble('ai',T('Encontré su web. ¿Quieres análisis comercial o técnico?','Found their website. Commercial or technical analysis?'))+
      msgBubble('me',T('Ambos.','Both.'))+
      msgBubble('ai',T('He terminado. Detecté seis oportunidades; tres son importantes. Mi recomendación comercial es $2,500. ¿Revisamos la propuesta?','Done. Found six opportunities; three are important. My commercial recommendation is $2,500. Review the proposal?'))+
      '</div>'+
      '<div class="qr" style="justify-content:flex-start"><button class="btn gold" id="cvReview" style="width:auto">'+T('Ver propuesta','View proposal')+'</button><button class="btn" id="cvVoice" style="width:auto">'+svg('mic')+'</button></div></div>';
    $('#cvReview').onclick=function(){go('decisionDetail',{id:'DEC-Mojitos'});};
    $('#cvVoice').onclick=function(){openVoice(true);};
    mountFX($('#cvFX'),'speaking');
  };
  function msgBubble(who,text){return '<div style="max-width:82%;margin:6px 0;padding:11px 14px;border-radius:15px;font-size:14.5px;'+(who==='me'?'margin-left:auto;background:var(--gold-dim);border:1px solid var(--gold-dim);border-bottom-right-radius:5px':'background:var(--elev2);border:1px solid var(--line);border-bottom-left-radius:5px')+'">'+esc(text)+'</div>';}

  function badge(k,t){return '<span class="badge b-'+k+'">'+t+'</span>';}

  /* ───── render ───── */
  function render(){
    var v=$('#view');
    renderTopbar({title:''}); // reset; screen sets it
    (SCREENS[state.screen]||SCREENS.command)(v);
    renderNav();
    renderFab();   /* solo limpia un resto si quedara alguno */
  }
  function renderOffline(){
    var b=$('#offlineBanner');
    b.innerHTML = state.online? '' : '<div class="offline-banner">'+svg('warn','width="12" style="vertical-align:-2px"')+' OFFLINE · '+T('las órdenes se guardan como borrador','orders saved as draft')+'</div>';
  }

  /* clock */

  /* splash → auth → command */
  $('#splashLogo').src=LOGO;
  setTimeout(function(){var a=$('#authTxt');if(a)a.textContent=T('Autenticado ✓','Authenticated ✓');},1500);
  setTimeout(function(){$('#splash').classList.add('hide');},2300);
  setTimeout(function(){var s=$('#splash');if(s)s.style.display='none';},2900);

  renderOffline();
  render();
})();
</script>
</body>
</html>
