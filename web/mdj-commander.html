<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>MDJ COMMANDER — AI Executive Command · Miami DJ Beat LLC</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
<script>
    /* FIX-LEGACY-SUPABASE-01 (2026-08-19) · el respaldo entra cuando falta la
       LIBRERIA, no cuando falta la sintaxis.
       Antes la puerta era una sonda de `?.` y `??`. Eso solo cubre el motor que no
       sabe parsear: si el bundle del CDN muere por CUALQUIER otra razon —una v2 mas
       nueva con sintaxis que el motor no soporta, red caida, TLS, bloqueo— la sonda
       pasa, el respaldo NO se inyecta y la pagina se queda sin cliente Supabase.
       Sin cliente no hay sesion, y el guard del perfil expulsa al login: ese era el
       rebote en Mac antiguas. Ahora se pregunta lo unico que importa, si la libreria
       esta aqui. En un navegador moderno no hace nada, porque ya esta.
       El CDN ademas se clava a 2.112.3, la misma version que la copia vendorizada:
       `@2` era flotante y podia cambiar bajo nuestros pies sin tocar el repo. */
(function () {
    var mdjLibAusente = !(window.supabase &&
        typeof window.supabase.createClient === 'function');
    if (mdjLibAusente) {
        document.write('<script src="./vendor/supabase-js-2.112.3.legacy.js?v=20260818-safari-legacy"><\/script>');
    }
})();
</script>
<script src="./supabase-config.js?v=elixis-commander"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<style>
  /* ═══════════ MDJ COMMANDER · mobile executive · dark premium ═══════════ */
  :root{
    --bg:#050505; --surface:#0b0d10; --elev:#12151a; --elev2:#171b22; --elev3:#1e222b;
    --line:#23262d; --line2:#2e323b;
    --gold:#d4af37; --gold2:#f4c95d; --gold-dim:rgba(212,175,55,.14); --gold-glow:rgba(212,175,55,.32);
    --text:#ffffff; --muted:#9ea4ad; --faint:#6a7079;
    --cyan:#3fb9e6; --green:#3ecf8e; --magenta:#c77bff; --amber:#e8b23a; --red:#f0616a;
    --shell:430px; --nav-h:64px; --top-h:52px;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
    --sans:-apple-system,system-ui,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:#000;color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
  button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none}
  img{display:block}
  ::-webkit-scrollbar{width:0;height:0}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* device frame on larger screens */
  .stage{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1000px 700px at 50% -10%,rgba(212,175,55,.06),transparent 60%),#000}
  .device{position:relative;width:100%;max-width:var(--shell);height:100%;background:var(--bg);overflow:hidden;
    display:flex;flex-direction:column}
  @media(min-width:480px){
    .device{height:min(920px,96dvh);border-radius:44px;border:1px solid #1c1f26;
      box-shadow:0 40px 120px rgba(0,0,0,.7),0 0 0 10px #0a0b0d,0 0 0 11px #202329}
    .app-scroll{border-radius:0}
  }

  /* faux status bar */

  /* top bar */
  .topbar{height:var(--top-h);flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);position:relative;z-index:5}
  .topbar .tb-title{font-size:16px;font-weight:700;letter-spacing:.01em;display:flex;flex-direction:column;line-height:1.1}
  .topbar .tb-title small{font-size:10.5px;font-weight:500;color:var(--muted);letter-spacing:.02em}
  .topbar .tb-spacer{flex:1}
  .icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;color:var(--muted);flex:none}
  .icon-btn:active{background:var(--elev)}
  .icon-btn svg{width:20px;height:20px}
  .tb-logo{width:30px;height:30px;flex:none}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .d-green{background:var(--green);box-shadow:0 0 8px var(--green)}
  .d-cyan{background:var(--cyan)}.d-amber{background:var(--amber)}.d-red{background:var(--red);box-shadow:0 0 8px var(--red)}.d-gold{background:var(--gold)}.d-magenta{background:var(--magenta)}.d-muted{background:var(--faint)}

  /* scroll area */
  .app-scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch}
  .pad{padding:18px 16px calc(20px + var(--sab))}
  .screen-anim{animation:scin .26s cubic-bezier(.2,.7,.3,1)}
  @keyframes scin{from{opacity:0;transform:translateX(14px)}}
  .fade-anim{animation:fade .24s ease}@keyframes fade{from{opacity:0}}

  /* bottom nav */
  .bottomnav{height:calc(var(--nav-h) + var(--sab));padding-bottom:var(--sab);flex:none;display:flex;border-top:1px solid var(--line);
    background:linear-gradient(180deg,var(--surface),var(--bg));position:relative;z-index:6}
  .navb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:10px;font-weight:600;letter-spacing:.02em;position:relative}
  .navb svg{width:22px;height:22px}
  .navb.on{color:var(--gold)}
  .navb.on::before{content:"";position:absolute;top:0;width:26px;height:2.5px;border-radius:0 0 3px 3px;background:var(--gold)}
  .navb .nb-badge{position:absolute;top:8px;right:calc(50% - 20px);min-width:15px;height:15px;border-radius:8px;background:var(--red);color:#fff;font-size:9px;display:grid;place-items:center;padding:0 3px;font-weight:700}
  .navb.center{flex:0 0 64px}
  .nav-orb{position:relative;width:72px;height:72px;margin-top:-26px;border-radius:50%;
    background:linear-gradient(180deg,var(--gold2),var(--gold));display:grid;place-items:center;
    /* Sin el anillo de 5px que lo separaba de la barra: el PO lo queria sin
       tanto borde. Queda solo la sombra que lo despega del fondo. */
    box-shadow:0 6px 18px var(--gold-glow);
    transition:opacity .1s linear}
  /* Desconectado invita a hablar: dentro del circulo va el microfono. En
     sesion, el circulo pasa a ser la fuente de energia y muestra el fenix.
     El simbolo dice en que momento estas sin necesidad de leer nada. */
  .nav-orb img{width:64px;height:64px;display:none}
  .nav-orb .orb-mic{display:grid;place-items:center;color:#1a1405}
  .nav-orb .orb-mic svg{width:32px;height:32px}
  .nav-orb.live img{display:block}
  .nav-orb.live .orb-mic{display:none}

  /* Con el saludo, los chips y el microfono fuera, el avatar quedaba pegado
     arriba y con un hueco debajo. Ahora la pantalla de comando centra su
     contenido en el alto disponible. */
  .pad-centro{min-height:100%;display:flex;flex-direction:column;justify-content:center}

  /* ── MODO AGENTE: el branding como fuente de energia ──────────────
     En sesion viva el fenix deja de ser un boton y emite. Los anillos son
     un radar que sale del centro; el resplandor y su tamano NO son una
     animacion fija: los mueve la amplitud real de la voz (--pulso), de tu
     microfono mientras escuchas y de la pista de ELIXIS mientras habla. */
  .nav-orb.live{
    box-shadow:0 6px 18px var(--gold-glow),
      0 0 calc(14px + var(--pulso,0) * 40px) rgba(212,175,55,calc(.35 + var(--pulso,0) * .5));
    /* La escala la pone el bucle en JS: transform:scale(calc(...)) con una
       variable dentro salia identidad, medido en el navegador. */
  }
  .nav-orb.live::before,.nav-orb.live::after{
    content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
    border:2px solid var(--gold2);opacity:0;
    animation:orbe-radar 1.9s cubic-bezier(.15,.6,.35,1) infinite;
  }
  .nav-orb.live::after{animation-delay:.95s}
  @keyframes orbe-radar{
    0%  {transform:scale(1);   opacity:calc(.22 + var(--pulso,0) * .58)}
    100%{transform:scale(2.35);opacity:0}
  }
  /* El oro es la homogeneidad de la marca y manda siempre. Escuchar y hablar
     NO se distinguen por color -- eso rompia la identidad -- sino por
     INTENSIDAD: escuchando el radar es tenue y el resplandor corto; hablando
     se abre del todo. Misma luz, distinta fuerza. */
  .nav-orb.live.rx::before,.nav-orb.live.rx::after{
    border-color:var(--gold);
    animation-duration:2.6s;
  }
  .nav-orb.live.rx{
    box-shadow:0 6px 18px var(--gold-glow),
      0 0 calc(10px + var(--pulso,0) * 26px) rgba(212,175,55,calc(.22 + var(--pulso,0) * .38));
  }

  /* headings / text */
  .large-title{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
  .page-sub{color:var(--muted);font-size:13px;margin-bottom:6px}
  .sec-h{font-size:11px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
  .sec-h:first-child{margin-top:4px}
  .muted{color:var(--muted)} .mono{font-family:var(--mono)}

  /* badges */
  .badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1px solid}
  .b-demo{color:var(--gold);border-color:var(--gold);background:var(--gold-dim)}
  .b-green{color:var(--green);border-color:var(--green);background:rgba(62,207,142,.1)}
  .b-cyan{color:var(--cyan);border-color:var(--cyan);background:rgba(63,185,230,.1)}
  .b-amber{color:var(--amber);border-color:var(--amber);background:rgba(232,178,58,.1)}
  .b-red{color:var(--red);border-color:var(--red);background:rgba(240,97,114,.1)}
  .b-magenta{color:var(--magenta);border-color:var(--magenta);background:rgba(199,123,255,.1)}
  .b-muted{color:var(--faint);border-color:var(--line2);background:var(--elev)}

  /* cards */
  .card{background:linear-gradient(180deg,var(--elev),var(--surface));border:1px solid var(--line);border-radius:16px;padding:16px}
  .card+.card{margin-top:12px}
  .tap{transition:transform .1s ease}.tap:active{transform:scale(.985)}
  .row{display:flex;align-items:center;gap:12px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:52px;border-radius:14px;font-size:15px;font-weight:700;border:1px solid var(--line2);background:var(--elev2);color:var(--text)}
  .btn:active{transform:scale(.99)}
  .btn svg{width:19px;height:19px}
  .btn.gold{border:none;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1405;box-shadow:0 8px 24px var(--gold-glow)}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--red);border-color:rgba(240,97,114,.4)}
  .btn.sm{min-height:40px;font-size:13px;border-radius:11px;width:auto;padding:0 14px}
  .btn-col{display:flex;flex-direction:column;gap:10px}

  /* command / avatar */
  /* AI agent = cut-out figure (no circle) over a live particle/circuit field */
  .avatar-stage{position:relative;width:min(290px,80vw);height:282px;margin:2px auto 0}
  .avatar-fx{position:absolute;inset:0;width:100%;height:100%;z-index:1}
  .avatar-baseglow{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);width:74%;height:44%;z-index:2;
    background:radial-gradient(closest-side,var(--gold-glow),transparent 72%);filter:blur(11px);opacity:.6;transition:.45s ease}
  .avatar-fig{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;z-index:3;
    filter:drop-shadow(0 10px 26px rgba(0,0,0,.7));animation:breathe 5.6s ease-in-out infinite}
  @keyframes breathe{50%{transform:translateY(-3px) scale(1.008)}}
  .avatar-stage.listening .avatar-baseglow{opacity:1;width:90%;height:56%}
  .avatar-stage.thinking .avatar-baseglow,.avatar-stage.understanding .avatar-baseglow,.avatar-stage.executing .avatar-baseglow{opacity:1;background:radial-gradient(closest-side,rgba(199,123,255,.42),transparent 72%)}
  .avatar-stage.speaking .avatar-fig{animation:talk 1.1s ease-in-out infinite}
  @keyframes talk{25%{transform:translateY(-2px)}60%{transform:translateY(1px) scale(1.006)}}
  .avatar-stage.executing .avatar-fig{transform:scale(.94);transition:transform .4s}
  /* immersive voice-conversation mode: only the agent + particles + subtitles */
  .voice-live{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100% - 2px);padding-top:4px}
  .avatar-stage.big{width:min(350px,90vw);height:min(390px,48vh)}
  .voice-status{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
  .voice-caption{text-align:center;font-size:18px;font-weight:600;line-height:1.42;color:var(--text);min-height:54px;margin:16px 8px 6px;max-width:340px;text-wrap:balance}
  .voice-caption .cap-q{color:var(--muted);font-weight:500;font-size:15.5px}
  .voice-controls{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:6px}
  .voice-pills{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .voice-pill{display:inline-flex;align-items:center;gap:7px;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:700;border:1px solid var(--line2);background:var(--elev2);color:var(--text)}
  .voice-pill.gold{border:none;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1405}
  .voice-pill:active{transform:scale(.97)}
  .voice-end{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--faint);padding:9px 18px;border:1px solid var(--line);border-radius:999px}
  .mic.small{width:74px;height:74px}.mic.small svg{width:30px}
  .mic.live::after{animation:micpulse 2.2s ease-out infinite}
  .voice-hint{font-size:11.5px;color:var(--faint);text-align:center;max-width:270px;line-height:1.45}
  .agent-name{text-align:center;margin-top:6px}
  .agent-name b{font-size:19px;letter-spacing:.04em}
  .agent-role{font-size:10.5px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:2px}
  .state-label{text-align:center;color:var(--muted);font-size:13px;margin-top:14px;min-height:20px;font-weight:500}
  .cmd-prompt{text-align:center;font-size:17px;font-weight:600;margin:6px 0 2px}

  /* ── Chat escrito: lo que ELIXIS va diciendo ─────────────────────
     Traido del laboratorio de voz, que es donde estaba funcionando. Debajo
     del avatar, no encima: la cara manda y el texto acompana. */
  .convo{display:flex;flex-direction:column;gap:10px;margin:6px 2px 0;
    max-height:34vh;overflow-y:auto;padding:2px 2px 6px}
  .convo .line{font-size:14.5px;line-height:1.5;color:var(--text)}
  .convo .line b{color:var(--gold2);font-weight:700}
  .convo .sys{font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:.02em}
  .convo:empty{display:none}
  .convo-state{display:flex;align-items:center;justify-content:center;gap:8px;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--muted);margin-top:10px;min-height:16px}

  /* waveform */
  .waveform{display:flex;align-items:center;justify-content:center;gap:3px;height:32px;margin:6px 0}
  .waveform i{width:3px;height:20%;border-radius:3px;background:var(--gold);opacity:.85;animation:wv 1s ease-in-out infinite}
  .waveform.idle i{animation:none;height:14%;opacity:.3;background:var(--faint)}
  @keyframes wv{50%{height:100%}}

  /* mic button */
  .mic-wrap{display:flex;align-items:center;justify-content:center;gap:26px;margin:16px 0 8px}
  .mic-side{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:10px;font-family:var(--mono);letter-spacing:.08em}
  .mic-side .icon-btn{width:46px;height:46px;border:1px solid var(--line2);border-radius:14px;background:var(--elev)}
  .mic-side.on .icon-btn{border-color:var(--gold);color:var(--gold);background:var(--gold-dim)}
  .mic{width:96px;height:96px;border-radius:50%;background:linear-gradient(180deg,var(--gold2),var(--gold));display:grid;place-items:center;
    box-shadow:0 0 0 6px rgba(212,175,55,.12),0 0 40px var(--gold-glow);position:relative;color:#1a1405;flex:none}
  .mic svg{width:38px;height:38px}
  .mic::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--gold);opacity:0}
  .mic.rec::after{animation:micpulse 1.5s ease-out infinite}
  @keyframes micpulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.35);opacity:0}}
  .mic.rec{background:linear-gradient(180deg,#ff6b6b,var(--red));color:#fff;box-shadow:0 0 0 6px rgba(240,97,114,.18),0 0 44px rgba(240,97,114,.4)}

  /* text input */
  .cmd-input{display:flex;gap:8px;margin-top:12px}
  .cmd-input input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line2);border-radius:14px;padding:14px 14px;color:var(--text);font-size:15px;font-family:inherit}
  .cmd-input input:focus{outline:none;border-color:var(--gold2)}
  .cmd-input .send{width:52px;flex:none;border-radius:14px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1405;display:grid;place-items:center}

  .chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
  .chip{font-size:12px;padding:7px 12px;border:1px solid var(--line2);border-radius:999px;background:var(--elev);color:var(--muted)}
  .chip:active{border-color:var(--gold);color:var(--gold)}

  /* quick reply buttons (avatar responses) */
  .qr{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
  .qr .btn{width:auto;min-height:42px;padding:0 16px;font-size:13px}

  /* radar */
  .radar-wrap{position:relative;width:230px;height:230px;margin:8px auto}
  .radar-wrap svg{width:100%;height:100%}
  .radar-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .radar-center b{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .radar-center span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--cyan);margin-top:2px}
  .radar-sweep{transform-origin:center;animation:sweep 3.4s linear infinite}
  @keyframes sweep{to{transform:rotate(360deg)}}

  .tabs{display:flex;gap:6px;background:var(--elev);border:1px solid var(--line);border-radius:12px;padding:4px;margin:4px 0 14px;overflow-x:auto}
  .tabs button{flex:1;white-space:nowrap;padding:8px 10px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--gold-dim);color:var(--gold)}

  /* pipeline steps */
  .pl-step{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
  .pl-step:last-child{border:none}
  .pl-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--elev2);color:var(--faint)}
  .pl-step.done .pl-ico{color:var(--green);background:rgba(62,207,142,.12)}
  .pl-step.run .pl-ico{color:var(--cyan);background:rgba(63,185,230,.12)}
  .pl-step .pl-t{font-size:13.5px;font-weight:600}
  .pl-step .pl-s{font-size:10.5px;font-family:var(--mono);letter-spacing:.04em}
  .pl-step.done .pl-s{color:var(--green)}.pl-step.run .pl-s{color:var(--cyan)}.pl-step.pend .pl-s{color:var(--faint)}
  .pl-time{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .spin{animation:spin 1s linear infinite;display:inline-block}@keyframes spin{to{transform:rotate(360deg)}}

  .progress{height:8px;border-radius:99px;background:var(--elev3);overflow:hidden}
  .progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .5s ease}

  /* list rows */
  .lrow{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}
  .lrow:last-child{border:none}
  .lrow .l-ico{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--elev2);color:var(--gold);overflow:hidden}
  .lrow .l-ico img{width:100%;height:100%;object-fit:cover}
  .lrow .l-t{font-size:14.5px;font-weight:600}
  .lrow .l-s{font-size:12px;color:var(--muted);margin-top:1px}
  .lrow .l-r{margin-left:auto;text-align:right;flex:none}
  .chev{color:var(--faint)}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13.5px}
  .kv dt{color:var(--faint);font-family:var(--mono);font-size:11px}
  .kv dd{margin:0;text-align:right}
  .bul{list-style:none;padding:0;margin:0}
  .bul li{display:flex;gap:9px;padding:6px 0;font-size:13.5px;color:var(--muted)}
  .bul li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);flex:none;margin-top:7px}

  .price{font-size:34px;font-weight:800;letter-spacing:-.02em}
  .price small{font-size:14px;color:var(--muted);font-weight:600}

  .empty{text-align:center;color:var(--faint);padding:40px 20px;font-size:14px}
  .hr{height:1px;background:var(--line);border:none;margin:14px 0}

  /* floating mic (secondary screens) */
  .fab-mic{position:absolute;right:16px;bottom:calc(var(--nav-h) + var(--sab) + 16px);width:52px;height:52px;border-radius:50%;
    background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1405;display:grid;place-items:center;z-index:20;box-shadow:0 8px 24px var(--gold-glow)}
  .fab-mic svg{width:24px;height:24px}

  /* sheet / overlay */
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:40;display:none;animation:fade .2s ease}
  .scrim.open{display:block}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--elev);border-top:1px solid var(--line2);border-radius:22px 22px 0 0;
    padding:10px 18px calc(22px + var(--sab));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow-y:auto}
  .sheet.open{transform:none}
  .sheet-grip{width:40px;height:4px;border-radius:3px;background:var(--line2);margin:2px auto 14px}
  .sheet h3{margin:0 0 4px;font-size:18px}

  /* voice overlay */
  .voice-ov{position:absolute;left:0;right:0;bottom:0;z-index:45;background:linear-gradient(180deg,var(--elev),var(--surface));border-top:1px solid var(--gold-dim);
    border-radius:22px 22px 0 0;padding:16px 18px calc(20px + var(--sab));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  .voice-ov.open{transform:none}
  .voice-ov .vo-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}

  /* toast */
  .toast-wrap{position:absolute;left:0;right:0;bottom:calc(var(--nav-h) + var(--sab) + 18px);z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
  .toast{background:var(--elev3);border:1px solid var(--gold-2,var(--gold));border-radius:12px;padding:11px 16px;font-size:13.5px;max-width:88%;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:tin .22s ease;display:flex;gap:9px;align-items:center}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}}

  .offline-banner{background:rgba(240,97,114,.12);border-bottom:1px solid rgba(240,97,114,.4);color:var(--red);font-size:12px;text-align:center;padding:6px;font-family:var(--mono);letter-spacing:.05em}

  .stat-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
  .stat-3 .s-v{font-size:24px;font-weight:800;font-family:var(--mono)}
  .stat-3 .s-l{font-size:10.5px;color:var(--muted);margin-top:2px}

  .conf-note{font-size:11px;color:var(--faint);text-align:center;margin-top:10px;line-height:1.5}

  /* splash */
  .splash{position:absolute;inset:0;z-index:80;background:radial-gradient(600px 500px at 50% 35%,rgba(212,175,55,.09),transparent 60%),var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s ease}
  .splash.hide{opacity:0;pointer-events:none}
  .splash img{width:96px;height:96px;filter:drop-shadow(0 0 24px var(--gold-glow));animation:sfloat 3s ease-in-out infinite}
  @keyframes sfloat{50%{transform:translateY(-6px)}}
  .splash h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.16em;background:linear-gradient(95deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .splash .sp-sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
  .splash .sp-auth{margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .faceid{width:56px;height:56px;border-radius:16px;border:1.5px solid var(--gold);display:grid;place-items:center;color:var(--gold)}
</style>
</head>
<body>

<div class="stage">
  <div class="device" id="device">
    <!-- La barra de estado falsa (9:41, cobertura, wifi, bateria) se elimino:
         en un movil real la pinta el sistema encima. Era teatro de prototipo. -->
    <div id="offlineBanner"></div>
    <div class="topbar" id="topbar"></div>
    <div class="app-scroll" id="view"></div>
    <div class="bottomnav" id="bottomnav"></div>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet"></div>
    <div class="voice-ov" id="voiceOv"></div>
    <div class="toast-wrap" id="toastWrap"></div>

    <!-- splash -->
    <div class="splash" id="splash">
      <img id="splashLogo" alt="Phoenix">
      <h1>MDJ COMMANDER</h1>
      <div class="sp-sub">AI Executive Command</div>
      <div class="sp-auth">
        <div class="faceid"><svg viewBox="0 0 24 24" width="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 10v1M15 10v1M12 9v4l-1 1M9.5 15c1.5 1 3.5 1 5 0"/></svg></div>
        <div style="font-size:12px;color:var(--muted)" id="authTxt">Autenticación segura…</div>
      </div>
    </div>
  </div>
</div>

  var lang=localStorage.getItem('mdjc_lang')||'es';
  function T(es,en){return lang==='es'?es:en;}
  /* ═══ CONEXIÓN REAL — Supabase Auth + ELIXIS backend (elixis-orchestrator / elixis-tts) ═══ */
  var _supa = (typeof window.getSupabaseClient==='function') ? window.getSupabaseClient() : null;
  var _token = null, _rec = null, _cvAudio = null;
  var _elixisHistory = [];
  function _goLogin(){ try{ window.location.replace('./login.html?next=mdj-commander.html'); }catch(e){} }
  (async function _initAuth(){
    if(!_supa) return;
    try{
      var r = await _supa.auth.getSession();
      var s = (r&&r.data)?r.data.session:null;
      if(s&&s.access_token){ _token = s.access_token; loadRealClients(); loadRealNotifs(); }
      else { _goLogin(); return; }
      _supa.auth.onAuthStateChange(function(_e,ss){ _token = ss?ss.access_token:null; if(!_token) _goLogin(); });
    }catch(e){ _goLogin(); }
  })();
  function _invokeHeaders(){
    var pub = window.MDB_SUPABASE_ANON_KEY||'';
    var h={ 'Content-Type':'application/json' };
    if(pub) h.apikey=pub;
    h.Authorization='Bearer '+(_token||pub);
    return h;
  }
  /* Pantalla CLIENTES → leads reales (RLS: staff/owner ve sus leads) */
  async function loadRealClients(){
    if(!_supa) return;
    try{
      var r = await _supa.from('leads')
        .select('name,contact_person,email,event_type,city,event_location,status,lead_outcome,total_amount,budget_estimate,event_date,created_at')
        .order('created_at',{ascending:false}).limit(30);
      var rows=(r&&r.data)?r.data:[];
      if(!rows.length) return;
      function mapSt(s){ s=String(s||'').toLowerCase(); if(/won|confirm|paid|active|complet/.test(s))return 'active'; if(/lost|cancel|declin|dead/.test(s))return 'lead'; return 'opportunity'; }
      CLIENTS = rows.map(function(l){
        var val=l.total_amount||l.budget_estimate;
        var last=l.event_type?(l.event_type+(l.event_date?' · '+l.event_date:'')):(l.lead_outcome||l.status||'Consulta');
        var nm=l.name||l.contact_person||(l.email?String(l.email).split('@')[0]:'')||'Cliente';
        return { n:nm, co:l.city||l.event_location||'—', st:mapSt(l.lead_outcome||l.status), last:{es:last,en:last}, val:val?('$'+Math.round(Number(val))):'—' };
      });
      if(state.screen==='clients'||state.screen==='clientDetail') render();
    }catch(e){}
  }
  /* Pantalla NOTIFICACIONES → alertas reales derivadas de leads */
  async function loadRealNotifs(){
    if(!_supa) return;
    try{
      var r = await _supa.from('leads')
        .select('name,contact_person,email,event_type,event_date,total_amount,payment_status,assigned_dj_name,created_at')
        .order('created_at',{ascending:false}).limit(30);
      var rows=(r&&r.data)?r.data:[];
      if(!rows.length) return;
      function nameOf(l){ return l.name||l.contact_person||(l.email?String(l.email).split('@')[0]:'')||'Cliente'; }
      var out=[];
      var sinDj=rows.filter(function(l){return !l.assigned_dj_name;}).length;
      if(sinDj>0) out.push({lvl:'critical',ico:'warn',t:{es:sinDj+' solicitudes sin DJ asignado',en:sinDj+' leads without a DJ'},d:{es:'Requieren tu asignación',en:'Need assignment'},time:''});
      rows.forEach(function(l){
        var ps=String(l.payment_status||'').toLowerCase();
        var val=Number(l.total_amount||0);
        if(val>0 && ps!=='paid_full' && ps!=='paid'){
          var txt=nameOf(l)+' · '+(l.event_type||'evento')+(l.event_date?' · '+l.event_date:'')+' · $'+Math.round(val);
          out.push({lvl:'important',ico:'dollar',t:{es:'Pago pendiente',en:'Pending payment'},d:{es:txt,en:txt},time:''});
        }
      });
      if(!out.length) out.push({lvl:'info',ico:'check',t:{es:'Todo al día',en:'All caught up'},d:{es:'Sin alertas pendientes',en:'No pending alerts'},time:''});
      NOTIFS = out.slice(0,10);
      if(state.screen==='notifications') render();
    }catch(e){}
  }
  async function askElixis(text){
    var url = window.mdbSupabaseFunctionUrl ? window.mdbSupabaseFunctionUrl('elixis-orchestrator') : null;
    if(!url) return 'No pude ubicar el servidor.';
    try{
      var res = await fetch(url,{ method:'POST', headers:_invokeHeaders(), body:JSON.stringify({ message:text, history:_elixisHistory.slice(-20) }) });
      if(res.status===401){ _goLogin(); return ''; }
      var d={}; try{ d=await res.json(); }catch(_){}
      if(!res.ok||!d.reply) return (d.error==='forbidden_not_staff') ? 'Tu cuenta no tiene acceso de staff/owner.' : 'Tuve un problema ('+res.status+').';
      _elixisHistory.push({role:'user',content:text});
      _elixisHistory.push({role:'assistant',content:d.reply});
      return d.reply;
    }catch(e){ return 'No pude conectar. Revisa tu conexión.'; }
  }
  /* Desbloqueo de audio: un solo elemento "armado" con el primer gesto del usuario,
     para que la voz natural (OpenAI) SIEMPRE suene y nunca caiga a algo robótico. */
  var _audioArmed=false;
  var _SILENT="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
  function _voiceEl(){ if(!_cvAudio){ _cvAudio=new Audio(); } return _cvAudio; }
  function _armAudio(){ if(_audioArmed)return; var el=_voiceEl(); try{ el.src=_SILENT; var p=el.play(); if(p&&p.then)p.then(function(){_audioArmed=true;}).catch(function(){}); }catch(e){} }
  ['pointerdown','keydown','touchstart'].forEach(function(ev){ document.addEventListener(ev,_armAudio); });
  async function speakReal(text){
    var url = window.mdbSupabaseFunctionUrl ? window.mdbSupabaseFunctionUrl('elixis-tts') : null;
    if(!url||!text) return;
    try{
      var clean = String(text).replace(/[*_`#>]/g,'').replace(/https?:\/\/\S+/g,'').trim();
      var res = await fetch(url,{ method:'POST', headers:_invokeHeaders(), body:JSON.stringify({ text:clean, voice:(localStorage.getItem('elixis_voice')||'ash') }) });
      if(res.ok && (res.headers.get('content-type')||'').indexOf('audio')!==-1){
        var b = await res.blob();
        var el=_voiceEl();
        try{ el.pause(); }catch(_){}
        el.src=URL.createObjectURL(b);
        el.play().catch(function(){});
      }
    }catch(e){}
  }

  /* ───── AI particle / circuit field (behind the agent) ───── */
  var FX={pts:null,canvas:null,ctx:null,W:0,H:0,intensity:0.8,target:0.8,hue:'gold',raf:null,
    reduce:(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches)};
  var FXMAP={idle:[0.7,'gold'],listening:[1.5,'gold'],transcribing:[1.3,'cyan'],understanding:[2.1,'magenta'],confirmation:[1,'gold'],executing:[2.4,'magenta'],speaking:[1.5,'gold']};
  function fxSize(){var c=FX.canvas;if(!c)return;var r=c.getBoundingClientRect();var dpr=Math.min(2,window.devicePixelRatio||1);FX.W=Math.max(60,r.width);FX.H=Math.max(60,r.height);c.width=FX.W*dpr;c.height=FX.H*dpr;FX.ctx.setTransform(dpr,0,0,dpr,0,0);}
  function fxCol(a){return FX.hue==='magenta'?'rgba(199,123,255,'+a+')':FX.hue==='cyan'?'rgba(63,185,230,'+a+')':'rgba(212,175,55,'+a+')';}
  function mountFX(canvas,state){
    if(!canvas)return;FX.canvas=canvas;FX.ctx=canvas.getContext('2d');fxSize();
    var m=FXMAP[state]||FXMAP.idle;FX.target=m[0];FX.hue=m[1];
    if(!FX.pts){FX.pts=[];for(var i=0;i<28;i++)FX.pts.push({x:Math.random()*FX.W,y:Math.random()*FX.H,vx:(Math.random()-.5)*.32,vy:(Math.random()-.5)*.32,r:Math.random()*1.5+.7,ph:Math.random()*6.28});}
    if(FX.reduce){FX.intensity=FX.target;fxDraw();return;}
    if(!FX.raf)fxLoop();
  }
  function fxDraw(){
    var ctx=FX.ctx,c=FX.canvas;if(!ctx||!c||!document.body.contains(c))return;
    FX.intensity+=(FX.target-FX.intensity)*0.05;
    /* voice-reactive: the particles (not the mic) move with a simulated audio envelope while listening/speaking */
    var voiceOn=(state.avatar==='listening'||state.avatar==='speaking'||state.avatar==='transcribing');
    var t=Date.now()/1000;
    var s=0.5*Math.sin(t*7.3)+0.28*Math.sin(t*13.1+1)+0.22*Math.sin(t*19.7+2);
    var raw=voiceOn?(0.5+0.5*s):0;
    FX.level=(FX.level||0)+(raw-(FX.level||0))*0.3; var lvl=FX.level;
    var W=FX.W,H=FX.H,pts=FX.pts,inten=FX.intensity*(1+lvl*0.7);ctx.clearRect(0,0,W,H);
    for(var i=0;i<pts.length;i++){var p=pts[i];p.x+=p.vx*inten;p.y+=p.vy*inten;if(p.x<-4)p.x+=W+8;if(p.x>W+4)p.x-=W+8;if(p.y<-4)p.y+=H+8;if(p.y>H+4)p.y-=H+8;}
    var D=Math.min(W,H)*0.46*(1+lvl*0.14);
    for(var i=0;i<pts.length;i++)for(var j=i+1;j<pts.length;j++){var a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<D){var al=(1-d/D)*0.26*Math.min(1.7,inten)*(1+lvl*0.9);ctx.strokeStyle=fxCol(al);ctx.lineWidth=.7+lvl*.5;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}
    for(var i=0;i<pts.length;i++){var p=pts[i];var pr=(p.r+Math.sin(Date.now()/600+p.ph)*.3)*(1+lvl*1.05);ctx.fillStyle=fxCol(.6+lvl*.4);ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.4,pr),0,6.283);ctx.fill();}
  }
  function fxLoop(){fxDraw();FX.raf=requestAnimationFrame(fxLoop);}
  window.addEventListener('resize',function(){if(FX.canvas&&document.body.contains(FX.canvas))fxSize();});

  function go(screen,params,noStack){
    if(!noStack && state.screen && state.screen!==screen){state.stack.push({s:state.screen,p:state.params});if(state.stack.length>20)state.stack.shift();}
    state.screen=screen;state.params=params||{};render();
    $('#view').scrollTop=0;
  }

  /* ═══════════════════════════════════════════════════════════════════
     MOTOR DE VOZ EN TIEMPO REAL (FÉNIX)

     Sustituye al ciclo viejo — SpeechRecognition del navegador -> texto ->
     elixis-orchestrator -> elixis-tts — que medía entre 1 y 2,8 segundos por
     turno y no permitía interrumpir. Ahora el audio va y viene por WebRTC
     contra elixis-realtime-session: 171-364 ms medidos, y se le puede cortar
     a media frase.

     La CARA no se toca. Este motor solo mueve setAvatar() y state.agentReply,
     que es lo que la carrocería ya sabía leer.
     ═══════════════════════════════════════════════════════════════════ */
  var RT = (function(){
    var pc=null, dc=null, mic=null, spk=null;
    var ac=null, sink=null, anMic=null, anRem=null, buf=null, rafPulso=0;
    var sesion=null, nivelBloque=0, hb=0, t0=0;
    var hablando=false;

    function fnUrl(accion){
      if(!window.mdbSupabaseFunctionUrl) return null;
      var u = window.mdbSupabaseFunctionUrl('elixis-realtime-session');
      if(!u) return null;
      return accion ? u + (u.indexOf('?')===-1?'?':'&') + 'action=' + accion : u;
    }
    function usados(){ return t0 ? Math.max(0, Math.round((Date.now()-t0)/1000)) : 0; }

    /* ── Fuente de energia del branding ──────────────────────────────
       Un sumidero mudo mantiene el grafo bombeando sin emitir sonido; sin
       el, algunos navegadores no alimentan un analizador que no llega al
       destino y el orbe se queda plano. */
    function orbe(){ return document.querySelector('.nav-orb'); }
    function analizador(stream){
      if(!ac){
        var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
        ac=new AC(); sink=ac.createGain(); sink.gain.value=0; sink.connect(ac.destination);
        buf=new Uint8Array(256);
      }
      try{
        var an=ac.createAnalyser(); an.fftSize=512; an.smoothingTimeConstant=0.72;
        ac.createMediaStreamSource(stream).connect(an); an.connect(sink);
        return an;
      }catch(e){ return null; }
    }
    function nivel(an){
      if(!an||!buf) return 0;
      an.getByteTimeDomainData(buf);
      var s=0; for(var i=0;i<buf.length;i++){ var v=(buf[i]-128)/128; s+=v*v; }
      return Math.min(1, Math.sqrt(s/buf.length)*3.2);
    }
    var pulso=0, vivo=false;
    function latir(){
      var o=orbe();
      if(o){
        /* La barra inferior se vuelve a dibujar cuando cambia el estado, y el
           orbe pasa a ser OTRO elemento. Si solo se marcara al encender, la
           clase se perderia en el primer redibujado y el radar se apagaria
           solo. Se reafirma cada frame: sale barato y no se pierde nunca. */
        if(vivo && !o.classList.contains('live')) o.classList.add('live');
        var an = hablando ? (anRem||anMic) : anMic;
        var objetivo = nivel(an);
        pulso += (objetivo - pulso) * 0.3;
        if(pulso < 0.002) pulso = 0;
        o.style.setProperty('--pulso', pulso.toFixed(3));
        o.style.transform = 'scale(' + (1 + pulso * 0.09).toFixed(4) + ')';
        /* La opacidad respira con la voz: en silencio se atenua, en los picos
           se enciende del todo. Es lo que le da la pulsacion al boton. */
        o.style.opacity = (0.62 + pulso * 0.38).toFixed(3);
        o.classList.toggle('rx', !hablando);
      }
      rafPulso = requestAnimationFrame(latir);
    }
    function encender(){
      vivo=true;
      var o=orbe(); if(o){ o.classList.add('live','rx'); }
      if(!rafPulso) rafPulso = requestAnimationFrame(latir);
    }
    function apagar(){
      vivo=false;
      if(rafPulso){ cancelAnimationFrame(rafPulso); rafPulso=0; }
      var o=orbe(); if(o){ o.classList.remove('live','rx');
        o.style.removeProperty('--pulso'); o.style.removeProperty('transform');
        o.style.removeProperty('opacity'); }
      pulso=0; anMic=null; anRem=null;
      if(ac){ try{ ac.close(); }catch(e){} ac=null; sink=null; }
    }

    /* Herramientas: ELIXIS pide, el navegador ejecuta CON el JWT del usuario.
       El candado de cada función sigue mandando. */
    async function accion(nombre, cuerpo){
      var u = fnUrl(nombre);
      if(!u) return { ok:false, motivo:'fallo' };
      try{
        var r = await fetch(u,{ method:'POST', headers:_invokeHeaders(), body:JSON.stringify(cuerpo) });
        var d={}; try{ d=await r.json(); }catch(_){}
        if(r.status===401||r.status===403) return { ok:false, motivo:'sin_acceso' };
        if(!r.ok) return { ok:false, motivo:'fallo' };
        return d;
      }catch(e){ return { ok:false, motivo:'fallo' }; }
    }

    async function herramienta(item){
      setAvatar('executing');
      var args={}; try{ args=JSON.parse(item.arguments||'{}'); }catch(_){}
      var out;
      if(item.name==='consultar_elixis')      out = await accion('consultar',     { pregunta:String(args.pregunta||'') });
      else if(item.name==='recordar')         out = await accion('memory_write',  { clave:String(args.clave||''), hecho:String(args.hecho||'') });
      else if(item.name==='olvidar')          out = await accion('memory_forget', { clave:String(args.clave||'') });
      else                                    out = { ok:false, motivo:'herramienta_desconocida' };

      if(!dc || dc.readyState!=='open') return;
      dc.send(JSON.stringify({ type:'conversation.item.create',
        item:{ type:'function_call_output', call_id:item.call_id, output:JSON.stringify(out) } }));
      dc.send(JSON.stringify({ type:'response.create' }));   /* sin esto se queda mudo */
    }

    function linea(txt, cls){
      var c=document.getElementById('convo'); if(!c) return null;
      var d=document.createElement('div'); d.className=cls||'line';
      if(cls==='sys') d.textContent=txt; else d.innerHTML='<b>'+AGENT+':</b> '+esc(txt);
      c.appendChild(d); c.scrollTop=c.scrollHeight; return d;
    }
    function rotulo(t){ var e=document.getElementById('convoState'); if(e) e.textContent=t||''; }

    function evento(m){
      switch(m.type){
        case 'input_audio_buffer.speech_started':
          hablando=false; state.agentReply=null; state.agentLine=null;
          rotulo(T('Te escucho','Listening'));
          setAvatar('listening'); break;

        case 'input_audio_buffer.speech_stopped':
          rotulo(T('Pensando','Thinking'));
          setAvatar('understanding'); break;

        case 'response.output_audio_transcript.delta':
          if(!hablando){ hablando=true; state.agentReply=''; state.agentLine='real';
            RT._fila = linea('', 'line'); rotulo(T('Hablando','Speaking')); }
          state.agentReply += (m.delta||'');
          if(RT._fila) RT._fila.innerHTML='<b>'+AGENT+':</b> '+esc(state.agentReply);
          var c=document.getElementById('convo'); if(c) c.scrollTop=c.scrollHeight;
          setAvatar('speaking'); break;

        case 'response.done':
          /* Las llamadas a herramienta viajan DENTRO de response.done. Si se
             cierra el turno aquí sin mirarlas, la consulta no sale nunca. */
          var salida = (m.response && m.response.output) || [];
          var llamadas = salida.filter(function(i){ return i && i.type==='function_call'; });
          if(llamadas.length){ llamadas.forEach(herramienta); break; }
          hablando=false; RT._fila=null; rotulo(T('Te escucho','Listening'));
          setAvatar('listening'); break;

        case 'error':
          toast(T('Error en el canal de voz','Voice channel error'),'warn'); break;
      }
    }

    async function start(){
      if(pc) return;
      var url = fnUrl(null);
      if(!url){ toast(T('No pude ubicar el servidor de voz','Voice server not found'),'warn'); return; }
      url += (url.indexOf('?')===-1?'?':'&') + 'voice=' + (localStorage.getItem('elixis_voice')||'ash')
           + '&vad=' + (localStorage.getItem('elixis_vad')||'medium');

      setAvatar('understanding');
      try{
        mic = await navigator.mediaDevices.getUserMedia({
          audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true } });
      }catch(e){
        toast(T('Necesito permiso de micrófono','Microphone permission needed'),'warn');
        setAvatar('idle'); return;
      }

      pc = new RTCPeerConnection();
      spk = _voiceEl();                       /* reusa el elemento ya "armado" */
      pc.ontrack = function(ev){
        try{ spk.srcObject = ev.streams[0]; spk.play(); }catch(_){ }
        anRem = analizador(ev.streams[0]);   /* la voz de ELIXIS mueve el orbe */
      };
      mic.getAudioTracks().forEach(function(t){ pc.addTrack(t, mic); });
      anMic = analizador(mic);               /* tu voz lo mueve mientras escucha */

      dc = pc.createDataChannel('oai-events');
      dc.onopen = function(){
        linea(T('Canal de voz conectado. Habla con normalidad.','Voice channel connected. Speak normally.'),'sys');
        rotulo(T('Te escucho','Listening'));
        encender();                          /* modo agente: el fenix emite */
        setAvatar('listening'); haptic('light');
      };
      dc.onmessage = function(ev){ var m; try{ m=JSON.parse(ev.data); }catch(_){ return; } evento(m); };
      pc.onconnectionstatechange = function(){
        if(pc && ['failed','disconnected','closed'].indexOf(pc.connectionState)!==-1) stop(true);
      };

      var offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      var h = _invokeHeaders(); h['Content-Type']='application/sdp';
      var res;
      try{ res = await fetch(url,{ method:'POST', headers:h, body:offer.sdp }); }
      catch(e){ toast(T('No pude conectar la voz','Could not connect voice'),'warn'); stop(true); return; }

      if(res.status===401){ _goLogin(); return; }
      if(res.status===402){
        var q={}; try{ q=await res.json(); }catch(_){}
        toast(q.error==='safety_cap_reached'
          ? T('Tope técnico alcanzado','Technical cap reached')
          : T('Sin saldo de voz · continúa por texto','Out of voice credit · continue by text'),'warn');
        state.voiceMode='text'; stop(true); return;
      }
      if(res.status===403){ toast(T('Esta cuenta no tiene acceso de voz','No voice access for this account'),'warn'); stop(true); return; }
      if(res.status===429){ toast(T('Demasiadas sesiones · espera un momento','Too many sessions · wait a moment'),'warn'); stop(true); return; }
      if(!res.ok){ toast(T('La voz no está disponible ahora','Voice unavailable right now'),'warn'); stop(true); return; }

      sesion     = res.headers.get('x-elixis-session');
      nivelBloque= parseInt(res.headers.get('x-elixis-granted-seconds')||'0',10);
      t0         = Date.now();

      await pc.setRemoteDescription({ type:'answer', sdp: await res.text() });

      /* El latido evita que el barrendero dé la sesión por abandonada y la
         cobre entera. */
      if(sesion){
        hb = setInterval(function(){
          var u = fnUrl('heartbeat'); if(!u) return;
          fetch(u + '&session=' + encodeURIComponent(sesion), { method:'POST', headers:_invokeHeaders() }).catch(function(){});
        }, 4*60*1000);
      }
    }

    /* keepalive: la liquidación sale aunque se cierre la pestaña. Sin esto se
       le cobra al cliente el bloque entero en vez de lo que habló. */
    function liquidar(){
      if(hb){ clearInterval(hb); hb=0; }
      if(!sesion) { t0=0; return; }
      var u = fnUrl('settle');
      var s = sesion; sesion=null;
      var seg = usados(); t0=0;
      if(u) fetch(u + '&session=' + encodeURIComponent(s) + '&used=' + seg,
                  { method:'POST', headers:_invokeHeaders(), keepalive:true }).catch(function(){});
    }

    function stop(silencioso){
      liquidar();
      if(dc){ try{ dc.close(); }catch(_){ } dc=null; }
      if(pc){ try{ pc.close(); }catch(_){ } pc=null; }
      if(mic){ mic.getTracks().forEach(function(t){ try{ t.stop(); }catch(_){ } }); mic=null; }
      if(spk){ try{ spk.pause(); spk.srcObject=null; }catch(_){ } }
      hablando=false;
      apagar();
      linea(T('Canal de voz cerrado.','Voice channel closed.'),'sys');
      rotulo('');
      if(!silencioso) setAvatar('idle');
    }

    window.addEventListener('beforeunload', liquidar);
    return { start:start, stop:stop, activa:function(){ return !!pc; } };
  })();

  function startListening(){

      '<div class="card"><div class="row" style="gap:13px"><span class="l-ico" style="width:52px;height:52px;font-size:20px">'+esc(c.n.charAt(0))+'</span><div><div style="font-size:18px;font-weight:700">'+esc(c.n)+'</div><div class="muted" style="font-size:13px">'+esc(c.co)+'</div></div></div>'+
      '<div class="stat-3" style="margin-top:14px"><div><div class="s-v" style="font-size:18px;color:var(--gold)">'+c.val+'</div><div class="s-l">'+T('Valor potencial','Potential value')+'</div></div><div><div class="s-v" style="font-size:18px">3</div><div class="s-l">'+T('Propuestas','Proposals')+'</div></div><div><div class="s-v" style="font-size:18px">8</div><div class="s-l">'+T('Interacciones','Interactions')+'</div></div></div></div>'+

      '</div>';
    $('#clCall').onclick=function(){toast(T('Llamada no disponible en demo','Call not available in demo'),'phone');};
    document.querySelectorAll('[data-sub]').forEach(function(b){b.onclick=function(){toast(esc(b.getAttribute('data-sub'))+' · '+T('vista demo','demo view'));};});
  };

  /* AGENTS */
  SCREENS.agents=function(v){
    renderTopbar({back:true,title:T('Agentes','Agents')});
    v.innerHTML='<div class="pad screen-anim"><div class="card">'+AGENTS.map(function(a,i){var d=a.st==='run'?'d-cyan':'d-muted';return '<button class="lrow tap" style="width:100%;text-align:left" data-ag="'+i+'"><span class="l-ico">'+svg('agents')+'</span><div style="flex:1"><div class="l-t">'+esc(a.n)+'</div><div class="l-s">'+esc(a.task[lang]||a.task.es)+'</div></div><span class="l-r"><span class="dot '+d+'" style="display:inline-block"></span> <span class="mono" style="font-size:11px;color:var(--muted)">'+a.health+'%</span></span></button>';}).join('')+'</div></div>';
    document.querySelectorAll('[data-ag]').forEach(function(b){b.onclick=function(){go('agentDetail',{i:+b.getAttribute('data-ag')});};});
  };
  SCREENS.agentDetail=function(v){
    var a=AGENTS[state.params.i||0];
    renderTopbar({back:true,title:esc(a.n)});
    v.innerHTML='<div class="pad screen-anim">'+
      '<div class="card"><div class="row" style="gap:12px;margin-bottom:10px"><span class="l-ico" style="width:46px;height:46px">'+svg('agents')+'</span><div><div style="font-size:17px;font-weight:700">'+esc(a.n)+'</div><div class="muted" style="font-size:12.5px">'+esc(a.ms[lang]||a.ms.es)+'</div></div><span class="l-r badge '+(a.st==='run'?'b-cyan':'b-muted')+'" style="margin-left:auto">'+(a.st==='run'?'RUNNING':'IDLE')+'</span></div>'+

      '<div class="btn-col" style="margin-top:14px"><div style="display:flex;gap:10px"><button class="btn" id="agToggle">'+(a.st==='run'?svg('pause')+' Pause':svg('play')+' Activate')+'</button><button class="btn" id="agAsk">'+svg('mic')+' Ask</button></div>'+
      '<button class="btn ghost" id="agAct">'+svg('history')+' View Activity</button></div>'+
      '<div class="conf-note">'+T('La arquitectura profunda de agentes se edita en el Desktop Studio, no aquí.','Deep agent architecture is edited in the Desktop Studio, not here.')+'</div></div>';

    $('#agAsk').onclick=function(){openVoice(true);};
    $('#agAct').onclick=function(){toast(T('Actividad · vista demo','Activity · demo view'),'history');};
  };

    renderTopbar({back:true,title:'Studio'});

      '<div class="card"><div class="row" style="justify-content:space-between"><div class="row" style="gap:9px"><span class="dot d-green"></span><b>Desktop Studio</b></div><span class="badge b-green">ONLINE</span></div>'+
      '<div class="stat-3" style="margin-top:16px"><div><div class="s-v" style="color:var(--gold)">8</div><div class="s-l">Agents active</div></div><div><div class="s-v" style="color:var(--cyan)">3</div><div class="s-l">Tasks running</div></div><div><div class="s-v" style="color:var(--amber)">'+(state.decisionReady?1:0)+'</div><div class="s-l">Approvals</div></div></div>'+
      '<hr class="hr"><div class="row" style="justify-content:space-between;font-size:13px"><span class="muted">System Health</span><b style="color:var(--green)">98%</b></div></div>'+
      '<div class="card"><div class="sec-h" style="margin-top:0">'+T('Handoff móvil → escritorio','Handoff mobile → desktop')+'</div>'+
      '<p class="muted" style="font-size:13.5px;margin:0 0 12px">'+T('Cualquier documento, misión, cliente o decisión puede enviarse al Workspace Multi-Pantalla. El escritorio continúa desde ese contexto.','Any document, mission, client or decision can be sent to the Multi-Display Workspace. The desktop continues from that context.')+'</p>'+
      '<button class="btn gold" id="stSend">'+svg('desktop')+' Send to Desktop</button></div></div>';
    $('#stSend').onclick=function(){haptic('light');toast('Sent to Studio Workspace (demo)','desktop');};
  };

  SCREENS.profile=function(v){
    renderTopbar({back:true,title:T('Perfil','Profile'),right:'<button class="icon-btn" id="pfSet">'+svg('settings')+'</button>'});

      '<div class="card" style="text-align:center"><img src="'+AVATAR+'" alt="" style="width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:center top;margin:0 auto 10px;border:2px solid var(--gold-dim)">'+
      '<div style="font-size:19px;font-weight:800">Capitán Gerardo A. Valles</div>'+
      '<div class="agent-role" style="color:var(--gold)">OWNER · EXECUTIVE COMMAND</div>'+
      '<div class="muted" style="font-size:13px;margin-top:4px">Miami DJ Beat LLC</div>'+
      '<div class="row" style="gap:6px;justify-content:center;margin-top:8px"><span class="dot d-green"></span><span style="font-size:12px;color:var(--green)">'+T('En línea','Online')+'</span></div></div>'+
      '<div class="stat-3 card"><div><div class="s-v">32</div><div class="s-l">'+T('Misiones hoy','Missions today')+'</div></div><div><div class="s-v" style="color:var(--amber)">'+(state.decisionReady?1:0)+'</div><div class="s-l">'+T('Pendientes','Pending')+'</div></div><div><div class="s-v" style="color:var(--green)">28</div><div class="s-l">'+T('Completadas','Completed')+'</div></div></div>'+
      '<div class="card">'+[['lang',T('Idioma','Language'),lang==='es'?'Español':'English'],['face',T('Voz','Voice'),T('Push to talk','Push to talk')],['bell',T('Notificaciones','Notifications'),T('Inteligentes','Smart')],['lock',T('Seguridad','Security'),'Face ID'],['studio','Desktop Studio','ONLINE']].map(function(r){return '<div class="lrow"><span class="l-ico">'+svg(r[0])+'</span><span class="l-t" style="flex:1">'+r[1]+'</span><span class="muted" style="font-size:13px">'+r[2]+'</span></div>';}).join('')+'</div>'+
      '<button class="btn danger" id="pfOut" style="margin-top:14px">'+svg('logout')+' '+T('Cerrar sesión','Sign out')+'</button></div>';
    $('#pfSet').onclick=function(){go('settings');};
    $('#pfOut').onclick=function(){confirmAction({danger:true,title:T('¿Cerrar sesión?','Sign out?'),body:T('Volverás a la autenticación.','You will return to authentication.'),ok:T('Cerrar sesión','Sign out'),onOk:function(){location.reload();}});};
  };

  /* SETTINGS */
  SCREENS.settings=function(v){
    renderTopbar({back:true,title:T('Ajustes','Settings')});
    v.innerHTML='<div class="pad screen-anim">'+
      '<div class="sec-h">'+T('Idioma','Language')+'</div><div class="card" style="padding:8px"><div class="tabs" style="margin:0"><button class="'+(lang==='es'?'on':'')+'" data-lang="es">Español</button><button class="'+(lang==='en'?'on':'')+'" data-lang="en">English</button></div></div>'+
      '<div class="sec-h">'+T('Modo de voz','Voice mode')+'</div><div class="card">'+
      [['ptt','Push to talk',true],['cont',T('Conversación continua','Continuous conversation'),false],['text',T('Solo texto','Text only'),false]].map(function(r){return '<div class="lrow"><span class="l-t" style="flex:1">'+r[1]+'</span>'+(r[2]?'<span class="badge b-green">'+T('ACTIVO','ACTIVE')+'</span>':'<span class="muted" style="font-size:12px">'+T('Tocar','Tap')+'</span>')+'</div>';}).join('')+'</div>'+
      '<div class="sec-h">'+T('Conexión','Connection')+'</div><div class="card"><button class="lrow tap" id="offToggle" style="width:100%;text-align:left"><span class="l-ico" style="color:'+(state.online?'var(--green)':'var(--red)')+'">'+svg(state.online?'shield':'warn')+'</span><div style="flex:1"><div class="l-t">'+(state.online?T('En línea','Online'):'OFFLINE')+'</div><div class="l-s">'+T('Toca para simular offline','Tap to simulate offline')+'</div></div><span class="badge '+(state.online?'b-green':'b-red')+'">'+(state.online?'ON':'OFF')+'</span></button></div>'+
      '<div class="sec-h">'+T('Privacidad','Privacy')+'</div><div class="card"><div class="lrow"><span class="l-ico">'+svg('mic')+'</span><span class="l-t" style="flex:1">'+T('Micrófono','Microphone')+'</span><span class="badge b-muted">'+T('INACTIVO','OFF')+'</span></div><div class="lrow"><span class="l-ico">'+svg('lock')+'</span><span class="l-t" style="flex:1">'+T('Datos cifrados','Encrypted data')+'</span><span class="badge b-green">ON</span></div></div>'+
      '<div class="conf-note">MDJ COMMANDER v0.1 · Miami DJ Beat LLC · '+T('Prototipo demo · sin backend real','Demo prototype · no real backend')+'</div></div>';
    document.querySelectorAll('[data-lang]').forEach(function(b){b.onclick=function(){lang=b.getAttribute('data-lang');localStorage.setItem('mdjc_lang',lang);render();};});

  };

  /* CONVERSATION (long) */
  SCREENS.conversation=function(v){
    renderTopbar({back:true,title:'ELIXIS',sub:T('Conversación','Conversation')});
    v.innerHTML='<div class="pad screen-anim" style="display:flex;flex-direction:column;min-height:100%">'+
      '<div class="avatar-stage speaking" style="width:170px;height:186px;margin:0 auto 8px" id="cvStage"><canvas class="avatar-fx" id="cvFX"></canvas><div class="avatar-baseglow"></div><img class="avatar-fig" src="'+AVATAR+'"></div>'+
      '<div style="flex:1">'+
      msgBubble('me',T('Analiza esta compañía.','Analyze this company.'))+
      msgBubble('ai',T('Encontré su web. ¿Quieres análisis comercial o técnico?','Found their website. Commercial or technical analysis?'))+
      msgBubble('me',T('Ambos.','Both.'))+
      msgBubble('ai',T('He terminado. Detecté seis oportunidades; tres son importantes. Mi recomendación comercial es $2,500. ¿Revisamos la propuesta?','Done. Found six opportunities; three are important. My commercial recommendation is $2,500. Review the proposal?'))+
      '</div>'+
      '<div class="qr" style="justify-content:flex-start"><button class="btn gold" id="cvReview" style="width:auto">'+T('Ver propuesta','View proposal')+'</button><button class="btn" id="cvVoice" style="width:auto">'+svg('mic')+'</button></div></div>';
    $('#cvReview').onclick=function(){go('decisionDetail',{id:'DEC-Mojitos'});};
    $('#cvVoice').onclick=function(){openVoice(true);};
    mountFX($('#cvFX'),'speaking');
  };
  function msgBubble(who,text){return '<div style="max-width:82%;margin:6px 0;padding:11px 14px;border-radius:15px;font-size:14.5px;'+(who==='me'?'margin-left:auto;background:var(--gold-dim);border:1px solid var(--gold-dim);border-bottom-right-radius:5px':'background:var(--elev2);border:1px solid var(--line);border-bottom-left-radius:5px')+'">'+esc(text)+'</div>';}

  function badge(k,t){return '<span class="badge b-'+k+'">'+t+'</span>';}

  /* ───── render ───── */
  function render(){
    var v=$('#view');
    renderTopbar({title:''}); // reset; screen sets it
    (SCREENS[state.screen]||SCREENS.command)(v);
    renderNav();
    renderFab(state.screen!=='command'&&state.screen!=='conversation'&&MAIN.indexOf(state.screen)<0? true : (state.screen!=='command'));
    // FAB on all except command
    renderFab(state.screen!=='command');
  }
  function renderOffline(){
    var b=$('#offlineBanner');
    b.innerHTML = state.online? '' : '<div class="offline-banner">'+svg('warn','width="12" style="vertical-align:-2px"')+' OFFLINE · '+T('las órdenes se guardan como borrador','orders saved as draft')+'</div>';
  }

  /* clock */

  /* splash → auth → command */
  $('#splashLogo').src=LOGO;
  setTimeout(function(){var a=$('#authTxt');if(a)a.textContent=T('Autenticado ✓','Authenticated ✓');},1500);
  setTimeout(function(){$('#splash').classList.add('hide');},2300);
  setTimeout(function(){var s=$('#splash');if(s)s.style.display='none';},2900);

  renderOffline();
  render();
})();
</script>
