<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MDJ — Quick invoice / payment (emergency)</title>
  <link rel="stylesheet" href="./styles.css?v=20260430-legacy-compat-1" />
  <style>
    body { background: #0a0e14; color: #e8e8e8; min-height: 100vh; padding: 32px 16px 60px; }
    .aq-wrap { max-width: 520px; margin: 0 auto; }
    .aq-card {
      background: rgba(26, 43, 86, 0.25);
      border: 1px solid rgba(197, 160, 89, 0.4);
      border-radius: 20px;
      padding: 24px;
    }
    .aq-card h1 { margin: 0 0 8px; font-size: 1.35rem; color: var(--gold); }
    .aq-card p { font-size: 13px; opacity: 0.85; line-height: 1.45; margin: 0 0 16px; }
    label { display: block; font-size: 12px; opacity: 0.8; margin-bottom: 4px; }
    input {
      width: 100%; box-sizing: border-box; padding: 12px 14px; margin-bottom: 14px;
      border-radius: 12px; border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.3); color: #fff;
    }
    .aq-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
    #aq-status { margin-top: 14px; font-size: 13px; text-align: center; }
  </style>
</head>
<body class="notranslate">
  <div class="aq-wrap">
    <div class="aq-card" id="aq-gate" style="display:none;">
      <h1>🔐 Quick access</h1>
      <p>Enter the site emergency key (set in code or ask Architect).</p>
      <input type="password" id="aq-key" placeholder="Key" autocomplete="off" />
      <button type="button" class="btn primary" id="aq-unlock" style="width:100%;font-weight:900;">Unlock</button>
    </div>
    <div class="aq-card" id="aq-main" style="display:none;">
      <h1>⚡ Stripe + lead (guest)</h1>
      <p>Creates a <code>leads</code> row and opens Stripe Checkout URL. Bookmark:
        <a href="./manual-invoice-generator.html" style="color:var(--gold);">Manual invoice →</a></p>
      <label>Client email</label>
      <input type="email" id="aq-email" placeholder="cliente@email.com" />
      <label>Amount (USD)</label>
      <input type="number" id="aq-amt" min="1" step="0.01" placeholder="500" />
      <label>Description (optional)</label>
      <input type="text" id="aq-desc" placeholder="Event label" />
      <div class="aq-actions">
        <button type="button" class="btn primary" id="aq-go" style="flex:1;font-weight:900;">Create lead + payment link</button>
      </div>
      <p id="aq-status"></p>
    </div>
    <p style="text-align:center;margin-top:20px;font-size:12px;opacity:0.6;">
      <a href="./index.html" style="color:inherit;">Home</a>
      · <a href="./client-portal.html?mode=manager&guest=1" style="color:var(--gold);">Manager guest mode</a>
    </p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js?v=20260422-supabase-kxvqdr-host"></script>
  <script>
    (function () {
      var PASS = 'MDJB_GUEST_2026';
      var gate = document.getElementById('aq-gate');
      var main = document.getElementById('aq-main');
      var qs = new URLSearchParams(window.location.search);
      if (sessionStorage.getItem('mdj_aq_ok') === '1' || qs.get('key') === PASS) {
        sessionStorage.setItem('mdj_aq_ok', '1');
        main.style.display = 'block';
      } else {
        gate.style.display = 'block';
      }
      document.getElementById('aq-unlock').onclick = function () {
        var v = (document.getElementById('aq-key').value || '').trim();
        if (v === PASS) {
          sessionStorage.setItem('mdj_aq_ok', '1');
          gate.style.display = 'none';
          main.style.display = 'block';
        } else {
          alert('Invalid key');
        }
      };
      async function mdjFetchJson(resp) {
        var text = await resp.text();
        var data;
        try { data = text ? JSON.parse(text) : {}; } catch (e) { throw new Error(text.slice(0, 200)); }
        if (!resp.ok) throw new Error((data && data.error) || text.slice(0, 200));
        if (data && data.ok === false && data.error) throw new Error(String(data.error));
        return data;
      }
      document.getElementById('aq-go').onclick = async function () {
        var st = document.getElementById('aq-status');
        var email = (document.getElementById('aq-email').value || '').trim().toLowerCase();
        var amt = parseFloat(document.getElementById('aq-amt').value);
        var desc = (document.getElementById('aq-desc').value || '').trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          st.textContent = 'Valid email required.';
          return;
        }
        if (isNaN(amt) || amt < 1) {
          st.textContent = 'Amount must be at least 1 USD.';
          return;
        }
        var db = typeof window.getSupabaseClient === 'function' ? window.getSupabaseClient() : null;
        if (!db) {
          st.textContent = 'Supabase not configured.';
          return;
        }
        var sess = await db.auth.getSession();
        if (!sess || !sess.data || !sess.data.session) {
          window.location.href = './login.html?redirect=' + encodeURIComponent('admin-quick-invoice.html');
          return;
        }
        st.textContent = 'Creating lead…';
        var insRes = await db.from('leads').insert([{
          email: email,
          total_amount: amt,
          balance_paid: 0,
          payment_status: 'UNPAID',
          event_type: 'Guest (quick page)',
          event_date: new Date().toISOString().slice(0, 10),
          status: 'NEW',
          source: 'admin_quick_invoice',
          notes: JSON.stringify({ admin_quick_invoice: true })
        }]).select('id').single();
        if (insRes.error || !insRes.data || !insRes.data.id) {
          st.textContent = (insRes.error && insRes.error.message) || 'Insert failed (RLS?).';
          return;
        }
        var id = insRes.data.id;
        var payFn =
          typeof window.mdbSupabaseFunctionUrl === 'function'
            ? window.mdbSupabaseFunctionUrl('create-event-payment')
            : '';
        if (!payFn) {
          st.textContent = 'Supabase function URL missing.';
          return;
        }
        var resp = await fetch(payFn, {
          method: 'POST',
          headers:
            typeof window.mdjSupabaseAnonInvokeHeaders === 'function'
              ? window.mdjSupabaseAnonInvokeHeaders()
              : { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            lead_id: id,
            amount_cents: Math.max(Math.round(amt * 100), 100),
            description: desc || 'Miami DJ Beat — payment'
          })
        });
        try {
          var result = await mdjFetchJson(resp);
          if (!result.url) throw new Error('No URL');
          try {
            await navigator.clipboard.writeText(result.url);
            alert('Copied:\n' + result.url);
          } catch (e) {
            window.prompt('Payment link:', result.url);
          }
          st.textContent = 'Done. Lead id: ' + id;
        } catch (e) {
          st.textContent = String(e && e.message ? e.message : e);
        }
      };
    })();
  </script>
</body>
</html>
