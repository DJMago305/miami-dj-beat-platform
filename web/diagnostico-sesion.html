<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Diagnostico de sesion — Miami DJ Beat</title>
<!--
  FIX-LEGACY-SUPABASE-01 · pagina de diagnostico para motores antiguos.

  Se escribe ENTERA en ES5: sin funciones flecha, sin plantillas, sin ?., sin
  async/await. Si usara sintaxis moderna moriria justo en las maquinas que
  queremos medir, que es el error que ya cometimos una vez.

  No arregla nada ni toca la sesion: solo mira y escribe en pantalla. Sirve
  para saber, desde el propio equipo que falla, si la libreria llego, cual de
  las dos, y si hay sesion guardada.
-->
<style>
  body { margin:0; padding:20px; background:#0a0e16; color:#e6ebf2;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size:15px; }
  h1 { font-size:19px; margin:0 0 4px; color:#c5a059; }
  p.sub { margin:0 0 18px; color:#8b95a6; font-size:13px; }
  table { border-collapse:collapse; width:100%; max-width:820px; }
  td { padding:9px 10px; border-bottom:1px solid rgba(255,255,255,.09); vertical-align:top; }
  td.k { color:#8b95a6; width:210px; }
  td.v { font-family:ui-monospace,Menlo,Monaco,monospace; font-size:13px; word-break:break-all; }
  .ok { color:#6edc8b; font-weight:700; }
  .mal { color:#ff6961; font-weight:700; }
  .avi { color:#ffcc66; font-weight:700; }
  #veredicto { max-width:820px; margin:18px 0; padding:14px 16px; border-radius:10px;
               background:rgba(255,255,255,.04); border:1px solid rgba(197,160,89,.3); line-height:1.5; }
</style>

<!-- Mismo cargador que el resto del sitio, para medir lo que pasa de verdad. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
<script>
  window.__diagCdnOk = !!(window.supabase && typeof window.supabase.createClient === 'function');
  (function () {
      var mdjLibAusente = !(window.supabase &&
          typeof window.supabase.createClient === 'function');
      if (mdjLibAusente) {
          document.write('<script src="./vendor/supabase-js-2.112.3.legacy.js?v=20260818-safari-legacy"><\/script>');
      }
  })();
</script>
<script>
  window.__diagErrores = [];
  window.onerror = function (msg, url, linea) {
      window.__diagErrores.push(String(msg) + ' @ ' + String(url).split('/').pop() + ':' + linea);
      return false;
  };
</script>
<script src="./supabase-config.js"></script>
</head>
<body>
<h1>Diagnostico de sesion</h1>
<p class="sub">Solo mira y reporta. No cambia nada ni cierra tu sesion.</p>
<div id="veredicto">Midiendo…</div>
<table id="t"></table>

<script>
(function () {
    var filas = [];
    function fila(k, v, clase) {
        filas.push('<tr><td class="k">' + k + '</td><td class="v ' + (clase || '') + '">' + v + '</td></tr>');
    }
    function si(b) { return b ? '<span class="ok">SI</span>' : '<span class="mal">NO</span>'; }

    var libOk = !!(window.supabase && typeof window.supabase.createClient === 'function');
    var cdnOk = window.__diagCdnOk === true;
    var respaldoUsado = libOk && !cdnOk;

    fila('Navegador', String(navigator.userAgent).slice(0, 150));
    fila('CDN cargo la libreria', si(cdnOk));
    fila('Respaldo local usado', respaldoUsado ? '<span class="avi">SI — el CDN fallo</span>' : si(false));
    fila('Libreria disponible', si(libOk));

    var clienteOk = false;
    try { clienteOk = !!(window.getSupabaseClient && window.getSupabaseClient()); } catch (e1) {}
    fila('Cliente creado', si(clienteOk));
    fila('Failsafe se rindio', window.__mdbSupabaseInitFailed === true
        ? '<span class="mal">SI</span>' : si(false));

    var lsOk = false, claves = [];
    try {
        localStorage.setItem('__diag', '1'); localStorage.removeItem('__diag'); lsOk = true;
        for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && (k.indexOf('sb-') === 0 || k.indexOf('supabase') !== -1)) claves.push(k);
        }
    } catch (e2) { lsOk = false; }
    fila('localStorage disponible', si(lsOk));
    fila('Claves de sesion guardadas', claves.length ? claves.join('<br>') : '<span class="mal">ninguna</span>');

    fila('Errores de guion', window.__diagErrores.length
        ? '<span class="mal">' + window.__diagErrores.join('<br>') + '</span>'
        : '<span class="ok">ninguno</span>');

    document.getElementById('t').innerHTML = filas.join('');

    function veredicto(txt) { document.getElementById('veredicto').innerHTML = txt; }

    if (!libOk) {
        veredicto('<span class="mal">La libreria NO llego por ningun camino.</span> ' +
            'Ni el CDN ni la copia local. Sin libreria no hay sesion posible y el perfil ' +
            'expulsa al login: este es el rebote.');
        return;
    }

    if (!clienteOk) {
        veredicto('<span class="mal">La libreria esta, pero el cliente no se creo.</span> ' +
            'El fallo esta en la configuracion, no en la carga.');
        return;
    }

    if (!claves.length) {
        veredicto('<span class="avi">Todo cargo bien, pero no hay sesion guardada en este equipo.</span> ' +
            'El rebote al login seria correcto: hay que iniciar sesion aqui.');
        return;
    }

    var sb = window.getSupabaseClient();
    sb.auth.getSession().then(function (r) {
        var hay = !!(r && r.data && r.data.session);
        fila('Sesion leida', si(hay));
        if (hay) fila('Usuario', r.data.session.user.email || r.data.session.user.id);
        document.getElementById('t').innerHTML = filas.join('');
        veredicto(hay
            ? '<span class="ok">Todo correcto' + (respaldoUsado ? ' — gracias al respaldo local' : '') +
              '.</span> Hay sesion valida: el perfil no deberia rebotar.'
            : '<span class="mal">Hay claves guardadas pero la sesion no se pudo leer.</span> ' +
              'Suele ser el token caducado o el almacenamiento purgado por el navegador.');
    })['catch'](function (e3) {
        veredicto('<span class="mal">Fallo al leer la sesion:</span> ' + String(e3).slice(0, 160));
    });
})();
</script>
</body>
</html>
