<title>MDJB Music Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0d;
    --bg-elevated:#101012;
    --surface:#17171b;
    --surface-2:#1e1e23;
    --surface-3:#25252b;
    --border:#2b2b31;
    --border-strong:#3c3c44;
    --gold:#c5a059;
    --gold-bright:#e3c68b;
    --gold-dim:#7c6033;
    --gold-wash:rgba(197,160,89,.08);
    --text:#f1efe9;
    --text-dim:#9d9ca4;
    --text-faint:#5e5d64;
    --good:#38caa0;
    --good-wash:rgba(56,202,160,.12);
    --warn:#e2a53f;
    --warn-wash:rgba(226,165,63,.12);
    --critical:#e5586a;
    --critical-wash:rgba(229,88,106,.12);
    --info:#5aa3d8;
    --font-display:'Playfair Display',Georgia,serif;
    --font-body:'Inter',system-ui,-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    --rail-w:212px;
    --rail-w-collapsed:72px;
    --header-h:64px;
    --radius:10px;
    --radius-sm:6px;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--font-body);
    font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
  h1,h2,h3,h4{font-family:var(--font-display);font-weight:800;letter-spacing:.01em;text-wrap:balance;margin:0;}
  button{font-family:inherit;}
  ::selection{background:var(--gold-dim);color:#fff;}
  a{color:inherit;}
  .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  .label{
    font-family:var(--font-body);font-weight:600;font-size:10.5px;letter-spacing:.11em;
    text-transform:uppercase;color:var(--text-dim);
  }
  .scrollx{overflow-x:auto;}
  .badge{
    display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;
    font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid var(--border-strong);color:var(--text-dim);background:var(--surface-2);
    white-space:nowrap;
  }
  .badge.gold{color:var(--gold-bright);border-color:var(--gold-dim);background:var(--gold-wash);}
  .badge.good{color:var(--good);border-color:rgba(56,202,160,.35);background:var(--good-wash);}
  .badge.warn{color:var(--warn);border-color:rgba(226,165,63,.35);background:var(--warn-wash);}
  .badge.critical{color:var(--critical);border-color:rgba(229,88,106,.35);background:var(--critical-wash);}
  .badge.info{color:var(--info);border-color:rgba(90,163,216,.35);background:rgba(90,163,216,.1);}
  button.badge{appearance:none;font-family:inherit;cursor:pointer;}
  button.badge:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .btn{
    appearance:none;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);
    font-family:var(--font-body);font-weight:600;font-size:12.5px;letter-spacing:.03em;
    padding:9px 14px;border-radius:var(--radius-sm);cursor:pointer;
    transition:border-color .12s ease, background-color .12s ease, color .12s ease;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--text-faint);background:var(--surface-3);}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-gold{background:var(--gold);border-color:var(--gold);color:#151107;}
  .btn-gold:hover{background:var(--gold-bright);border-color:var(--gold-bright);color:#151107;}
  .btn-ghost{background:transparent;}
  .btn-sm{padding:6px 10px;font-size:11.5px;}
  .icon{width:16px;height:16px;display:block;flex:none;}
  .icon-lg{width:20px;height:20px;}
  .glass{
    background:linear-gradient(180deg,var(--surface-2),var(--surface));
    border:1px solid var(--border);border-radius:var(--radius);
  }
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:13px 16px;border-bottom:1px solid var(--border);
  }
  .panel-body{padding:16px;}

  /* ---------- App shell ---------- */
  #app{min-height:100%;display:flex;flex-direction:column;}
  .topbar{
    height:var(--header-h);flex:none;display:flex;align-items:center;
    padding:0 18px 0 16px;gap:18px;border-bottom:1px solid var(--border);
    background:var(--bg-elevated);position:relative;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand-mark{
    width:38px;height:38px;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .brand-mark img{width:100%;height:100%;object-fit:contain;display:block;}
  .brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
  .brand-text .b-name{font-family:var(--font-display);font-weight:800;font-size:15.5px;letter-spacing:.03em;white-space:nowrap;}
  .brand-text .b-sub{font-size:9.5px;color:var(--text-dim);letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;}
  .topbar-center{
    flex:1;display:flex;justify-content:center;min-width:0;
  }
  .experience-pill{
    display:flex;align-items:center;gap:8px;padding:7px 14px 7px 10px;border-radius:999px;
    background:var(--surface-2);border:1px solid var(--border-strong);max-width:100%;
  }
  .experience-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none;box-shadow:0 0 0 3px var(--good-wash);}
  .listen-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--text-faint);margin-right:5px;}
  .listen-dot.on{background:var(--good);box-shadow:0 0 0 3px var(--good-wash);animation:pulse-dot 1.6s ease-in-out infinite;}
  @keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:.4;}}
  .experience-pill span{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.04em;
    text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .topbar-right{display:flex;align-items:center;gap:6px;flex:none;}
  .icon-btn{
    width:34px;height:34px;border-radius:var(--radius-sm);border:1px solid transparent;background:transparent;
    color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:background-color .12s ease, color .12s ease, border-color .12s ease;position:relative;
  }
  .icon-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-strong);}
  .icon-btn.active{color:var(--gold);border-color:var(--gold-dim);background:var(--gold-wash);}
  .icon-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  .shell{flex:1;display:flex;min-height:0;}
  .rail{
    width:var(--rail-w);flex:none;border-right:1px solid var(--border);background:var(--bg-elevated);
    display:flex;flex-direction:column;padding:14px 10px;gap:2px;transition:width .16s ease;overflow-y:auto;
  }
  .rail.collapsed{width:var(--rail-w-collapsed);}
  .rail-group-label{
    font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);
    padding:12px 10px 6px;
  }
  .rail.collapsed .rail-group-label,.rail.collapsed .nav-label,.rail.collapsed .nav-tag{display:none;}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--radius-sm);
    color:var(--text-dim);cursor:pointer;border:1px solid transparent;background:none;width:100%;text-align:left;
    font-family:var(--font-body);font-weight:600;font-size:12.5px;letter-spacing:.02em;
    transition:background-color .12s ease,color .12s ease,border-color .12s ease;
  }
  .nav-item:hover{background:var(--surface-2);color:var(--text);}
  .nav-item.active{background:var(--gold-wash);color:var(--gold-bright);border-color:var(--gold-dim);}
  .nav-item .icon{color:inherit;}
  .nav-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
  .nav-tag{font-size:8.5px;font-weight:700;letter-spacing:.06em;color:var(--text-faint);
    border:1px solid var(--border-strong);border-radius:4px;padding:1px 4px;flex:none;}
  .rail-foot{margin-top:auto;padding:10px 8px 4px;}
  .proto-badge{
    display:flex;flex-direction:column;gap:3px;padding:9px 10px;border-radius:var(--radius-sm);
    border:1px dashed var(--border-strong);
  }
  .proto-badge b{font-size:9.5px;letter-spacing:.09em;color:var(--gold-bright);}
  .proto-badge span{font-size:9px;color:var(--text-faint);letter-spacing:.03em;}
  .rail.collapsed .proto-badge span,.rail.collapsed .proto-badge b{display:none;}

  main{flex:1;min-width:0;overflow-y:auto;padding:22px 26px 60px;}
  .view{display:none;}
  .view.active{display:block;animation:fade .14s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .view-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
  .view-title{font-size:23px;}
  .view-desc{color:var(--text-dim);font-size:12.5px;max-width:62ch;margin-top:4px;}
  .eyebrow{font-family:var(--font-body);font-weight:700;font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--gold-bright);margin-bottom:6px;display:block;}

  /* ---------- Home / Experiences ---------- */
  .hero{text-align:center;padding:34px 10px 26px;}
  .hero h1{font-size:44px;letter-spacing:.01em;}
  .hero p{color:var(--text-dim);font-size:13.5px;letter-spacing:.02em;margin-top:8px;text-transform:uppercase;font-weight:600;}
  .exp-grid{
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:1080px;margin:0 auto;
  }
  @media(max-width:1040px){.exp-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
  .exp-card{
    border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);
    padding:20px 18px;display:flex;flex-direction:column;gap:10px;min-height:186px;position:relative;overflow:hidden;
  }
  .exp-card.enabled{border-color:var(--gold-dim);background:linear-gradient(160deg,var(--surface-2),var(--surface) 60%);}
  .exp-card.enabled::before{
    content:"";position:absolute;inset:-40% -20% auto auto;width:200px;height:200px;
    background:radial-gradient(circle,var(--gold-wash),transparent 70%);pointer-events:none;
  }
  .exp-card.soon{opacity:.55;}
  .exp-card h3{font-size:19px;letter-spacing:.01em;line-height:1.05;}
  .exp-card .exp-tag{margin-bottom:2px;}
  .exp-card p{color:var(--text-dim);font-size:12px;margin:0;flex:1;}
  .exp-card .exp-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}

  /* ---------- Event Mode status strip ---------- */
  .status-strip{
    display:flex;align-items:center;gap:0;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);margin-bottom:16px;overflow:hidden;
  }
  .status-cell{padding:10px 16px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:3px;min-width:96px;}
  .status-cell:last-child{border-right:none;}
  .status-cell .v{font-family:var(--font-mono);font-weight:600;font-size:14px;}
  .status-cell select{
    background:none;border:none;color:var(--text);font-family:var(--font-mono);font-weight:600;font-size:14px;
    padding:0;cursor:pointer;
  }
  .status-cell select:focus-visible{outline:2px solid var(--gold);}
  .culture-toggle{display:flex;gap:4px;padding:10px 16px;}
  .culture-btn{
    padding:6px 11px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface-2);
    color:var(--text-dim);font-size:10.5px;font-weight:700;letter-spacing:.06em;cursor:pointer;
  }
  .culture-btn.active{background:var(--gold);border-color:var(--gold);color:#151107;}
  .energy-cell{flex:1;min-width:160px;padding:10px 16px;}
  .energy-track{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin-top:6px;}
  .energy-fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));border-radius:4px;transition:width .2s ease;}

  /* ---------- Event Mode 3 columns ---------- */
  .event-grid{display:grid;grid-template-columns:236px minmax(0,1fr) 268px;gap:14px;align-items:start;}
  @media(max-width:1180px){.event-grid{grid-template-columns:1fr;}}
  .gen-list{display:flex;flex-direction:column;gap:5px;padding:10px;}
  .gen-item{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);cursor:pointer;
    border:1px solid transparent;background:none;width:100%;text-align:left;color:var(--text-dim);
  }
  .gen-item:hover{background:var(--surface-2);}
  .gen-item .gdot{width:8px;height:8px;border-radius:50%;background:var(--border-strong);flex:none;}
  .gen-item .gname{font-family:var(--font-display);font-weight:700;font-size:14px;color:inherit;flex:1;}
  .gen-item .grange{font-size:9.5px;color:var(--text-faint);font-family:var(--font-mono);}
  .gen-item.active{background:var(--gold-wash);border-color:var(--gold-dim);color:var(--gold-bright);}
  .gen-item.active .gdot{background:var(--gold);box-shadow:0 0 0 3px var(--gold-wash);}
  .gen-item.next .gname::after{content:"→ next";font-size:9px;color:var(--text-faint);margin-left:8px;font-family:var(--font-body);text-transform:uppercase;letter-spacing:.05em;}
  .gen-item.prev .gname::after{content:"prev";font-size:9px;color:var(--text-faint);margin-left:8px;font-family:var(--font-body);text-transform:uppercase;letter-spacing:.05em;}

  .now-playing{padding:20px;display:flex;flex-direction:column;gap:16px;}
  .np-top{display:flex;gap:16px;}
  .artwork{
    width:112px;height:112px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--surface-3),var(--surface));border:1px solid var(--border-strong);
    display:flex;align-items:center;justify-content:center;color:var(--gold-dim);position:relative;overflow:hidden;
  }
  .artwork::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,var(--gold-wash),transparent 60%);}
  .np-info{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:3px;}
  .np-title{font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1.08;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .np-artist{color:var(--text-dim);font-size:13.5px;font-weight:500;}
  .np-meta{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border-radius:var(--radius-sm);overflow:hidden;}
  .stat-cell{background:var(--surface-2);padding:10px 12px;display:flex;flex-direction:column;gap:3px;}
  .stat-cell .v{font-family:var(--font-mono);font-weight:700;font-size:17px;}
  .stat-cell.hi .v{color:var(--gold-bright);}
  .response-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .response-btns{display:flex;gap:6px;}
  .rbtn{
    width:44px;height:38px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--surface-2);
    color:var(--text-dim);font-family:var(--font-mono);font-weight:700;font-size:13px;cursor:pointer;
  }
  .rbtn:hover{border-color:var(--text-faint);}
  .rbtn[data-v="-2"]:hover,.rbtn[data-v="-1"]:hover{color:var(--critical);border-color:var(--critical);}
  .rbtn[data-v="0"]:hover{color:var(--text);}
  .rbtn[data-v="1"]:hover,.rbtn[data-v="2"]:hover{color:var(--good);border-color:var(--good);}
  .rbtn.picked{background:var(--gold);border-color:var(--gold);color:#151107;}
  .reaction-meter{display:flex;align-items:center;gap:8px;flex:1;min-width:150px;}
  .reaction-track{flex:1;height:20px;border-radius:5px;background:var(--surface-3);display:flex;align-items:center;gap:2px;padding:3px;}
  .reaction-bar{flex:1;height:100%;border-radius:3px;background:var(--border-strong);}
  .reaction-bar.on{background:var(--gold);}

  .fi-grid{display:flex;flex-direction:column;gap:1px;background:var(--border);border-radius:var(--radius-sm);overflow:hidden;}
  .fi-row{background:var(--surface-2);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .fi-row .k{font-size:10.5px;color:var(--text-dim);letter-spacing:.05em;text-transform:uppercase;font-weight:600;}
  .fi-row .v{font-family:var(--font-mono);font-weight:700;font-size:13px;}

  .nme-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px;}
  @media(max-width:980px){.nme-grid{grid-template-columns:1fr;}}
  .move-card{padding:15px;display:flex;flex-direction:column;gap:10px;}
  .move-card .mc-head{display:flex;align-items:center;justify-content:space-between;}
  .move-card .mc-kind{font-family:var(--font-display);font-weight:800;font-size:13.5px;letter-spacing:.03em;}
  .move-card.safe{border-color:rgba(90,163,216,.3);}
  .move-card.up{border-color:rgba(226,165,63,.3);}
  .move-card.bridge{border-color:var(--gold-dim);}
  .move-track{font-weight:700;font-size:14.5px;}
  .move-artist{color:var(--text-dim);font-size:12px;}
  .move-meta{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);}
  .confidence-row{display:flex;align-items:center;gap:8px;}
  .conf-track{flex:1;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;}
  .conf-fill{height:100%;border-radius:3px;background:var(--gold);}
  .why-toggle{background:none;border:none;color:var(--text-faint);font-size:10.5px;text-decoration:underline;
    cursor:pointer;padding:0;text-align:left;font-family:var(--font-body);}
  .why-box{font-size:11.5px;color:var(--text-dim);background:var(--surface-2);border:1px solid var(--border);
    border-radius:6px;padding:9px 10px;display:none;line-height:1.5;}
  .why-box.open{display:block;}
  .move-empty{color:var(--text-faint);font-size:12px;padding:10px 0;}

  .journey-row{display:flex;align-items:center;gap:0;padding:22px 16px;overflow-x:auto;}
  .journey-node{display:flex;flex-direction:column;align-items:center;gap:8px;flex:none;width:104px;position:relative;}
  .journey-dot{width:15px;height:15px;border-radius:50%;background:var(--surface-3);border:2px solid var(--border-strong);z-index:1;}
  .journey-node.done .journey-dot{background:var(--gold-dim);border-color:var(--gold-dim);}
  .journey-node.active .journey-dot{background:var(--gold);border-color:var(--gold-bright);box-shadow:0 0 0 5px var(--gold-wash);}
  .journey-label{font-family:var(--font-display);font-weight:700;font-size:12.5px;color:var(--text-dim);}
  .journey-node.active .journey-label{color:var(--gold-bright);}
  .journey-here{font-size:8.5px;color:var(--gold-bright);letter-spacing:.06em;text-transform:uppercase;position:absolute;top:-16px;}
  .journey-line{flex:1;height:2px;background:var(--border-strong);margin-top:-31px;min-width:20px;}
  .journey-line.done{background:var(--gold-dim);}
  .journey-line.bridge{background:repeating-linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 11px);}

  .timeline-wrap{padding:16px;}
  .timeline-svg{width:100%;height:150px;display:block;}
  .timeline-legend{display:flex;justify-content:space-between;font-size:9px;color:var(--text-faint);
    letter-spacing:.04em;text-transform:uppercase;margin-top:6px;padding:0 4px;font-family:var(--font-mono);}

  .footer-strip{display:flex;gap:0;margin-top:16px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);overflow-x:auto;}
  .footer-cell{padding:10px 16px;border-right:1px solid var(--border);white-space:nowrap;font-size:11px;color:var(--text-dim);
    display:flex;align-items:center;gap:6px;}
  .footer-cell:last-child{border-right:none;}
  .footer-cell b{color:var(--text);font-family:var(--font-mono);}

  /* ---------- Library ---------- */
  .filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;}
  .filter-bar select,.filter-bar input[type=text]{
    background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);
    padding:8px 10px;border-radius:6px;font-family:var(--font-body);font-size:12px;
  }
  .filter-bar input[type=text]{min-width:190px;}
  .filter-bar select:focus-visible,.filter-bar input:focus-visible{outline:2px solid var(--gold);}
  table{border-collapse:collapse;width:100%;min-width:920px;}
  thead th{
    text-align:left;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);
    font-weight:700;padding:8px 12px;border-bottom:1px solid var(--border-strong);white-space:nowrap;position:sticky;top:0;background:var(--bg);
  }
  tbody td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:12.5px;white-space:nowrap;}
  tbody tr{cursor:pointer;}
  tbody tr:hover td{background:var(--surface-2);}
  tbody tr.played td{color:var(--text-faint);}
  .track-name{color:var(--text);font-weight:600;}
  .result-count{color:var(--text-faint);font-size:11px;margin-bottom:10px;}

  /* ---------- Generation map ---------- */
  .genmap-row{display:flex;align-items:center;padding:30px 6px;overflow-x:auto;gap:0;}
  .genmap-node{display:flex;flex-direction:column;align-items:center;gap:10px;flex:none;width:118px;position:relative;cursor:pointer;
    background:none;border:none;color:inherit;font-family:inherit;}
  .genmap-circle{width:52px;height:52px;border-radius:50%;background:var(--surface-2);border:2px solid var(--border-strong);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:15px;color:var(--text-dim);}
  .genmap-node.active .genmap-circle{background:var(--gold-wash);border-color:var(--gold);color:var(--gold-bright);}
  .genmap-node.from .genmap-circle{border-color:var(--info);box-shadow:0 0 0 3px rgba(90,163,216,.18);}
  .genmap-node.to .genmap-circle{border-color:var(--good);box-shadow:0 0 0 3px rgba(56,202,160,.18);}
  .genmap-label{font-size:11.5px;font-weight:700;color:var(--text-dim);}
  .genmap-node.active .genmap-label{color:var(--gold-bright);}
  .genmap-line{flex:1;height:2px;background:var(--border-strong);min-width:16px;margin-top:-30px;}
  .ft-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px;}
  .ft-field{display:flex;flex-direction:column;gap:5px;}
  .ft-field select{background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);padding:9px 12px;
    border-radius:6px;font-family:var(--font-mono);font-size:12.5px;min-width:150px;}
  .bridge-list{display:flex;flex-direction:column;gap:8px;}
  .bridge-item{display:flex;align-items:center;gap:12px;padding:12px 14px;}
  .bridge-item .bi-main{flex:1;min-width:0;}
  .bridge-item .bi-title{font-weight:700;font-size:13px;}
  .bridge-item .bi-sub{color:var(--text-dim);font-size:11.5px;}
  .chip-row{display:flex;gap:5px;flex-wrap:wrap;}
  .chip{font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:3px 7px;border-radius:5px;
    background:var(--surface-3);color:var(--text-dim);border:1px solid var(--border-strong);}

  /* ---------- Bridge engine ---------- */
  .route-tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap;}
  .route-tab{padding:9px 14px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-2);
    color:var(--text-dim);font-weight:700;font-size:12px;cursor:pointer;}
  .route-tab.active{background:var(--gold-wash);border-color:var(--gold);color:var(--gold-bright);}
  .route-chain{display:flex;align-items:center;gap:0;flex-wrap:wrap;padding:20px 4px;}
  .chain-node{padding:14px 16px;min-width:150px;}
  .chain-arrow{width:34px;text-align:center;color:var(--text-faint);flex:none;}

  /* ---------- Block builder ---------- */
  .bb-form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px;}
  @media(max-width:900px){.bb-form{grid-template-columns:repeat(2,minmax(0,1fr));}}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);}
  .field input,.field select{background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);
    padding:9px 11px;border-radius:6px;font-family:var(--font-body);font-size:12.5px;}
  .bb-lanes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px;}
  @media(max-width:1100px){.bb-lanes{grid-template-columns:repeat(2,minmax(0,1fr));}}
  .lane{display:flex;flex-direction:column;gap:8px;}
  .lane-head{display:flex;align-items:center;justify-content:space-between;}
  .lane-title{font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;}
  .lane-body{min-height:64px;border:1px dashed var(--border-strong);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:6px;}
  .lane-empty{font-size:10.5px;color:var(--text-faint);text-align:center;padding:14px 4px;}
  .lane-track{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:7px 8px;display:flex;flex-direction:column;gap:4px;}
  .lane-track .lt-title{font-size:11.5px;font-weight:700;}
  .lane-track .lt-meta{font-size:9.5px;color:var(--text-faint);font-family:var(--font-mono);}
  .lane-track .lt-actions{display:flex;gap:4px;margin-top:2px;}
  .lane-track .lt-actions button{flex:1;font-size:9.5px;padding:3px 4px;}
  .saved-blocks{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .saved-block{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;gap:10px;}

  /* ---------- History ---------- */
  .hist-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border);}
  .hist-row:last-child{border-bottom:none;}
  .hist-time{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);width:56px;flex:none;}
  .hist-icon{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none;}
  .hist-main{flex:1;min-width:0;}
  .hist-title{font-size:12.5px;font-weight:600;}
  .hist-sub{font-size:11px;color:var(--text-dim);}

  /* ---------- Learning ---------- */
  .learn-grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start;}
  @media(max-width:900px){.learn-grid{grid-template-columns:1fr;}}
  .learn-track-btn{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:9px 11px;border-radius:8px;
    border:1px solid transparent;background:none;color:var(--text-dim);cursor:pointer;}
  .learn-track-btn:hover{background:var(--surface-2);}
  .learn-track-btn.active{background:var(--gold-wash);border-color:var(--gold-dim);color:var(--gold-bright);}
  .reason-list{display:flex;flex-direction:column;gap:10px;}
  .reason-item{display:flex;gap:12px;padding:13px 14px;}
  .reason-icon{width:30px;height:30px;border-radius:8px;background:var(--gold-wash);color:var(--gold-bright);
    display:flex;align-items:center;justify-content:center;flex:none;}
  .reason-item h4{font-family:var(--font-body);font-weight:700;font-size:12.5px;margin-bottom:3px;}
  .reason-item p{margin:0;color:var(--text-dim);font-size:12px;line-height:1.5;}

  /* ---------- Config ---------- */
  .cfg-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border);gap:16px;}
  .cfg-row:last-child{border-bottom:none;}
  .cfg-row .k{font-weight:600;font-size:12.5px;}
  .cfg-row .d{color:var(--text-dim);font-size:11px;margin-top:2px;}
  .switch{width:40px;height:22px;border-radius:999px;background:var(--surface-3);border:1px solid var(--border-strong);
    position:relative;cursor:pointer;flex:none;}
  .switch.on{background:var(--gold);border-color:var(--gold);}
  .switch::after{content:"";position:absolute;top:1px;left:1px;width:18px;height:18px;border-radius:50%;background:#0b0b0d;transition:left .12s ease;}
  .switch.on::after{left:19px;background:#151107;}

  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 20px;
    color:var(--text-faint);gap:8px;text-align:center;}
  .empty-state .icon-lg{width:30px;height:30px;color:var(--text-faint);}

  .grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start;}
  @media(max-width:1000px){.grid-2{grid-template-columns:1fr;}}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--surface-3);
    border:1px solid var(--gold-dim);color:var(--text);padding:10px 18px;border-radius:999px;font-size:12.5px;
    font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .18s ease, transform .18s ease;z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-faint);}
</style>

function fmtClock(sec){

  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}

/* ============================= NEXT MOVE ENGINE ============================= */
function candidatesForGen(genIdx){
  return TRACKS.filter(function(t){ return t.gen===genIdx && !state.playedIds[t.id]; });
}
function pickSafeRoute(){
  var np = trackById(state.nowPlayingId);
  var pool = candidatesForGen(state.activeGen).filter(function(t){ return t.id!==state.nowPlayingId; });
  pool.sort(function(a,b){
    var da = Math.abs(a.energy-np.energy), db = Math.abs(b.energy-np.energy);
    if (da!==db) return da-db;
    return b.recognition-a.recognition;
  });
  return pool[0]||null;
}
function pickEnergyUp(){
  var np = trackById(state.nowPlayingId);
  var pool = TRACKS.filter(function(t){ return !state.playedIds[t.id] && t.id!==state.nowPlayingId && (t.gen===state.activeGen || t.gen===state.activeGen+1) && t.energy>=np.energy+1; });
  pool.sort(function(a,b){ return (b.energy-a.recognition/20) - (a.energy-a.recognition/20); });
  pool.sort(function(a,b){ return b.energy-a.energy || b.recognition-a.recognition; });
  return pool[0]||null;
}
function pickGenerationBridge(){
  var target = Math.min(state.activeGen+1, GENERATIONS.length-1);
  var pool = TRACKS.filter(function(t){ return !state.playedIds[t.id] && t.bridge && (t.gen===state.activeGen || t.gen===target); });
  pool.sort(function(a,b){ return b.recognition-a.recognition; });
  return {track: pool[0]||null, target: target};
}
function confidenceFor(kind, t){
  if (!t) return 0;
  var base = Math.round(t.recognition*9);
  if (kind==='bridge') base -= 4;
  if (kind==='up') base -= 2;
  return Math.max(58, Math.min(99, base));
}
function evidenceFor(t){
  if (state.playedIds[t.id]) return {label:'FIELD TESTED', tone:'good'};
  if (t.recognition>=9.3) return {label:'HIGHLY PROVEN', tone:'gold'};
  if (t.recognition>=8.0) return {label:'CURATED', tone:'info'};
  return {label:'THEORETICAL', tone:''};
}
function whyText(kind, t){
  if (!t) return '';
  var np = trackById(state.nowPlayingId);
  if (kind==='safe'){
    return 'Same generation as the floor ('+genOf(t.gen).label+'), energy within '+Math.abs(t.energy-np.energy).toFixed(0)+' point of the current track, and a '+t.recognition+'/10 recognition score keeps floor risk low.';
  }
  return 'Energy '+t.energy+'/10 is higher than the current '+np.energy+'/10 — a deliberate push. Function tag "'+t.func+'" signals this track is built to intensify, not maintain.';
}

/* ---- DJ Knowledge layer: Track A -> next-generation bridge relationship ---- */
function bridgeKnowledgeFor(t){
  var targetGen = Math.min(t.gen+1, GENERATIONS.length-1);
  var why = ['Rhythm & tempo compatibility ('+t.bpm+' BPM, key '+t.key+')', 'Energy continuity ('+t.energy.toFixed(1)+'/10)'];
  if (t.recognition>=9) why.push('Near-universal cross-generation recognition ('+t.recognition.toFixed(1)+'/10)');
  if (t.culture==='mixed') why.push('Built as a cross-cultural crossover track');
  if (t.category==='CULTURAL TRIGGER') why.push('Strong cultural-trigger reaction within its audience');
  if (t.func==='BRIDGE' || t.func==='EXIT') why.push('Functionally tagged as an '+t.func+' moment for this block');
  var risk = t.recognition>=9 ? 'LOW' : (t.recognition>=8 ? 'MEDIUM' : 'HIGH');
  var when = (t.func==='EXIT' || t.func==='BRIDGE')
    ? 'Once the '+genOf(t.gen).label+' block has peaked and energy is ready to carry forward, before the floor cools.'
    : 'Early in the '+genOf(t.gen).label+' block, to set up a smoother generational hand-off later.';
  var audience = t.culture==='mixed'
    ? 'Mixed '+genOf(t.gen).label+' / '+genOf(targetGen).label+' crossover guests'
    : (t.culture==='latino' ? 'Latino ' : 'Anglo ')+genOf(t.gen).label+' audience moving into '+genOf(targetGen).label;
  var eventTypes = t.culture==='latino' ? ['Wedding','Quinceañera','Club'] : ['Wedding','Club','Corporate'];
  return {targetGen:targetGen, why:why, when:when, audience:audience, risk:risk, eventTypes:eventTypes};
}

/* ============================= DJ PERFORMANCE / TRANSITION KNOWLEDGE ============================= */
function bridgeQualityFor(prevT, curT){
  if (!prevT || !curT) return null;
  var genDelta = Math.abs(curT.gen - prevT.gen);
  var score = 0;
  if (curT.bridge || prevT.bridge) score += 2;
  if (Math.abs(curT.energy - prevT.energy) <= 1.5) score += 1;
  if (curT.recognition >= 8.5) score += 1;
  if (genDelta === 0) score += 1;
  if (genDelta <= 1) score += 1;
  if (score >= 4) return 'STRONG';
  if (score >= 2) return 'MODERATE';
  return 'WEAK';
}
function seedKnowledgeFor(fromId, toId){
  for (var i=0;i<TRANSITION_KNOWLEDGE.length;i++){
    if (TRANSITION_KNOWLEDGE[i].from===fromId && TRANSITION_KNOWLEDGE[i].to===toId) return TRANSITION_KNOWLEDGE[i];
  }
  return null;
}
function liveStatsFor(fromId, toId){
  var entries = state.liveTransitionLog.filter(function(l){ return l.fromId===fromId && l.toId===toId; });
  return {
    count: entries.length,
    pos: entries.filter(function(l){ return l.response>0; }).length,
    neu: entries.filter(function(l){ return l.response===0; }).length,
    neg: entries.filter(function(l){ return l.response<0; }).length
  };
}
function combinedTransitionKnowledge(fromId, toId){
  var seed = seedKnowledgeFor(fromId, toId);
  var live = liveStatsFor(fromId, toId);
  var basePlayed = seed ? seed.played : 0;
  var basePositive = seed ? Math.round(seed.played*seed.positivePct/100) : 0;
  var totalPlayed = basePlayed + live.count;
  if (totalPlayed===0) return null;
  var totalPositive = basePositive + live.pos;
  var positivePct = Math.round((totalPositive/totalPlayed)*100);
  var confidence;
  if (seed){ confidence = seed.confidence; }
  else if (totalPlayed>=25){ confidence='FIELD TESTED'; }
  else if (totalPlayed>=10){ confidence='CURATED'; }
  else { confidence='THEORETICAL'; }
  return {played:totalPlayed, positivePct:positivePct, byEvent:seed?seed.byEvent:null, mixedPct:seed?seed.mixedPct:null, confidence:confidence, liveCount:live.count, live:live};
}

function renderTimeline(){
  var w=760,h=130,pad=10;
  var pts = state.energyPoints;
  var maxE=10;
  var stepX = (w-pad*2)/(pts.length-1);
  var coords = pts.map(function(v,i){ return [pad+i*stepX, h-pad-((v/maxE)*(h-pad*2))]; });
  var line = coords.map(function(c,i){ return (i===0?'M':'L')+c[0].toFixed(1)+' '+c[1].toFixed(1); }).join(' ');
  var area = line+' L '+coords[coords.length-1][0].toFixed(1)+' '+(h-pad)+' L '+coords[0][0].toFixed(1)+' '+(h-pad)+' Z';
  var last = coords[coords.length-1];
  return (
    '<div class="panel"><div class="panel-head"><span class="label">Event Energy Timeline</span><span class="num" style="font-size:11px;color:var(--text-dim);">Scale 1–10</span></div>'+
    '<div class="timeline-wrap">'+
      '<svg class="timeline-svg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
        '<defs><linearGradient id="tlfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--gold)" stop-opacity="0.35"/><stop offset="100%" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>'+
        [2,4,6,8,10].map(function(v){ var y=h-pad-((v/maxE)*(h-pad*2)); return '<line x1="'+pad+'" y1="'+y+'" x2="'+(w-pad)+'" y2="'+y+'" stroke="var(--border)" stroke-width="1"/>'; }).join('')+
        '<path d="'+area+'" fill="url(#tlfill)"/>'+
        '<path d="'+line+'" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+
        '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="5" fill="var(--gold)" stroke="var(--bg)" stroke-width="2"/>'+
      '</svg>'+
      '<div class="timeline-legend">'+PHASES.slice(0, pts.length+2).map(function(p){ return '<span>'+p+'</span>'; }).join('')+'</div>'+
    '</div></div>'
  );
}

function wireEventView(){
  var el = document.getElementById('view-event');
  el.querySelectorAll('[data-gen]').forEach(function(b){
    b.addEventListener('click', function(){ state.activeGen = parseInt(b.getAttribute('data-gen'),10); renderEvent(); });
  });
  el.querySelectorAll('[data-culture]').forEach(function(b){
    b.addEventListener('click', function(){ state.culture = b.getAttribute('data-culture'); renderEvent(); });
  });
  var sel = document.getElementById('selEventType');
  if (sel) sel.addEventListener('change', function(){ state.eventType = sel.value; });
  el.querySelectorAll('[data-response]').forEach(function(b){
    b.addEventListener('click', function(){
      var v = parseInt(b.getAttribute('data-response'),10);
      state.lastResponse = v;
      var t = trackById(state.nowPlayingId);
      var delta = v*0.15;
      t._liveEnergy = Math.max(1, Math.min(10, t.energy + delta));
      t.energy = Math.round(t._liveEnergy*10)/10;
      var last = state.energyPoints[state.energyPoints.length-1];
      state.energyPoints[state.energyPoints.length-1] = Math.max(1, Math.min(10, last + delta));
      pushHistory('response', t, (v>0?'+':'')+v);
      toast('Floor response logged: '+(v>0?'+':'')+v);
      renderEvent();
    });
  });
  el.querySelectorAll('[data-why]').forEach(function(b){
    b.addEventListener('click', function(){
      var box = document.getElementById('why-'+b.getAttribute('data-why'));
      box.classList.toggle('open');
    });
  });
  el.querySelectorAll('[data-select-move]').forEach(function(b){
    b.addEventListener('click', function(){
      selectTrack(b.getAttribute('data-track'), b.getAttribute('data-select-move'));
    });
  });
}

function selectTrack(trackId, source){
  var prev = trackById(state.nowPlayingId);
  var next = trackById(trackId);
  if (!next) return;
  state.playedIds[prev.id] = true;
  pushHistory('played', prev, '');
  if (next.gen !== state.activeGen){
    state.currentBlockLabel = 'B-0'+(15+Object.keys(state.playedIds).length);
    state.blockStartedAt = Date.now();
    state.phaseIndex = Math.min(PHASES.length-1, state.phaseIndex+1);
    state.energyPoints.push(next.energy);
    pushHistory('block', next, 'New block — '+genOf(next.gen).label);
  }
  state.activeGen = next.gen;
  state.nowPlayingId = next.id;
  state.lastResponse = 0;
  toast((source==='bridge'?'Bridge selected — ':source==='up'?'Energy Up selected — ':'Safe Route selected — ')+next.title);
  renderEvent();
  renderHeaderBits();
}

function toggleListening(){
  state.liveListening = !state.liveListening;
  renderLiveListening();
}
function simulateDetection(){
  state.liveSeqIndex = (state.liveSeqIndex+1) % LIVE_DEMO_SEQUENCE.length;
  var nextId = LIVE_DEMO_SEQUENCE[state.liveSeqIndex];
  if (state.liveCurrentId) state.livePreviousId = state.liveCurrentId;
  state.liveCurrentId = nextId;
  state.liveMatchConfidence = 92 + ((state.liveSeqIndex*7) % 8);
  state.liveTimecode = 0;
  renderLiveListening();
}
function wireLiveListening(){
  var el = document.getElementById('view-live');
  var toggle = document.getElementById('toggleListen');
  if (toggle) toggle.addEventListener('click', toggleListening);
  var startBtn = document.getElementById('startListening');
  if (startBtn) startBtn.addEventListener('click', toggleListening);
  var srcSel = document.getElementById('liveSourceSel');
  if (srcSel) srcSel.addEventListener('change', function(e){ state.liveSource=e.target.value; });
  var simBtn = document.getElementById('simulateDetect');
  if (simBtn) simBtn.addEventListener('click', simulateDetection);
  el.querySelectorAll('[data-live-response]').forEach(function(b){
    b.addEventListener('click', function(){
      var v = parseInt(b.getAttribute('data-live-response'),10);
      var prev = trackById(state.livePreviousId), cur = trackById(state.liveCurrentId);
      if (!prev||!cur) return;
      var key = prev.id+'>'+cur.id;
      state.liveLastResponse[key] = v;
      state.liveTransitionLog.push({fromId:prev.id, toId:cur.id, response:v, time: nowStamp()});
      toast('Floor result logged: '+(v>0?'+':'')+v+' — teaching the system');
      renderLiveListening();
    });
  });
}

function discTabTitle(tab){
  var m = {trending:'Trending Now', charts:"This Week's Chart", 'new':'New & Rising', recommended:'Recommended For You', genres:'By Genre', regions:'By Region', search:'Search Results'};
  return m[tab] || 'Trending Now';

function discoverPoolForTab(tab){
  var base = DISCOVERY.slice();
  var r = state.discoverRegion;
  if (r>0){ base = base.slice(r).concat(base.slice(0,r)); }
  if (tab==='charts') return base.slice().reverse();
  if (tab==='new') return base.filter(function(d){ return d.trend==='new'; });
  if (tab==='recommended') return base.filter(function(d){ return !d.inLibrary; });
  if (tab==='genres') return base.slice().sort(function(a,b){ return a.genre.localeCompare(b.genre); });
  return base;
}
function discoverRow(d, i){
  var trendIcon = d.trend==='up'?'trendUp':d.trend==='down'?'trendDown':d.trend==='new'?'trendNew':'trendFlat';

    '<div class="hist-row">'+

  el.querySelectorAll('[data-remove]').forEach(function(b){
    b.addEventListener('click', function(){
      var p = b.getAttribute('data-remove').split(':');
      bk.lanes[p[0]].splice(parseInt(p[1],10),1);
      renderBlocks();
    });
  });
  el.querySelectorAll('[data-move]').forEach(function(b){
    b.addEventListener('click', function(){
      var p = b.getAttribute('data-move').split(':');
      var lane=p[0], idx=parseInt(p[1],10), dir=parseInt(p[2],10);
      var arr = bk.lanes[lane]; var ni = idx+dir;
      if (ni<0||ni>=arr.length) return;
      var tmp=arr[idx]; arr[idx]=arr[ni]; arr[ni]=tmp;
      renderBlocks();
    });
  });
  document.getElementById('bbSave').addEventListener('click', function(){
    state.savedBlocks.unshift(JSON.parse(JSON.stringify(bk)));
    toast('Block saved: '+bk.name);
    renderBlocks();
  });
}

/* ============================= VIEW: BRIDGE ENGINE ============================= */
var ROUTE_OPTIONS = [
  {id:'direct', label:'Direct', hops:0},
  {id:'1-track', label:'1-Track Bridge', hops:1},
  {id:'2-track', label:'2-Track Bridge', hops:2},
  {id:'3-track', label:'3-Track Bridge', hops:3}
];
var CONNECTORS = ['BPM','KEY','RHYTHM','SAMPLE','REMIX','ERA','CULTURAL CONNECTION','ENERGY','LEGACY'];
function connectorsFor(t){
  var seed = t.id.charCodeAt(1)+t.gen;
  var picked = [];
  CONNECTORS.forEach(function(c,i){ if ((seed+i)%3===0) picked.push(c); });
  return picked.length ? picked.slice(0,4) : ['ERA','ENERGY'];
}
function renderBridge(){
  var el = document.getElementById('view-bridge');
  var from = state.bridgeFrom, to = state.bridgeTo;
  var hops = ROUTE_OPTIONS.filter(function(r){ return r.id===state.bridgeRoute; })[0].hops;
  var pool = TRACKS.filter(function(t){ return t.bridge && (t.gen===from||t.gen===to); }).sort(function(a,b){ return b.recognition-a.recognition; });
  var chain = pool.slice(0, Math.max(hops,0));
  var npTrack = trackById(state.nowPlayingId);

  el.innerHTML =
    '<div class="view-head"><div><span class="eyebrow">Programming</span><h2 class="view-title">Bridge Engine</h2>'+
    '<p class="view-desc">Plan the connective tissue between two generations using BPM, key, rhythm, sample and cultural relationships.</p></div></div>'+
    '<div class="ft-row">'+
      '<div class="ft-field"><label class="label">Current Generation</label><select id="brFrom">'+GENERATIONS.map(function(g,i){ return '<option value="'+i+'"'+(from===i?' selected':'')+'>'+g.code+' — '+g.label+'</option>'; }).join('')+'</select></div>'+
      '<div class="ft-field"><label class="label">Target Generation</label><select id="brTo">'+GENERATIONS.map(function(g,i){ return '<option value="'+i+'"'+(to===i?' selected':'')+'>'+g.code+' — '+g.label+'</option>'; }).join('')+'</select></div>'+
      '<div class="ft-field"><label class="label">Current Track</label><div class="badge" style="padding:9px 12px;">'+esc(npTrack.title)+'</div></div>'+
    '</div>'+
    '<div class="route-tabs">'+ROUTE_OPTIONS.map(function(r){ return '<button class="route-tab'+(state.bridgeRoute===r.id?' active':'')+'" data-route="'+r.id+'">'+r.label+'</button>'; }).join('')+'</div>'+
    '<div class="panel"><div class="panel-head"><span class="label">'+genOf(from).label+' → '+(hops>0?hops+'-Track Bridge':'Direct')+' → '+genOf(to).label+'</span></div>'+
    '<div class="route-chain scrollx">'+
      '<div class="panel chain-node"><div class="label">'+genOf(from).label+'</div><div style="font-weight:700;margin-top:4px;">'+esc(npTrack.title)+'</div></div>'+
      '<div class="chain-arrow">→</div>'+
      (chain.length ? chain.map(function(t,i){
        return '<div class="panel chain-node"><div class="label">Bridge '+(i+1)+' &middot; '+genOf(t.gen).label+'</div><div style="font-weight:700;margin-top:4px;">'+esc(t.title)+'</div>'+
          '<div class="chip-row" style="margin-top:6px;">'+connectorsFor(t).map(function(c){ return '<span class="chip">'+c+'</span>'; }).join('')+'</div></div><div class="chain-arrow">→</div>';
      }).join('') : (hops>0 ? '<div class="move-empty" style="padding:14px;">No demo tracks tagged for '+hops+' hops on this span.</div><div class="chain-arrow">→</div>' : ''))+
      '<div class="panel chain-node" style="border-color:var(--gold-dim);"><div class="label">'+genOf(to).label+'</div><div style="font-weight:700;margin-top:4px;color:var(--gold-bright);">Target Generation</div></div>'+
    '</div>'+
    '<div class="panel-body" style="padding-top:0;"><button class="btn btn-gold btn-sm" id="useRoute">Use This Route</button></div>'+
    '</div>'+
    renderBridgeKnowledgePanel(chain[0]||null, from, to);

  document.getElementById('brFrom').addEventListener('change', function(e){ state.bridgeFrom=parseInt(e.target.value,10); renderBridge(); });
  document.getElementById('brTo').addEventListener('change', function(e){ state.bridgeTo=parseInt(e.target.value,10); renderBridge(); });
  el.querySelectorAll('[data-route]').forEach(function(b){
    b.addEventListener('click', function(){ state.bridgeRoute = b.getAttribute('data-route'); renderBridge(); });
  });
  document.getElementById('useRoute').addEventListener('click', function(){
    state.activeGen = state.bridgeFrom;
    toast("Route queued — visit Event Mode's Generation Bridge card to select the next track.");
    setView('event');
  });
}

/* ============================= VIEW: HISTORY ============================= */
function renderHistory(){
  var el = document.getElementById('view-history');
  var playedCount = Object.keys(state.playedIds).length;
  el.innerHTML =
    '<div class="view-head"><div><span class="eyebrow">Record</span><h2 class="view-title">History</h2>'+
    '<p class="view-desc">Chronological log of played tracks, floor responses and block changes for this session.</p></div>'+
    '<span class="badge good">No Repeats ✓</span></div>'+
    '<div class="footer-strip" style="margin-bottom:14px;"><div class="footer-cell">Tracks Played <b>'+playedCount+'</b></div><div class="footer-cell">Events Logged <b>'+state.history.length+'</b></div></div>'+
    '<div class="panel">'+
      (state.history.length ? state.history.map(function(h){
        var t = h.trackId ? trackById(h.trackId) : null;
        var iconName = h.kind==='played'?'play':(h.kind==='response'?'status':'blocks');
        var iconBg = h.kind==='played'?'good-wash':(h.kind==='response'?'gold-wash':'info');
        var title = h.kind==='played' ? 'Played: '+(t?t.title:'') : h.kind==='response' ? 'Floor response '+h.extra+' — '+(t?t.title:'') : h.extra;
        var sub = t ? genOf(t.gen).label+' · '+t.artist : '';
        return '<div class="hist-row"><span class="hist-time">'+h.time+'</span><span class="hist-icon" style="background:var(--'+(h.kind==='played'?'good-wash':h.kind==='response'?'gold-wash':'surface-3')+');color:'+(h.kind==='played'?'var(--good)':h.kind==='response'?'var(--gold-bright)':'var(--info)')+';">'+iconSvg(iconName)+'</span><span class="hist-main"><div class="hist-title">'+esc(title)+'</div><div class="hist-sub">'+esc(sub)+'</div></span></div>';
      }).join('') : '<div class="empty-state">'+iconSvg('history')+'<span>Nothing logged yet — select a Next Move or log a Floor Response in Event Mode.</span></div>')+
    '</div>';
}

/* ============================= VIEW: LEARNING ============================= */

  el.innerHTML =
    '<div class="view-head"><div><span class="eyebrow">Record</span><h2 class="view-title">DJ Learning Mode</h2>'+
    '<p class="view-desc">The platform teaches reasoning, not just titles. Pick a demo track to see how the engine would justify a recommendation.</p></div></div>'+
    '<div class="learn-grid">'+
      '<div class="panel panel-body" style="max-height:520px;overflow-y:auto;">'+
        '<span class="label" style="display:block;margin-bottom:8px;">Demo Tracks</span>'+
        TRACKS.map(function(tr){
          return '<button class="learn-track-btn'+(tr.id===state.learnTrackId?' active':'')+'" data-learn="'+tr.id+'"><span style="font-weight:700;font-size:12px;">'+esc(tr.title)+'</span><span style="font-size:10.5px;color:var(--text-faint);">'+genOf(tr.gen).label+' &middot; '+tr.artist+'</span></button>';
        }).join('')+
      '</div>'+
      '<div>'+
        '<div class="panel panel-body" style="margin-bottom:14px;">'+
          '<div class="np-title" style="font-size:18px;">'+esc(t.title)+'</div>'+
          '<div class="np-artist">'+esc(t.artist)+' &middot; '+genOf(t.gen).label+' &middot; '+t.category+'</div>'+
        '</div>'+
        '<div class="reason-list">'+
          REASONS.map(function(r){
            return '<div class="panel reason-item"><div class="reason-icon">'+iconSvg(r.icon)+'</div><div><h4>'+r.name+'</h4><p>'+r.text+'</p></div></div>';
          }).join('')+
        '</div>'+
      '</div>'+
    '</div>';
  el.querySelectorAll('[data-learn]').forEach(function(b){
    b.addEventListener('click', function(){ state.learnTrackId = b.getAttribute('data-learn'); renderLearning(); });
  });
}

/* ============================= VIEW: CONFIG ============================= */
function renderConfig(){
  var el = document.getElementById('view-config');
  el.innerHTML =
    '<div class="view-head"><div><span class="eyebrow">System</span><h2 class="view-title">Config</h2>'+
    '<p class="view-desc">Prototype-level settings. Nothing here writes to a backend — this is a local, non-production shell.</p></div></div>'+
    '<div class="panel">'+
      '<div class="cfg-row"><div><div class="k">Guided Learning Mode</div><div class="d">Same recommendation engine for both — Guided auto-expands WHY reasoning; Experienced stays compact for veteran DJs who just want the numbers.</div></div><button class="switch'+(state.guided?' on':'')+'" id="cfgGuided"></button></div>'+
      '<div class="cfg-row"><div><div class="k">Booth Focus (Full Screen)</div><div class="d">Collapses the rail to icons only for low-light booth use.</div></div><button class="switch'+(state.djMode?' on':'')+'" id="cfgFocus"></button></div>'+
      '<div class="cfg-row"><div><div class="k">Default Culture Mode</div><div class="d">Applied when Event Mode is opened fresh.</div></div>'+
        '<select id="cfgCulture" style="background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);padding:8px 10px;border-radius:6px;">'+
        ['anglo','latino','mixed'].map(function(c){ return '<option value="'+c+'"'+(state.culture===c?' selected':'')+'>'+c.toUpperCase()+'</option>'; }).join('')+'</select></div>'+
      '<div class="cfg-row"><div><div class="k">Active Experience</div><div class="d">Determines which catalog and rules are loaded into Event Mode.</div></div><span class="badge gold">One Hit Wonder</span></div>'+
      '<div class="cfg-row"><div><div class="k">Platform Architecture</div><div class="d">Core Platform (Event, Library, Floor Intelligence, Energy, Generation, Block, Bridge, History and Learning engines) is fully decoupled from Experiences. Each Experience plugs in its own catalog, rules and bridges by ID — the core never has to be rebuilt to add one.</div></div><span class="badge">10 Core Engines</span></div>'+
      '<div class="cfg-row"><div><div class="k">Environment</div><div class="d">This build never writes to production systems, and carries no payments, accounts or persistence.</div></div><span class="badge">Prototype · Local · Non-Production</span></div>'+
    '</div>';
  document.getElementById('cfgGuided').addEventListener('click', function(){ toggleGuidedMode(); renderConfig(); });
  document.getElementById('cfgFocus').addEventListener('click', function(){ toggleFocusMode(); renderConfig(); });
  document.getElementById('cfgCulture').addEventListener('change', function(e){ state.culture=e.target.value; });
}

/* ============================= NAV / SHELL ============================= */
var VIEWS = ['home','experiences','event','live','discover','library','genmap','blocks','bridge','history','learning','config'];
var RENDERERS = {
  home:renderHome, experiences:renderExperiences, event:renderEvent, live:renderLiveListening, discover:renderDiscover, library:renderLibrary,
  genmap:renderGenMap, blocks:renderBlocks, bridge:renderBridge, history:renderHistory,
  learning:renderLearning, config:renderConfig
};
function setView(v){
  state.view = v;
  VIEWS.forEach(function(name){
    document.getElementById('view-'+name).classList.toggle('active', name===v);
  });
  document.querySelectorAll('.nav-item').forEach(function(btn){
    btn.classList.toggle('active', btn.getAttribute('data-view')===v);
  });
  RENDERERS[v]();
}
document.querySelectorAll('.nav-item').forEach(function(btn){
  btn.addEventListener('click', function(){ setView(btn.getAttribute('data-view')); });
});

function toggleGuidedMode(){
  state.guided = !state.guided;
  document.getElementById('btnDjMode').classList.toggle('active', state.guided);
  var badge = document.getElementById('modeBadge');
  badge.textContent = state.guided ? 'GUIDED' : 'EXPERIENCED';
  badge.className = 'badge'+(state.guided?' info':'');
  toast(state.guided ? 'Guided Mode — recommendations now show full reasoning' : 'Experienced Mode — compact readouts, tap Why when needed');
  if (state.view==='event') renderEvent();
}
function toggleFocusMode(){
  state.djMode = !state.djMode;
  document.getElementById('rail').classList.toggle('collapsed', state.djMode);
}
document.getElementById('btnDjMode').addEventListener('click', toggleGuidedMode);
document.getElementById('btnSettings').addEventListener('click', function(){ setView('config'); });
document.getElementById('btnEventStatus').addEventListener('click', function(){
  toast(state.history.length ? 'Event status: ACTIVE — '+Object.keys(state.playedIds).length+' tracks played' : 'Event status: STANDBY — no tracks played yet');
});
document.getElementById('btnFocus').addEventListener('click', function(){
  var el = document.documentElement;
  try{
    if (!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el); document.getElementById('btnFocus').classList.add('active'); }
    else { (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document); document.getElementById('btnFocus').classList.remove('active'); }
  }catch(e){ toggleFocusMode(); document.getElementById('btnFocus').classList.toggle('active', state.djMode); }
});

function renderHeaderBits(){
  var exp = EXPERIENCES.filter(function(e){ return e.id===state.experience; })[0] || EXPERIENCES[0];
  document.getElementById('expPillLabel').textContent = exp.name.toUpperCase()+' EXPERIENCE';
}

setInterval(function(){
  if (state.view==='event'){
    var cell = document.getElementById('clockCell');
    if (cell) cell.textContent = nowStamp();
  }
  if (state.view==='live' && state.liveListening && state.liveCurrentId){
    state.liveTimecode += 1;
    var tcCell = document.getElementById('liveTimecodeCell');
    if (tcCell) tcCell.textContent = fmtClock(state.liveTimecode);
  }
}, 1000);

renderHeaderBits();
setView('home');
})();
</script>
