<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Factura / cotización — Miami DJ Beat</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #222; color: #111; font-family: Georgia, 'Times New Roman', serif; }
    .toolbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center;
      padding: 12px; background: rgba(10,8,6,0.95); border-bottom: 1px solid rgba(197,160,89,0.4);
    }
    .toolbar button {
      padding: 10px 18px; border-radius: 10px; border: 1px solid rgba(197,160,89,0.5);
      background: rgba(197,160,89,0.15); color: #f5e6c8; font-weight: 800; cursor: pointer;
    }
    .wrap { padding: 16px; display: flex; justify-content: center; }
    #a4-root {
      width: 210mm; min-height: 297mm; background: #fff; padding: 16mm 18mm;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    h1 { margin: 0; font-size: 22px; letter-spacing: 0.08em; color: #1a237e; }
    .meta { font-size: 11px; color: #555; margin: 8px 0 18px; line-height: 1.5; }
    table.inv { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 12px; }
    table.inv th, table.inv td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    table.inv th { background: #f5f5f5; color: #1a237e; }
    .tot { margin-top: 16px; font-size: 13px; text-align: right; }
    .tot strong { font-size: 16px; color: #111; }
    @media print {
      html, body { background: #fff; }
      .toolbar { display: none !important; }
      .wrap { padding: 0; }
      #a4-root { box-shadow: none; }
      @page { size: A4; margin: 14mm; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button type="button" id="btn-print">Imprimir / PDF (A4)</button>
    <button type="button" id="btn-png">Descargar PNG (A4)</button>
  </div>
  <div class="wrap"><div id="a4-root"></div></div>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    (function () {
      var KEY = 'mdj_staff_invoice_print_v1';
      var data;
      try { data = JSON.parse(sessionStorage.getItem(KEY) || 'null'); } catch (e) { data = null; }
      var root = document.getElementById('a4-root');
      if (!data || data.v !== 1 || !root) {
        root.innerHTML = '<p style="padding:20px;">Sin datos de factura. Úsalo desde <strong>Admin → Producción</strong>.</p>';
        return;
      }
      function esc(s) {
        if (s == null) return '';
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }
      var lines = (data.lines || []).map(function (L) {
        var sub = (Number(L.qty) || 0) * (Number(L.unit) || 0);
        return '<tr><td>' + esc(L.desc) + '</td><td>' + esc(String(L.qty)) + '</td><td>$' + (Number(L.unit) || 0).toFixed(2) + '</td><td>$' + sub.toFixed(2) + '</td></tr>';
      }).join('');
      function nl2br(s) {
        return esc(s).replace(/\r\n|\r|\n/g, '<br/>');
      }
      var bill = (data.billingAddress || '').trim();
      var evAd = (data.eventAddress || '').trim();
      var locBlock = '';
      if (bill || evAd) {
        locBlock =
          '<div class="loc" style="margin-top:10px;margin-bottom:14px;padding:12px 14px;border-radius:10px;border:1px solid #c5cae9;background:#f8f9ff;font-size:11px;line-height:1.55;color:#333;">';
        if (bill) {
          locBlock +=
            '<div style="margin-bottom:8px;"><strong style="color:#1a237e;">Dirección</strong><br/>' +
            nl2br(bill) +
            '</div>';
        }
        if (evAd) {
          locBlock +=
            '<div style="margin-bottom:8px;"><strong style="color:#1a237e;">Lugar del evento</strong><br/>' +
            nl2br(evAd) +
            '</div>';
        }
        locBlock += '</div>';
      }
      var comp = (data.clientCompanyName || '').trim();
      var compPref = String(data.companyPrintPrefix || 'Empresa / razón social:').trim();
      var buyerLine = esc(data.clientLabel || '');
      if (comp) {
        buyerLine +=
          '<br/><span style="font-size:11px;color:#444;">' + esc(compPref) + ' ' + esc(comp) + '</span>';
      }
      var ph = String(data.clientPhone || '').trim();
      var em = String(data.clientEmail || '').trim();
      var phL = esc(data.contactPhoneLabel || 'Tel.');
      var emL = esc(data.contactEmailLabel || 'Email');
      if (ph) {
        buyerLine += '<br/><span style="font-size:11px;color:#444;">' + phL + ' ' + esc(ph) + '</span>';
      }
      if (em) {
        buyerLine += '<br/><span style="font-size:11px;color:#444;">' + emL + ' ' + esc(em) + '</span>';
      }
      var kind = data.docKind === 'invoice' ? 'FACTURA' : 'COTIZACIÓN';
      root.innerHTML =
        '<h1>' + kind + '</h1>' +
        '<div class="meta"><strong>Ref:</strong> ' + esc(data.ref || '') + '<br/><strong>Cliente:</strong> ' + buyerLine +
        '<br/><strong>Fecha:</strong> ' + esc(data.dateStr || '') + '</div>' +
        locBlock +
        '<table class="inv"><thead><tr><th>Concepto</th><th>Cant.</th><th>P. unit</th><th>Subtotal</th></tr></thead><tbody>' +
        lines + '</tbody></table>' +
        '<div class="tot">Subtotal: $' + (Number(data.subtotal) || 0).toFixed(2) + '<br/>' +
        (data.taxPct > 0 ? 'Impuesto (' + data.taxPct + '%): $' + (Number(data.taxAmt) || 0).toFixed(2) + '<br/>' : '') +
        '<strong>Total: $' + (Number(data.total) || 0).toFixed(2) + '</strong></div>' +
        (data.notes ? '<p style="margin-top:20px;font-size:11px;color:#444;">' + esc(data.notes) + '</p>' : '') +
        '<p style="margin-top:28px;font-size:10px;color:#888;text-align:center;">Miami DJ Beat LLC</p>';

      document.getElementById('btn-print').onclick = function () { window.print(); };
      document.getElementById('btn-png').onclick = function () {
        if (typeof html2canvas !== 'function') {
          alert('html2canvas no cargó.');
          return;
        }
        html2canvas(root, { scale: 2, backgroundColor: '#fff' }).then(function (canvas) {
          var a = document.createElement('a');
          a.download = (data.ref || 'invoice').replace(/[^a-z0-9-_]/gi, '_') + '.png';
          a.href = canvas.toDataURL('image/png');
          a.click();
        });
      };
    })();
  </script>
</body>
</html>
